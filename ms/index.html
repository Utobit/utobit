<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manamuhan Studio</title>
  <meta name="description" content="마나무한 스튜디오 — Player : Final Raid 얼리 액세스 오픈. Project Glyph 개발 중.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F93QE1MMT8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F93QE1MMT8');
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+KR:wght@900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
      background: #fff;
      overflow-x: hidden;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%; min-height: 100vh; padding: 48px 0;
      color: #111827;
      position: relative;
      overflow: hidden;
    }

    /* 배경 격자 애니메이션 */
    .grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(#e5e7eb 1px, transparent 1px),
        linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0;
      animation: fadeGrid 1.2s ease-out 0.3s forwards;
    }
    @keyframes fadeGrid {
      to { opacity: 1; }
    }

    /* 중앙 블러 글로우 */
    .glow {
      position: absolute;
      width: min(70vw, 600px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,.12) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .7; }
      50%       { transform: scale(1.12); opacity: 1; }
    }

    /* 텍스트 */
    .content {
      position: relative; z-index: 10;
      text-align: center;
    }

    .studio-sub {
      font-size: clamp(0.7rem, 1.2vw, 0.875rem);
      font-weight: 700;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: 24px;
      opacity: 0;
      animation: slideUp 0.9s cubic-bezier(.22,1,.36,1) 0.2s forwards;
    }

    .studio-name {
      font-size: clamp(2.4rem, 12vw, 9rem);
      font-weight: 900;
      letter-spacing: -.05em;
      line-height: .9;
      color: #111827;
      opacity: 0;
      animation: slideUp 0.9s cubic-bezier(.22,1,.36,1) 0.35s forwards;
      position: relative;
    }
    /* 텍스트 마스크 라인 효과 */
    .studio-name::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #2563eb, transparent);
      transform: scaleX(0);
      animation: lineReveal 1s cubic-bezier(.22,1,.36,1) 0.9s forwards;
    }
    @keyframes lineReveal {
      to { transform: scaleX(1); }
    }

    .enter-hint {
      margin-top: 48px;
      font-size: 0.8125rem; font-weight: 600;
      color: #9ca3af;
      letter-spacing: .06em;
      opacity: 0;
      animation: slideUp 0.9s cubic-bezier(.22,1,.36,1) 0.6s forwards;
      transition: color .2s;
    }
    a.enter-hint { display: inline-block; text-decoration: none; }
    a.enter-hint:hover { color: #2563eb; }

    /* PLAYER : Final Raid 오픈 소식 (2026-10-01 얼리 액세스) */
    .news {
      display: block;
      margin: 44px auto 0;
      width: min(460px, calc(100vw - 32px));
      border-radius: 18px;
      overflow: hidden;
      text-align: left;
      text-decoration: none;
      color: #fff;
      background: #050913;
      box-shadow: 0 18px 50px rgba(15,23,42,.22);
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      opacity: 0;
      animation: slideUp 0.9s cubic-bezier(.22,1,.36,1) 0.5s forwards;
      transition: box-shadow .25s;
    }
    .news:hover { box-shadow: 0 22px 60px rgba(37,99,235,.35); }
    .news-art {
      position: relative; aspect-ratio: 16 / 8;
      background: url('/player/assets/hero.jpg') center 42% / cover no-repeat;
    }
    .news-art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #050913 2%, rgba(5,9,19,0) 60%); }
    .news-tag {
      position: absolute; top: 14px; left: 14px; z-index: 1;
      font-family: 'Inter', sans-serif;
      font-size: 0.6875rem; font-weight: 900; letter-spacing: .14em;
      color: #fff; background: #2563eb;
      padding: 4px 10px; border-radius: 999px;
    }
    .news-main { display: flex; gap: 14px; align-items: center; padding: 0 20px 20px; margin-top: -28px; position: relative; z-index: 1; }
    .news-icon { width: 64px; height: 64px; border-radius: 16px; flex: none; box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.12); }
    .news-title { font-size: 1.05rem; font-weight: 900; letter-spacing: -.02em; margin-bottom: 4px; }
    .news-body { font-size: 0.8125rem; font-weight: 400; line-height: 1.55; color: #a9b8d6; }
    .news-cta { font-size: 0.75rem; font-weight: 700; color: #7fb0ff; margin-top: 6px; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(24px); }
    }
    @keyframes fadeGridOut {
      to { opacity: 0; }
    }
    .stage-out .studio-sub {
      animation: slideDown 0.35s cubic-bezier(.55,0,.1,1) 0s forwards !important;
    }
    .stage-out .studio-name {
      animation: slideDown 0.35s cubic-bezier(.55,0,.1,1) 0.05s forwards !important;
    }
    .stage-out .enter-hint, .stage-out .news {
      animation: slideDown 0.35s cubic-bezier(.55,0,.1,1) 0.1s forwards !important;
    }
    .stage-out .grid-bg {
      animation: fadeGridOut 0.38s ease-in forwards !important;
    }
    .stage-out .glow {
      transition: opacity 0.38s ease !important;
      opacity: 0 !important;
      animation: none !important;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid-bg"></div>
    <div class="glow"></div>
    <div class="content">
      <p class="studio-sub">Game Studio</p>
      <h1 class="studio-name">MANAMUHAN<br>STUDIO</h1>
      <a class="news" href="/player/">
        <div class="news-art"><span class="news-tag">NOW OPEN · 2026.10.01</span></div>
        <div class="news-main">
          <img class="news-icon" src="/player/assets/icon.jpg" alt="Player : Final Raid">
          <div>
            <p class="news-title">Player : Final Raid 얼리 액세스 오픈!</p>
            <p class="news-body">실제 지도에서 펼쳐지는 RPG.<br>주변에 생겨난 게이트를 클리어하세요.</p>
            <p class="news-cta">자세히 보기 →</p>
          </div>
        </div>
      </a>
      <a class="enter-hint" href="pg/">Project Glyph →</a>
    </div>
  </div>
<script>
  document.querySelector('a.enter-hint').addEventListener('click', function(e) {
    e.preventDefault();
    var href = this.getAttribute('href');
    document.querySelector('.stage').classList.add('stage-out');
    setTimeout(function() { window.location.href = href; }, 400);
  });
</script>
</body>
</html>
