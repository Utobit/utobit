e Postanowienie","SK_F_P_0707":"Trójlistna Koniczyna","SK_F_P_0708":"Wizualizacja","SK_F_P_0709":"Materializacja","SK_F_P_0711":"Przełamanie","SK_F_P_0712":"Namierzenie Celu","SK_F_P_0714":"Strefa Zakazu Wstępu","SK_F_P_0716":"Mocny Cios","SK_F_P_0719":"Seria Cięć","SK_F_P_0720":"Talent Szermierczy","SK_F_P_0722":"Talent Zabójcy","SK_F_P_0723":"Odwrócenie Losu","SK_F_P_0801":"Powinowactwo Zimna","SK_F_P_0802":"Mistrzostwo Zamrożenia","SK_F_P_0803":"Niezwykły Wzrost","SK_F_P_0904":"Zbieracz Odłamków","SK_F_P_0905":"Odkrywca","SK_SS_P_0302":"Sztuka Dwóch Mieczy","SK_SS_P_0303":"Łamacz Zasad","SK_SS_P_0304":"Łamacz Zaklęć","SK_SS_P_0301":"Drenaż Many","SK_SS_A_0501":"Oportunista","SK_S_P_0971":"Sztuka walki lisa"},"desc":{"SK_EX_A_0001":"Pasywna. Nadaje ci „Czarny Księżyc”. Wrogowie atakujący ciebie mają -25% celności, a twoje ataki zadają obrażenia dodatkowe równe atakowi magicznemu ×3.","SK_EX_A_0002":"Aktywna żywiołu światła.\nZaczyna się rzucać w chwili rozpoczęcia walki, jako osobne rzucanie. Po 20 turach uderza wszystkich wrogów atakiem magicznym równym wszystkim obrażeniom zadanym przez ciebie w walce. Potem twoje MP spada do 0 i odzyskuje się po 10(15)% na turę przez 10 tur.","SK_EX_A_0006":"[Miecz] Płatki opadają jak deszcz. Ataki podstawowe uderzają jednocześnie 3 losowych wrogów, zadając każdemu obrażenia równe końcowemu atakowi ×3(4.5) + sumie wszystkich statystyk ×3(4.5). Każde trafienie dodaje celowi 10 ładunków Pełnego rozkwitu; przy 60 ładunkach cel rozkwita i otrzymuje obrażenia równe 30% jego maks. PŻ (zmniejszone przez OBR). Jeśli jego PŻ wynoszą wtedy 30% maks. PŻ lub mniej, zostaje stracony z pominięciem OBR. Obrażenia rozkwitu nie mogą przekroczyć 30-krotności twoich maks. PŻ i nie mogą być krytyczne.","SK_EX_A_0007":"[P] Gdy masz wyposażony [Miecz], [Sztylet] lub [Wielki miecz]: ataki podstawowe stają się żywiołem błyskawic. Celność +25(37.5)%, szybkość ataku +80(120)%, obrażenia kryt. +80(120)%.","SK_EX_A_0012":"Aktywna żywiołu mroku (natychmiastowa).\nPo rzuceniu rozpoczyna 15-turowe kanałowanie (brak innych akcji). Co turę zadaje wszystkim wrogom obrażenia równe MAG × N (N = liczba minionych tur) i zużywa 6% many na turę. Kanałowanie kończy się wcześniej, gdy zabraknie many.\nGdy kanałowanie się zakończy, do końca walki twoje ataki podstawowe zyskują obrażenia dodatkowe MAG ×8 i uderzają dwukrotnie.","SK_EX_A_0015":"[P] Gdy masz wyposażony [Miecz], [Sztylet] lub [Wielki miecz]: ataki podstawowe zawsze trafiają, a umiejętności, których główną bronią jest [Miecz], [Sztylet] lub [Wielki miecz], zadają o 600(900)% większe obrażenia.","SK_EX_A_0501":"[Dowolna broń] Umiejętność ataku wyprzedzającego. Poziom ×100(150) + suma wszystkich statystyk ×2(3). Koszt: 3% MP.","SK_EX_A_0502":"[Dystansowe] Obrażenia stałe równe końcowemu atakowi ×120(180)%. Wrogowie trafieni twoim atakiem wyprzedzającym na początku walki zostają oznaczeni „Wizją przyszłości” i co sekundę otrzymują te same obrażenia.","SK_EX_A_0503":"[Dowolna broń] Umiejętność ataku wyprzedzającego. Suma wszystkich statystyk ×3. Atak na dzikiego potwora rozpoczyna walkę z 1-6 osobnikami tego potwora. Na początku walki zadaje wszystkim wrogom obrażenia równe sumie wszystkich statystyk ×3.","SK_EX_A_0504":"Atak wyprzedzający na dzikie potwory natychmiast wygrywa walkę. Na początku walki daje wszystkim sojusznikom unik +25%.","SK_EX_A_0505":"Gdy jesteś celem, 100% szansy na zadanie atakującemu obrażeń równych otrzymanym. Następnie odzyskujesz 90(135)% otrzymanych obrażeń.","SK_EX_P_0303":"[P] Jeśli po ataku podstawowym cel przeżyje, znika całe opóźnienie przed i po ataku, a ty automatycznie ponawiasz atak podstawowy 1 turę później bez wybierania akcji. Powtarza się raz na turę, aż cel padnie — wtedy wraca wybór akcji i pierwotny odstęp działań.","SK_EX_P_0304":"[P] Za każdym razem, gdy działasz, maks. MP rośnie o 1(1.5)% (procent składany). Jednocześnie zadaje wszystkim wrogom magiczne obrażenia okresowe o mocy równej podniesionemu maks. MP. Te obrażenia podlegają obronie magicznej i redukcji obrażeń celu.","SK_EX_P_0701":"Potwory również mają statystyki. Dodaje do twoich statystyk po 10% każdej z 6 statystyk wroga. Na poziomie 100 dodaje do twoich statystyk 110% statystyk potwora.","SK_EX_P_0801":"[P] Na początku walki piętnuje wszystkich wrogów „Kresem”. Po 20 sekundach zadaje wszystkim wrogom obrażenia równe poziom ×100 + MAG ×70 i ogłusza ich na 3 s. Wobec wrogów objętych „Zamrożeniem” obrażenia stają się obrażeniami stałymi.","SK_EX_P_0802":"Na początku walki przyzywa 3 Mroźne Kule, ignorując limit 1 kuli. Rozpoczynasz walkę z 0% MP.","SK_SSS_P_0905":"[P] Zmysł +{27}.","SK_SS_P_0905":"[P] Zmysł +{24}.","SK_SS_P_0951":"[P] Gdy wrogowi zostaje 1 HP, zyskujesz 3 okazje do ataku podstawowego. Ten próg rośnie o 5% z każdym Lv Pogardy; przy Pogardzie Lv5 zyskujesz 3 okazje do ataku podstawowego, gdy wróg ma 25% HP lub mniej.","SK_A_A_0801":"Przyzywa do gracza Królową Szronu. Walczy u twojego boku, rzucając losowe zaklęcie żywiołu zamrożenia rangi F-A co 2 twoje tury akcji. Jej statystyki wynoszą 75(112.5)% twoich. Królowej Szronu nie można rozproszyć. Rzucanie 3(2) s, koszt 25(17)% MP. Nie można przyzwać podwójnie.","SK_EX_A_0003":"[Miecz] Aktywna podtrzymywana (natychmiastowa).\nPo rzuceniu przez 20 tur co turę jeden losowy wróg obrywa uderzeniem meteoru o sile SIŁ ×20(30).\nKoszt 3% many na turę; kanałowanie kończy się natychmiast, gdy zabraknie many, zostaniesz ogłuszony lub wybierzesz inną umiejętność.","SK_EX_A_0017":"[Miecz]\nGdy wróg wykonuje atak podstawowy, 50(75)% szansy na jego unieważnienie i zadanie wrogowi obrażeń równych sumie wszystkich statystyk ×10(15). Wewnętrzne odnowienie 3 tury.","SK_S_A_0501":"Ataki wyprzedzające z pozycji DPS w zwarciu zadają (SIŁ+ZRC) ×3(4.5) obrażeń dodatkowych.","SK_S_A_0502":"[Miecz, Sztylet, Wielki miecz, Włócznia] Raz na walkę, gdy jesteś celem, 5(7.5)% szansy na zmniejszenie obrażeń do 1 i zadanie wrogowi obrażeń równych końcowemu atakowi ×10(15).","SK_S_A_0801":"[A] [Faza] Rzuca nieprzerwanie przez 15 sekund. Podczas rzucania twoje HP wynosi 1. Dopóki rzucanie trwa, co 3 tury atakuje losowego wroga 6(9) Odłamkami Szronu. (Rzucanie przerywa zdjęcie Fazy, rozproszenie wzmocnienia lub ogłuszenie.) Rzucanie 2 s.","SK_S_A_0902":"[A] Zadaje wszystkim wrogom obrażenia równe {10}% maks. HP. (Maks. obrażenia na trafienie = suma wszystkich statystyk × 50)","SK_S_P_0502":"[Miecz, Sztylet, Wielki miecz] Zwiększa efekty Mistrzostwa Miecza o 50(75)%. Celność, szansa kryt. i obrażenia kryt. +25(37.5)%. Przy wyliczaniu końcowego ataku zyskujesz dodatkowo 2(3)× ataku broni.","SK_S_P_0801":"[P] Atak magiczny +50(75)%, maks. MP +30(45)%","SK_S_P_0905":"[P] Zmysł +{21}.","SK_S_P_0951":"[P] Zabicie wroga atakiem Kontry daje dodatkową okazję do ataku.","SK_S_P_0962":"[P] Zabicie wroga daje 1 dodatkową okazję do ataku.","SK_A_A_0301":"[Miecz] Uderza wszystkich wrogów dwukrotnie. Obrażenia równe 150(225)% końcowego ataku plus suma wszystkich statystyk ×1(1.5).","SK_A_A_0302":"[Miecz, Sztylet] Zadaje obrażenia równe 100(150)% końcowego ataku plus ZRC ×12~18(18~27). Po ataku jesteś odrętwiały przez 3 tury.","SK_A_A_0303":"[Sztylet] 100(150)% końcowego ataku. Obrażenia kryt. 500(750)%.","SK_A_A_0304":"[Wielki miecz] Uderza jednocześnie do 6 wrogów. Obrażenia równe 220(330)% końcowego ataku plus SIŁ ×5(7.5). Zmniejsza obronę trafionych wrogów o 15(22.5)%. (Odświeża się, nie sumuje)","SK_A_A_0305":"[Kastet] Uderza wszystkich wrogów raz. Niszczy wszystkie tarcze celów, po czym zadaje obrażenia równe 220(330)% końcowego ataku. Można go zablokować Kontrą.","SK_A_A_0306":"[Dystansowe] Uwalnia twój ostatni płomień. 320(480)% końcowego ataku. Opóźnienie po ataku: 5 tur. Obrażenia końcowe rosną o brakujące MP względem maksimum. (+1(1.5)% za każdy brakujący 1%)","SK_A_A_0307":"[Przybór magiczny] 120(180)% ataku magicznego. Nakłada Zatrucie many. Zadaje te same obrażenia każdemu wrogowi z Zatruciem many. Jeśli ten atak zabije wroga, odzyskujesz MP równe pozostałemu MP wroga.","SK_A_A_0501":"[Miecz] Umiejętność ataku wyprzedzającego. Końcowy atak 1.8(2.7) + suma wszystkich statystyk ×1(1.5). Koszt: 3% MP. (Aura miecza)","SK_A_A_0504":"[Włócznia] Umiejętność ataku wyprzedzającego. Obrażenia stałe (SIŁ+MAG) ×3.5(5.25); zawsze trafia krytycznie. Koszt: 15% MP. (Rzut włócznią)","SK_A_A_0506":"[Tarcza] Umiejętność ataku wyprzedzającego. Obrażenia równe obronie ×5(7.5). Koszt: 4% MP. (Rzucony głaz)","SK_A_A_0508":"[Tarcza] Gdy jesteś celem, natychmiast odzyskujesz 2(3)% maks. HP. Jeśli jesteś ostatnim sojusznikiem na nogach, każde otrzymane trafienie zadaje też wszystkim wrogom obrażenia równe odzyskanemu HP.","SK_A_A_0509":"[Włócznia, Przybór magiczny] Gdy sojusznik jest celem, a jego HP wynosi 15(22.5)% lub mniej, natychmiast przywraca mu HP równe twojemu SZC ×8(12). Koszt 8% MP na sojusznika; bez MP nie aktywuje się. Uleczony sojusznik otrzymuje o 25(37.5)% mniejsze obrażenia do końca walki.","SK_A_A_0510":"Unik +30(45)%. Gdy skutecznie unikniesz, ścigasz atakującego i zadajesz obrażenia równe 80(120)% twojego końcowego ataku.","SK_A_A_0511":"Gdy jesteś celem umiejętności lub ataku magicznego, zmniejsza te obrażenia o 80(120)%. Następnie zmniejsza bazowe statystyki atakującego o 30(45)% do końca walki, a ty zyskujesz tę wartość.","SK_A_A_0802":"[A] [Faza] Trwa 10 s. Natychmiast i co 2 s nakłada „Zamrożenie” na wszystkich wrogów. „Zamrożenie” dodatkowo nakłada celność -35(52.5)%.","SK_A_E_0507":"Przy ataku wyprzedzającym z góry nakłada na wroga Rozdarcie. (Otrzymywane obrażenia +25(37.5)%)","SK_A_P_0001":"Zwiększa skuteczność umiejętności żywiołu lodu o 30(45)%.","SK_A_P_0301":"[Tarcza] Zwiększa obronę wszystkich sojuszników (poza tobą) o twoją obronę ×0.1(0.15). Dodatkowo nadaje wszystkim sojusznikom kumulującą się Tarczę Egidy równą 7(10.5)% twojego HP. Następnie zadaje jednemu wrogowi obrażenia równe sumie utworzonych tarcz sojuszników ×0.5(0.75). (Górny limit obrażeń = poziom gracza ×300(450))","SK_A_P_0302":"[Włócznia] Zadaje 2 wrogom obrażenia równe (SIŁ + MAG) ×10(15).","SK_A_P_0303":"Wszystkie efekty żywiołaków +70(105)%. Przyzywa chochlika, który bierze udział w walce. Chochlik czasem blokuje umiejętność zamiast ciebie.","SK_A_P_0304":"Gdy zyskasz dodatkową okazję do ataku, twój następny atak podstawowy lub umiejętność ignoruje obronę wroga.","SK_A_P_0305":"Po wejściu do walki zapewnia +1 turę z góry.","SK_A_P_0306":"Przy ataku wyprzedzającym: szansa kryt. +25(37.5)%, celność +25(37.5)%.","SK_A_P_0307":"Celność +45(67.5)%. Otrzymywane obrażenia magiczne -15(22.5)%.","SK_A_P_0308":"Po wejściu do Wrót maks. MP tymczasowo rośnie o 50(75)% aż do końca Wrót. (Jako maks. MP zaczyna napełnione.)","SK_A_P_0701":"Inteligencja +50(75)","SK_A_P_0702":"[P] Gdy MP spadnie do 20(30) lub mniej, odzyskujesz 10(15)% MP. (Można wyłączyć)","SK_A_P_0801":"[P] Maks. MP rośnie o poziom gracza ×60(90). Każdy 1% zużytego MP zwiększa obrażenia umiejętności żywiołu zamrożenia o 1(1.5)%.","SK_A_P_0802":"[P] Tury wrogów +1. Szybkość rzucania sojuszników +30(45)%.","SK_A_P_0803":"[P] Podczas walki zwiększa statystyki SIŁ i MAG sojuszników o poziom ×1(1.5) i o tyle samo zmniejsza wrogom. (Nie sumuje się)","SK_A_P_0901":"[Pasywna] Po każdym ataku podstawowym kręci ruletką. Ruletka pokazuje 1-7; wypadnięcie 7 daje dodatkową okazję do ataku. Twoje SZC zwiększa szansę na 7. (Od 15% do limitu 50%)","SK_A_P_0902":"[P] Działasz jako pierwszy jednym atakiem podstawowym na początku walki. Jeśli tę umiejętność ma kilku walczących, pierwszeństwo ma wyższa ZRC, potem wyższe PD (przy remisie wygrywa gracz).","SK_A_P_0905":"[P] Zmysł +{18}.","SK_B_A_0301":"[Miecz] Zadaje obrażenia równe 150% końcowego ataku plus suma wszystkich statystyk ×1.","SK_B_A_0302":"[Sztylet] 100(150)% końcowego ataku + ładunki Pościgu ×10(15)%. Po ataku zyskujesz 1 ładunek Pościgu. (Maks. 25) Do 350(525)% obrażeń.","SK_B_A_0303":"[Wielki miecz] Zadaje wszystkim wrogom w walce obrażenia równe 180(270)% końcowego ataku plus SIŁ ×2(3). Tury trafionych wrogów są opóźnione o +2.","SK_B_A_0304":"[Kastet] 100(150)% końcowego ataku + obrażenia dla wszystkich wrogów. Obrona trafionych wrogów -35(52.5)%. Nie można go skontrować.","SK_B_A_0305":"[Dystansowe] 85(127.5)% końcowego ataku + wystrzeliwuje 6 pocisków. Trafia losowych wrogów. Każde trafienie zmniejsza obronę trafionego wroga o 1(1.5). (Sumuje się bez ograniczeń.)","SK_B_A_0306":"[Przybór magiczny] 120(180)% ataku magicznego. Nakłada Zatrucie many na trafionych wrogów. Wrogowie z Zatruciem many otrzymują dodatkowe obrażenia magiczne równe liczbie ładunków Zatrucia many ×1(1.5)%.","SK_B_A_0501":"[Miecz, Wielki miecz] Umiejętność ataku wyprzedzającego. Końcowy atak 1.6(2.4) + suma wszystkich statystyk ×1(1.5).","SK_B_A_0502":"[Tarcza, Włócznia, Kastet] Umiejętność ataku wyprzedzającego. Końcowy atak 1.2(1.8) + suma wszystkich statystyk ×1(1.5).","SK_B_A_0503":"[Dystansowe] Po pokonaniu celu jednym atakiem wyprzedzającym twój następny atak wyprzedzający zyskuje premię do ataku 15(22.5)%.","SK_B_A_0505":"[Miecz, Kastet, Sztylet] Po uniknięciu ataku wroga 30(45)% szansy na zadanie obrażeń równych końcowemu atakowi ×1.8(2.7). Zawsze trafia krytycznie z obrażeniami kryt. +250(375)%. Zyskujesz natychmiastową akcję.","SK_B_A_0506":"Po uniknięciu ataku wroga 30% szansy na nadanie „Przyspieszenia” wszystkim sojusznikom. Od 2. użycia nadaje wszystkim sojusznikom kumulujący się unik +5%.","SK_B_A_0507":"[Dystansowe, Przybór magiczny] Gdy wróg rzuca atak magiczny, 15(22.5)% szansy na jego anulowanie. Do 5 razy na walkę; koszt 5% MP za użycie. Przy anulowaniu zadaje obrażenia równe MP zużytemu przez wroga ×10(15) i opóźnia podstawową turę akcji wroga o 1.","SK_B_A_0801":"[A] Nakłada Zamrożenie na wszystkich wrogów; co najmniej 1 gwarantowany, 35(52.5)% szansy na każdego. Następnie zadaje obrażenia równe atakowi magicznemu ×6(9) za każdy nałożony ładunek Zamrożenia. Zaraz potem egzekwuje wrogów poniżej 20(30)% HP. Rzucanie 8 s. 3 użycia na walkę. Koszt: 25% MP.","SK_B_P_0001":"Przy ataku podstawowym Rycerz Cienia o statystykach identycznych z twoimi wykonuje 1 dodatkowy atak podstawowy.","SK_B_P_0301":"Gdy masz wyposażoną [Tarczę]: zadaje wszystkim wrogom obrażenia równe obronie ×6(9). Nadaje wszystkim sojusznikom kumulującą się Tarczę Egidy równą 5(7.5)% twojego HP.","SK_B_P_0302":"[Włócznia] Obrażenia stałe równe (SIŁ+MAG) ×5(7.5).","SK_B_P_0303":"Wszystkie efekty żywiołaków +30(45)%.","SK_B_P_0304":"Po wejściu do walki zapewnia 2 tury z góry.","SK_B_P_0305":"Celność, szansa kryt. i obrażenia kryt. +25(37.5)%.","SK_B_P_0306":"Unik +45(67.5)%.","SK_B_P_0307":"Maks. MP +15(22.5)%.","SK_B_P_0308":"[Tarcza] Maks. HP +35(52.5)%.","SK_B_P_0701":"[P] Urodzony geniusz. Wszystkie statystyki +7(10.5)","SK_B_P_0702":"[P] Dodaje 10(15)% twojej najwyższej statystyki do pozostałych statystyk.","SK_B_P_0705":"[P] Celność +25(37.5)%. Każdy chybiony atak daje dodatkowo celność +5(7.5)%. (Sumuje się bez ograniczeń)","SK_B_P_0706":"Zyskujesz ZRC równą poziomowi gracza ×1(1.5).","SK_B_P_0707":"Zyskujesz atak i atak magiczny równe poziomowi gracza ×1(1.5).","SK_B_P_0708":"Zyskujesz SZC i ZMY równe poziomowi gracza ×0.5(0.75).","SK_B_P_0709":"Zyskujesz INT równą poziomowi gracza ×1(1.5).","SK_B_P_0711":"[P] Gdy jakiś sojusznik ma 10(15)% HP lub mniej, przywraca sojusznikowi o najniższym HP 10(15)% zdrowia (bez rzucania). 5 razy na walkę.","SK_B_P_0712":"[P] Urodzony z niszczycielską siłą. SIŁ rośnie o 3(4.5) co 4 poziomy gracza. Pasywna.","SK_B_P_0801":"Zwiększa obrażenia końcowe magii żywiołu lodu o 35(52.5)%.","SK_B_P_0802":"[P] Nakładanie Zamrożenia dodaje 1 dodatkowy ładunek.","SK_B_P_0905":"[P] Zmysł +{15}.","SK_C_A_0301":"[Miecz, Wielki miecz] 145% końcowego ataku. Uderza jednocześnie do 3 wrogów.","SK_C_A_0302":"[Sztylet] 120% końcowego ataku. 15% szansy na dodatkową okazję do ataku po ataku.","SK_C_A_0303":"[Włócznia] 125% końcowego ataku. 15% obrażeń jest zadawane jako obrażenia stałe. Zmniejsza obronę trafionego wroga o 25%.","SK_C_A_0304":"[Kastet] 90% końcowego ataku ×2 uderzenia. Uderza na przemian lewą i prawą pięścią. Nie można go skontrować.","SK_C_A_0305":"[Dystansowe] 135% końcowego ataku. Zadaje obrażenia dodatkowe równe SIŁ +1.5. (Sumowanie)","SK_C_A_0306":"[Tarcza] 150% końcowego ataku plus stałe obrażenia dodatkowe równe obronie ×5.","SK_C_A_0307":"[Dystansowe] 120% końcowego ataku ×2 uderzenia. Jeśli pierwsze uderzenie zabije wroga, nadwyżka obrażeń przechodzi na innego wroga.","SK_C_A_0308":"[Przybór magiczny] 85% ataku magicznego. Nakłada „Zatrucie many” na trafionych wrogów. Zatruci maną wrogowie co sekundę (10 tur) otrzymują obrażenia skalowane statystyką MAG rzucającego ×1. (Pięciu magów uderzających za 100 zadaje 500 obrażeń na sekundę. Nalicza się tylko raz na gracza.)","SK_C_A_0501":"[Sztylet] Umiejętność ataku wyprzedzającego. Końcowy atak 1.5. Bonus: ignoruje 25% redukcji obrażeń (sumowanie).","SK_C_A_0502":"Jeśli zostaniesz zaatakowany, zanim wykonasz akcję, zyskujesz przyspieszenie tur +3 (3 tury zużywane jako pierwsze).","SK_C_A_0504":"[Miecz, Wielki miecz, Kastet, Włócznia, Sztylet] Raz na walkę, 10% szansy aktywacji po uniknięciu ataku wroga. Zadaje obrażenia równe 150% końcowego ataku jako gwarantowany kryt, nadaje ci „Przyspieszenie” (unik +25%, celność +25%, 30 tur) i daje natychmiastową akcję.","SK_C_A_0505":"[Specjalne] Wymaga w drużynie [Tarczy] oraz użytkownika broni [Dystansowej] lub [Przyboru magicznego]; aktywuje się do 3 razy na walkę. Gdy jesteś celem, 60% szansy na zignorowanie obrażeń, a każdy sojusznik z wyposażoną bronią [Dystansową] lub [Przyborem magicznym] uderza wszystkich wrogów, zadając obrażenia równe (końcowy atak + atak magiczny) ×2.","SK_C_A_0506":"Szansa na Kontrę +2%. Gdy Kontra zadaje obrażenia: obrażenia końcowe +10%, celność +5%, szansa kryt. +5%.","SK_C_A_0801":"[A] Przyzywa na pole Mroźną Kulę. Kula pozostaje przy graczu, stale emanując mocą. HP Mroźnej Kuli = MAG gracza ×15 + poziom ×100. Co 2 sekundy zadaje wszystkim wrogom obrażenia okresowe równe MAG rzucającego ×1. Trafieni wrogowie mają 25% szansy na „Zamrożenie”. [Przybór magiczny] Gdy gracz zostaje trafiony, Mroźna Kula przyjmuje cios jako pierwsza. Atakujący otrzymuje 1 ładunek „Zamrożenia” przed obliczeniem obrażeń. Za każdym razem, gdy na polu przybywa ładunek Zamrożenia, zyskujesz tarczę równą Magii x0,1. Można przyzwać tylko 1 kulę na walkę. Po zniszczeniu można jej użyć ponownie po 15 sekundach.","SK_C_A_0802":"[A] Zadaje 2800 obrażeń wszystkim wrogom. Nakłada 1 Zamrożenie. Szansa kryt. 25%.","SK_C_E_0503":"Przy ataku wyprzedzającym celność +20%.","SK_C_P_0001":"Pasyw aktywowany. Gdy zostaniesz zaatakowany, zużywa 10% bieżącego MP i o tyle samo zmniejsza otrzymane obrażenia.","SK_C_P_0212":"Przy ataku podstawowym „Cień” wykonuje dodatkowe uderzenie zadające 15% obrażeń.","SK_C_P_0301":"[Miecz, Sztylet, Kastet] Trafieni wrogowie co 3 sekundy (30 tur) otrzymują ciągłe obrażenia równe ZRC ×0.1.","SK_C_P_0302":"Gdy masz wyposażony [Miecz], obrażenia ataku podstawowego i umiejętności +20%. Zyskujesz celność +25%.","SK_C_P_0303":"Gdy masz wyposażony [Kastet], obrażenia umiejętności +80%. Czas rzucania -1 tura.","SK_C_P_0304":"Gdy masz wyposażony [Wielki miecz], zwiększa SIŁ o poziom gracza ×1.","SK_C_P_0305":"Gdy masz wyposażoną [Tarczę], zwiększa obronę o SIŁ ×5. Otrzymywane obrażenia -35%. Zyskujesz *Prowokację*. Ignoruje obrażenia równe twojej obronie lub niższe. (Zignorowane obrażenia = 1 obrażenie)","SK_C_P_0306":"Gdy masz wyposażony [Sztylet], zwiększa ZRC o poziom gracza ×1.","SK_C_P_0307":"Gdy masz wyposażoną [Włócznię], zyskujesz +15% obrażeń końcowych i +15% redukcji obrażeń.","SK_C_P_0308":"Gdy masz wyposażoną broń [Dystansową], końcowy atak +15%.","SK_C_P_0309":"Gdy masz wyposażony [Przybór magiczny], natychmiast odzyskujesz 10% zużytego MP. Obrażenia umiejętności +30%.","SK_C_P_0701":"[P] Szczęście +30","SK_C_P_0702":"[A] Nadaje wszystkim sojusznikom tarczę równą MAG ×3 + HP rzucającego ×0.3. Rzucanie 3 s. MP 60.","SK_C_P_0703":"[A] Zużywa całą twoją tarczę, by zadać obrażenia równe jej wartości. Rzucanie 1 s. MP 25.","SK_C_P_0706":"[P] Twoja najwyższa statystyka +35.","SK_C_P_0707":"[A] Jeśli maks. HP wroga przewyższa twoje, zadaje obrażenia fizyczne równe różnicy HP ×0.5. (Górny limit obrażeń = suma wszystkich statystyk ×8). MP 50.","SK_C_P_0709":"[P] Zyskujesz unik równy poziomowi gracza ×0.5%. (50% na poziomie 99)","SK_C_P_0712":"[P] Odzyskujesz 3% obrażeń zadanych magią.","SK_C_P_0801":"Zwiększa obrażenia końcowe magii żywiołu zamrożenia o 7% i czas trwania Zamrożenia o 20%.","SK_C_P_0802":"Na początku walki nakłada Zamrożenie (E) na wszystkich wrogów z 15% szansą na każdego. Umiejętności Zamrożenia kosztują 2% mniej MP.","SK_C_P_0803":"[P] Szansa kryt. +25% przy atakach żywiołu lodu.","SK_C_P_0804":"[P] [Włócznia] Ataki podstawowe i umiejętności żywiołu lodu zadają 35% dodatkowych obrażeń magicznych. Otrzymywane obrażenia -10%.","SK_C_P_0805":"[P] Zmniejsza otrzymywane obrażenia magiczne o 25%. Za każdą aktywacją redukcja spada o 1 p.p., minimalnie do 1%. 25% szansy na oparcie się Zamrożeniu.","SK_C_P_0806":"[P] Zwiększa zdobywane PD o {25}%.","SK_C_P_0905":"[P] Zmysł +{12}.","SK_D_A_0001":"[A] Wystrzeliwuje lodową strzałę w jednego wroga, zadając obrażenia równe 280% ataku magicznego. Rzucanie 5 s. Koszt: 15% MP.","SK_D_A_0301":"[Miecz, Wielki miecz] 125% końcowego ataku. Uderza jednocześnie do 3 wrogów.","SK_D_A_0302":"[Kastet] 115% końcowego ataku. Obrażenia dodatkowe równe 3% bieżącego HP wroga. (Maks. 1200)","SK_D_A_0303":"[Dystansowe] 110% końcowego ataku. Rzucanie po ataku -10% (pierwszeństwo tury). Nakłada *Ranę* na trafionego wroga. Wszystkie ataki fizyczne zadają zranionym wrogom 5% obrażeń dodatkowych.","SK_D_A_0304":"[Sztylet] 55% końcowego ataku ×2 uderzenia. Wykonuje dwa ataki podstawowe. Drugie uderzenie ignoruje 35% obrony.","SK_D_A_0305":"[Tarcza] 110% końcowego ataku. Zadaje obrażenia dodatkowe równe obronie ×3. Uderza jednocześnie do 3 wrogów. Zmniejsza obronę trafionych wrogów o 25%.","SK_D_A_0306":"[Włócznia] 120% końcowego ataku. Trafieni wrogowie: celność -25% oraz szybkość ataku i rzucania -25%. (Nie sumuje się)","SK_D_A_0307":"[Przybór magiczny] 115% ataku magicznego. Trafieni wrogowie: odporność magiczna -50%.","SK_D_A_0501":"[Dystansowe] Umiejętność ataku wyprzedzającego. Końcowy atak 1.4. Bonus: szansa kryt. +15%.","SK_D_A_0503":"Po udanym ataku wyprzedzającym: INT +10 na czas walki.","SK_D_A_0504":"Po udanym ataku wyprzedzającym: SZC i ZMY +15 na czas walki.","SK_D_A_0505":"Ataki wyprzedzające ignorują 20% obrony wroga.","SK_D_A_0506":"[Przybór magiczny] Gdy sojusznik jest celem ataku, 30% szansy na nałożenie „Zamrożenia” na wroga. Zamrożeni wrogowie mają celność -25%. Ładunki Zamrożenia trwają 10 sekund; co 3 ładunki zadają obrażenia równe MAG ×1.","SK_D_A_0507":"[Miecz, Sztylet, Wielki miecz, Kastet, Włócznia] Raz na walkę, gdy cios miałby sprowadzić HP do 0, HP zatrzymuje się na 1. Następnie negujesz kolejne trafienie, zadajesz wrogowi obrażenia równe 150% końcowego ataku i odzyskujesz HP do 15%.","SK_D_A_0801":"[A] Nadaje ci tarczę równą atakowi magicznemu ×2. Rzucanie 2 s. Koszt: 15% MP.","SK_D_A_0802":"[A] Zadaje wszystkim wrogom obrażenia równe atakowi magicznemu ×3 i nakłada „Zamrożenie” 3 razy. Rzucanie 5 s. Koszt: 15% MP.","SK_D_P_0001":"Celność +15. (Sumuje się ze Skupieniem)","SK_D_P_0002":"Szybkość ataku stopniowo rośnie co turę podczas walki. +0,1% na turę (10 tur = 1%).","SK_D_P_0301":"Gdy masz wyposażony [Miecz], obrażenia umiejętności +25%. Skraca opóźnienie tur po ataku o 3 tury.","SK_D_P_0302":"Gdy masz wyposażony [Kastet], obrażenia umiejętności +30%. Czas rzucania -1 tura.","SK_D_P_0303":"Gdy masz wyposażony [Wielki miecz], obrażenia ataku podstawowego +15%. Redukcja obrażeń +15%.","SK_D_P_0304":"Gdy masz wyposażoną [Tarczę], zwiększa obronę o SIŁ ×3. Otrzymywane obrażenia -25%. Zyskujesz *Prowokację*.","SK_D_P_0305":"Gdy masz wyposażony [Sztylet], szybkość ataku +25%.","SK_D_P_0306":"Gdy masz wyposażoną [Włócznię], zyskujesz +10% obrażeń końcowych i +10% redukcji obrażeń.","SK_D_P_0307":"Gdy masz wyposażoną broń [Dystansową], zyskujesz celność +25% i obrażenia kryt. +25%.","SK_D_P_0308":"Gdy masz wyposażony [Przybór magiczny], czas rzucania -25%.","SK_D_P_0309":"Zwiększa obronę o sumę wszystkich statystyk ×0.2.","SK_D_P_0701":"[P] Gdy rzucasz umiejętność zużywającą MP, a slot rzucania jest wolny, automatycznie współrzuca „Kulę Rezonansu”.","SK_D_P_0702":"[P] Jeśli po twoim ataku podstawowym wrogowi zostanie 1% HP lub mniej, wykonujesz jeden dodatkowy atak podstawowy.","SK_D_P_0703":"[P] Zyskujesz 1000 złota i 30 PD za każde przebyte 3 km.","SK_D_P_0704":"[A] Do użycia na zatrutym wrogu. Ustala ładunki Zatrucia na 5; nadmiar Zatrucia zadaje natychmiastowe obrażenia. Stałe obrażenia Zatrucia stają się wtedy równe 2% maks. HP wroga co 3 sekundy. (Maks. obrażenia = MAG gracza ×12). Rzucanie 3 s. MP 90.","SK_D_P_0705":"[A] Wstrzykuje wzmacniającą energię 3 losowym sojusznikom poza tobą. Daje maks. HP +15% i otrzymywane obrażenia -7%. Rzucanie natychmiastowe. 1 s opóźnienia po użyciu. MP 45.","SK_D_P_0708":"[P] Odzyskujesz 1% zadanych obrażeń fizycznych.","SK_D_P_0801":"Umiejętności żywiołu zamrożenia rzucane o 15% szybciej (zaokrąglenie w górę). Szansa kryt. +15%. Czas trwania Zamrożenia +2 s.","SK_D_P_0802":"Spowolnienie „Zamrożenia” +1 (osłabienie tur). Gdy „Zamrożenie” wygasa, zadaje obrażenia magiczne równe zużytym ładunkom Zamrożenia × maks. HP × 3%. (Uwzględnia obronę magiczną)","SK_D_P_0803":"25% szansy na oparcie się efektowi statusu „Zamrożenie”.","SK_D_P_0804":"[P] Zyskujesz 1 INT za każdy 1% HP utracony podczas walki.","SK_D_P_0806":"Atak magiczny +12%, maks. MP +12%.","SK_D_P_0807":"Obrażenia aktywnych umiejętności żywiołaków +10%. (Mnożnik grupy umiejętności)","SK_D_P_0808":"[P] Skraca czas rzucania przyzwań żywiołaków o 2 s. Przyzwania żywiołaków nie kosztują MP.","SK_D_P_0809":"[P] Zwiększa zdobywane PD o {15}%.","SK_D_P_0905":"[P] Zmysł +{9}.","SK_E_A_0301":"[Miecz] 110% końcowego ataku. Zadaje obrażenia dodatkowe równe ZRC +1.","SK_E_A_0302":"[Kastet] 105% końcowego ataku. Zmniejsza obronę trafionego wroga o 3. (Sumuje się bez ograniczeń)","SK_E_A_0303":"[Wielki miecz] 120% końcowego ataku. Uderza jednocześnie 3 pobliskich wrogów. Nakłada 3 tury opóźnienia po ataku.","SK_E_A_0304":"[Tarcza] 110% końcowego ataku. Zadaje obrażenia dodatkowe równe obronie ×1.","SK_E_A_0305":"[Włócznia] 120% końcowego ataku. Zadaje obrażenia dodatkowe równe ZRC +1.","SK_E_A_0306":"[Dystansowe] 110% końcowego ataku. Zadaje obrażenia dodatkowe równe SIŁ +1. Atak dystansowy.","SK_E_A_0307":"[Sztylet] 95% końcowego ataku. Szansa kryt. +30% dla tego ataku. Obrażenia kryt. +25%.","SK_E_A_0308":"[Przybór magiczny] 105% ataku magicznego. Ataki podstawowe stają się magicznymi pociskami.","SK_E_A_0501":"[Sztylet] Umiejętność ataku wyprzedzającego. Współczynnik końcowego ataku 1.1. Pocisk: sztylet.","SK_E_A_0502":"[Dystansowe] Umiejętność ataku wyprzedzającego. Współczynnik końcowego ataku 1.2. Pocisk: kula.","SK_E_A_0503":"[Przybór magiczny] Umiejętność ataku wyprzedzającego. Atak magiczny 1.1. Pocisk: kula magiczna. Żywioł: ogień.","SK_E_A_0507":"Zabójstwa atakiem wyprzedzającym dają +15% złota.","SK_E_A_0508":"[Tarcza] Gdy jesteś celem ataku, aktywuje się ze 100% szansą. Zadaje obrażenia równe obronie ×5.","SK_E_A_0509":"[Włócznia, Kastet] Gdy jesteś celem ataku, 5% szansy aktywacji: anuluje atak (tura wroga przepada) i daje ci dodatkową okazję do ataku. (Kradzież tury)","SK_E_A_0701":"[A] Atak ×220%. MP 25.","SK_E_A_0702":"[A] Atak ×180%, celność +20%. Szansa kryt. +10%. MP 20.","SK_E_A_0703":"[A] Wyrzuca 2 wrogów w niebo. 160% ataku magicznego. Trafieni wrogowie nie mogą działać przez 15 tur. Rzucanie 1,5 s. MP 70.","SK_E_A_0711":"[A] Nakłada na wroga „Korozję”. Zmniejsza jego obronę i obronę magiczną o 30% i co turę zadaje obrażenia równe 1% jego maks. HP. Rzucanie 2,5 s. MP 95.","SK_E_A_0801":"[A] Osłabienie jednego celu. Opóźnia akcję jednego wr  закалки","SK_F_P_0705":"Крепость тела","SK_F_P_0706":"Твёрдая решимость","SK_F_P_0707":"Трилистник","SK_F_P_0708":"Визуализация","SK_F_P_0709":"Материализация","SK_F_P_0711":"Разбор","SK_F_P_0712":"Захват цели","SK_F_P_0714":"Запретная зона","SK_F_P_0716":"Сильный удар кулаком","SK_F_P_0719":"Серия разрезов","SK_F_P_0720":"Талант мечника","SK_F_P_0722":"Талант ассасина","SK_F_P_0723":"Реванш","SK_F_P_0801":"Склонность к холоду","SK_F_P_0802":"Мастерство заморозки","SK_F_P_0803":"Незаурядный рост","SK_F_P_0904":"Собиратель осколков","SK_F_P_0905":"Исследователь","SK_SS_P_0302":"Парное фехтование","SK_SS_P_0303":"Нарушитель правил","SK_SS_P_0304":"Разрушитель заклинаний","SK_SS_P_0301":"Похищение маны","SK_SS_A_0501":"Оппортунист","SK_S_P_0971":"Боевое искусство лисы"},"desc":{"SK_EX_A_0001":"Пассивный. Даёт вам «Чёрную луну». Враги, атакующие вас, получают -25% меткости, а ваши атаки наносят доп. урон, равный маг. атаке ×3.","SK_EX_A_0002":"Актив стихии света.\nНачинает каст в момент начала боя, отдельным кастом. Через 20 ходов бьёт всех врагов магической атакой, равной всему урону, нанесённому вами за бой. Затем ваш MP становится 0 и восстанавливается по 10(15)% за ход в течение 10 ходов.","SK_EX_A_0006":"[Меч] Лепестки падают дождём. Обычные атаки бьют 3 случайных врагов одновременно, нанося каждому финальная атака ×3(4.5) + все хар-ки ×3(4.5) урона. Каждое попадание добавляет цели 10 зарядов «Полного цветения»; при 60 зарядах цель расцветает и получает урон в размере 30% её макс. ОЗ (снижается защитой). Если в этот момент ОЗ цели не выше 30% макс. ОЗ, она казнится без учёта защиты. Урон цветения не может превышать ваш макс. ОЗ ×30 и не бывает критическим.","SK_EX_A_0007":"[P] С [мечом], [кинжалом] или [двуручным мечом]: обычные атаки становятся электрическими. Меткость +25(37.5)%, скорость атаки +80(120)%, крит. урон +80(120)%.","SK_EX_A_0012":"Актив тёмной стихии (мгновенный).\nПосле применения начинается 15-ходовый ченнелинг (другие действия недоступны). Каждый ход наносит всем врагам урон магия ×N (N = прошедших ходов) и расходует 6% маны за ход. При нехватке маны прекращается досрочно.\nПо завершении ченнелинга до конца боя обычные атаки получают магия ×8 доп. урона и бьют дважды.","SK_EX_A_0015":"[P] С [мечом], [кинжалом] или [двуручным мечом]: обычные атаки всегда попадают, а навыки с основным оружием [меч], [кинжал] или [двуручный меч] наносят на 600(900)% больше урона.","SK_EX_A_0501":"[Любое оружие] Навык упреждающего удара. Ур. ×100(150) + все хар-ки ×2(3). Расход MP 3%.","SK_EX_A_0502":"[Дальний бой] Финальная атака ×120(180)% фиксированного урона. Враги, поражённые вашим упреждающим ударом в начале боя, помечаются «Видением будущего» и получают тот же урон каждую секунду.","SK_EX_A_0503":"[Любое оружие] Навык упреждающего удара. Все хар-ки ×3. Атака дикого монстра начинает бой с 1–6 такими монстрами. В начале боя наносит всем врагам урон все хар-ки ×3.","SK_EX_A_0504":"Упреждающий удар по дикому монстру сразу засчитывает победу в бою. В начале боя даёт всем союзникам уклонение +25%.","SK_EX_A_0505":"Когда вы становитесь целью, со 100% шансом наносите атакующему урон, равный полученному. Затем восстанавливаете 90(135)% полученного урона.","SK_EX_P_0303":"[P] Если после обычной атаки цель выжила, все задержки исчезают, и через 1 ход вы автоматически атакуете снова без выбора действия. Повторяется раз в ход, пока цель не падёт, затем возвращаются выбор действия и исходный интервал.","SK_EX_P_0304":"[P] С каждым вашим действием макс. MP растёт на 1(1.5)% (сложный процент). Одновременно наносит всем врагам периодический магический урон силой, равной новому макс. MP. Урон зависит от маг. защиты и снижения урона цели.","SK_EX_P_0701":"У монстров тоже есть характеристики. Добавляет к вашим характеристикам по 10% от каждой из 6 характеристик врага. На 100 уровне добавляет к вашим характеристикам 110% характеристик монстра.","SK_EX_P_0801":"[P] В начале боя клеймит всех врагов «Финалом». Через 20 секунд наносит всем врагам урон ур. ×100 + магия ×70 и оглушает всех на 3 с. По врагам с «Заморозкой» урон становится фиксированным.","SK_EX_P_0802":"В начале боя призывает 3 Ледяные сферы, игнорируя лимит в 1 сферу. Вы начинаете бой с 0% MP.","SK_SSS_P_0905":"[P] Восприятие +{27}.","SK_SS_P_0905":"[P] Восприятие +{24}.","SK_SS_P_0951":"[P] Когда у врага остаётся 1 HP, даёте себе 3 возможности обычной атаки. Этот порог растёт на 5% с каждым Lv Презрения; на Презрении Lv5 вы получаете 3 возможности обычной атаки, когда у врага остаётся 25% HP или меньше.","SK_A_A_0801":"Призывает Королеву инея к игроку. Она сражается вместе с вами, применяя случайное заклинание стихии заморозки рангов F–A каждые 2 ваших хода. Её характеристики — 75(112.5)% ваших. Королеву инея нельзя развеять. Каст 3(2) с, расход 25(17)% MP. Повторный призыв невозможен.","SK_EX_A_0003":"[Меч] Длительный актив (мгновенный).\nПосле применения в течение 20 ходов каждый ход метеорит силой сила ×20(30) поражает одного случайного врага.\nРасход 3% маны за ход; при нехватке маны, оглушении или выборе другого навыка ченнелинг немедленно прекращается.","SK_EX_A_0017":"[Меч]\nКогда враг наносит обычную атаку, с шансом 50(75)% аннулирует её и наносит врагу урон все хар-ки ×10(15). Внутренний кулдаун 3 хода.","SK_S_A_0501":"Упреждающие удары с позиции ближнего бойца наносят (сила+ловкость) ×3(4.5) доп. урона.","SK_S_A_0502":"[Меч, кинжал, двуручный меч, копьё] Раз за бой, став целью, с шансом 5(7.5)% снижает урон до 1 и наносит врагу урон финальная атака ×10(15).","SK_S_A_0801":"[A] [Фаза] Кастуется непрерывно 15 секунд. Ваш HP во время каста становится 1. Пока каст продолжается, каждые 3 хода атакует случайного врага 6(9) ледяными осколками. (Каст прерывается при снятии Фазы, развеивании баффа или оглушении.) Каст 2 с.","SK_S_A_0902":"[A] Наносит всем врагам урон {10}% макс. HP. (Макс. урон за удар = все хар-ки × 50)","SK_S_P_0502":"[Меч, кинжал, двуручный меч] Усиливает эффекты мастерства меча на 50(75)%. Меткость, шанс крит. удара и крит. урон +25(37.5)%. При расчёте финальной атаки дополнительно получает атаку оружия ×2(3).","SK_S_P_0801":"[P] Маг. атака +50(75)%, макс. MP +30(45)%","SK_S_P_0905":"[P] Восприятие +{21}.","SK_S_P_0951":"[P] Убийство врага контратакой даёт дополнительную возможность атаки.","SK_S_P_0962":"[P] Убийство врага даёт 1 дополнительную возможность атаки.","SK_A_A_0301":"[Меч] Атакует всех врагов 2 раза. Урон: 150(225)% финальной атаки + все хар-ки ×1(1.5).","SK_A_A_0302":"[Меч, кинжал] Наносит 100(150)% финальной атаки + ловкость ×12~18(18~27) урона. После атаки вы скованы 3 хода.","SK_A_A_0303":"[Кинжал] 100(150)% финальной атаки. Крит. урон 500(750)%.","SK_A_A_0304":"[Двуручный меч] Атакует до 6 врагов одновременно. Урон: 220(330)% финальной атаки + сила ×5(7.5). Снижает защиту поражённых врагов на 15(22.5)%. (Обновляется, не суммируется)","SK_A_A_0305":"[Кастеты] Атакует всех врагов 1 раз. Уничтожает все барьеры целей, затем наносит 220(330)% финальной атаки. Может быть заблокировано контратакой.","SK_A_A_0306":"[Дальний бой] Высвобождает последнее оставшееся пламя. 320(480)% финальной атаки. Задержка восстановления 5 ходов. Финальный урон растёт на величину недостающего до максимума MP. (+1(1.5)% за каждый недостающий 1%)","SK_A_A_0307":"[Маг. инструмент] 120(180)% маг. атаки. Накладывает «Отравление маной». Наносит такой же урон всем врагам с отравлением маной. Если эта атака убивает врага, ваш MP восстанавливается на величину оставшегося MP врага.","SK_A_A_0501":"[Меч] Навык упреждающего удара. Финальная атака 1.8(2.7) + все хар-ки ×1(1.5). Расход MP 3%. (Аура меча)","SK_A_A_0504":"[Копьё] Навык упреждающего удара. Фиксированный урон (сила+магия) ×3.5(5.25); всегда попадает критическим ударом. Расход MP 15%. (Бросок копья)","SK_A_A_0506":"[Щит] Навык упреждающего удара. Урон: защита ×5(7.5). Расход MP 4%. (Брошенный камень)","SK_A_A_0508":"[Щит] Когда вы становитесь целью, мгновенно восстанавливаете 2(3)% макс. HP. Если вы последний выживший союзник, каждый полученный удар также наносит всем врагам урон, равный восстановленному HP.","SK_A_A_0509":"[Копьё, маг. инструмент] Когда союзник становится целью и его HP 15(22.5)% или ниже, мгновенно восстанавливает ему HP на удача ×8(12). Расход 8% MP за союзника; без MP не срабатывает. Получаемый урон исцелённого союзника снижен на 25(37.5)% до конца боя.","SK_A_A_0510":"Уклонение +30(45)%. При успешном уклонении преследуете атакующего и наносите урон 80(120)% вашей финальной атаки.","SK_A_A_0511":"Когда вы становитесь целью навыка или магической атаки, снижает этот урон на 80(120)%. Затем снижает базовые характеристики атакующего на 30(45)% до конца боя, и вы получаете их себе.","SK_A_A_0802":"[A] [Фаза] Длится 10 с. Мгновенно и каждые 2 с накладывает «Заморозку» на всех врагов. «Заморозка» дополнительно снижает меткость на 35(52.5)%.","SK_A_E_0507":"При упреждающем ударе заранее накладывает на врага «Разрыв». (Получаемый урон +25(37.5)%)","SK_A_P_0001":"Эффективность навыков стихии льда +30(45)%.","SK_A_P_0301":"[Щит] Повышает защиту всех союзников (кроме вас) на вашу защиту ×0.1(0.15). Дополнительно даёт всем союзникам суммирующийся барьер Эгиды в размере 7(10.5)% вашего HP. Затем наносит одному врагу урон, равный сумме созданных барьеров ×0.5(0.75). (Макс. урон = уровень игрока ×300(450))","SK_A_P_0302":"[Копьё] Наносит 2 врагам урон (сила + магия) ×10(15).","SK_A_P_0303":"Все эффекты духов +70(105)%. Призывает пикси, которая участвует в бою. Пикси иногда принимает навык на себя вместо вас.","SK_A_P_0304":"Получив дополнительную возможность атаки, ваша следующая обычная атака или навык игнорирует защиту врага.","SK_A_P_0305":"При входе в бой заранее получаете +1 ход.","SK_A_P_0306":"При упреждающем ударе: шанс крит. удара +25(37.5)%, меткость +25(37.5)%.","SK_A_P_0307":"Меткость +45(67.5)%. Получаемый магический урон -15(22.5)%.","SK_A_P_0308":"При входе во Врата макс. MP временно увеличивается на 50(75)% до конца Врат. (Это макс. MP, поэтому он сразу заполнен.)","SK_A_P_0701":"Интеллект +50(75)","SK_A_P_0702":"[P] Каждый раз, когда MP падает до 20(30) или ниже, восстанавливает 10(15)% MP. (Можно отключить)","SK_A_P_0801":"[P] Макс. MP растёт на уровень игрока ×60(90). Каждый потраченный 1% MP увеличивает урон навыков стихии заморозки на 1(1.5)%.","SK_A_P_0802":"[P] Ходы врагов +1. Скорость каста союзников +30(45)%.","SK_A_P_0803":"[P] В бою увеличивает силу и магию союзников на ур. ×1(1.5), у врагов — уменьшает на столько же. (Не суммируется)","SK_A_P_0901":"[Пассивный] После каждой обычной атаки крутит рулетку 1–7; выпавшая 7 даёт дополнительную возможность атаки. Удача повышает шанс семёрки. (От 15% до предела 50%)","SK_A_P_0902":"[P] В начале боя действуете первым одной обычной атакой. Если навык есть у нескольких бойцов, приоритет — выше ловкость, затем выше опыт (при равенстве — игрок).","SK_A_P_0905":"[P] Восприятие +{18}.","SK_B_A_0301":"[Меч] Наносит урон 150% финальной атаки + все хар-ки ×1.","SK_B_A_0302":"[Кинжал] 100(150)% финальной атаки + стаки «Погони» ×10(15)%. После атаки получаете 1 стак «Погони». (Макс. 25) До 350(525)% урона.","SK_B_A_0303":"[Двуручный меч] Наносит всем врагам в бою урон 180(270)% финальной атаки + сила ×2(3). Ходы поражённых врагов задерживаются на +2.","SK_B_A_0304":"[Кастеты] 100(150)% финальной атаки + урон всем врагам. Защита поражённых врагов -35(52.5)%. Не может быть контратаковано.","SK_B_A_0305":"[Дальний бой] 85(127.5)% финальной атаки + 6 выстрелов. Бьёт случайных врагов. Каждое попадание снижает защиту поражённого врага на 1(1.5). (Суммируется бесконечно.)","SK_B_A_0306":"[Маг. инструмент] 120(180)% маг. атаки. Накладывает на поражённых врагов отравление маной. Враги с отравлением маной получают доп. магический урон, равный стакам отравления ×1(1.5)%.","SK_B_A_0501":"[Меч, двуручный меч] Навык упреждающего удара. Финальная атака 1.6(2.4) + все хар-ки ×1(1.5).","SK_B_A_0502":"[Щит, копьё, кастеты] Навык упреждающего удара. Финальная атака 1.2(1.8) + все хар-ки ×1(1.5).","SK_B_A_0503":"[Дальний бой] После убийства цели упреждающим ударом с одного выстрела следующий упреждающий удар получает бонус атаки 15(22.5)%.","SK_B_A_0505":"[Меч, кастеты, кинжал] После уклонения от атаки врага с шансом 30(45)% наносит урон финальная атака ×1.8(2.7). Всегда попадает критом с крит. уроном +250(375)%. Получаете немедленное действие.","SK_B_A_0506":"После уклонения от атаки врага с шансом 30% даёт всем союзникам «Ускорение». Со 2-го применения даёт всем союзникам суммирующееся уклонение +5%.","SK_B_A_0507":"[Дальний бой, маг. инструмент] Когда враг кастует магическую атаку, с шансом 15(22.5)% отменяет её. До 5 раз за бой; расход 5% MP за срабатывание. При отмене наносит урон, равный потраченному врагом MP ×10(15), и задерживает базовый ход врага на 1.","SK_B_A_0801":"[A] Накладывает заморозку на всех врагов; минимум 1 гарантированно, шанс 35(52.5)% на каждого. Затем наносит урон маг. атака ×6(9) за каждый наложенный стак заморозки. Сразу после казнит врагов с HP ниже 20(30)%. Каст 8 с. 3 раза за бой. Расход 25% MP.","SK_B_P_0001":"При обычной атаке Теневой рыцарь с вашими характеристиками наносит 1 дополнительную обычную атаку.","SK_B_P_0301":"[Щит] При экипировке: наносит всем врагам урон защита ×6(9). Даёт всем союзникам суммирующийся барьер Эгиды в размере 5(7.5)% вашего HP.","SK_B_P_0302":"[Копьё] Фиксированный урон (сила+магия) ×5(7.5).","SK_B_P_0303":"Все эффекты духов +30(45)%.","SK_B_P_0304":"При входе в бой заранее получаете 2 хода.","SK_B_P_0305":"Меткость, шанс крит. удара и крит. урон +25(37.5)%.","SK_B_P_0306":"Уклонение +45(67.5)%.","SK_B_P_0307":"Макс. MP +15(22.5)%.","SK_B_P_0308":"[Щит] Макс. HP +35(52.5)%.","SK_B_P_0701":"[P] Прирождённый гений. Все хар-ки +7(10.5)","SK_B_P_0702":"[P] Добавляет 10(15)% вашей самой высокой характеристики к остальным характеристикам.","SK_B_P_0705":"[P] Меткость +25(37.5)%. Каждый промах даёт дополнительно меткость +5(7.5)%. (Суммируется бесконечно)","SK_B_P_0706":"Получаете ловкость, равную уровню игрока ×1(1.5).","SK_B_P_0707":"Получаете атаку и маг. атаку, равные уровню игрока ×1(1.5).","SK_B_P_0708":"Получаете удачу и чутьё, равные уровню игрока ×0.5(0.75).","SK_B_P_0709":"Получаете интеллект, равный уровню игрока ×1(1.5).","SK_B_P_0711":"[P] Когда у союзника 10(15)% HP или ниже, восстанавливает союзнику с наименьшим HP 10(15)% HP (без каста). 5 раз за бой.","SK_B_P_0712":"[P] Врождённая разрушительная сила. Сила растёт на 3(4.5) каждые 4 уровня игрока. Пассивный.","SK_B_P_0801":"Финальный урон магии стихии льда +35(52.5)%.","SK_B_P_0802":"[P] При наложении заморозки добавляет 1 дополнительный стак.","SK_B_P_0905":"[P] Восприятие +{15}.","SK_C_A_0301":"[Меч, двуручный меч] Финальная атака 145%. Атакует до 3 врагов одновременно.","SK_C_A_0302":"[Кинжал] Финальная атака 120%. После атаки с шансом 15% получаете дополнительную возможность атаки.","SK_C_A_0303":"[Копьё] Финальная атака 125%. 15% урона наносится как фиксированный. Снижает защиту поражённого врага на 25%.","SK_C_A_0304":"[Кастеты] Финальная атака 90% ×2 удара. Бьёт попеременно левым и правым кулаком. Не может быть контратаковано.","SK_C_A_0305":"[Дальний бой] Финальная атака 135%. Наносит доп. урон, равный сила +1.5. (Суммируется)","SK_C_A_0306":"[Щит] Финальная атака 150% + доп. фиксированный урон, равный защите ×5.","SK_C_A_0307":"[Дальний бой] Финальная атака 120% ×2 удара. Если первый удар убивает врага, остаток урона переходит на другого врага.","SK_C_A_0308":"[Маг. инструмент] Маг. атака 85%. Накладывает на поражённых врагов «Отравление маной». Отравленные маной враги получают урон каждую секунду (10 ходов) пропорционально магии заклинателя ×1. (Пять магов, бьющих по 100, наносят 500 урона в секунду. От одного игрока накапливается лишь один раз.)","SK_C_A_0501":"[Кинжал] Навык упреждающего удара. Финальная атака 1.5. Бонус: игнорирует 25% снижения урона (аддитивно).","SK_C_A_0502":"Если вас атаковали до вашего действия, получаете буст ходов +3 (3 хода, расходуемых первыми).","SK_C_A_0504":"[Меч, двуручный меч, кастеты, копьё, кинжал] Раз за бой, при уклонении от атаки врага срабатывает с шансом 10%. Наносит врагу 150% финальной атаки гарантированным критом, даёт вам «Ускорение» (уклонение +25%, меткость +25%, 30 ходов) и немедленное действие.","SK_C_A_0505":"[Особый] Требуется [Щит] и [Дальний бой] или [Маг. инструмент] в отряде; до 3 раз за бой. Когда вы становитесь целью, с шансом 60% игнорирует урон, и каждый союзник с [Дальним боем] или [Маг. инструментом] бьёт всех врагов на (финальная атака + маг. атака) ×2.","SK_C_A_0506":"Шанс контратаки +2%. Когда контратака наносит урон: финальный урон +10%, меткость +5%, шанс крит. удара +5%.","SK_C_A_0801":"[A] Призывает на поле Ледяную сферу. Сфера остаётся рядом с игроком, постоянно излучая силу. HP сферы = магия игрока ×15 + ур. ×100. Каждые 2 секунды наносит всем врагам периодический урон магия заклинателя ×1. Поражённые враги с шансом 25% получают «Заморозку». [Маг. инструмент] При ударе по игроку сфера принимает удар первой. Атакующий получает 1 заряд «Заморозки» до расчёта урона. Каждый раз, когда на поле добавляется заряд Заморозки, вы получаете щит, равный Магии x0,1. За бой можно призвать только 1 сферу. После разрушения её можно использовать снова через 15 секунд.","SK_C_A_0802":"[A] Наносит всем врагам 2 800 урона. Накладывает 1 заморозку. Шанс крит. удара 25%.","SK_C_E_0503":"При упреждающем ударе меткость +20%.","SK_C_P_0001":"Срабатывающий пассив. При атаке по вам расходует 10% текущего MP и на столько же снижает получаемый урон.","SK_C_P_0212":"При обычной атаке «Тень» наносит дополнительный удар на 15% урона.","SK_C_P_0301":"[Меч, кинжал, кастеты] Поражённые враги постоянно получают урон, равный ловкости ×0.1, каждые 3 секунды (30 ходов).","SK_C_P_0302":"[Меч] При экипировке урон обычных атак и навыков +20%. Меткость +25%.","SK_C_P_0303":"[Кастеты] При экипировке урон навыков +80%. Время каста -1 ход.","SK_C_P_0304":"[Двуручный меч] При экипировке повышает силу на уровень игрока ×1.","SK_C_P_0305":"[Щит] При экипировке повышает защиту на силу ×5. Получаемый урон -35%. Получаете «Провокацию». Игнорирует урон не выше вашей защиты. (Игнорированный урон = 1 урон)","SK_C_P_0306":"[Кинжал] При экипировке повышает ловкость на уровень игрока ×1.","SK_C_P_0307":"[Копьё] При экипировке даёт финальный урон +15% и снижение урона +15%.","SK_C_P_0308":"[Дальний бой] При экипировке финальная атака +15%.","SK_C_P_0309":"[Маг. инструмент] При экипировке мгновенно восстанавливает 10% потраченного MP. Урон навыков +30%.","SK_C_P_0701":"[P] Удача +30","SK_C_P_0702":"[A] Даёт всем союзникам барьер магия ×3 + HP заклинателя ×0.3. Каст 3 с. MP 60.","SK_C_P_0703":"[A] Расходует весь ваш барьер и наносит урон, равный его величине. Каст 1 с. MP 25.","SK_C_P_0706":"[P] Ваша самая высокая характеристика +35.","SK_C_P_0707":"[A] Если макс. HP врага выше вашего, наносит разницу HP ×0.5 физическим уроном. (Макс. урон = все хар-ки ×8). MP 50.","SK_C_P_0709":"[P] Получаете уклонение, равное уровню игрока ×0.5%. (50% на 99 уровне)","SK_C_P_0712":"[P] Восстанавливаете 3% нанесённого магией урона.","SK_C_P_0801":"Финальный урон магии стихии заморозки +7%, длительность заморозки +20%.","SK_C_P_0802":"В начале боя накладывает заморозку (E) на всех врагов с шансом 15% на каждого. Навыки заморозки расходуют на 2% меньше MP.","SK_C_P_0803":"[P] Шанс крит. удара +25% при атаках стихией льда.","SK_C_P_0804":"[P] [Копьё] Обычные атаки и атаки навыками стихии льда наносят 35% доп. магического урона. Получаемый урон -10%.","SK_C_P_0805":"[P] Снижает получаемый магический урон на 25%. С каждым срабатыванием снижение падает на 1 п.п., минимум 1%. Шанс 25% сопротивляться заморозке.","SK_C_P_0806":"[P] Получение опыта +{25}%.","SK_C_P_0905":"[P] Восприятие +{12}.","SK_D_A_0001":"[A] Выпускает ледяную стрелу: урон 280% маг. атаки одному врагу. Каст 5 с. Расход 15% MP.","SK_D_A_0301":"[Меч, двуручный меч] Финальная атака 125%. Атакует до 3 врагов одновременно.","SK_D_A_0302":"[Кастеты] Финальная атака 115%. Доп. урон 3% текущего HP врага. (Макс. 1200)","SK_D_A_0303":"[Дальний бой] Финальная атака 110%. Пост-каст после атаки -10% (приоритет хода). Накладывает на поражённого врага «Рану». Все физические атаки наносят раненым врагам 5% доп. урона.","SK_D_A_0304":"[Кинжал] Финальная атака 55% ×2 удара. Наносит две обычные атаки. Второй удар игнорирует 35% защиты.","SK_D_A_0305":"[Щит] Финальная атака 110%. Доп. урон, равный защите ×3. Атакует до 3 врагов одновременно. Снижает защиту поражённых врагов на 25%.","SK_D_A_0306":"[Копьё] Финальная атака 120%. Поражённые враги: меткость -25%, скорость атаки и каста -25%. (Не суммируется)","SK_D_A_0307":"[Маг. инструмент] Маг. атака 115%. Поражённые враги: магическое сопротивление -50%.","SK_D_A_0501":"[Дальний бой] Навык упреждающего удара. Финальная атака 1.4. Бонус шанса крит. удара +15%.","SK_D_A_0503":"При успешном упреждающем ударе: интеллект +10 на время боя.","SK_D_A_0504":"При успешном упреждающем ударе: удача и чутьё +15 на время боя.","SK_D_A_0505":"Упреждающие удары игнорируют 20% защиты врага.","SK_D_A_0506":"[Маг. инструмент] Когда союзник становится целью, с шансом 30% накладывает на врага «Заморозку». Замороженные враги: меткость -25%. Стаки заморозки длятся 10 секунд; каждые 3 стака наносят урон магия ×1.","SK_D_A_0507":"[Меч, кинжал, двуручный меч, кастеты, копьё] Раз за бой, когда удар должен снизить HP до 0, HP фиксируется на 1. Затем аннулирует следующий удар, наносит врагу 150% финальной атаки и восстанавливает ваш HP до 15%.","SK_D_A_0801":"[A] Даёт вам барьер, равный маг. атаке ×2. Каст 2 с. Расход 15% MP.","SK_D_A_0802":"[A] Наносит всем врагам урон маг. атака ×3 и накладывает «Заморозку» 3 раза. Каст 5 с. Расход 15% MP.","SK_D_P_0001":"Меткость +15. (Суммируется с «Концентрацией»)","SK_D_P_0002":"Скорость атаки постепенно растёт каждый ход боя. +0.1% за ход (10 ходов = 1%).","SK_D_P_0301":"[Меч] При экипировке урон навыков +25%. Сокращает задержку хода после атаки на 3 хода.","SK_D_P_0302":"[Кастеты] При экипировке урон навыков +30%. Время каста -1 ход.","SK_D_P_0303":"[Двуручный меч] При экипировке урон обычных атак +15%. Снижение получаемого урона +15%.","SK_D_P_0304":"[Щит] При экипировке повышает защиту на силу ×3. Получаемый урон -25%. Получаете «Провокацию».","SK_D_P_0305":"[Кинжал] При экипировке скорость атаки +25%.","SK_D_P_0306":"[Копьё] При экипировке даёт финальный урон +10% и снижение урона +10%.","SK_D_P_0307":"[Дальний бой] При экипировке меткость +25% и крит. урон +25%.","SK_D_P_0308":"[Маг. инструмент] При экипировке время каста -25%.","SK_D_P_0309":"Повышает защиту на все хар-ки ×0.2.","SK_D_P_0701":"[P] Когда вы кастуете навык с расходом MP и слот каста свободен, автоматически параллельно кастует «Резонансную сферу».","SK_D_P_0702":"[P] Если после вашей обычной атаки у врага осталось 1% HP или меньше, наносите ещё одну обычную атаку.","SK_D_P_0703":"[P] За каждые 3 км пути получаете 1 000 золота и 30 опыта.","SK_D_P_0704":"[A] Применяется к отравленному врагу. Фиксирует стаки отравления на 5; избыток отравления наносит немедленный урон. Далее фиксированный урон отравления становится 2% макс. HP врага каждые 3 секунды. (Макс. урон = магия игрока ×12). Каст 3 с. MP 90.","SK_D_P_0705":"[A] Вливает укрепляющую энергию в 3 случайных союзников, кроме вас. Даёт макс. HP +15% и получаемый урон -7%. Мгновенный каст. Задержка после 1 с. MP 45.","SK_D_P_0708":"[P] Восстанавливаете 1% нанесённого физического урона.","SK_D_P_0801":"Навыки стихии заморозки кастуются на 15% быстрее (округление вверх). Шанс крит. удара +15%. Длительность заморозки +2 с.","SK_D_P_0802":"«Заморозка»: замедление +1 (дебафф хода). Когда «Заморозка» спадает, наносит магический урон, равный израсходованным стакам заморозки × макс. HP ×3%. (Действует маг. защита)","SK_D_P_0803":"Шанс 25% сопротивляться эффекту «Заморозка».","SK_D_P_0804":"[P] За каждый потерянный в бою 1% HP получаете 1 интеллект.","SK_D_P_0806":"Маг. атака +12%, макс. MP +12%.","SK_D_P_0807":"Урон активных навыков духов +10%. (Множитель группы навыков)","SK_D_P_0808":"[P] Сокращает каст призыва духов на 2 с. Призыв духов не расходует MP.","SK_D_P_0809":"[P] Получение опыта +{15}%.","SK_D_P_0905":"[P] Восприятие +{9}.","SK_E_A_0301":"[Меч] Финальная атака 110%. Доп. урон, равный ловкость +1.","SK_E_A_0302":"[Кастеты] Финальная атака 105%. Снижает защиту поражённого врага на 3. (Суммируется бесконечно)","SK_E_A_0303":"[Двуручный меч] Финальная атака 120%. Атакует 3 ближайших врагов одновременно. Задержка после атаки 3 хода.","SK_E_A_0304":"[Щит] Финальная атака 110%. Доп. урон, равный защите ×1.","SK_E_A_0305":"[Копьё] Финальная атака 120%. Доп. урон, равный ловкость +1.","SK_E_A_0306":"[Дальний бой] Финальная атака 110%. Доп. урон, равный сила +1. Дальняя атака.","SK_E_A_0307":"[Кинжал] Финальная атака 95%. Шанс крит. удара +30% для этой атаки. Крит. урон +25%.","SK_E_A_0308":"[Маг. инструмент] Маг. атака 105%. Обычные атаки становятся магическими снарядами.","SK_E_A_0501":"[Кинжал] Навык упреждающего удара. Коэффициент финальной атаки 1.1. Снаряд: кинжал.","SK_E_A_0502":"[Дальний бой] Навык упреждающего удара. Коэффициент финальной атаки 1.2. Снаряд: пуля.","SK_E_A_0503":"[Маг. инструмент] Навык упреждающего удара. Маг. атака 1.1. Снаряд: магическая сфера. Стихия: огонь.","SK_E_A_0507":"Убийства упреждающим ударом дают +15% золота.","SK_E_A_0508":"[Щит] Когда вы становитесь целью атаки, срабатывает со 100% шансом. Наносит урон защита ×5.","SK_E_A_0509":"[Копьё, кастеты] Когда вы становитесь целью атаки, с шансом 5% отменяет её (ход врага тратится) и даёт вам дополнительную возможность атаки. (Кража хода)","SK_E_A_0701":"[A] Атака ×220%. MP 25","SK_E_A_0702":"[A] Атака ×180%, меткость +20%. Шанс крит. удара +10%. MP 20","SK_E_A_0703":"[A] Подбрасывает 2 врагов в небо. Маг. атака ×160%. Поражённые враги не могут действовать 15 ходов. Каст 1.5 с. MP 70.","SK_E_A_0711":"[A] Накладывает на врага «Коррозию». Снижает его защиту и маг. защиту на 30% и наносит 1% макс. HP урона каждый ход. Каст 2.5 с. MP 95.","SK_E_A_0801":"[A] Дебафф одной цели. Задерживает действие одного врага на 1 ход после его хода. После 3 стаков заморозки каждый новый стак наносит урон магия заклинателя ×1. Длится 6 с. Каст 1 с. Расход 2% MP. (Макс. 3 стака.)","SK_E_A_0802":"[A] Призывает импа. При попадании вашей обычной атаки с шансом 15% наносит доп. магический урон тьмы, равный 85% вашей маг. атаки.","SK_E_A_0803":"[A] Наносит всем врагам урон: число призванных духов × 150% вашей маг. атаки. Атака игнорирует 50% маг. защиты. 3 раза за бой.","SK_E_A_0804":"[A] Окутывает вас силой духа молний. До конца боя обычные атаки наносят доп. магический урон (магия+ловкость) ×1. Каст 2 с. MP 50.","SK_E_A_0805":"[A] Дух света помогает в бою. Меткость всех врагов -5%, союзников +5%. Сопротивление стихии света +15%. Каст 1 с. Длится 20 с. MP 35.","SK_E_E_0505":"*Зачарование* При упреждающем ударе расходует 3% MP: урон +10%. При убийстве с одного удара возвращает 1% MP. (Можно включать и выключать)","SK_E_E_0506":"Упреждающие удары игнорируют 25% снижения урона врага.","SK_E_P_0001":"Меткость +10. (Не суммируется с «Концентрацией»)","SK_E_P_0002":"Ловкость +5, Меткость +5.","SK_E_P_0003":"Чем ниже HP, тем больше снижение получаемого урона (HP 100% = 1%, +1% за каждые потерянные 10% HP, до 8% при HP 30% и ниже). При HP 1 уклоняетесь от следующих 2 атак.","SK_E_P_0124":"[Обычная атака] Тщательно прицеливается перед выстрелом. Меткость +15%, финальный урон обычной атаки +5%.","SK_E_P_0301":"Захватывает приоритет атаки. Урон +15% по врагам во время каста. Возможность атаки +10% дополнительно. (Откат времени только для вас — после действия следующее действие бронируется заранее с приоритетом в 10% стоимости хода обычной атаки.)","SK_E_P_0302":"[Меч] При экипировке урон обычных атак +15%.","SK_E_P_0303":"[Кастеты] При экипировке меткость +25%.","SK_E_P_0304":"[Двуручный меч] При экипировке обычные атаки поражают +1 цель.","SK_E_P_0305":"[Щит] При экипировке повышает защиту на силу ×1.","SK_E_P_0306":"[Кинжал] При экипировке все атаки накладывают «Рану». *Рана* = все физические атаки наносят раненым врагам 5% доп. урона.","SK_E_P_0307":"[Копьё] При экипировке даёт финальный урон +5% и снижение урона +5%.","SK_E_P_0308":"[Дальний бой] При экипировке шанс крит. удара +25%.","SK_E_P_0309":"[Маг. инструмент] При экипировке в бою восстанавливает 1% макс. MP в секунду (10 ходов).","SK_E_P_0504":"*Зачарование* При упреждающем ударе расходует 1% MP и наносит доп. урон, равный потраченному MP × магия ×0.3. (Можно включать и выключать)","SK_E_P_0704":"[Особое правило] В боях с дикими монстрами появляется +1 монстр. (Можно отключить)","SK_E_P_0705":"[P] *Боевой самобафф*. Ход действия сохраняется во время каста, позволяя наложить каст ещё одного навыка (макс. 2 одновременно). В ход совмещённого каста нельзя использовать обычные атаки. (Можно отключить)","SK_E_P_0706":"[P] Интеллект +8","SK_E_P_0707":"[P] Урон навыков +15%.","SK_E_P_0708":"[P] Урон навыка растёт с временем каста. +0.5% доп. урона за ход (4 с = +20% урона).","SK_E_P_0709":"[P] Ускоряет движения. Скорость атаки +8%.","SK_E_P_0710":"[P] Крит. урон +60% по врагам с HP 30% и ниже.","SK_E_P_0713":"[P] Каждый промах в бою даёт удачу +1.","SK_E_P_0714":"[A] Наносит 3 врагам физический урон ур. ×30 + (сила+магия) ×2. Меткость +25%. MP 80","SK_E_P_0716":"[P] Первая обычная атака в бою наносит 1.3× урона.","SK_E_P_0717":"[A] Покрывает оружие ядом. Далее обычные атаки с шансом 15% накладывают «Отравление». MP 15. Каст 0.1 с.","SK_E_P_0718":"[A] Накладывает «Отравление» на одного врага. Каждые 3 секунды наносит фиксированный урон 1% макс. HP врага. (Суммируется) (Макс. урон = магия игрока ×8). Каст 2 с. MP 45.","SK_E_P_0719":"[A] Восстанавливает HP союзника с наименьшим HP на удача ×4. Мгновенный каст. Задержка хода после 2 с. MP 80.","SK_E_P_0720":"[A] Разворачивает зону исцеления. Все союзники восстанавливают удача ×2 HP каждый ход в течение 15 ходов. Каст 2 с. Расход 15% MP. Раз за бой.","SK_E_P_0721":"[A] Придаёт оружию ос ка по 2 случайным врагам (максимум). Финальная атака ×120%. 4 раза за бой. Расход 35 MP.","SK_F_A_0703":"[A] Урон 175% маг. атаки. Половина урона 2 соседним врагам. Каст 4 с. MP 30.","SK_F_A_0704":"[A] Бьёт всех врагов на 120% маг. атаки. MP 45. Каст 3 с.","SK_F_A_0801":"[A] Урон маг. атака 2.0 + магия ×3. Шанс крит. удара +25%. Каст 5 с. Расход 3% MP.","SK_F_A_0802":"[A] В бою добавляет вашим обычным атакам маг. атака ×0.5 доп. урона. Пока действует Ледяное копьё, шанс крит. удара обычных атак +25%. Каст 1 с.","SK_F_A_0803":"[A] Маг. атака ×1.2. Каст 2 с. MP 5%.","SK_F_A_0804":"[A] Даёт случайному союзнику духа ветра. Союзник получает скорость атаки, скорость каста и уклонение +10%. Каст 2 с. MP 20.","SK_F_A_0805":"[A] В вашу магию вселяется пламя. Урон навыков +35%. Каст 2 с. MP 25.","SK_F_A_0806":"[A] В выбранного союзника вселяется дух воды. В бою восстановление маны 5 за ход, время каста -20%.","SK_F_A_0807":"[A] В случайного союзника вселяется дух земли. (Приоритет — танк, если есть) Защита + (магия заклинателя ×1). Каст 2 с. Длится 20 с. MP 45.","SK_F_E_0503":"При упреждающем ударе шанс крит. удара +10%.","SK_F_P_0001":"Меткость +5.","SK_F_P_0002":"Уклонение +5.","SK_F_P_0003":"Оттачивает ближний бой. Физическая защита +5, получаемый урон -5%, финальная атака +5.","SK_F_P_0004":"[Двуручный меч] При экипировке растёт владение двуручным мечом. Финальная атака +5, получаемый урон -5%.","SK_F_P_0005":"Постоянно восстанавливает HP в бою. 0.1 за ход (10 ходов = 1).","SK_F_P_0006":"Со 2-го удара последовательной атаки урон растёт на 5% (сложным процентом).","SK_F_P_0007":"Постоянно восстанавливает MP в бою. 0.5 за ход.","SK_F_P_0701":"После убийства врага навыком 15% остатка урона переходит на соседнего врага.","SK_F_P_0702":"[A] Наносит фиксированный урон ур. ×25 + (магия+ловкость) ×0.01 + защита врага ×1. Расход 8% MP. Каст 3 с. Снижает защиту поражённого врага на 30. (Не суммируется)","SK_F_P_0703":"[P] Ловкость +5","SK_F_P_0704":"[P] HP +200","SK_F_P_0705":"[P] 06":"[Kılıç] Yapraklar yağmur gibi dökülür. Temel saldırılar aynı anda 3 rastgele düşmana vurur ve her birine Nihai Saldırı x3(4.5) + Tüm Statlar x3(4.5) hasar verir. Her isabet hedefe 10 Tam Çiçeklenme yükü ekler; 60 yükte hedef çiçeklenir ve maks. CP'sinin %30'u kadar hasar alır (SAV ile azalır). Bu sırada hedefin CP'si maks. CP'sinin %30'u veya altındaysa SAV yok sayılarak infaz edilir. Çiçeklenme hasarı maks. CP'nin 30 katını aşamaz ve kritik vuramaz.","SK_EX_A_0007":"[P] [Kılıç], [Hançer] veya [Büyük Kılıç] kuşanılıyken: temel saldırılar yıldırım elementli olur. İsabet +25(37.5)%, Saldırı hızı +80(120)%, Kritik hasar +80(120)%.","SK_EX_A_0012":"Karanlık elementli aktif (anında).\nKullanıldığı anda 15 turluk bir kanalize başlar (başka eylem yapılamaz). Her tur tüm düşmanlara MAG x N hasar verir (N = geçen tur sayısı) ve tur başına 6% mana tüketir. Mana biterse kanalize erken sona erer.\nKanalize tamamlanınca, savaş bitene kadar temel saldırılarınız MAG x8 ek hasar kazanır ve iki kez vurur.","SK_EX_A_0015":"[P] [Kılıç], [Hançer] veya [Büyük Kılıç] kuşanılıyken: temel saldırılar her zaman isabet eder ve ana silahı [Kılıç], [Hançer] veya [Büyük Kılıç] olan yetenekler 600(900)% daha fazla hasar verir.","SK_EX_A_0501":"[Tüm Silahlar] Ön saldırı yeteneği. Sv x100(150) + Tüm Statlar x2(3). MP'nin 3%'ünü tüketir.","SK_EX_A_0502":"[Menzilli] Nihai Saldırı x120(180)% sabit hasar. Savaş başında Ön saldırınıza uğrayan düşmanlar 'Gelecek Görüşü' ile işaretlenir ve her saniye aynı hasarı tekrar tekrar alır.","SK_EX_A_0503":"[Tüm Silahlar] Ön saldırı yeteneği. Tüm Statlar x3. Bir yabani canavara saldırmak, o yabani canavardan 1-6 tanesiyle savaşa sokar. Savaş başında tüm düşmanlara Tüm Statlar x3 hasar verir.","SK_EX_A_0504":"Yabani canavarlara yapılan Ön saldırılar savaşı anında kazanır. Savaş başında tüm müttefiklere Kaçınma +25% verir.","SK_EX_A_0505":"Hedef alındığınızda 100% ihtimalle saldırana, alınan hasara eşit hasar verirsiniz. Ardından aldığınız hasarın 90(135)%'ini yenilersiniz.","SK_EX_P_0303":"[P] Temel saldırıdan sonra hedef hayatta kalırsa tüm ön/son gecikme kaybolur ve eylem seçmeden 1 tur sonra otomatik olarak yeniden temel saldırı yaparsınız. Hedef düşene kadar her tur 1 kez tekrarlanır; sonra eylem seçiminiz ve özgün eylem aralığınız geri döner.","SK_EX_P_0304":"[P] Her eyleminizde maks. MP 1(1.5)% (bileşik) artar. Aynı anda tüm düşmanlara, artmış maks. MP'nize eşit güçte sürekli büyü hasarı verir. Bu hasar, hedefin Büyü savunmasından ve hasar azaltmasından etkilenir.","SK_EX_P_0701":"Canavarların da statları vardır. Düşmanın 6 statının her birinin %10'unu kendi statlarına ekler. 100. seviyede canavarın sahip olduğu statların %110'unu kendi statlarına ekler.","SK_EX_P_0801":"[P] Savaş başında tüm düşmanları 'Nihayet' ile damgalar. 20 saniye sonra tüm düşmanlara Sv x100 + MAG x70 hasar verir ve onları 3 sn sersemletir. 'Donma' etkisindeki düşmanlara bu hasar sabit hasar olarak uygulanır.","SK_EX_P_0802":"Savaş başında, 1 küre sınırını yok sayarak 3 Kırağı Küresi çağırır. Savaşa 0% MP ile başlarsınız.","SK_SSS_P_0905":"[P] Sezgi +{27}.","SK_SS_P_0905":"[P] Sezgi +{24}.","SK_SS_P_0951":"[P] Bir düşman 1 HP ile kaldığında, kendinize 3 temel saldırı fırsatı verirsiniz. Bu eşik her Hor Görme Lv'inde %5 artar; Hor Görme Lv5'te, bir düşmanın HP'si %25 veya altına düştüğünde 3 temel saldırı fırsatı kazanırsınız.","SK_A_A_0801":"Oyuncunun yanına Kırağı Kraliçesi'ni çağırır. Sizinle birlikte savaşır ve her 2 eylem turunuzda bir, rastgele F-A rütbeli bir Donma elementli büyü kullanır. Statları sizinkinin 75(112.5)%'idir. Kırağı Kraliçesi dağıtılamaz. Hazırlama 3(2) sn, MP'nin 25(17)%'ini tüketir. İki kez çağrılamaz.","SK_EX_A_0003":"[Kılıç] Süreğen aktif (anında).\nKullanıldığı anda, 20 tur boyunca her tur rastgele bir düşmana STR x20(30) kadar bir meteor vuruşu iner.\nTur başına 3% mana tüketir; mana biterse, sersemletilirseniz veya başka bir yetenek seçerseniz kanalize anında sona erer.","SK_EX_A_0017":"[Kılıç]\nBir düşman temel saldırı yaptığında 50(75)% ihtimalle onu geçersiz kılar ve düşmana Tüm Statlar x10(15) hasar verir. 3 tur iç bekleme.","SK_S_A_0501":"Yakın Dövüş DPS pozisyonundan yapılan Ön saldırılar (STR+AGI) x3(4.5) ek hasar verir.","SK_S_A_0502":"[Kılıç, Hançer, Büyük Kılıç, Mızrak] Savaşta 1 kez, hedef alındığınızda 5(7.5)% ihtimalle hasarı 1'e düşürür ve düşmana Nihai Saldırı x10(15) hasar verirsiniz.","SK_S_A_0801":"[A] [Faz] 15 saniye boyunca kesintisiz hazırlama yapar. Hazırlama sırasında HP'niz 1 olur. Hazırlama sürerken her 3 turda bir, rastgele bir düşmana 6(9) Kırağı Parçası ile saldırır. (Faz kaldırılırsa, güçlendirme dağıtılırsa veya sersemletilirseniz hazırlama kesilir.) Hazırlama 2 sn.","SK_S_A_0902":"[A] Tüm düşmanlara maks. HP'nin {10}%'u kadar hasar verir. (Vuruş başına maks. hasar = Tüm Statlar x 50)","SK_S_P_0502":"[Kılıç, Hançer, Büyük Kılıç] Kılıç Ustalığı etkilerini 50(75)% artırır. İsabet, Kritik şansı ve Kritik hasar +25(37.5)%. Nihai Saldırı hesaplanırken ek olarak silah saldırısının 2(3) katı kazanılır.","SK_S_P_0801":"[P] Büyü Saldırısı +50(75)%, Maks. MP +30(45)%","SK_S_P_0905":"[P] Sezgi +{21}.","SK_S_P_0951":"[P] Kontra saldırısıyla bir düşman öldürmek ek saldırı fırsatı verir.","SK_S_P_0962":"[P] Bir düşman öldürmek 1 ek saldırı fırsatı verir.","SK_A_A_0301":"[Kılıç] Tüm düşmanlara 2 kez vurur. 150(225)% Nihai Saldırı artı Tüm Statlar x1(1.5) hasar.","SK_A_A_0302":"[Kılıç, Hançer] 100(150)% Nihai Saldırı artı AGI x12~18(18~27) hasar verir. Saldırıdan sonra 3 tur sersem kalırsınız.","SK_A_A_0303":"[Hançer] 100(150)% Nihai Saldırı. Kritik hasar 500(750)%.","SK_A_A_0304":"[Büyük Kılıç] Aynı anda en fazla 6 düşmana vurur. 220(330)% Nihai Saldırı artı STR x5(7.5) hasar. Vurulan düşmanların savunmasını 15(22.5)% azaltır. (Yığılmaz, yenilenir)","SK_A_A_0305":"[Muşta] Tüm düşmanlara 1 kez vurur. Hedeflerin tüm kalkanlarını yok eder, ardından 220(330)% Nihai Saldırı hasarı verir. Kontra ile savuşturulabilir.","SK_A_A_0306":"[Menzilli] Kalan son alevinizi salıverir. 320(480)% Nihai Saldırı. 5 tur toparlanma gecikmesi. Nihai hasar, maks. MP'den eksilen miktar kadar artar. (Eksilen her 1% için +1(1.5)%)","SK_A_A_0307":"[Büyü Aleti] 120(180)% Büyü Saldırısı. Mana Zehirlenmesi verir. Mana zehirlenmiş her düşmana aynı hasarı verir. Bu saldırı bir düşmanı öldürürse, düşmanın kalan MP'si kadar MP'niz yenilenir.","SK_A_A_0501":"[Kılıç] Ön saldırı yeteneği. Nihai Saldırı 1.8(2.7) + Tüm Statlar x1(1.5). MP'nin 3%'ünü tüketir. (Kılıç aurası)","SK_A_A_0504":"[Mızrak] Ön saldırı yeteneği. (STR+MAG) x3.5(5.25) sabit hasar; her zaman kritik vuruş olarak isabet eder. MP'nin 15%'ini tüketir. (Mızrak fırlatma)","SK_A_A_0506":"[Kalkan] Ön saldırı yeteneği. Savunma x5(7.5) hasar. MP'nin 4%'ünü tüketir. (Fırlatılan kaya)","SK_A_A_0508":"[Kalkan] Hedef alındığınızda maks. HP'nin 2(3)%'ünü anında yenilersiniz. Ayakta kalan son müttefik sizseniz, aldığınız her vuruş, yenilediğiniz HP kadar tüm düşmanlara da hasar verir.","SK_A_A_0509":"[Mızrak, Büyü Aleti] Bir müttefik hedef alındığında ve HP'si 15(22.5)% veya altındaysa, HP'sini anında LUK x8(12) kadar yeniler. Müttefik başına MP'nin 8%'ini tüketir; harcanacak MP yoksa tetiklenmez. İyileşen müttefiğin aldığı hasar savaş boyunca 25(37.5)% azalır.","SK_A_A_0510":"Kaçınma +30(45)%. Başarıyla kaçındığınızda saldıranı kovalayıp Nihai Saldırınızın 80(120)%'i kadar hasar verirsiniz.","SK_A_A_0511":"Bir yetenek veya büyü saldırısının hedefi olduğunuzda o hasarı 80(120)% azaltır. Ardından saldıranın temel statlarını savaş bitene kadar 30(45)% azaltır ve o miktarı kendiniz kazanırsınız.","SK_A_A_0802":"[A] [Faz] 10 sn sürer. Anında ve her 2 saniyede tüm düşmanlara 'Donma' uygular. 'Donma' ayrıca İsabet -35(52.5)% verir.","SK_A_E_0507":"Ön saldırıda düşmana önceden Parçalanma uygular. (Alınan hasar +25(37.5)%)","SK_A_P_0001":"Buz elementli yeteneklerin verimini 30(45)% artırır.","SK_A_P_0301":"[Kalkan] Kendiniz hariç tüm müttefiklerin savunmasını, savunmanız x0.1(0.15) kadar artırır. Ayrıca tüm mütte ilahlar] 100% Nihai Saldırı. Silahı savurur.","SK_F_A_0501":"[Tüm Silahlar] Ön saldırı yeteneği. Nihai Saldırı 1.0","SK_F_A_0504":"[Kılıç, Büyük Kılıç] Bir saldırının hedefi olduğunuzda 1 hasar alır ve saldırana atılarak 200% hasar verirsiniz. Tetiklenme ihtimali 8%.","SK_F_A_0505":"[Kalkan] Savaşta 1 kez, fiziksel saldırının hedefi olduğunuzda 10% ihtimalle kontra yapar. Hasarı yok sayar ve düşmanın Nihai Saldırısının 20%'si kadar hasar verir. (En fazla: Oyuncu Sv x50)","SK_F_A_0506":"[Mızrak, Muşta] Bir saldırının hedefi olduğunuzda 3% ihtimalle tetiklenir: saldırıyı iptal eder (düşmanın turu harcanır) ve düşmana Nihai Saldırınızın 80%'i kadar hasar verir. Düşmanın turunu 3 tur geciktirir.","SK_F_A_0507":"[Hançer, Menzilli] Fiziksel hasarın hedefi olduğunuzda 4% ihtimalle hasarın yalnızca 10%'unu alır ve düşmana AGI x2 hasar verirsiniz. (Her zaman etkin)","SK_F_A_0509":"Başarılı bir Kontra saldırısında: düşman 2 tur gecikir ve siz 2 tur öncelik kazanırsınız.","SK_F_A_0701":"[A] Kalkanları delmek için tek bir noktaya vurur. 110% Nihai Saldırı hasarı + vurulan düşmanın savunması -100. (Yığılmaz) 3 kez kullanılabilir. MP 25. Anında hazırlama.","SK_F_A_0702":"[A] En fazla 2 rastgele düşmana kesin isabetli bir saldırı. 120% Nihai Saldırı. Savaşta 4 kez kullanılabilir. 35 MP tüketir.","SK_F_A_0703":"[A] 175% Büyü Saldırısı hasarı. Bitişikteki 2 düşmana yarım hasar verir. Hazırlama 4 sn. MP 30.","SK_F_A_0704":"[A] Tüm düşmanlara 120% Büyü Saldırısı ile vurur. MP 45. Hazırlama 3 sn.","SK_F_A_0801":"[A] Büyü Saldırısı 2.0 + MAG x3 hasar. Kritik şansı +25% uygulanır. Hazırlama 5 sn. MP'nin 3%'ünü tüketir.","SK_F_A_0802":"[A] Savaş sırasında temel saldırılarınıza Büyü Saldırısı x0.5 ek hasar ekler. Buz Mızrağı etkinken temel saldırı Kritik şansı +25%. Hazırlama 1 sn.","SK_F_A_0803":"[A] Büyü Saldırısı x1.2. Hazırlama 2 sn. MP'nin 5%'ini tüketir.","SK_F_A_0804":"[A] Rastgele bir müttefiğe rüzgar ruhu verir. O müttefik Saldırı hızı, Hazırlama hızı ve Kaçınma +10% kazanır. Hazı
