반복되며, 대상이 쓰러지면 행동 선택권과 원래 행동 간격으로 돌아옵니다.","SK_EX_P_0304":"[P] 자신이 행동할 때마다 최대 MP가 1(1.5)%씩 복리로 상승합니다. 동시에 적 전체에게 상승 후 최대 MP와 동일한 위력의 마법 지속피해를 입힙니다. 이 피해는 대상의 마법방어력과 피해 감소 효과의 영향을 받습니다.","SK_EX_P_0701":"몬스터도 스테이터스를 소지중입니다. 적 스테이터스 6종의 10%씩을 자신의 스텟에 더합니다. 100레벨 기준 몬스터가 보유한 스테이터스의 110%를 자신의 스테이터스에 더합니다.","SK_EX_P_0801":"[P] 전투 시작시 적 전체에 '종언'을 부여합니다. 20초후 적 전체에게 LV*100+마력*70의 데미지를 입힙니다. 적 전체 기절 3초. '빙결'이 적용된 적에게는 데미지가 고정데미지로 적용됩니다.","SK_EX_P_0802":"전투 시작시 '서리구체 3개'를 소환합니다. 서리구체의 1개 한도를 무시합니다. 전투 시작시 MP가 0%로 시작합니다.","SK_SSS_P_0905":"[P] 감각이 {27} 증가합니다.","SK_SS_P_0905":"[P] 감각이 {24} 증가합니다.","SK_SS_P_0951":"[P] 적의 HP가 1 남았을 때, 자신에게 기본 공격기회를 3회 부여합니다. 이 기준은 멸시 Lv이 오를 때마다 5%씩 상승하여, 멸시 Lv5 기준 적의 HP가 25% 이하로 남았을 때 기본 공격기회를 3회 부여합니다.","SK_A_A_0801":"플레이어에게 서리여왕을 소환합니다. 서리여왕은 플레이어와 함께 전투를 수행합니다. 서리여왕은 플레이어 행동 2턴마다 F~A급의 빙결속성 마법을 랜덤하게 사용합니다. 서리여왕의 스테이터스는 플레이어의 75(112.5)%가 적용됩니다. 서리여왕은 해제되지 않습니다. 캐스팅 3(2)초, MP 25(17)% 소모. 중복소환 불가.","SK_EX_A_0003":"[검] 지속성 액티브(즉발).\n시전 즉시 20턴 동안 매턴 랜덤한 적 1명에게 힘*20(30)의 유성 공격을 가합니다.\n매턴 마나 3%를 소모하며, 마나가 부족하거나 스턴을 받거나 다른 스킬을 선택하면 채널링이 즉시 종료됩니다.","SK_EX_A_0017":"[검]\n적이 기본공격을 가할때, 50(75)%확률로 공격을 무효로 하고 적에게 올스탯*10(15)의 데미지를 가합니다. 3턴의 내부 쿨타임","SK_S_A_0501":"근접딜러 포지션으로 선제공격시 (힘+민첩)*3(4.5)의 추가데미지를 가함","SK_S_A_0502":"[검,단검,대검,창] 전투당 1회, 자신이 공격대상이 되었을때, 5(7.5)% 확률로 피해를 1로 감소시키고 적에게 최종공격력 *10(15)의 데미지를 가합니다.","SK_S_A_0801":"[A][위상] 15초 동안 추가로 캐스팅합니다. 캐스팅중 자신의 체력을 1로 만듭니다. 캐스팅되고 있는 도중 3턴마다 랜덤한 적에게 6(9)개의 서리구슬로 공격합니다.(위상이 해제되고, 버프해제, 스턴 당하면 캐스팅 지속이 끊깁니다.), 캐스팅 2초.","SK_S_A_0902":"[A] 적 전체에게 최대 HP의 {10}% 피해를 가합니다. (1타 최대 데미지 = 올스탯 x 50)","SK_S_P_0502":"[검,단검,대검] 검 마스터리의 효과를 50(75)% 증가시킵니다. 명중률, 치명타확률, 치명타 피해량이 25(37.5)% 증가합니다. 최종공격력 산정시 무기공격력의 2(3)배를 추가로 획득합니다.","SK_S_P_0801":"[P] 마법공격력 +50(75)%, maxMP +30(45)%","SK_S_P_0905":"[P] 감각이 {21} 증가합니다.","SK_S_P_0951":"[P] 카운터 공격으로 적을 처치 시 추가 공격기회를 얻습니다.","SK_S_P_0962":"[P] 적을 처치하면 1회 추가 공격기회를 획득합니다.","SK_A_A_0301":"[검] 적 전체를 2회 공격합니다. 최종공격력 150(225)% + 올스탯*1(1.5)의 데미지.","SK_A_A_0302":"[검,단검] 최종공격력 100(150)% + 민첩*12~18(18~27)의 데미지를 가합니다. 공격후 3턴간 경직됩니다.","SK_A_A_0303":"[단검] 최종공격력 100(150)%. 치명타 피해량 500(750)%","SK_A_A_0304":"[대검] 적 최대 6명을 동시에 공격합니다. 최종공격력 220(330)% + 힘*5(7.5)의 피해. 피격된 적의 방어력을 15(22.5)% 감소시킵니다.(중첩 없이 갱신)","SK_A_A_0305":"[너클] 적 전체를 1회 공격합니다. 공격대상의 보호막을 전부 파괴합니다. 이후 최종공격력 220(330)%의 데미지. 카운터로 방어할 수 있음.","SK_A_A_0306":"[원거리] 마지막 남은 불꽃을 사용합니다. 최종공격력 320(480)%. 후 딜레이 5턴. 최대 MP에서 줄어든 MP만큼 최종데미지가 증가합니다.(1%감소시 1(1.5)%증가)","SK_A_A_0307":"[마도구] 마법공격력 * 120(180)%. 적에게 마력중독 부여. 마력중독된 모든 적에게 동일한 피해를 입힘. 이 공격으로 적을 처치하는 경우, 적의 남은 MP만큼 자신의 MP가 회복됨.","SK_A_A_0501":"[검] 선제공격 스킬. 최종공격력 1.8(2.7)+올스탯*1(1.5). MP 소모 3%(검기)","SK_A_A_0504":"[창] 선제공격 스킬. (힘+마)*3.5(5.25) 고정데미지, 반드시 치명타로 명중한다. MP 소모 15%(투창)","SK_A_A_0506":"[방패] 선제공격 스킬. 방어력*5(7.5) 데미지. MP소모 4%(투척-돌)","SK_A_A_0508":"[방패] 자신이 공격대상이 되었을때, 최대 Hp의 2(3)%를 즉시 회복합니다. 전장에 아군이 자신 혼자남은경우, 피격시마다 적 전체에게 자신의 체력 회복분만큼 데미지를 가합니다.","SK_A_A_0509":"[창,마도구] 아군이 공격대상이 되었을때, 대상 아군의 Hp가 15(22.5)%이하라면 대상의 HP를 즉시 자신의 행운*8(12)의 Hp를 회복합니다. 한명당 MP를 8%소모하며, 소모할 MP가 없는 경우 추가로 발동하지 않습니다. 회복 대상 아군의 받는피해량을 전투동안 25(37.5)% 감소시킵니다.","SK_A_A_0510":"회피율이 30(45)% 상승합니다. 자신이 회피에 성공한경우, 공격자를 추격해 최종공격력의 80(120)%에 해당하는 피해를 입힙니다.","SK_A_A_0511":"자신이 스킬 또는 마법피해의 대상이 된 경우, 그 피해량을 80(120)% 감소시킵니다. 이후 공격자의 기초스탯을 전투 종료시까지 30(45)% 감소시키고, 해당스텟만큼 자신이 획득합니다.","SK_A_A_0802":"[A] [위상] 10초 지속, 즉시 및 2초마다 적 전체에게 '빙결'을 부여합니다. '빙결'이 추가로 명중률감소 35(52.5)%를 부여합니다.","SK_A_E_0507":"선제공격시 적에게 파열효과를 선적용함.(받는 피해량증가 + 25(37.5)%)","SK_A_P_0001":"얼음(Ice) 속성 스킬의 효율이 30(45)% 증가한다.","SK_A_P_0301":"[방패] 본인을 제외한 아군의 방어력을 자신의 방어력 * 0.1(0.15)만큼 증가시킵니다. 추가로 아군 전체에 자신의 HP의 7(10.5)%만큼 중첩되는 이지스 방어막을 추가합니다. 이때 생성한 아군 보호막의 합*0.5(0.75)만큼 적 1명에게 데미지를 가합니다.(최대 데미지캡 = 플레이어레벨*300(450))","SK_A_P_0302":"[창] 2명의 적에게 (힘+마력)×10(15)의 데미지를 가합니다.","SK_A_P_0303":"모든 정령효과 70(105)% 증가. 전투에 참여하는 픽시를 소환합니다. 픽시는 종종 스킬을 대신 막아 줍니다.","SK_A_P_0304":"추가공격기회를 획득했을때, 다음 기본공격 및 스킬이 적의 방어력을 무시합니다.","SK_A_P_0305":"전투 진입시 +1턴 우선확보.","SK_A_P_0306":"선제공격시 치명타확률 +25(37.5)%. 명중률 +25(37.5)%","SK_A_P_0307":"명중률 + 45(67.5)%. 받는 마법피해 15(22.5)% 감소. ccuracy, while your own attacks deal bonus damage equal to Magic ATK x3.","SK_EX_A_0002":"Light-element active.\nBegins casting the moment battle starts, on its own separate cast. After 20 turns, strikes all enemies with a magic attack equal to all damage you dealt during the battle. Afterward your MP is set to 0, then recovers by 10(15)% per turn for 10 turns.","SK_EX_A_0006":"[Sword] Petals fall like rain. Basic attacks strike 3 random enemies at once, dealing each Final ATK x3(4.5) + All Stats x3(4.5) damage. Each hit adds 10 Full Bloom stacks to the target; at 60 stacks it blooms, dealing damage equal to 30% of the target's Max HP (reduced by DEF). If the target's HP is at or below 30% of its Max HP, it is executed instead, ignoring DEF. Bloom damage cannot exceed 30x your Max HP and cannot critically hit.","SK_EX_A_0007":"[P] While a [Sword], [Dagger] or [Greatsword] is equipped: basic attacks become lightning-element. Accuracy +25(37.5)%, Attack Speed +80(120)%, Crit Damage +80(120)%.","SK_EX_A_0012":"Dark-element active (instant).\nUpon casting, begins a 15-turn channel (no other actions). Each turn deals MAG x N damage (N = turns elapsed) to all enemies and consumes 6% mana per turn. The channel ends early if mana runs out.\nWhen the channel completes, until battle ends your basic attacks gain MAG x8 bonus damage and strike twice.","SK_EX_A_0015":"[P] While a [Sword], [Dagger] or [Greatsword] is equipped: basic attacks always hit, and skills whose main weapon is [Sword], [Dagger] or [Greatsword] deal 600(900)% more damage.","SK_EX_A_0501":"[All Weapons] Preemptive Strike skill. Lv x100(150) + All Stats x2(3). Costs 3% MP.","SK_EX_A_0502":"[Ranged] Final ATK x120(180)% fixed damage. Enemies hit by your Preemptive Strike at battle start are marked with 'Future Sight' and take the same damage repeatedly every second.","SK_EX_A_0503":"[All Weapons] Preemptive Strike skill. All Stats x3. Attacking a wild monster enters a battle of 1-6 of that wild monster. At battle start, deals All Stats x3 damage to all enemies.","SK_EX_A_0504":"Preemptive Strikes on wild monsters instantly win the battle. At battle start, grants all allies Evasion +25%.","SK_EX_A_0505":"When you are targeted, 100% chance to deal damage to the attacker equal to the damage received. You then recover 90(135)% of the damage taken.","SK_EX_P_0303":"[P] After a basic attack, if the target survives, all pre/post delay vanishes and you automatically basic-attack again 1 turn later without choosing an action. Repeats once per turn until the target falls, then your action choice and original action interval return.","SK_EX_P_0304":"[P] Each time you act, max MP rises by 1(1.5)% (compounding). Simultaneously deals magic damage-over-time to all enemies with power equal to your raised max MP. This damage is affected by the target's Magic DEF and damage reduction.","SK_EX_P_0701":"Monsters have stats too. Adds 10% of each of the enemy's 6 stats to your own stats. At level 100, adds 110% of the monster's stats to your own stats.","SK_EX_P_0801":"[P] At battle start, brands all enemies with 'Finality'. After 20 seconds, deals Lv x100 + MAG x70 damage to all enemies and stuns them for 3s. Against enemies afflicted with 'Freeze', the damage becomes fixed damage.","SK_EX_P_0802":"Summons 3 Frost Orbs at battle start, ignoring the 1-orb limit. You begin the battle at 0% MP.","SK_SSS_P_0905":"[P] SEN +{27}.","SK_SS_P_0905":"[P] SEN +{24}.","SK_SS_P_0951":"[P] When an enemy is left at 1 HP, grant yourself 3 basic attack opportunities. This threshold rises by 5% with each Contempt Lv; at Contempt Lv5, you gain 3 basic attack opportunities when an enemy is at 25% HP or less.","SK_A_A_0801":"Summons the Frost Queen to the player. She fights alongside you, casting a random F-A rank Freeze-element spell every 2 of your action turns. Her stats are 75(112.5)% of yours. The Frost Queen cannot be dispelled. 3(2)s cast, costs 25(17)% MP. Cannot be summoned twice.","SK_EX_A_0003":"[Sword] Sustained active (instant).\nUpon casting, for 20 turns a meteor strike of STR x20(30) hits one random enemy each turn.\nCosts 3% mana per turn; channeling ends immediately if mana runs out, you are stunned, or you choose another skill.","SK_EX_A_0017":"[Sword]\nWhen an enemy makes a basic attack, 50(75)% chance to nullify it and deal All Stats x10(15) damage to the enemy. 3-turn internal cooldown.","SK_S_A_0501":"Preemptive Strikes from a melee-DPS position deal (STR+AGI) x3(4.5) bonus damage.","SK_S_A_0502":"[Sword, Dagger, Greatsword, Spear] Once per battle, when you are targeted, 5(7.5)% chance to reduce the damage to 1 and deal Final ATK x10(15) damage to the enemy.","SK_S_A_0801":"[A] [Phase] Casts continuously for 15 seconds. Your HP is set to 1 while casting. While the cast continues, attacks a random enemy with 6(9) Frost Shards every 3 turns. (Casting is interrupted if the Phase is removed, the buff is dispelled, or you are stunned.) 2s cast.","SK_S_A_0902":"[A] Deals {10}% of max HP as damage to all enemies. (Max damage per hit = All Stats x 50)","SK_S_P_0502":"[Sword, Dagger, Greatsword] Increases Sword Mastery effects by 50(75)%. Accuracy, Crit Rate and Crit Damage +25(37.5)%. Gains an additional 2(3)x weapon ATK when Final ATK is calculated.","SK_S_P_0801":"[P] Magic ATK +50(75)%, Max MP +30(45)%","SK_S_P_0905":"[P] SEN +{21}.","SK_S_P_0951":"[P] Killing an enemy with a Counter attack grants an extra attack opportunity.","SK_S_P_0962":"[P] Killing an enemy grants 1 extra attack opportunity.","SK_A_A_0301":"[Sword] Strikes all enemies twice. 150(225)% Final ATK plus All Stats x1(1.5) damage.","SK_A_A_0302":"[Sword, Dagger] Deals 100(150)% Final ATK plus AGI x12~18(18~27) damage. You are staggered for 3 turns after attacking.","SK_A_A_0303":"[Dagger] 100(150)% Final ATK. Crit Damage 500(750)%.","SK_A_A_0304":"[Greatsword] Strikes up to 6 enemies at once. 220(330)% Final ATK plus STR x5(7.5) damage. Reduces struck enemies' DEF by 15(22.5)%. (Refreshes, does not stack)","SK_A_A_0305":"[Knuckles] Strikes all enemies once. Destroys all of the targets' shields, then deals 220(330)% Final ATK damage. Can be blocked by Counter.","SK_A_A_0306":"[Ranged] Unleashes your last remaining flame. 320(480)% Final ATK. 5-turn recovery delay. Final damage increases by the amount of MP missing from max. (+1(1.5)% per 1% missing)","SK_A_A_0307":"[Magic Tool] 120(180)% Magic ATK. Inflicts Mana Poison. Deals the same damage to every mana-poisoned enemy. If this attack kills an enemy, restore your MP by the enemy's remaining MP.","SK_A_A_0501":"[Sword] Preemptive Strike skill. Final ATK 1.8(2.7) + All Stats x1(1.5). Costs 3% MP. (Sword aura)","SK_A_A_0504":"[Spear] Preemptive Strike skill. (STR+MAG) x3.5(5.25) fixed damage; always lands as a critical hit. Costs 15% MP. (Spear throw)","SK_A_A_0506":"[Shield] Preemptive Strike skill. DEF x5(7.5) damage. Costs 4% MP. (Thrown rock)","SK_A_A_0508":"[Shield] When targeted, instantly recover 2(3)% of max HP. If you are the last ally standing, each hit you take also deals damage to all enemies equal to the HP you recovered.","SK_A_A_0509":"[Spear, Magic Tool] When an ally is targeted and that ally's HP is 15(22.5)% or below, instantly restore their HP by your LUK x8(12). Costs 8% MP per ally; does not trigger without MP to spend. The healed ally's damage taken is reduced by 25(37.5)% for the battle.","SK_A_A_0510":"Evasion +30(45)%. When you successfully evade, chase the attacker and deal 80(120)% of your Final ATK as damage.","SK_A_A_0511":"When targeted by a skill or magic attack, reduces that damage by 80(120)%. Then reduces the attacker's base stats by 30(45)% until battle ends, and you gain that amount yourself.","SK_A_A_0802":"[A] [Phase] Lasts 10s. Instantly, and every 2s, inflicts 'Freeze' on all enemies. 'Freeze' additionally inflicts Accuracy -35(52.5)%.","SK_A_E_0507":"On Preemptive Strike, pre-applies Rupture to the enemy. (Damage taken +25(37.5)%)","SK_A_P_0001":"Increases the efficiency of Ice-element skills by 30(45)%.","SK_A_P_0301":"[Shield] Increases all allies' DEF (except your own) by your DEF x0.1(0.15). Additionally grants all allies a stacking Aegis Shield equal to 7(10.5)% of your HP. Then deals damage to one enemy equal to the total ally shields created x0.5(0.75). (Max damage cap = Player Lv x300(450))","SK_A_P_0302":"[Spear] Deals (STR + MAG) x10(15) damage to 2 enemies.","SK_A_P_0303":"All Spirit effects +70(105)%. Summons a pixie that joins the battle. The pixie occasionally blocks a skill in your place.","SK_A_P_0304":"When you gain an extra attack opportunity, your next basic attack or skill ignores the enemy's DEF.","SK_A_P_0305":"Secures +1 turn in advance on entering battle.","SK_A_P_0306":"On Preemptive Strike: Crit Rate +25(37.5)%, Accuracy +25(37.5)%.","SK_A_P_0307":"Accuracy +45(67.5)%. Magic damage taken -15(22.5)%.","SK_A_P_0308":"On entering a Gate, max MP temporarily increases by 50(75)% until the Gate ends. (Being max MP, it starts filled.)","SK_A_P_0701":"INT +50(75)","SK_A_P_0702":"[P] Whenever MP falls to 20(30) or below, recover 10(15)% MP. (Can be disabled)","SK_A_P_0801":"[P] Max MP rises by Player Lv x60(90). Every 1% of MP spent increases Freeze-element skill damage by 1(1.5)%.","SK_A_P_0802":"[P] Enemy turns +1. Allied Casting Speed +30(45)%.","SK_A_P_0803":"[P] During battle, increases allies' STR and MAG stats by Lv x1(1.5) and reduces enemies' by the same. (Does not stack)","SK_A_P_0901":"[Passive] Spins a roulette after each basic attack. The roulette runs 1-7; landing a 7 grants an extra attack opportunity. Your LUK raises the odds of a 7. (From 15% up to a 50% cap)","SK_A_P_0902":"[P] Act first with one basic attack at battle start. If multiple combatants own this skill, priority goes to higher AGI, then higher EXP (player wins ties).","SK_A_P_0905":"[P] SEN +{18}.","SK_B_A_0301":"[Sword] Deals 150% Final ATK plus All Stats x1 damage.","SK_B_A_0302":"[Dagger] 100(150)% Final ATK + Pursuit stacks x10(15)%. Gain 1 Pursuit stack after attacking. (Max 25) Up to 350(525)% damage.","SK_B_A_0303":"[Greatsword] Deals 180(270)% Final ATK plus STR x2(3) damage to all enemies in battle. Struck enemies' turns are delayed by +2.","SK_B_A_0304":"[Knuckles] 100(150)% Final ATK + damage to all enemies. Struck enemies' DEF -35(52.5)%. Cannot be Countered.","SK_B_A_0305":"[Ranged] 85(127.5)% Final ATK + fires 6 shots. Strikes random enemies. Each hit reduces the struck enemy's DEF by 1(1.5). (Stacks infinitely.)","SK_B_A_0306":"[Magic Tool] 120(180)% Magic ATK. Inflicts Mana Poison on struck enemies. Enemies with Mana Poison take bonus magic damage equal to Mana Poison stacks x1(1.5)%.","SK_B_A_0501":"[Sword, Greatsword] Preemptive Strike skill. Final ATK 1.6(2.4) + All Stats x1(1.5).","SK_B_A_0502":"[Shield, Spear, Knuckles] Preemptive Strike skill. Final ATK 1.2(1.8) + All Stats x1(1.5).","SK_B_A_0503":"[Ranged] After one-shotting a target with a Preemptive Strike, your next Preemptive Strike gains an ATK bonus of 15(22.5)%.","SK_B_A_0505":"[Sword, Knuckles, Dagger] After evading an enemy attack, 30(45)% chance to deal Final ATK x1.8(2.7) damage. Always lands as a crit with Crit Damage +250(375)%. Gain an immediate action.","SK_B_A_0506":"After evading an enemy attack, 30% chance to grant 'Haste' to all allies. From the 2nd use onward, grants all allies a stacking Evasion +5%.","SK_B_A_0507":"[Ranged, Magic Tool] When an enemy casts a magic attack, 15(22.5)% chance to cancel it. Up to 5 times per battle; costs 5% MP per use. On cancel, deals damage equal to the enemy's spent MP x10(15) and delays the enemy's base action turn by 1.","SK_B_A_0801":"[A] Applies Freeze to all enemies; at least 1 guaranteed, 35(52.5)% chance each. Then deals Magic ATK x6(9) damage per Freeze stack applied. Immediately afterward, executes enemies below 20(30)% HP. 8s cast. Usable 3 times per battle. Costs 25% MP.","SK_B_P_0001":"On basic attack, a Shadow Knight with stats identical to yours deli rs 0.5 per turn.","SK_F_P_0701":"After killing an enemy with a skill, 15% of the leftover damage carries to an adjacent enemy.","SK_F_P_0702":"[A] Deals fixed damage of Lv x25 + (MAG+AGI) stats x0.01 + enemy DEF x1. Costs 8% MP. 3s cast. Reduces the struck enemy's DEF by 30. (No stacking)","SK_F_P_0703":"[P] AGI +5","SK_F_P_0704":"[P] HP +200","SK_F_P_0705":"[P] HP +150, damage taken -3%","SK_F_P_0706":"[P] STR +3, LUK +3","SK_F_P_0707":"[P] MP +80","SK_F_P_0708":"[P] INT +3, SEN +3","SK_F_P_0709":"[P] INT +5","SK_F_P_0711":"[P] When enemies outnumber your side, gain final damage +30%.","SK_F_P_0712":"[A] Marks one enemy as the target. Allies deal 30% more damage to it. Costs 35 MP. Instant use.","SK_F_P_0714":"[A] Casts for 10 seconds. Counter chance +25% while casting. Costs 15% MP. Instant cast.","SK_F_P_0716":"[A] Deals 225% of (Final ATK - weapon ATK) as damage. MP 25.","SK_F_P_0719":"[All Weapons] [A] Deals 100 physical damage twice. +35 damage per player level.","SK_F_P_0720":"[Sword, Greatsword, Dagger] [P] While equipped, gain Casting Speed +15%, Attack Speed +15%, Accuracy +15%.","SK_F_P_0722":"[P] Crit Rate +25% against targets at full HP. The same applies against enemies at 25% HP or below.","SK_F_P_0723":"[P] When your HP is lower than your target's, Crit Damage +25%.","SK_F_P_0801":"Magic ATK +15, Max MP +50","SK_F_P_0802":"Ice-element damage +15%","SK_F_P_0803":"[P] Increases EXP gain by {5}%.","SK_F_P_0904":"[P] Gain {1} Crystal per wild monster slain.","SK_F_P_0905":"[P] SEN +{3}.","SK_SS_P_0302":"[Sword/Greatsword/Dagger] While equipped, wield two blades. Adds 100% of the Final ATK of your strongest unequipped sword-type weapon to your Final ATK (+5% per enhancement level), and you may also gain that sword's unique effect.","SK_SS_P_0303":"Forcibly cancels the enemy's basic attack. (20% trigger chance)","SK_SS_P_0304":"When the enemy is casting, forcibly cancels it and inflicts stun. (20% trigger chance)","SK_SS_P_0301":"[Magic Tool] On attacking, 動不可）。毎ターン敵全体に魔力×N（N=経過ターン数）のダメージを与え、毎ターンマナを6%ずつ消費する。マナが不足するとチャネリングは早期終了する。\nチャネリング完了後、戦闘終了まで通常攻撃に魔力×8の追加ダメージ+2回攻撃が適用される。","SK_EX_A_0015":"[P] [剣・短剣・大剣]装備時。通常攻撃が必ず命中し、主武装が[剣]・[短剣]・[大剣]のスキルのダメージが600(900)%増加する。","SK_EX_A_0501":"[全武器] 先制攻撃スキル。Lv×100(150) + 全ステータス×2(3)。MP消費3%。","SK_EX_A_0502":"[遠距離] 最終攻撃力×120(180)%の固定ダメージ。戦闘開始時に先制攻撃を受けた敵に「未来視」が付き、同じダメージを毎秒繰り返し受ける。","SK_EX_A_0503":"[全武器] 先制攻撃スキル。全ステータス×3。野生モンスター攻撃時、その野生モンスター1~6体で構成された戦闘に突入する。戦闘開始時、全ての敵に全ステータス×3のダメージ。","SK_EX_A_0504":"野生モンスターへの先制攻撃時、戦闘を勝利として処理する。戦闘開始時、味方全体に回避率25%を付与。","SK_EX_A_0505":"自分が攻撃対象になった時、100%の確率で受けたダメージと同じダメージを相手に与える。その後、自分は受けたダメージの90(135)%を回復する。","SK_EX_P_0303":"[P] 通常攻撃後、対象が生きていれば前後ディレイが消え、行動を選択しなくても1ターン後に自動で再び通常攻撃する。対象が倒れるまでターンごとに1回ずつ繰り返され、倒れると行動選択権と元の行動間隔に戻る。","SK_EX_P_0304":"[P] 自分が行動するたびに最大MPが1(1.5)%ずつ複利で上昇する。同時に敵全体へ、上昇後の最大MPと同じ威力の魔法持続ダメージを与える。このダメージは対象の魔法防御力とダメージ減少効果の影響を受ける。","SK_EX_P_0701":"モンスターもステータスを持っています。敵のステータス6種それぞれの10%を自分のステータスに加えます。レベル100基準で、モンスターが持つステータスの110%を自分のステータスに加えます。","SK_EX_P_0801":"[P] 戦闘開始時、敵全体に「終焉」を付与する。20秒後、敵全体にLv×100+魔力×70のダメージを与える。敵全体スタン3秒。「凍結」が適用された敵にはダメージが固定ダメージとして適用される。","SK_EX_P_0802":"戦闘開始時、「霜の球体」を3個召喚する。霜の球体の1個制限を無視する。戦闘開始時、MPが0%で始まる。","SK_SSS_P_0905":"[P] 感覚が{27}増加する。","SK_SS_P_0905":"[P] 感覚が{24}増加する。","SK_SS_P_0951":"[P] 敵のHPが1残った時、自分に通常攻撃の機会を3回付与する。この基準は蔑視のLvが上がるごとに5%ずつ上昇し、蔑視Lv5では敵のHPが25%以下になった時に通常攻撃の機会を3回付与する。","SK_A_A_0801":"プレイヤーに霜の女王を召喚する。霜の女王は共に戦い、プレイヤーの行動2ターンごとにF~A級の凍結属性魔法をランダムに使用する。ステータスはプレイヤーの75(112.5)%が適用される。霜の女王は解除されない。詠唱3(2)秒、MP25(17)%消費。重複召喚不可。","SK_EX_A_0003":"[剣] 持続型アクティブ（即発）。\n発動直後から20ターンの間、毎ターンランダムな敵1体に力×20(30)の流星攻撃を放つ。\n毎ターンマナ3%を消費し、マナが不足するか、スタンを受けるか、他のスキルを選択するとチャネリングは即座に終了する。","SK_EX_A_0017":"[剣]\n敵が通常攻撃を行う時、50(75)%の確率で攻撃を無効化し、敵に全ステータス×10(15)のダメージを与える。内部クールタイム3ターン。","SK_S_A_0501":"近接アタッカーのポジションで先制攻撃時、（筋力+敏捷）×3(4.5)の追加ダメージを与える。","SK_S_A_0502":"[剣・短剣・大剣・槍] 戦闘中1回、自分が攻撃対象になった時、5(7.5)%の確率でダメージを1に減少させ、敵に最終攻撃力×10(15)のダメージを与える。","SK_S_A_0801":"[A][位相] 15秒間追加で詠唱する。詠唱中、自分のHPを1にする。詠唱が続いている間、3ターンごとにランダムな敵に6(9)個の霜の玉で攻撃する。（位相が解除される、バフ解除、スタンを受けると詠唱の持続が途切 武器為[劍]・[短劍]・[大劍]的技能傷害增加 600(900)%。","SK_EX_A_0501":"[所有武器] 先制攻擊技能。Lv×100(150) + 全屬性×2(3)。消耗 3% MP。","SK_EX_A_0502":"[遠程] 最終攻擊力×120(180)% 固定傷害。戰鬥開始時被先制攻擊命中的敵人會被附加「未來視」，每秒反覆受到相同傷害。","SK_EX_A_0503":"[所有武器] 先制攻擊技能。全屬性×3。攻擊野生怪物時，進入由 1~6 隻該野生怪物組成的戰鬥。戰鬥開始時，對全體敵人造成全屬性×3 的傷害。","SK_EX_A_0504":"對野生怪物先制攻擊時，直接判定戰鬥勝利。戰鬥開始時為全體我方附加迴避率 +25%。","SK_EX_A_0505":"自身成為攻擊目標時，100% 機率對攻擊者造成等同所受傷害的傷害。之後自身回復所受傷害的 90(135)%。","SK_EX_P_0303":"[P] 普通攻擊後若目標存活，前後搖全部消失，無需選擇行動即在 1 回合後自動再次普通攻擊。直到目標倒下前每回合重複 1 次；目標倒下後恢復行動選擇權與原本的行動間隔。","SK_EX_P_0304":"[P] 自身每次行動時，最大 MP 以複利提升 1(1.5)%。同時對全體敵人造成等同提升後最大 MP 威力的魔法持續傷害。此傷害受目標的魔法防禦力與傷害減免效果影響。","SK_EX_P_0701":"怪物也擁有屬性。將敵人 6 種屬性各自的 10% 加到自己的屬性上。以 100 級為基準，將怪物所擁有屬性的 110% 加到自己的屬性上。","SK_EX_P_0801":"[P] 戰鬥開始時對全體敵人附加「終焉」。20 秒後對全體敵人造成 Lv×100 + 魔力×70 的傷害，並使全體敵人暈眩 3 秒。對已附加「冰凍」的敵人，此傷害以固定傷害計算。","SK_EX_P_0802":"戰鬥開始時召喚 3 個霜之球，無視霜之球 1 個的上限。戰鬥開始時 MP 為 0%。","SK_SSS_P_0905":"[P] 感知增加 {27}。","SK_SS_P_0905":"[P] 感知增加 {24}。","SK_SS_P_0951":"[P] 敵人 HP 剩 1 時，為自身附加 3 次普通攻擊機會。此基準隨蔑視 Lv 每提升 1 級上升 5%，蔑視 Lv5 時，敵人 HP 剩 25% 以下即為自身附加 3 次普通攻擊機會。","SK_A_A_0801":"為玩家召喚霜雪女王。她與玩家並肩作戰，每 2 個玩家行動回合隨機施放一個 F~A 級冰凍屬性魔法。其屬性為玩家的 75(112.5)%。霜雪女王無法被解除。詠唱 3(2) 秒，消耗 25(17)% MP。無法重複召喚。","SK_EX_A_0003":"[劍] 持續型主動（即發）。\n施放後 20 回合內，每回合對隨機 1 名敵人施加力量×20(30) 的流星攻擊。\n每回合消耗 3% 魔力；魔力不足、受到暈眩或選擇其他技能時，引導立即結束。","SK_EX_A_0017":"[劍]\n敵人進行普通攻擊時，有 50(75)% 機率使其無效，並對敵人造成全屬性×10(15) 的傷害。內部冷卻 3 回合。","SK_S_A_0501":"以近戰輸出位置先制攻擊時，追加（力量+敏捷）×3(4.5) 的額外傷害。","SK_S_A_0502":"[劍、短劍、大劍、槍] 每場戰鬥 1 次，成為攻擊目標時，有 5(7.5)% 機率將傷害減至 1，並對敵人造成最終攻擊力×10(15) 的傷害。","SK_S_A_0801":"[A] [相位] 額外持續詠唱 15 秒。詠唱期間自身 HP 變為 1。詠唱進行中，每 3 回合以 6(9) 顆霜之珠攻擊隨機敵人。（相位被解除、增益被驅散或被暈眩時，詠唱中斷。）詠唱 2 秒。","SK_S_A_0902":"[A] 對全體敵人造成最大 HP {10}% 的傷害。（單次最大傷害 = 全屬性×50）","SK_S_P_0502":"[劍、短劍、大劍] 使劍精通的效果提升 50(75)%。命中率、暴擊率、暴擊傷害提升 25(37.5)%。計算最終攻擊力時，額外獲得武器攻擊力的 2(3) 倍。","SK_S_P_0801":"[P] 魔法攻擊力 +50(75)%、最大 MP +30(45)%","SK_S_P_0905":"[P] 感知增加 {21}。","SK_S_P_0951":"[P] 以反擊擊殺敵人時，獲得額外攻擊機會。","SK_S_P_0962":"[P] 擊殺敵人時獲得 1 次額外攻擊機會。","SK_A_A_0301":"[劍] 攻擊全體敵人 2 次。造成最終攻擊力 150(225)% + 全屬性×1(1.5) 的傷害。","SK ,"SK_F_P_0001":"Fokus","SK_F_P_0002":"Wachsamkeit","SK_F_P_0003":"Kampfkunst","SK_F_P_0004":"Großschwertkunst","SK_F_P_0005":"Kampfregeneration","SK_F_P_0006":"Komboangriff","SK_F_P_0007":"Manaregeneration","SK_F_P_0701":"Richtige Stelle","SK_F_P_0702":"Resonanzkugel","SK_F_P_0703":"Angeborenes Tempo","SK_F_P_0704":"Früchte der Disziplin","SK_F_P_0705":"Zähigkeit","SK_F_P_0706":"Fester Wille","SK_F_P_0707":"Dreiblättriges Kleeblatt","SK_F_P_0708":"Visualisierung","SK_F_P_0709":"Materialisierung","SK_F_P_0711":"Zerlegen","SK_F_P_0712":"Zielerfassung","SK_F_P_0714":"Sperrzone","SK_F_P_0716":"Kraftschlag","SK_F_P_0719":"Serienhieb","SK_F_P_0720":"Schwerttalent","SK_F_P_0722":"Assassinentalent","SK_F_P_0723":"Gegenstoß","SK_F_P_0801":"Kälteaffinität","SK_F_P_0802":"Frost-Meisterschaft","SK_F_P_0803":"Außergewöhnliches Wachstum","SK_F_P_0904":"Scherbensammler","SK_F_P_0905":"Entdecker","SK_SS_P_0302":"Zwillingsschwertkunst","SK_SS_P_0303":"Regelbrecher","SK_SS_P_0304":"Zauberbrecher","SK_SS_P_0301":"Manaentzug","SK_SS_A_0501":"Opportunist","SK_S_P_0971":"Fuchs-Kampfkunst"},"desc":{"SK_EX_A_0001":"Passiv. Gewährt dir „Schwarzmond“. Gegner, die dich angreifen, erleiden -25 % Genauigkeit; deine eigenen Angriffe verursachen Bonusschaden in Höhe von Magieangriff x3.","SK_EX_A_0002":"Licht-Aktiv.\nBeginnt mit Kampfbeginn zu wirken, auf separatem Wirkvorgang. Nach 20 Zügen trifft ein Magieangriff alle Gegner in Höhe deines gesamten im Kampf verursachten Schadens. Danach fallen deine MP auf 0 und erholen sich 10 Züge lang um 10(15)% pro Zug.","SK_EX_A_0006":"[Schwert] Blütenblätter fallen wie Regen. Standardangriffe treffen 3 zufällige Gegner gleichzeitig und verursachen je Endangriff x3(4.5) + alle Werte x3(4.5) Schaden. Jeder Treffer fügt dem Ziel 10 Vollblüte-Stapel hinzu; bei 60 Stapeln erblüht es und erleidet Schaden in Höhe von 30 % seiner max. LP (durch VER verringert). Liegen seine LP dabei bei höchstens 30 % der max. LP, wird es stattdessen unter Ignorieren der VER hingerichtet. Erblühschaden beträgt höchstens das 30-Fache deiner max. LP und kann nicht kritisch treffen.","SK_EX_A_0007":"[P] Mit angelegtem [Schwert], [Dolch] oder [Großschwert]: Standardangriffe werden zum Blitz-Element. Genauigkeit +25(37.5)%, Angriffstempo +80(120)%, Krit-Schaden +80(120)%.","SK_EX_A_0012":"Dunkel-Aktiv (sofort).\nNach dem Wirken beginnt ein 15-Züge-Kanalisieren (keine anderen Aktionen). Jeder Zug verursacht MAG x N Schaden (N = vergangene Züge) an allen Gegnern und verbraucht 6 % Mana pro Zug. Geht das Mana aus, endet das Kanalisieren vorzeitig.\nNach Abschluss erhalten deine Standardangriffe bis Kampfende MAG x8 Bonusschaden und treffen 2-mal.","SK_EX_A_0015":"[P] Mit angelegtem [Schwert], [Dolch] oder [Großschwert]: Standardangriffe treffen immer, und Skills mit Hauptwaffe [Schwert], [Dolch] oder [Großschwert] verursachen 600(900)% mehr Schaden.","SK_EX_A_0501":"[Alle Waffen] Erstschlag-Skill. Lv x100(150) + alle Werte x2(3). Kostet 3 % MP.","SK_EX_A_0502":"[Fernkampf] Endangriff x120(180)% Fixschaden. Von deinem Erstschlag bei Kampfbeginn getroffene Gegner erhalten „Zukunftssicht“ und erleiden denselben Schaden jede Sekunde erneut.","SK_EX_A_0503":"[Alle Waffen] Erstschlag-Skill. Alle Werte x3. Der Angriff auf ein Wildmonster startet einen Kampf gegen 1-6 dieses Wildmonsters. Bei Kampfbeginn erleiden alle Gegner alle Werte x3 Schaden.","SK_EX_A_0504":"Erstschläge auf Wildmonster gewinnen den Kampf sofort. Bei Kampfbeginn erhalten alle Verbündeten Ausweichen +25 %.","SK_EX_A_0505":"Wirst du zum Ziel, fügst du dem Angreifer mit 100 % Chance Schaden in Höhe des erlittenen Schadens zu. Danach stellst du 90(135)% des erlittenen Schadens als HP wieder her.","SK_EX_P_0303":"[P] Überlebt das Ziel deinen Standardangriff, entfällt jede Vor-/Nachverzögerung und du greifst 1 Zug später automatisch erneut an, ohne eine Aktion zu wählen. Wiederholt sich 1-mal pro Zug, bis das Ziel fällt; danach kehren Aktionswahl und ursprüngliches Aktionsintervall zurück.","SK_EX_P_0304":"[P] Mit jeder deiner Aktionen steigen die max. MP um 1(1.5)% (Zinseszins). Zugleich erleiden alle Gegner anhaltenden Magieschaden in Höhe deiner erhöhten max. MP. Dieser Schaden unterliegt Magie-DEF und Schadensreduktion des Ziels.","SK_EX_P_0701":"Auch Monster besitzen Werte. Fügt deinen eigenen Werten jeweils 10 % der 6 Werte des Gegners hinzu. Auf Level 100 werden deinen Werten 110 % der Werte des Monsters hinzugefügt.","SK_EX_P_0801":"[P] Bei Kampfbeginn werden alle Gegner mit „Finalität“ gebrandmarkt. Nach 20 Sekunden erleiden alle Gegner Lv x100 + MAG x70 Schaden und sind 3 s betäubt. Gegen Gegner mit „Einfrieren“ wird der Schaden zu Fixschaden.","SK_EX_P_0802":"Beschwört bei Kampfbeginn 3 Frostkugeln und ignoriert das 1-Kugel-Limit. Du startest den Kampf mit 0 % MP.","SK_SSS_P_0905":"[P] Sinn +{27}.","SK_SS_P_0905":"[P] Sinn +{24}.","SK_SS_P_0951":"[P] Bleibt ein Gegner mit 1 HP übrig, erhältst du 3 Standardangriffsgelegenheiten. Diese Schwelle steigt mit jedem Verachtung-Lv um 5 %; ab Verachtung Lv5 erhältst du 3 Standardangriffsgelegenheiten, wenn ein Gegner 25 % HP oder weniger hat.","SK_A_A_0801":"Beschwört die Frostkönigin an deine Seite. Sie kämpft mit dir und wirkt alle 2 deiner Aktionszüge einen zufälligen Frost-Zauber von Rang F-A. Ihre Werte betragen 75(112.5)% deiner Werte. Die Frostkönigin kann nicht aufgelöst werden. 3(2) s Wirkzeit, kostet 25(17)% MP. Keine Doppelbeschwörung.","SK_EX_A_0003":"[Schwert] Anhaltendes Aktiv (sofort).\nNach dem Wirken trifft 20 Züge lang jeden Zug ein Meteorschlag mit STR x20(30) einen zufälligen Gegner.\nKostet 3 % Mana pro Zug; das Kanalisieren endet sofort, wenn das Mana ausgeht, du betäubt wirst oder du einen anderen Skill wählst.","SK_EX_A_0017":"[Schwert]\nFührt ein Gegner einen Standardangriff aus: 50(75)% Chance, ihn zu annullieren und dem Gegner alle Werte x10(15) Schaden zuzufügen. 3 Züge interner Cooldown.","SK_S_A_0501":"Erstschläge aus der Nahkampf-DD-Position verursachen (STR+AGI) x3(4.5) Bonusschaden.","SK_S_A_0502":"[Schwert, Dolch, Großschwert, Speer] 1-mal pro Kampf: Wirst du zum Ziel, 5(7.5)% Chance, den Schaden auf 1 zu senken und dem Gegner Endangriff x10(15) Schaden zuzufügen.","SK_S_A_0801":"[A] [Phase] Wirkt 15 Sekunden lang weiter. Deine HP werden währenddessen auf 1 gesetzt. Solange gewirkt wird, greifen alle 3 Züge 6(9) Frostsplitter einen zufälligen Gegner an. (Wird die Phase entfernt, der Buff aufgelöst oder du betäubt, bricht das Wirken ab.) 2 s Wirkzeit.","SK_S_A_0902":"[A] Fügt allen Gegnern {10}% der max. HP als Schaden zu. (Max. Schaden pro Treffer = alle Werte x 50)","SK_S_P_0502":"[Schwert, Dolch, Großschwert] Erhöht Schwert-Meisterschafts-Effekte um 50(75)%. Genauigkeit, Krit-Chance und Krit-Schaden +25(37.5)%. Bei der Endangriffs-Berechnung erhältst du zusätzlich das 2(3)-Fache des Waffen-ATK.","SK_S_P_0801":"[P] Magieangriff +50(75)%, Max. MP +30(45)%","SK_S_P_0905":"[P] Sinn +{21}.","SK_S_P_0951":"[P] Ein Kill durch einen Konterangriff gewährt eine zusätzliche Angriffsgelegenheit.","SK_S_P_0962":"[P] Ein Kill gewährt 1 zusätzliche Angriffsgelegenheit.","SK_A_A_0301":"[Schwert] Trifft alle Gegner 2-mal. 150(225)% Endangriff plus alle Werte x1(1.5) Schaden.","SK_A_A_0302":"[Schwert, Dolch] Verursacht 100(150)% Endangriff plus AGI x12~18(18~27) Schaden. Nach dem Angriff bist du 3 Züge lang starr.","SK_A_A_0303":"[Dolch] 100(150)% Endangriff. Krit-Schaden 500(750)%.","SK_A_A_0304":"[Großschwert] Trifft bis zu 6 Gegner gleichzeitig. 220(330)% Endangriff plus STR x5(7.5) Schaden. Senkt die DEF getroffener Gegner um 15(22.5)%. (Wird erneuert, stapelt nicht)","SK_A_A_0305":"[Schlagringe] Trifft alle Gegner 1-mal. Zerstört alle Schilde der Ziele, danach 220(330)% Endangriff als Schaden. Kann gekontert werden.","SK_A_A_0306":"[Fernkampf] Entfesselt deine letzte Flamme. 320(480)% Endangriff. 5 Züge Nachwirkzeit. Der Endschaden steigt entsprechend der von max. MP fehlenden MP. (+1(1.5)% je 1 % Verlust)","SK_A_A_0307":"[Magiewerkzeug] 120(180)% Magieangriff. Verursacht Manavergiftung. Fügt jedem manavergifteten Gegner denselben Schaden zu. Tötet dieser Angriff einen Gegner, stellst du MP in Höhe seiner übrigen MP wieder her.","SK_A_A_0501":"[Schwert] Erstschlag-Skill. Endangriff 1.8(2.7) + alle Werte x1(1.5). Kostet 3 % MP. (Schwertaura)","SK_A_A_0504":"[Speer] Erstschlag-Skill. (STR+MAG) x3.5(5.25) Fixschaden; trifft immer kritisch. Kostet 15 % MP. (Speerwurf)","SK_A_A_0506":"[Schild] Erstschlag-Skill. DEF x5(7.5) Schaden. Kostet 4 % MP. (Steinwurf)","SK_A_A_0508":"[Schild] Wirst du zum Ziel, stellst du sofort 2(3)% deiner max. HP wieder her. Bist du der letzte Verbündete im Kampf, fügt jeder erlittene Treffer zudem allen Gegnern Schaden in Höhe der geheilten HP zu.","SK_A_A_0509":"[Speer, Magiewerkzeug] Wird ein Verbündeter mit 15(22.5)% HP oder weniger zum Ziel, heilst du ihn sofort um LUK x8(12) HP. Kostet 8 % MP pro Verbündetem; ohne MP kein Auslösen. Der geheilte Verbündete erleidet für den Kampf 25(37.5)% weniger Schaden.","SK_A_A_0510":"Ausweichen +30(45)%. Nach erfolgreichem Ausweichen verfolgst du den Angreifer und verursachst 80(120)% deines Endangriffs als Schaden.","SK_A_A_0511":"Wirst du Ziel eines Skills oder Magieangriffs, verringert sich dieser Schaden um 80(120)%. Danach sinken die Basiswerte des Angreifers bis Kampfende um 30(45)%, und du erhältst diese Werte selbst.","SK_A_A_0802":"[A] [Phase] Hält 10 s. Verhängt sofort und alle 2 s „Einfrieren“ über alle Gegner. „Einfrieren“ senkt zusätzlich die Genauigkeit um 35(52.5)%.","SK_A_E_0507":"Beim Erstschlag erhält der Gegner vorab „Zerreißen“. (Erlittener Schaden +25(37.5)%)","SK_A_P_0001":"Erhöht die Effizienz von Eis-Skills um 30(45)%.","SK_A_P_0301":"[Schild] Erhöht die DEF aller Verbündeten (außer deiner) um deine DEF x0.1(0.15). Gewährt allen Verbündeten zudem einen stapelbaren Ägis-Schild in Höhe von 7(10.5)% deiner HP. Danach erleidet ein Gegner Schaden in Höhe der erzeugten Verbündeten-Schilde x0.5(0.75). (Max. Schadensobergrenze = Spieler-Lv x300(450))","SK_A_P_0302":"[Speer] Fügt 2 Gegnern (STR + MAG) x10(15) Schaden zu.","SK_A_P_0303":"Alle Elementar-Effekte +70(105)%. Beschwört eine Pixie, die am Kampf teilnimmt. Die Pixie fängt gelegentlich einen Skill für dich ab.","SK_A_P_0304":"Erhältst du eine zusätzliche Angriffsgelegenheit, ignoriert dein nächster Standardangriff oder Skill die DEF des Gegners.","SK_A_P_0305":"Sichert beim Kampfeintritt +1 Zug im Voraus.","SK_A_P_0306":"Beim Erstschlag: Krit-Chance +25(37.5)%, Genauigkeit +25(37.5)%.","SK_A_P_0307":"Genauigkeit +45(67.5)%. Erlittener Magieschaden -15(22.5)%.","SK_A_P_0308":"Beim Betreten eines Tors steigen die max. MP bis zum Ende des Tors vorübergehend um 50(75)%. (Als Max-MP starten sie gefüllt.)","SK_A_P_0701":"Intelligenz +50(75)","SK_A_P_0702":"[P] Fallen die MP auf 20(30) oder weniger, stellst du 10(15)% MP wieder her. (Deaktivierbar)","SK_A_P_0801":"[P] Max. MP steigen um Spieler-Lv x60(90). Je 1 % verbrauchter MP steigt der Schaden von Frost-Skills um 1(1.5)%.","SK_A_P_0802":"[P] Gegnerzüge +1. Zaubertempo der Verbündeten +30(45)%.","SK_A_P_0803":"[P] Erhöht im Kampf STR und MAG der Verbündeten um Lv x1(1.5) und senkt die der Gegner um denselben Wert. (Stapelt nicht)","SK_A_P_0901":"[Passiv] Dreht nach jedem Standardangriff ein Roulette von 1-7. Bei einer 7 erhältst du eine zusätzliche Angriffsgelegenheit. Dein LUK erhöht die Chance auf die 7. (Von 15 % bis max. 50 %)","SK_A_P_0902":"[P] Handle bei Kampfbeginn zuerst mit einem Standardangriff. Besitzen mehrere Kämpfer diesen Skill, gilt: höhere AGI zuerst, dann höhere EXP (bei Gleichstand gewinnt der Spieler).","SK_A_P_0905":"[P] Sinn +{18}.","SK_B_A_0301":"[Schwert] Verursacht 150 % Endangriff plus alle Werte x1 Schaden.","SK_B_A_0302":"[Dolch] 100(150)% Endangriff + Verfolgungs-Stapel x10(15)%. Nach dem Angriff erhältst du 1 Verfolgungs-Stapel. (Max. 25) Bis zu 350(525)% Schaden.","SK_B_A_0303":"[Großschwert] Fügt allen Gegnern im Kampf 180(270)% Endangriff plus STR x2(3) Schaden zu. Die Züge getroffener Gegner verzögern sich um +2.","SK_B_A_0304":"[Schlagringe] 100(150)% Endangriff + Schaden an allen Gegnern. DEF getroffener Gegner -35(52.5)%. Kann nicht gekontert werden.","SK_B_A_0305":"[Fernkampf] 85(127.5)% Endangriff + 6 Schüsse. Trifft zufällige Gegner. Jeder Treffer senkt die DEF des Getroffenen um 1(1.5). (Unendlich stapelbar.)","SK_B_A_0306":"[Magiewerkzeug] 120(180)% Magieangriff. Verhängt Manavergiftung über getroffene Gegner. Manavergiftete Gegner erleiden Bonus-Magieschaden in Höhe der Manavergiftungs-Stapel x1(1.5)%.","SK_B_A_0501":"[Schwert, Großschwert] Erstschlag-Skill. Endangriff 1.6(2.4) + alle Werte x1(1.5).","SK_B_A_0502":"[Schild, Speer, Schlagringe] Erstschlag-Skill. Endangriff 1.2(1.8) + alle Werte x1(1.5).","SK_B_A_0503":"[Fernkampf] Nach einem One-Shot-Kill per Erstschlag erhält dein nächster Erstschlag +15(22.5)% ATK-Bonus.","SK_B_A_0505":"[Schwert, Schlagringe, Dolch] Nach dem Ausweichen eines gegnerischen Angriffs: 30(45)% Chance, Endangriff x1.8(2.7) Schaden zu verursachen. Trifft immer kritisch mit Krit-Schaden +250(375)%. Du erhältst sofort eine Aktion.","SK_B_A_0506":"Nach dem Ausweichen eines gegnerischen Angriffs: 30 % Chance, allen Verbündeten „Hast“ zu gewähren. Ab der 2. Auslösung erhalten alle Verbündeten stapelbar Ausweichen +5 %.","SK_B_A_0507":"[Fernkampf, Magiewerkzeug] Wirkt ein Gegner einen Magieangriff, 15(22.5)% Chance, ihn abzubrechen. Bis zu 5-mal pro Kampf; kostet je 5 % MP. Beim Abbruch: Schaden in Höhe der vom Gegner verbrauchten MP x10(15), und der Basiszug des Gegners verzögert sich um 1.","SK_B_A_0801":"[A] Verhängt „Einfrieren“ über alle Gegner; mindestens 1 garantiert, je 35(52.5)% Chance. Danach Magieangriff x6(9) Schaden pro verhängtem Einfrieren-Stapel. Direkt danach werden Gegner unter 20(30)% HP hingerichtet. 8 s Wirkzeit. 3-mal pro Kampf. Kostet 25 % MP.","SK_B_P_0001":"Bei Standardangriffen führt ein Schattenritter mit deinen Werten einen zusätzlichen Standardangriff aus.","SK_B_P_0301":"Mit angelegtem [Schild]: DEF x6(9) Schaden an allen Gegnern. Gewährt allen Verbündeten einen stapelbaren Ägis-Schild in Höhe von 5(7.5)% deiner HP.","SK_B_P_0302":"[Speer] Fixschaden von (STR+MAG) x5(7.5).","SK_B_P_0303":"Alle Elementar-Effekte +30(45)%.","SK_B_P_0304":"Sichert beim Kampfeintritt 2 Züge im Voraus.","SK_B_P_0305":"Genauigkeit, Krit-Chance und Krit-Schaden +25(37.5)%.","SK_B_P_0306":"Ausweichen +45(67.5)%.","SK_B_P_0307":"Max. MP +15(22.5)%.","SK_B_P_0308":"[Schild] Max. HP +35(52.5)%.","SK_B_P_0701":"[P] Ein geborenes Genie. Alle Werte +7(10.5)","SK_B_P_0702":"[P] Addiert 10(15)% deines höchsten Werts auf deine übrigen Werte.","SK_B_P_0705":"[P] Genauigkeit +25(37.5)%. Jeder verfehlte Angriff gewährt weitere +5(7.5)% Genauigkeit. (Unendlich stapelbar)","SK_B_P_0706":"Erhalte AGI in Höhe von Spieler-Lv x1(1.5).","SK_B_P_0707":"Erhalte ATK und Magieangriff in Höhe von Spieler-Lv x1(1.5).","SK_B_P_0708":"Erhalte LUK und SEN in Höhe von Spieler-Lv x0.5(0.75).","SK_B_P_0709":"Erhalte INT in Höhe von Spieler-Lv x1(1.5).","SK_B_P_0711":"[P] Hat ein Verbündeter 10(15)% HP oder weniger, werden die HP des Verbündeten mit den niedrigsten HP um 10(15)% geheilt (ohne Wirkzeit). 5-mal pro Kampf.","SK_B_P_0712":"[P] Mit zerstörerischer Kraft geboren. STR steigt alle 4 Spielerlevel um 3(4.5). Passiv.","SK_B_P_0801":"Erhöht den Endschaden von Eismagie um 35(52.5)%.","SK_B_P_0802":"[P] Beim Verhängen von „Einfrieren“ +1 zusätzlicher Stapel.","SK_B_P_0905":"[P] Sinn +{15}.","SK_C_A_0301":"[Schwert, Großschwert] 145 % Endangriff. Trifft bis zu 3 Gegner gleichzeitig.","SK_C_A_0302":"[Dolch] 120 % Endangriff. 15 % Chance auf eine zusätzliche Angriffsgelegenheit nach dem Angriff.","SK_C_A_0303":"[Speer] 125 % Endangriff. 15 % des Schadens gelten als Fixschaden. Senkt die DEF des getroffenen Gegners um 25 %.","SK_C_A_0304":"[Schlagringe] 90 % Endangriff x2 Treffer. Schlägt abwechselnd mit links und rechts. Kann nicht gekontert werden.","SK_C_A_0305":"[Fernkampf] 135 % Endangriff. Bonusschaden in Höhe von STR +1.5. (Additiv)","SK_C_A_0306":"[Schild] 150 % Endangriff plus fixer Bonusschaden in Höhe von DEF x5.","SK_C_A_0307":"[Fernkampf] 120 % Endangriff x2 Treffer. Tötet der erste Treffer den Gegner, geht der Restschaden auf einen anderen Gegner über.","SK_C_A_0308":"[Magiewerkzeug] 85 % Magieangriff. Verhängt „Manavergiftung“ über getroffene Gegner. Manavergiftete Gegner erleiden jede Sekunde (10 Züge) Schaden proportional zum MAG-Wert des Wirkers x1. (Fünf Magier mit je 100 verursachen 500 Schaden pro Sekunde. Pro Spieler nur 1-mal kumuliert.)","SK_C_A_0501":"[Dolch] Erstschlag-Skill. Endangriff 1.5. Ignoriert als Bonus 25 % Schadensreduktion (additiv).","SK_C_A_0502":"Wirst du angegriffen, bevor du handelst, erhältst du Zug-Boost +3 (3 Züge, die zuerst genutzt werden).","SK_C_A_0504":"[Schwert, Großschwert, Schlagringe, Speer, Dolch] 1-mal pro Kampf: 10 % Chance beim Ausweichen eines gegnerischen Angriffs. Verursacht 150 % Endangriff als garantierten Krit, gewährt dir „Hast“ (Ausweichen +25 %, Genauigkeit +25 %, 30 Züge) und du erhältst sofort eine Aktion.","SK_C_A_0505":"[Spezial] Benötigt in der Gruppe einen [Schild]- sowie einen [Fernkampf]- oder [Magiewerkzeug]-Nutzer; bis zu 3-mal pro Kampf. Wirst du zum Ziel, 60 % Chance: Der Schaden wird ignoriert, und jeder Verbündete mit [Fernkampf] oder [Magiewerkzeug] trifft alle Gegner mit (Endangriff + Magieangriff) x2 Schaden.","SK_C_A_0506":"Konterchance +2 %. Verursacht ein Konter Schaden: Endschaden +10 %, Genauigkeit +5 %, Krit-Chance +5 %.","SK_C_A_0801":"[A] Beschwört eine Frostkugel aufs Feld. Sie bleibt neben dem Spieler und strahlt dauerhaft Kraft aus. Frostkugel-HP = Spieler-MAG x15 + Lv x100. Alle 2 Sekunden erleiden alle Gegner Wirker-MAG x1 als anhaltenden Schaden. Getroffene Gegner werden mit 25 % Chance mit „Einfrieren“ belegt. [Magiewerkzeug] Wird der Spieler getroffen, fängt die Frostkugel den Treffer zuerst ab. Der Angreifer erhält vor der Schadensberechnung 1 Stapel „Einfrieren“. Jedes Mal, wenn auf dem Feld ein Einfrieren-Stapel hinzukommt, erhältst du einen Schild in Höhe von Magie x0,1. Nur 1 Kugel pro Kampf beschwörbar. Wird sie zerstört, ist sie nach 15 Sekunden wieder einsetzbar.","SK_C_A_0802":"[A] Fügt allen Gegnern 2.800 Schaden zu. Verhängt 1x Einfrieren. Krit-Chance 25 %.","SK_C_E_0503":"Beim Erstschlag: Genauigkeit +20 %.","SK_C_P_0001":"Ausgelöste Passive. Bei einem Angriff auf dich werden 10 % der aktuellen MP verbraucht, um den erlittenen Schaden um diesen Betrag zu senken.","SK_C_P_0212":"Bei Standardangriffen führt ein „Schatten“ einen Folgeschlag mit 15 % des Schadens aus.","SK_C_P_0301":"[Schwert, Dolch, Schlagringe] Getroffene Gegner erleiden alle 3 Sekunden (30 Züge) fortlaufend Schaden in Höhe von AGI x0.1.","SK_C_P_0302":"Mit angelegtem [Schwert]: Standardangriffs- und Skill-Schaden +20 %. Genauigkeit +25 %.","SK_C_P_0303":"Mit angelegten [Schlagringen]: Skill-Schaden +80 %. Wirkzeit -1 Zug.","SK_C_P_0304":"Mit angelegtem [Großschwert] steigt STR um Spieler-Lv x1.","SK_C_P_0305":"Mit angelegtem [Schild]: DEF steigt um STR x5. Erlittener Schaden -35 %. Du erhältst *Spott*. Ignoriert Schaden bis zur Höhe deiner DEF. (Ignorierter Schaden = 1 Schaden)","SK_C_P_0306":"Mit angelegtem [Dolch] steigt AGI um Spieler-Lv x1.","SK_C_P_0307":"Mit angelegtem [Speer]: Endschaden +15 % und Schadensreduktion +15 %.","SK_C_P_0308":"Mit angelegter [Fernkampf]-Waffe: Endangriff +15 %.","SK_C_P_0309":"Mit angelegtem [Magiewerkzeug]: 10 % der verbrauchten MP werden sofort zurückerstattet. Skill-Schaden +30 %.","SK_C_P_0701":"[P] Glück +30","SK_C_P_0702":"[A] Gewährt allen Verbündeten einen Schild von MAG x3 + Wirker-HP x0.3. 3 s Wirkzeit. MP 60.","SK_C_P_0703":"[A] Verbraucht deinen gesamten Schild und verursacht Schaden in Höhe des Schildwerts. 1 s Wirkzeit. MP 25.","SK_C_P_0706":"[P] Dein höchster Wert +35.","SK_C_P_0707":"[A] Übersteigen die max. HP des Gegners deine, verursacht die HP-Differenz nus.","SK_D_A_0503":"Bei erfolgreichem Erstschlag: INT +10 für den Kampf.","SK_D_A_0504":"Bei erfolgreichem Erstschlag: LUK und SEN +15 für den Kampf.","SK_D_A_0505":"Erstschläge ignorieren 20 % der gegnerischen DEF.","SK_D_A_0506":"[Magiewerkzeug] Wird ein Verbündeter zum Ziel: 30 % Chance, den Gegner mit „Einfrieren“ zu belegen. Eingefrorene Gegner: Genauigkeit -25 %. Einfrieren-Stapel halten 10 Sekunden; je 3 Stapel verursachen MAG x1 Schaden.","SK_D_A_0507":"[Schwert, Dolch, Großschwert, Schlagringe, Speer] 1-mal pro Kampf: Würde ein Treffer die HP auf 0 senken, bleiben sie bei 1. Danach wird der nächste Treffer negiert, der Gegner erleidet 150 % Endangriff Schaden und deine HP erholen sich auf 15 %.","SK_D_A_0801":"[A] Gewährt dir einen Schild in Höhe von Magieangriff x2. 2 s Wirkzeit. Kostet 15 % MP.","SK_D_A_0802":"[A] Fügt allen Gegnern Magieangriff x3 Schaden zu und verhängt 3-mal „Einfrieren“. 5 s Wirkzeit. Kostet 15 % MP.","SK_D_P_0001":"Genauigkeit +15. (Stapelt mit Fokus)","SK_D_P_0002":"Das Angriffstempo steigt im Kampf mit jedem Zug. +0.1 % pro Zug (10 Züge = 1 %).","SK_D_P_0301":"Mit angelegtem [Schwert]: Skill-Schaden +25 %. Zugverzögerung nach Angriffen -3 Züge.","SK_D_P_0302":"Mit angelegten [Schlagringen]: Skill-Schaden +30 %. Wirkzeit -1 Zug.","SK_D_P_0303":"Mit angelegtem [Großschwert]: Standardangriffsschaden +15 %. Schadensreduktion +15 %.","SK_D_P_0304":"Mit angelegtem [Schild]: DEF steigt um STR x3. Erlittener Schaden -25 %. Du erhältst *Spott*.","SK_D_P_0305":"Mit angelegtem [Dolch]: Angriffstempo +25 %.","SK_D_P_0306":"Mit angelegtem [Speer]: Endschaden +10 % und Schadensreduktion +10 %.","SK_D_P_0307":"Mit angelegter [Fernkampf]-Waffe: Genauigkeit +25 % und Krit-Schaden +25 %.","SK_D_P_0308":"Mit angelegtem [Magiewerkzeug]: Wirkzeit -25 %.","SK_D_P_0309":"Erhöht die DEF um alle Werte x0.2.","SK_D_P_0701":"[P] Wirkst du einen MP-Skill und ein Wirkplatz ist frei, wird „Resonanzkugel“ automatisch mitgewirkt.","SK_D_P_0702":"[P] Bleibt ein G 4":"Briseur de sorts","SK_SS_P_0301":"Drain de mana","SK_SS_A_0501":"Opportuniste","SK_S_P_0971":"Art martial du renard"},"desc":{"SK_EX_A_0001":"Passif. Vous accorde « Lune noire ». Les ennemis qui vous attaquent subissent -25% de précision, tandis que vos attaques infligent des dégâts bonus égaux à ATQ magique x3.","SK_EX_A_0002":"Actif de lumière.\nCommence à s'incanter dès le début du combat, sur une incantation séparée. Après 20 tours, frappe tous les ennemis d'une attaque magique égale à tous les dégâts infligés pendant le combat. Vos PM tombent ensuite à 0, puis récupèrent de 10(15)% par tour pendant 10 tours.","SK_EX_A_0006":"[Épée] Les pétales tombent comme la pluie. Les attaques de base frappent 3 ennemis aléatoires à la fois, infligeant chacune ATQ finale x3(4.5) + toutes les stats x3(4.5) de dégâts. Chaque coup ajoute 10 cumuls de Pleine floraison à la cible ; à 60 cumuls, elle éclot et subit des dégâts égaux à 30 % de ses PV max (réduits par la DÉF). Si ses PV sont alors à 30 % ou moins de ses PV max, elle est exécutée en ignorant la DÉF. Les dégâts d'éclosion ne peuvent pas dépasser 30 fois vos PV max et ne peuvent pas être critiques.","SK_EX_A_0007":"[P] [Épée], [Dague] ou [Espadon] équipé : les attaques de base deviennent de foudre. Précision +25(37.5)%, vitesse d'attaque +80(120)%, dégâts critiques +80(120)%.","SK_EX_A_0012":"Actif des ténèbres (instantané).\nÀ l'incantation, démarre une canalisation de 15 tours (aucune autre action). Chaque tour inflige MAG x N (N = tours écoulés) de dégâts à tous les ennemis et consomme 6% de mana par tour. La canalisation s'arrête si le mana manque.\nUne fois achevée, jusqu'à la fin du combat vos attaques de base gagnent MAG x8 de dégâts bonus et frappent deux fois.","SK_EX_A_0015":"[P] [Épée], [Dague] ou [Espadon] équipé : les attaques de base touchent toujours, et les compétences dont l'arme principale est [Épée], [Dague] ou [Espadon] infligent 600(900)% de dégâts en plus.","SK_EX_A_0501":"[Toutes armes] Compétence d'attaque préventive. Niv. x100(150) + toutes les stats x2(3). Coûte 3% de PM.","SK_EX_A_0502":"[Distance] ATQ finale x120(180)% en dégâts fixes. Les ennemis touchés par votre attaque préventive en début de combat sont marqués « Vision du futur » et subissent les mêmes dégâts chaque seconde.","SK_EX_A_0503":"[Toutes armes] Compétence d'attaque préventive. Toutes les stats x3. Attaquer un monstre sauvage lance un combat contre 1 à 6 exemplaires de ce monstre. Au début du combat, inflige toutes les stats x3 de dégâts à tous les ennemis.","SK_EX_A_0504":"Les attaques préventives sur les monstres sauvages remportent aussitôt le combat. Au début du combat, accorde Esquive +25% à tous les alliés.","SK_EX_A_0505":"Quand vous êtes pris pour cible, 100% de chances d'infliger à l'attaquant des dégâts égaux à ceux reçus. Vous récupérez ensuite 90(135)% des dégâts subis.","SK_EX_P_0303":"[P] Après une attaque de base, si la cible survit, tout délai avant/après disparaît et vous réattaquez automatiquement 1 tour plus tard sans choisir d'action. Se répète une fois par tour jusqu'à la chute de la cible, puis votre choix d'action et l'intervalle d'origine reviennent.","SK_EX_P_0304":"[P] À chacune de vos actions, les PM max augmentent de 1(1.5)% (composé). Inflige simultanément à tous les ennemis des dégâts magiques continus d'une puissance égale à vos PM max augmentés. Ces dégâts sont affectés par la DÉF magique et la réduction de dégâts de la cible.","SK_EX_P_0701":"Les monstres possèdent eux aussi des stats. Ajoute à vos stats 10 % de chacune des 6 stats de l'ennemi. Au niveau 100, ajoute à vos stats 110 % des stats du monstre.","SK_EX_P_0801":"[P] Au début du combat, marque tous les ennemis de « Fin ultime ». Après 20 secondes, inflige Niv. x100 + MAG x70 de dégâts à tous les ennemis et les étourdit 3 s. Contre les ennemis sous « Gel », les dégâts deviennent des dégâts fixes.","SK_EX_P_0802":"Invoque 3 Orbes de givre au début du combat, en ignorant la limite d'un seul orbe. Vous commencez le combat à 0% de PM.","SK_SSS_P_0905":"[P] SEN +{27}.","SK_SS_P_0905":"[P] SEN +{24}.","SK_SS_P_0951":"[P] Quand un ennemi reste à 1 PV, accordez-vous 3 occasions d'attaque de base. Ce seuil augmente de 5 % à chaque Lv de Mépris ; à Mépris Lv5, vous obtenez 3 occasions d'attaque de base quand un ennemi a 25 % de PV ou moins.","SK_A_A_0801":"Invoque la Reine du givre auprès du joueur. Elle combat à vos côtés et lance un sort de Gel aléatoire de rang F-A tous les 2 de vos tours d'action. Ses stats valent 75(112.5)% des vôtres. La Reine du givre ne peut être dissipée. Incantation 3(2)s, coûte 25(17)% de PM. Invocation unique.","SK_EX_A_0003":"[Épée] Actif soutenu (instantané).\nÀ l'incantation, pendant 20 tours, une frappe météore de FOR x20(30) touche un ennemi aléatoire chaque tour.\nCoûte 3% de mana par tour ; la canalisation cesse aussitôt si le mana manque, si vous êtes étourdi ou si vous choisissez une autre compétence.","SK_EX_A_0017":"[Épée]\nQuand un ennemi porte une attaque de base, 50(75)% de chances de l'annuler et d'infliger toutes les stats x10(15) de dégâts à l'ennemi. Délai interne de 3 tours.","SK_S_A_0501":"Les attaques préventives depuis une position de DPS de mêlée infligent (FOR+AGI) x3(4.5) de dégâts bonus.","SK_S_A_0502":"[Épée, Dague, Espadon, Lance] Une fois par combat, quand vous êtes ciblé, 5(7.5)% de chances de réduire les dégâts à 1 et d'infliger ATQ finale x10(15) de dégâts à l'ennemi.","SK_S_A_0801":"[A] [Phase] Incante en continu pendant 15 secondes. Vos PV sont fixés à 1 pendant l'incantation. Tant qu'elle dure, attaque un ennemi aléatoire avec 6(9) Éclats de givre tous les 3 tours. (L'incantation s'interrompt si la Phase est levée, le buff dissipé ou si vous êtes étourdi.) Incantation 2 s.","SK_S_A_0902":"[A] Inflige {10}% des PV max en dégâts à tous les ennemis. (Dégâts max par coup = toutes les stats x 50)","SK_S_P_0502":"[Épée, Dague, Espadon] Augmente les effets de Maîtrise de l'épée de 50(75)%. Précision, taux de critique et dégâts critiques +25(37.5)%. Gagne en plus 2(3)x l'ATQ de l'arme au calcul de l'ATQ finale.","SK_S_P_0801":"[P] ATQ magique +50(75)%, PM max +30(45)%","SK_S_P_0905":"[P] SEN +{21}.","SK_S_P_0951":"[P] Tuer un ennemi d'une Contre-attaque accorde une occasion d'attaque supplémentaire.","SK_S_P_0962":"[P] Tuer un ennemi accorde 1 occasion d'attaque supplémentaire.","SK_A_A_0301":"[Épée] Frappe tous les ennemis 2 fois. 150(225)% de l'ATQ finale + toutes les stats x1(1.5) de dégâts.","SK_A_A_0302":"[Épée, Dague] Inflige 100(150)% de l'ATQ finale + AGI x12~18(18~27) de dégâts. Vous êtes figé 3 tours après l'attaque.","SK_A_A_0303":"[Dague] 100(150)% de l'ATQ finale. Dégâts critiques 500(750)%.","SK_A_A_0304":"[Espadon] Frappe jusqu'à 6 ennemis à la fois. 220(330)% de l'ATQ finale + FOR x5(7.5) de dégâts. Réduit la DÉF des ennemis touchés de 15(22.5)%. (Se renouvelle, sans cumul)","SK_A_A_0305":"[Poings] Frappe tous les ennemis 1 fois. Détruit tous les boucliers des cibles, puis inflige 220(330)% de l'ATQ finale. Peut être bloqué par un Contre.","SK_A_A_0306":"[Distance] Libère votre dernière flamme. 320(480)% de l'ATQ finale. Délai de récupération de 5 tours. Les dégâts finaux augmentent selon les PM manquants par rapport au max. (+1(1.5)% par 1% manquant)","SK_A_A_0307":"[Outil magique] 120(180)% de l'ATQ magique. Inflige Poison de mana. Inflige les mêmes dégâts à tous les ennemis empoisonnés au mana. Si cette attaque tue un ennemi, restaure vos PM à hauteur des PM restants de l'ennemi.","SK_A_A_0501":"[Épée] Compétence d'attaque préventive. ATQ finale 1.8(2.7) + toutes les stats x1(1.5). Coûte 3% de PM. (Onde de lame)","SK_A_A_0504":"[Lance] Compétence d'attaque préventive. (FOR+MAG) x3.5(5.25) de dégâts fixes ; touche toujours en critique. Coûte 15% de PM. (Lancer de lance)","SK_A_A_0506":"[Bouclier] Compétence d'attaque préventive. DÉF x5(7.5) de dégâts. Coûte 4% de PM. (Jet de rocher)","SK_A_A_0508":"[Bouclier] Quand vous êtes pris pour cible, récupérez instantanément 2(3)% des PV max. Si vous êtes le dernier allié debout, chaque coup subi inflige aussi à tous les ennemis des dégâts égaux aux PV récupérés.","SK_A_A_0509":"[Lance, Outil magique] Quand un allié est pris pour cible et que ses PV sont à 15(22.5)% ou moins, restaurez aussitôt ses PV de Chance x8(12). Coûte 8% de PM par allié ; ne se déclenche pas sans PM disponibles. L'allié soigné subit 25(37.5)% de dégâts en moins pour le combat.","SK_A_A_0510":"Esquive +30(45)%. Après une esquive réussie, poursuivez l'attaquant et infligez 80(120)% de votre ATQ finale en dégâts.","SK_A_A_0511":"Quand vous êtes ciblé par une compétence ou une attaque magique, réduit ces dégâts de 80(120)%. Réduit ensuite les stats de base de l'attaquant de 30(45)% jusqu'à la fin du combat, et vous gagnez l'équivalent.","SK_A_A_0802":"[A] [Phase] Dure 10 s. Immédiatement, puis toutes les 2 s, inflige « Gel » à tous les ennemis. « Gel » inflige en plus Précision -35(52.5)%.","SK_A_E_0507":"En attaque préventive, applique d'avance Rupture à l'ennemi. (Dégâts subis +25(37.5)%)","SK_A_P_0001":"Augmente l'efficacité des compétences de glace de 30(45)%.","SK_A_P_0301":"[Bouclier] Augmente la DÉF de tous les alliés (sauf vous) de votre DÉF x0.1(0.15). Accorde en plus à tous les alliés un bouclier Égide cumulable égal à 7(10.5)% de vos PV. Inflige ensuite à un ennemi des dégâts égaux au total des boucliers alliés créés x0.5(0.75). (Plafond de dégâts = Niv. joueur x300(450))","SK_A_P_0302":"[Lance] Inflige (FOR + MAG) x10(15) de dégâts à 2 ennemis.","SK_A_P_0303":"Tous les effets d'esprit +70(105)%. Invoque une pixie qui participe au combat. La pixie bloque parfois une compétence à votre place.","SK_A_P_0304":"Quand vous gagnez une occasion d'attaque supplémentaire, votre prochaine attaque de base ou compétence ignore la DÉF ennemie.","SK_A_P_0305":"Garantit +1 tour d'avance à l'entrée en combat.","SK_A_P_0306":"En attaque préventive : taux de critique +25(37.5)%, précision +25(37.5)%.","SK_A_P_0307":"Précision +45(67.5)%. Dégâts magiques subis -15(22.5)%.","SK_A_P_0308":"À l'entrée d'un Portail, les PM max augmentent temporairement de 50(75)% jusqu'à la fin du Portail. (PM max, donc déjà remplis.)","SK_A_P_0701":"INT +50(75)","SK_A_P_0702":"[P] Chaque fois que les PM tombent à 20(30) ou moins, récupérez 10(15)% de PM. (Désactivable)","SK_A_P_0801":"[P] Les PM max augmentent de Niv. joueur x60(90). Chaque 1% de PM dépensé augmente les dégâts des compétences de Gel de 1(1.5)%.","SK_A_P_0802":"[P] Tours ennemis +1. Vitesse d'incantation alliée +30(45)%.","SK_A_P_0803":"[P] En combat, augmente la FOR et la MAG des alliés de Niv. x1(1.5) et réduit celles des ennemis d'autant. (Sans cumul)","SK_A_P_0901":"[Passif] Lance une roulette après chaque attaque de base. La roulette va de 1 à 7 ; un 7 accorde une occasion d'attaque supplémentaire. Votre Chance augmente la probabilité d'obtenir un 7. (De 15% jusqu'à 50% max)","SK_A_P_0902":"[P] Agissez en premier avec une attaque de base au début du combat. Si plusieurs combattants possèdent cette compétence, la priorité va à la plus haute AGI, puis à la plus haute EXP (le joueur gagne en cas d'égalité).","SK_A_P_0905":"[P] SEN +{18}.","SK_B_A_0301":"[Épée] Inflige 150% de l'ATQ finale + toutes les stats x1 de dégâts.","SK_B_A_0302":"[Dague] 100(150)% de l'ATQ finale + cumuls de Poursuite x10(15)%. Gagnez 1 cumul de Poursuite après l'attaque. (Max 25) Jusqu'à 350(525)% de dégâts.","SK_B_A_0303":"[Espadon] Inflige 180(270)% de l'ATQ finale + FOR x2(3) de dégâts à tous les ennemis en combat. Les tours des ennemis touchés sont retardés de +2.","SK_B_A_0304":"[Poings] 100(150)% de l'ATQ finale + dégâts à tous les ennemis. DÉF des ennemis touchés -35(52.5)%. Ne peut pas être Contré.","SK_B_A_0305":"[Distance] 85(127.5)% de l'ATQ finale + 6 tirs. Frappe des ennemis aléatoires. Chaque coup réduit la DÉF de l'ennemi touché de 1(1.5). (Cumul infini.)","SK_B_A_0306":"[Outil magique] 120(180)% de l'ATQ magique. Inflige Poison de mana aux ennemis touchés. Les ennemis empoisonnés au mana subissent des dégâts magiques bonus égaux aux cumuls de Poison de mana x1(1.5)%.","SK_B_A_0501":"[Épée, Espadon] Compétence d'attaque préventive. ATQ finale 1.6(2.4) + toutes les stats x1(1.5).","SK_B_A_0502":"[Bouclier, Lance, Poings] Compétence d'attaque préventive. ATQ finale 1.2(1.8) + toutes les stats x1(1.5).","SK_B_A_0503":"[Distance] Après avoir éliminé une cible d'un seul coup en attaque préventive, votre prochaine attaque préventive gagne un bonus d'ATQ de 15(22.5)%.","SK_B_A_0505":"[Épée, Poings, Dague] Après avoir esquivé une attaque ennemie, 30(45)% de chances d'infliger ATQ finale x1.8(2.7) de dégâts. Touche toujours en critique avec dégâts critiques +250(375)%. Gagnez une action immédiate.","SK_B_A_0506":"Après avoir esquivé une attaque ennemie, 30% de chances d'accorder « Hâte » à tous les alliés. À partir de la 2e utilisation, accorde à tous les alliés Esquive +5% cumulable.","SK_B_A_0507":"[Distance, Outil magique] Quand un ennemi incante une attaque magique, 15(22.5)% de chances de l'annuler. Jusqu'à 5 fois par combat ; coûte 5% de PM par usage. En cas d'annulation, inflige des dégâts égaux aux PM dépensés par l'ennemi x10(15) et retarde son tour d'action de base de 1.","SK_B_A_0801":"[A] Applique Gel à tous les ennemis ; au moins 1 garanti, 35(52.5)% de chances chacun. Inflige ensuite ATQ magique x6(9) de dégâts par cumul de Gel appliqué. Juste après, exécute les ennemis sous 20(30)% de PV. Incantation 8 s. Utilisable 3 fois par combat. Coûte 25% de PM.","SK_B_P_0001":"À l'attaque de base, un Chevalier des ombres aux stats identiques aux vôtres porte une attaque de base supplémentaire.","SK_B_P_0301":"[Bouclier] équipé : inflige DÉF x6(9) de dégâts à tous les ennemis. Accorde à tous les alliés un bouclier Égide cumulable égal à 5(7.5)% de vos PV.","SK_B_P_0302":"[Lance] Dégâts fixes de (FOR+MAG) x5(7.5).","SK_B_P_0303":"Tous les effets d'esprit +30(45)%.","SK_B_P_0304":"Garantit 2 tours d'avance à l'entrée en combat.","SK_B_P_0305":"Précision, taux de critique et dégâts critiques +25(37.5)%.","SK_B_P_0306":"Esquive +45(67.5)%.","SK_B_P_0307":"PM max +15(22.5)%.","SK_B_P_0308":"[Bouclier] PV max +35(52.5)%.","SK_B_P_0701":"[P] Un génie né. Toutes les stats +7(10.5)","SK_B_P_0702":"[P] Ajoute 10(15)% de votre stat la plus élevée à vos autres stats.","SK_B_P_0705":"[P] Précision +25(37.5)%. Chaque attaque ratée accorde Précision +5(7.5)% supplémentaire. (Cumul infini)","SK_B_P_0706":"Gagnez de l'AGI égale à Niv. joueur x1(1.5).","SK_B_P_0707":"Gagnez de l'ATQ et de l'ATQ magique égales à Niv. joueur x1(1.5).","SK_B_P_0708":"Gagnez de la Chance et du SEN égaux à Niv. joueur x0.5(0.75).","SK_B_P_0709":"Gagnez de l'INT égale à Niv. joueur x1(1.5).","SK_B_P_0711":"[P] Quand un allié est à 10(15)% de PV ou moins, restaure 10(15)% des PV de l'allié le plus faible (sans incantation). 5 fois par combat.","SK_B_P_0712":"[P] Né avec une force destructrice. La FOR augmente de 3(4.5) tous les 4 niveaux de joueur. Passif.","SK_B_P_0801":"Augmente les dégâts finaux de la magie de glace de 35(52.5)%.","SK_B_P_0802":"[P] Appliquer Gel ajoute 1 cumul supplémentaire.","SK_B_P_0905":"[P] SEN +{15}.","SK_C_A_0301":"[Épée, Espadon] 145% de l'ATQ finale. Frappe jusqu'à 3 ennemis à la fois.","SK_C_A_0302":"[Dague] 120% de l'ATQ finale. 15% de chances de gagner une occasion d'attaque supplémentaire après l'attaque.","SK_C_A_0303":"[Lance] 125% de l'ATQ finale. 15% des dégâts sont infligés en dégâts fixes. Réduit la DÉF de l'ennemi touché de 25%.","SK_C_A_0304":"[Poings] 90% de l'ATQ finale x2 coups. Frappe en alternant poing gauche et poing droit. Ne peut pas être Contré.","SK_C_A_0305":"[Distance] 135% de l'ATQ finale. Inflige des dégâts bonus égaux à FOR +1.5. (Additif)","SK_C_A_0306":"[Bouclier] 150% de l'ATQ finale + dégâts fixes bonus égaux à DÉF x5.","SK_C_A_0307":"[Distance] 120% de l'ATQ finale x2 coups. Si le premier coup tue l'ennemi, les dégâts restants passent sur un autre ennemi.","SK_C_A_0308":"[Outil magique] 85% de l'ATQ magique. Inflige « Poison de mana » aux ennemis touchés. Les ennemis empoisonnés au mana subissent chaque seconde (10 tours) des dégâts proportionnels à la MAG du lanceur x1. (Cinq mages frappant à 100 infligent 500 dégâts par seconde. Ne s'accumule qu'une fois par joueur.)","SK_C_A_0501":"[Dague] Compétence d'attaque préventive. ATQ finale 1.5. Ignore 25% de réduction de dégâts (additive) en bonus.","SK_C_A_0502":"Si vous êtes attaqué avant d'agir, gagnez Boost de tours +3 (3 tours joués en premier).","SK_C_A_0504":"[Épée, Espadon, Poings, Lance, Dague] Une fois par combat, 10% de chances de se déclencher quand vous esquivez une attaque ennemie. Inflige 150% de l'ATQ finale en critique garanti, vous accorde « Hâte » (Esquive +25%, Précision +25%, 30 tours) et une action immédiate.","SK_C_A_0505":"[Spécial] Nécessite un [Bouclier] plus un utilisateur [Distance] ou [Outil magique] dans le groupe ; se déclenche jusqu'à 3 fois par combat. Quand vous êtes ciblé, 60% de chances d'ignorer les dégâts, et chaque allié équipé de [Distance] ou [Outil magique] frappe tous les ennemis pour (ATQ finale + ATQ magique) x2 de dégâts.","SK_C_A_0506":"Chance de Contre +2%. Quand un Contre inflige des dégâts : dégâts finaux +10%, précision +5%, taux de critique +5%.","SK_C_A_0801":"[A] Invoque un Orbe de givre sur le terrain. L'orbe reste près du joueur et rayonne en continu. PV de l'orbe = MAG du joueur x15 + Niv. x100. Toutes les 2 s, inflige MAG du lanceur x1 en dégâts continus à tous les ennemis. Les ennemis touchés ont 25% de chances de subir « Gel ». [Outil magique] Quand le joueur est touché, l'Orbe de givre encaisse en premier. L'attaquant reçoit 1 charge de « Gel » avant le calcul des dégâts. Chaque fois qu'une charge de Gel s'ajoute sur le terrain, vous gagnez un bouclier égal à Magie x0,1. 1 seul orbe par combat. S'il est détruit, il est réutilisable après 15 secondes.","SK_C_A_0802":"[A] Inflige 2 800 dégâts à tous les ennemis. Applique 1 Gel. Taux de critique 25%.","SK_C_E_0503":"En attaque préventive, Précision +20%.","SK_C_P_0001":"Passif déclenché. En cas d'attaque subie, consomme 10% des PM actuels pour réduire d'autant les dégâts reçus.","SK_C_P_0212":"À l'attaque de base, une « Ombre » porte une frappe de suivi infligeant 15% des dégâts.","SK_C_P_0301":"[Épée, Dague, Poings] Les ennemis touchés subissent en continu AGI x0.1 de dégâts toutes les 3 secondes (30 tours).","SK_C_P_0302":"[Épée] équipée : dégâts des attaques de base et des compétences +20%. Précision +25%.","SK_C_P_0303":"[Poings] équipés : dégâts de compétence +80%. Temps d'incantation -1 tour.","SK_C_P_0304":"[Espadon] équipé : augmente la FOR de Niv. joueur x1.","SK_C_P_0305":"[Bouclier] équipé : augmente la DÉF de FOR x5. Dégâts subis -35%. Gagne *Provocation*. Ignore les dégâts inférieurs ou égaux à votre DÉF. (Dégâts ignorés = 1 dégât)","SK_C_P_0306":"[Dague] équipée : augmente l'AGI de Niv. joueur x1.","SK_C_P_0307":"[Lance] équipée : dégâts finaux +15% et réduction de dégâts +15%.","SK_C_P_0308":"[Distance] équipée : ATQ finale +15%.","SK_C_P_0309":"[Outil magique] équipé : récupère aussitôt 10% des PM dépensés. Dégâts de compétence +30%.","SK_C_P_0701":"[P] Chance +30","SK_C_P_0702":"[A] Accorde à tous les alliés un bouclier de MAG x3 + PV du lanceur x0.3. Incantation 3 s. PM 60.","SK_C_P_0703":"[A] Consume tout votre bouclier pour infliger des dégâts égaux à sa valeur. Incantation 1 s. PM 25.","SK_C_P_0706":"[P] Votre stat la plus élevée +35.","SK_C_P_0707":"[A] Si les PV max de l'ennemi dépassent les vôtres, inflige la différence de PV max x0.5 en dégâts physiques. (Plafond de dégâts = toutes les stats x8). PM 50.","SK_C_P_0709":"[P] Gagnez une Esquive égale à Niv. joueur x0.5%. (50% au niveau 99)","SK_C_P_0712":"[P] Récupérez 3% des dégâts magiques que vous infligez.","SK_C_P_0801":"Augmente les dégâts finaux de la magie de Gel de 7% et la durée du Gel de 20%.","SK_C_P_0802":"Au début du combat, applique Gel (E) à tous les ennemis avec 15% de chances chacun. Les compétences de Gel coûtent 2% de PM en moins.","SK_C_P_0803":"[P] Taux de critique +25% sur les attaques de glace.","SK_C_P_0804":"[P] [Lance] Les attaques de base et de compétence de glace infligent 35% de dégâts magiques bonus. Dégâts subis -10%.","SK_C_P_0805":"[P] Réduit les dégâts magiques subis de 25%. À chaque déclenchement, la réduction baisse de 1 pt, jusqu'à 1% minimum. 25% de chances de résister au Gel.","SK_C_P_0806":"[P] Augmente l'EXP gagnée de {25}%.","SK_C_P_0905":"[P] SEN +{12}.","SK_D_A_0001":"[A] Tire une flèche de glace sur un ennemi : 280% de l'ATQ magique. Incantation 5 s. Coûte 15% de PM.","SK_D_A_0301":"[Épée, Espadon] 125% de l'ATQ finale. Frappe jusqu'à 3 ennemis à la fois.","SK_D_A_0302":"[Poings] 115% de l'ATQ finale. Dégâts bonus égaux à 3% des PV actuels de l'ennemi. (Max 1200)","SK_D_A_0303":"[Distance] 110% de l'ATQ finale. Incantation post-attaque -10% (priorité de tour). Inflige *Blessure* à l'ennemi touché. Toutes les attaques physiques infligent 5% de dégâts bonus aux ennemis blessés.","SK_D_A_0304":"[Dague] 55% de l'ATQ finale x2 coups. Porte deux attaques de base. Le second coup ignore 35% de la DÉF.","SK_D_A_0305":"[Bouclier] 110% de l'ATQ finale. Dégâts bonus égaux à DÉF x3. Frappe jusqu'à 3 ennemis à la fois. Réduit la DÉF des ennemis touchés de 25%.","SK_D_A_0306":"[Lance] 120% de l'ATQ finale. Les ennemis touchés subissent Précision -25% et vitesse d'attaque/d'incantation -25%. (Sans cumul)","SK_D_A_0307":"[Outil magique] 115% de l'ATQ magique. Les ennemis touchés subissent Résistance magique -50%.","SK_D_A_0501":"[Distance] Compétence d'attaque préventive. ATQ finale 1.4. Bonus de taux de critique +15% appliqué.","SK_D_A_0503":"En attaque préventive réussie : INT +10 pour le combat.","SK_D_A_0504":"En attaque préventive réussie : Chance et SEN +15 pour le combat.","SK_D_A_0505":"Les attaques préventives ignorent 20% de la DÉF ennemie.","SK_D_A_0506":"[Ou
