,"SK_F_A_0807":"Địa Linh","SK_F_E_0503":"Liều Lĩnh","SK_F_P_0001":"Tập Trung","SK_F_P_0002":"Cảnh Giác","SK_F_P_0003":"Võ Thuật","SK_F_P_0004":"Đại Kiếm Thuật","SK_F_P_0005":"Hồi Phục Chiến Đấu","SK_F_P_0006":"Đòn Liên Hoàn","SK_F_P_0007":"Hồi Ma Lực","SK_F_P_0701":"Đúng Nơi Đúng Chỗ","SK_F_P_0702":"Cầu Cộng Hưởng","SK_F_P_0703":"Tốc Độ Thiên Bẩm","SK_F_P_0704":"Thành Quả Rèn Luyện","SK_F_P_0705":"Sức Chịu Đựng","SK_F_P_0706":"Ý Chí Sắt Đá","SK_F_P_0707":"Cỏ Ba Lá","SK_F_P_0708":"Hình Dung","SK_F_P_0709":"Hiện Thực Hóa","SK_F_P_0711":"Phá Giải","SK_F_P_0712":"Khóa Mục Tiêu","SK_F_P_0714":"Vùng Cấm","SK_F_P_0716":"Cú Đấm Mạnh","SK_F_P_0719":"Chém Liên Tiếp","SK_F_P_0720":"Tài Năng Kiếm Thuật","SK_F_P_0722":"Tài Năng Ám Sát","SK_F_P_0723":"Lật Ngược Thế Cờ","SK_F_P_0801":"Thiên Phú Hàn Khí","SK_F_P_0802":"Tinh Thông Đóng Băng","SK_F_P_0803":"Trưởng Thành Vượt Trội","SK_F_P_0904":"Nhà Sưu Tầm Mảnh Vỡ","SK_F_P_0905":"Nhà Thám Hiểm","SK_SS_P_0302":"Song Kiếm Thuật","SK_SS_P_0303":"Kẻ phá luật","SK_SS_P_0304":"Kẻ phá phép","SK_SS_P_0301":"Hút mana","SK_SS_A_0501":"Kẻ cơ hội","SK_S_P_0971":"Chiến thuật hồ ly"},"desc":{"SK_EX_A_0001":"Bị động. Tự cấp 'Hắc Nguyệt'. Kẻ địch tấn công bạn chịu -25% Chính xác, ngược lại đòn tấn công của bạn gây thêm sát thương bằng Công phép x3.","SK_EX_A_0002":"Chủ động thuộc tính ánh sáng.\nBắt đầu niệm ngay khi trận mở màn, trên một ô niệm riêng. Sau 20 lượt, giáng lên toàn bộ kẻ địch một đòn tấn công phép bằng toàn bộ sát thương bạn đã gây ra trong trận. Sau đó MP của bạn bị đặt về 0, rồi hồi 10(15)% mỗi lượt trong 10 lượt.","SK_EX_A_0006":"[Kiếm] Cánh hoa rơi như mưa. Đòn đánh thường đánh cùng lúc 3 kẻ địch ngẫu nhiên, gây cho mỗi mục tiêu sát thương bằng Tấn công cuối x3(4.5) + Toàn chỉ số x3(4.5). Mỗi đòn trúng cộng 10 tầng Mãn Khai cho mục tiêu; đủ 60 tầng sẽ khai hoa, gây sát thương bằng 30% HP tối đa của mục tiêu (bị giảm bởi phòng thủ). Khi đó nếu HP mục tiêu không quá 30% HP tối đa, mục tiêu bị hành quyết, bỏ qua phòng thủ. Sát thương khai hoa không vượt quá 30 lần HP tối đa của bạn và không thể chí mạng.","SK_EX_A_0007":"[P] Khi trang bị [Kiếm], [Dao găm] hoặc [Đại kiếm]: đòn đánh thường trở thành thuộc tính sét. Chính xác +25(37.5)%, Tốc độ đánh +80(120)%, Sát thương chí mạng +80(120)%.","SK_EX_A_0012":"Chủ động thuộc tính bóng tối (tức thời).\nNgay khi thi triển, bắt đầu kênh niệm 15 lượt (không thể hành động khác). Mỗi lượt gây sát thương bằng Phép lực x N (N = số lượt đã trôi qua) lên toàn bộ kẻ địch và tiêu hao 6% MP mỗi lượt. Kênh niệm kết thúc sớm nếu hết MP.\nKhi kênh niệm hoàn tất, đến hết trận đòn đánh thường của bạn được cộng thêm sát thương bằng Phép lực x8 và đánh 2 lần.","SK_EX_A_0015":"[P] Khi trang bị [Kiếm], [Dao găm] hoặc [Đại kiếm]: đòn đánh thường luôn trúng đích, và kỹ năng có vũ khí chính là [Kiếm]·[Dao găm]·[Đại kiếm] gây thêm 600(900)% sát thương.","SK_EX_A_0501":"[Mọi vũ khí] Kỹ năng Đòn phủ đầu. Lv x100(150) + Toàn chỉ số x2(3). Tốn 3% MP.","SK_EX_A_0502":"[Tầm xa] Sát thương cố định bằng Tấn công cuối x120(180)%. Kẻ địch trúng Đòn phủ đầu của bạn lúc mở trận sẽ bị đánh dấu 'Thấu Thị Tương Lai' và nhận lại cùng lượng sát thương đó mỗi giây.","SK_EX_A_0503":"[Mọi vũ khí] Kỹ năng Đòn phủ đầu. Toàn chỉ số x3. Khi tấn công quái vật hoang dã, vào trận đấu gồm 1-6 con quái đó. Khi trận bắt đầu, gây sát thương bằng Toàn chỉ số x3 lên toàn bộ kẻ địch.","SK_EX_A_0504":"Đòn phủ đầu lên quái vật hoang dã lập tức thắng trận. Khi trận bắt đầu, cấp cho toàn bộ đồng minh Né tránh +25%.","SK_EX_A_0505":"Khi bạn trở thành mục tiêu, 100% xác suất gây lại cho kẻ tấn công lượng sát thương đúng bằng lượng đã nhận. Sau đó bạn hồi 90(135)% lượng sát thương phải chịu.","SK_EX_P_0303":"[P] Sau đòn đánh thường, nếu mục tiêu còn sống, mọi độ trễ trước/sau biến mất và bạn tự động đánh thường lần nữa sau 1 lượt mà không cần chọn hành động. Lặp lại mỗi lượt 1 lần đến khi mục tiêu gục ngã, sau đó quyền chọn hành động và nhịp hành động ban đầu trở lại.","SK_EX_P_0304":"[P] Mỗi lần bạn hành động, MP tối đa tăng 1(1.5)% (lãi kép). Đồng thời gây sát thương phép theo thời gian lên toàn bộ kẻ địch với uy lực bằng MP tối đa sau khi tăng. Sát thương này chịu ảnh hưởng của Thủ phép và hiệu ứng giảm sát thương của mục tiêu.","SK_EX_P_0701":"Quái vật cũng có chỉ số. Cộng 10% của từng chỉ số trong 6 loại chỉ số của kẻ địch vào chỉ số của bản thân. Ở cấp 100, cộng 110% chỉ số mà quái vật sở hữu vào chỉ số của bản thân.","SK_EX_P_0801":"[P] Khi trận bắt đầu, khắc dấu 'Hồi Kết' lên toàn bộ kẻ địch. Sau 20 giây, gây sát thương bằng Lv x100 + Phép lực x70 lên toàn bộ kẻ địch và làm choáng chúng 3 giây. Với kẻ địch đang chịu 'Đóng băng', sát thương trở thành sát thương cố định.","SK_EX_P_0802":"Triệu hồi 3 Cầu Sương Giá khi trận bắt đầu, bỏ qua giới hạn 1 quả cầu. Bạn bắt đầu trận với 0% MP.","SK_SSS_P_0905":"[P] Giác quan +{27}.","SK_SS_P_0905":"[P] Giác quan +{24}.","SK_SS_P_0951":"[P] Khi kẻ địch chỉ còn 1 HP, tự cấp cho mình 3 cơ hội đánh thường. Ngưỡng này tăng 5% mỗi khi Lv Khinh Miệt tăng; ở Khinh Miệt Lv5, bạn nhận 3 cơ hội đánh thường khi HP kẻ địch còn 25% trở xuống.","SK_A_A_0801":"Triệu hồi Nữ Hoàng Sương Giá đến bên người chơi. Nàng chiến đấu cùng bạn, thi triển ngẫu nhiên một phép thuộc tính Đóng băng hạng F-A sau mỗi 2 lượt hành động của bạn. Chỉ số của nàng bằng 75(112.5)% của bạn. Nữ Hoàng Sương Giá không thể bị giải trừ. Niệm 3(2) giây, tốn 25(17)% MP. Không thể triệu hồi hai lần.","SK_EX_A_0003":"[Kiếm] Chủ động duy trì (tức thời).\nNgay khi thi triển, trong 20 lượt, mỗi lượt một đòn lưu tinh bằng Sức mạnh x20(30) giáng xuống 1 kẻ địch ngẫu nhiên.\nTốn 3% MP mỗi lượt; kênh niệm kết thúc ngay nếu hết MP, bị choáng hoặc bạn chọn kỹ năng khác.","SK_EX_A_0017":"[Kiếm]\nKhi kẻ địch tung đòn đánh thường, 50(75)% xác suất vô hiệu hóa đòn đó và gây sát thương bằng Toàn chỉ số x10(15) lên kẻ địch. Hồi chiêu nội bộ 3 lượt.","SK_S_A_0501":"Đòn phủ đầu từ vị trí sát thương cận chiến gây thêm (Sức mạnh+Nhanh nhẹn) x3(4.5) sát thương.","SK_S_A_0502":"[Kiếm, Dao găm, Đại kiếm, Thương] 1 lần mỗi trận, khi bạn trở thành mục tiêu, 5(7.5)% xác suất giảm sát thương xuống còn 1 và gây sát thương bằng Tấn công cuối x10(15) lên kẻ địch.","SK_S_A_0801":"[A] [Vị thế] Niệm liên tục trong 15 giây. HP của bạn bị đặt về 1 trong khi niệm. Khi niệm còn tiếp diễn, cứ mỗi 3 lượt tấn công một kẻ địch ngẫu nhiên bằng 6(9) Ngọc Sương Giá. (Việc niệm bị gián đoạn nếu Vị thế bị gỡ, buff bị giải trừ, hoặc bạn bị choáng.) Niệm 2 giây.","SK_S_A_0902":"[A] Gây sát thương bằng {10}% HP tối đa lên toàn bộ kẻ địch. (Sát thương tối đa mỗi hit = Toàn chỉ số x 50)","SK_S_P_0502":"[Kiếm, Dao găm, Đại kiếm] Tăng 50(75)% hiệu quả của Tinh Thông Kiếm. Chính xác, Tỉ lệ chí mạng và Sát thương chí mạng +25(37.5)%. Khi tính Tấn công cuối, nhận thêm 2(3) lần tấn công của vũ khí.","SK_S_P_0801":"[P] Công phép +50(75)%, MP tối đa +30(45)%","SK_S_P_0905":"[P] Giác quan +{21}.","SK_S_P_0951":"[P] Hạ gục kẻ địch bằng đòn Phản đòn sẽ nhận thêm cơ hội tấn công.","SK_S_P_0962":"[P] Hạ gục kẻ địch sẽ nhận thêm 1 cơ hội tấn công.","SK_A_A_0301":"[Kiếm] Đánh toàn bộ kẻ địch 2 lần. Sát thương bằng 150(225)% Tấn công cuối cộng Toàn chỉ số x1(1.5).","SK_A_A_0302":"[Kiếm, Dao găm] Gây sát thương bằng 100(150)% Tấn công cuối cộng Nhanh nhẹn x12~18(18~27). Bạn bị cứng đờ 3 lượt sau khi tấn công.","SK_A_A_0303":"[Dao găm] 100(150)% Tấn công cuối. Sát thương chí mạng 500(750)%.","SK_A_A_0304":"[Đại kiếm] Đánh cùng lúc tối đa 6 kẻ địch. Sát thương bằng 220(330)% Tấn công cuối cộng Sức mạnh x5(7.5). Giảm 15(22.5)% Phòng thủ của kẻ địch trúng đòn. (Làm mới, không cộng dồn)","SK_A_A_0305":"[Găng đấm] Đánh toàn bộ kẻ địch 1 lần. Phá hủy toàn bộ khiên của mục tiêu, sau đó gây sát thương bằng 220(330)% Tấn công cuối. Có thể bị chặn bởi Phản đòn.","SK_A_A_0306":"[Tầm xa] Giải phóng ngọn lửa cuối cùng còn lại. 320(480)% Tấn công cuối. Độ trễ hồi đòn 5 lượt. Sát thương cuối tăng theo lượng MP đã mất so với tối đa. (+1(1.5)% mỗi 1% MP mất)","SK_A_A_0307":"[Pháp khí] 120(180)% Công phép. Gây Nhiễm độc ma lực. Gây cùng lượng sát thương lên mọi kẻ địch đang bị nhiễm độc ma lực. Nếu đòn này hạ gục kẻ địch, hồi MP của bạn bằng lượng MP còn lại của kẻ địch.","SK_A_A_0501":"[Kiếm] Kỹ năng Đòn phủ đầu. Tấn công cuối 1.8(2.7) + Toàn chỉ số x1(1.5). Tốn 3% MP. (Kiếm khí)","SK_A_A_0504":"[Thương] Kỹ năng Đòn phủ đầu. Sát thương cố định (Sức mạnh+Phép lực) x3.5(5.25); luôn trúng chí mạng. Tốn 15% MP. (Phóng thương)","SK_A_A_0506":"[Khiên] Kỹ năng Đòn phủ đầu. Sát thương bằng Phòng thủ x5(7.5). Tốn 4% MP. (Ném đá)","SK_A_A_0508":"[Khiên] Khi trở thành mục tiêu, hồi ngay 2(3)% HP tối đa. Nếu bạn là đồng minh cuối cùng còn đứng vững, mỗi đòn phải nhận cũng gây sát thương lên toàn bộ kẻ địch bằng lượng HP bạn đã hồi.","SK_A_A_0509":"[Thương, Pháp khí] Khi đồng minh trở thành mục tiêu và HP của họ từ 15(22.5)% trở xuống, hồi ngay HP cho họ bằng May mắn của bạn x8(12). Tốn 8% MP mỗi đồng minh; không kích hoạt nếu không còn MP để tiêu. Đồng minh được hồi giảm 25(37.5)% sát thương phải chịu trong suốt trận.","SK_A_A_0510":"Né tránh +30(45)%. Khi né thành công, truy đuổi kẻ tấn công và gây sát thương bằng 80(120)% Tấn công cuối của bạn.","SK_A_A_0511":"Khi trở thành mục tiêu của kỹ năng hoặc đòn tấn công phép, giảm 80(120)% lượng sát thương đó. Sau đó giảm 30(45)% chỉ số gốc của kẻ tấn công đến hết trận, và bạn nhận đúng lượng chỉ số đó.","SK_A_A_0802":"[A] [Vị thế] Kéo dài 10 giây. Ngay lập tức, và cứ mỗi 2 giây, gây 'Đóng băng' lên toàn bộ kẻ địch. 'Đóng băng' còn gây thêm Chính xác -35(52.5)%.","SK_A_E_0507":"Khi tung Đòn phủ đầu, áp trước hiệu ứng Rạn Vỡ lên kẻ địch. (Sát thương phải chịu +25(37.5)%)","SK_A_P_0001":"Tăng 30(45)% hiệu quả của kỹ năng thuộc tính Băng (Ice).","SK_A_P_0301":"[Khiên] Tăng Phòng thủ của mọi đồng minh (trừ bạn) bằng Phòng thủ của bạn x0.1(0.15). Thêm vào đó, cấp cho toàn bộ đồng minh Khiên Aegis cộng dồn bằng 7(10.5)% HP của bạn. Sau đó gây sát thương lên 1 kẻ địch bằng tổng lượng khiên đồng minh vừa tạo x0.5(0.75). (Giới hạn sát thương tối đa = Lv người chơi x300(450))","SK_A_P_0302":"[Thương] Gây sát thương bằng (Sức mạnh + Phép lực) x10(15) lên 2 kẻ địch.","SK_A_P_0303":"Mọi hiệu ứng Tinh linh +70(105)%. Triệu hồi một tiểu tiên tham gia chiến đấu. Tiểu tiên thỉnh thoảng chặn kỹ năng thay bạn.","SK_A_P_0304":"Khi nhận thêm cơ hội tấn công, đòn đánh thường hoặc kỹ năng kế tiếp bỏ qua Phòng thủ của kẻ địch.","SK_A_P_0305":"Giành trước +1 lượt khi vào trận.","SK_A_P_0306":"Khi tung Đòn phủ đầu: Tỉ lệ chí mạng +25(37.5)%, Chính xác +25(37.5)%.","SK_A_P_0307":"Chính xác +45(67.5)%. Sát thương phép phải chịu -15(22.5)%.","SK_A_P_0308":"Khi vào Cổng, MP tối đa tạm thời tăng 50(75)% cho đến khi Cổng kết thúc. (Vì là MP tối đa nên khởi đầu đã được nạp đầy.)","SK_A_P_0701":"Trí tuệ +50(75)","SK_A_P_0702":"[P] Mỗi khi MP giảm xuống còn 20(30) trở xuống, hồi 10(15)% MP. (Có thể tắt)","SK_A_P_0801":"[P] MP tối đa tăng bằng Lv người chơi x60(90). Mỗi 1% MP tiêu hao làm tăng 1(1.5)% sát thương kỹ năng thuộc tính Đóng băng.","SK_A_P_0802":"[P] Lượt của kẻ địch +1. Tốc độ niệm của đồng minh +30(45)%.","SK_A_P_0803":"[P] Trong trận, tăng chỉ số Sức mạnh và Phép lực của đồng minh bằng Lv x1(1.5), đồng thời giảm của kẻ địch lượng tương tự. (Không cộng dồn)","SK_A_P_0901":"[Bị động] Quay vòng quay sau mỗi đòn đánh thường. Vòng quay chạy từ 1-7; ra số 7 sẽ nhận thêm cơ hội tấn công. May mắn của bạn nâng tỉ lệ ra số 7. (Từ 15% đến giới hạn 50%)","SK_A_P_0902":"[P] Hành động trước tiên với 1 đòn đánh thường khi trận bắt đầu. Nếu nhiều người tham chiến cùng sở hữu kỹ năng này, ưu tiên theo Nhanh nhẹn cao hơn, rồi EXP cao hơn (hòa thì người chơi thắng).","SK_A_P_0905":"[P] Giác quan +{18}.","SK_B_A_0301":"[Kiếm] Gây sát thương bằng 150% Tấn công cuối cộng Toàn chỉ số x1.","SK_B_A_0302":"[Dao găm] 100(150)% Tấn công cuối + tầng Truy Kích x10(15)%. Nhận 1 tầng Truy Kích sau khi tấn công. (Tối đa 25) Sát thương lên tới 350(525)%.","SK_B_A_0303":"[Đại kiếm] Gây sát thương bằng 180(270)% Tấn công cuối cộng Sức mạnh x2(3) lên toàn bộ kẻ địch trong trận. Lượt của kẻ địch trúng đòn bị trì hoãn +2.","SK_B_A_0304":"[Găng đấm] 100(150)% Tấn công cuối + gây sát thương lên toàn bộ kẻ địch. Phòng thủ của kẻ địch trúng đòn -35(52.5)%. Không thể bị Phản đòn.","SK_B_A_0305":"[Tầm xa] 85(127.5)% Tấn công cuối + bắn 6 phát. Bắn trúng kẻ địch ngẫu nhiên. Mỗi hit giảm 1(1.5) Phòng thủ của kẻ địch trúng đòn. (Cộng dồn vô hạn.)","SK_B_A_0306":"[Pháp khí] 120(180)% Công phép. Gây Nhiễm độc ma lực lên kẻ địch trúng đòn. Kẻ địch mang Nhiễm độc ma lực nhận thêm sát thương phép bằng số tầng Nhiễm độc ma lực x1(1.5)%.","SK_B_A_0501":"[Kiếm, Đại kiếm] Kỹ năng Đòn phủ đầu. Tấn công cuối 1.6(2.4) + Toàn chỉ số x1(1.5).","SK_B_A_0502":"[Khiên, Thương, Găng đấm] Kỹ năng Đòn phủ đầu. Tấn công cuối 1.2(1.8) + Toàn chỉ số x1(1.5).","SK_B_A_0503":"[Tầm xa] Sau khi hạ gục mục tiêu trong một đòn bằng Đòn phủ đầu, Đòn phủ đầu kế tiếp nhận thưởng tấn công 15(22.5)%.","SK_B_A_0505":"[Kiếm, Găng đấm, Dao găm] Sau khi né đòn tấn công của kẻ địch, 30(45)% xác suất gây sát thương bằng Tấn công cuối x1.8(2.7). Luôn trúng chí mạng với Sát thương chí mạng +250(375)%. Nhận ngay lượt hành động.","SK_B_A_0506":"Sau khi né đòn tấn công của kẻ địch, 30% xác suất cấp 'Tăng tốc' cho toàn bộ đồng minh. Từ lần dùng thứ 2 trở đi, cấp cho toàn bộ đồng minh Né tránh +5% cộng dồn.","SK_B_A_0507":"[Tầm xa, Pháp khí] Khi kẻ địch thi triển đòn tấn công phép, 15(22.5)% xác suất hủy đòn đó. Tối đa 5 lần mỗi trận; tốn 5% MP mỗi lần. Khi hủy thành công, gây sát thương bằng MP kẻ địch đã tiêu x10(15) và trì hoãn lượt hành động cơ bản của kẻ địch 1 lượt.","SK_B_A_0801":"[A] Áp Đóng băng lên toàn bộ kẻ địch; chắc chắn ít nhất 1 tên, 35(52.5)% xác suất mỗi tên. Sau đó gây sát thương bằng Công phép x6(9) cho mỗi tầng Đóng băng đã áp. Ngay sau đó, hành quyết kẻ địch có HP dưới 20(30)%. Niệm 8 giây. Dùng được 3 lần mỗi trận. Tốn 25% MP.","SK_B_P_0001":"Khi đánh thường, một Kỵ Sĩ Bóng Tối có chỉ số giống hệt bạn tung thêm 1 đòn đánh thường.","SK_B_P_0301":"Khi trang bị [Khiên]: gây sát thương bằng Phòng thủ x6(9) lên toàn bộ kẻ địch. Cấp cho toàn bộ đồng minh Khiên Aegis cộng dồn bằng 5(7.5)% HP của bạn.","SK_B_P_0302":"[Thương] Sát thương cố định bằng (Sức mạnh+Phép lực) x5(7.5).","SK_B_P_0303":"Mọi hiệu ứng Tinh linh +30(45)%.","SK_B_P_0304":"Giành trước 2 lượt khi vào trận.","SK_B_P_0305":"Chính xác, Tỉ lệ chí mạng và Sát thương chí mạng +25(37.5)%.","SK_B_P_0306":"Né tránh +45(67.5)%.","SK_B_P_0307":"MP tối đa +15(22.5)%.","SK_B_P_0308":"[Khiên] HP tối đa +35(52.5)%.","SK_B_P_0701":"[P] Thiên tài bẩm sinh. Toàn chỉ số +7(10.5)","SK_B_P_0702":"[P] Cộng 10(15)% chỉ số cao nhất của bạn vào các chỉ số còn lại.","SK_B_P_0705":"[P] Chính xác +25(37.5)%. Mỗi đòn đánh trượt cấp thêm Chính xác +5(7.5)%. (Cộng dồn vô hạn)","SK_B_P_0706":"Nhận Nhanh nhẹn bằng Lv người chơi x1(1.5).","SK_B_P_0707":"Nhận Tấn công và Công phép bằng Lv người chơi x1(1.5).","SK_B_P_0708":"Nhận May mắn và Giác quan bằng Lv người chơi x0.5(0.75).","SK_B_P_0709":"Nhận Trí tuệ bằng Lv người chơi x1(1.5).","SK_B_P_0711":"[P] Khi có đồng minh HP từ 10(15)% trở xuống, hồi 10(15)% HP cho đồng minh có HP thấp nhất (không cần niệm). 5 lần mỗi trận.","SK_B_P_0712":"[P] Bẩm sinh mang sức mạnh hủy diệt. Sức mạnh tăng 3(4.5) mỗi 4 cấp người chơi. Bị động.","SK_B_P_0801":"Tăng 35(52.5)% sát thương cuối của phép thuộc tính Băng.","SK_B_P_0802":"[P] Khi áp Đóng băng, thêm 1 tầng bổ sung.","SK_B_P_0905":"[P] Giác quan +{15}.","SK_C_A_0301":"[Kiếm, Đại kiếm] 145% Tấn công cuối. Đánh cùng lúc tối đa 3 kẻ địch.","SK_C_A_0302":"[Dao găm] 120% Tấn công cuối. Sau khi tấn công, 15% xác suất nhận thêm cơ hội tấn công.","SK_C_A_0303":"[Thương] 125% Tấn công cuối. 15% lượng sát thương được tính là sát thương cố định. Giảm 25% Phòng thủ của kẻ địch trúng đòn.","SK_C_A_0304":"[Găng đấm] 90% Tấn công cuối x2 hit. Đấm luân phiên tay trái và tay phải. Không thể bị Phản đòn.","SK_C_A_0305":"[Tầm xa] 135% Tấn công cuối. Gây sát thương cộng thêm bằng Sức mạnh +1.5. (Cộng gộp)","SK_C_A_0306":"[Khiên] 150% Tấn công cuối cộng thêm sát thương cố định bằng Phòng thủ x5.","SK_C_A_0307":"[Tầm xa] 120% Tấn công cuối x2 hit. Nếu hit đầu tiên hạ gục kẻ địch, sát thương thừa chuyển sang kẻ địch khác.","SK_C_A_0308":"[Pháp khí] 85% Công phép. Gây 'Nhiễm độc ma lực' lên kẻ địch trúng đòn. Kẻ địch bị nhiễm độc ma lực nhận sát thương mỗi giây (10 lượt) theo chỉ số Phép lực x1 của người thi triển. (Năm pháp sư đánh với 100 sẽ gây 500 sát thương mỗi giây. Mỗi người chơi chỉ tích lũy 1 lần.)","SK_C_A_0501":"[Dao găm] Kỹ năng Đòn phủ đầu. Tấn công cuối 1.5. Thưởng bỏ qua 25% giảm sát thương (cộng gộp).","SK_C_A_0502":"Nếu bị tấn công trước khi bạn hành động, nhận Tăng Lượt +3 (3 lượt được dùng trước).","SK_C_A_0504":"[Kiếm, Đại kiếm, Găng đấm, Thương, Dao găm] 1 lần mỗi trận, 10% xác suất kích hoạt khi bạn né đòn tấn công của kẻ địch. Gây sát thương bằng 150% Tấn công cuối với chí mạng chắc chắn, tự cấp 'Tăng tốc' (Né tránh +25%, Chính xác +25%, 30 lượt) và nhận ngay lượt hành động.","SK_C_A_0505":"[Đặc biệt] Yêu cầu trong tổ đội có [Khiên] cùng với [Tầm xa] hoặc [Pháp khí]; kích hoạt tối đa 3 lần mỗi trận. Khi bạn trở thành mục tiêu, 60% xác suất bỏ qua sát thương đó, và mọi đồng minh trang bị [Tầm xa] hoặc [Pháp khí] tấn công toàn bộ kẻ địch với sát thương bằng (Tấn công cuối + Công phép) x2.","SK_C_A_0506":"Xác suất Phản đòn +2%. Khi Phản đòn gây sát thương: sát thương cuối +10%, Chính xác +5%, Tỉ lệ chí mạng +5%.","SK_C_A_0801":"[A] Triệu hồi Cầu Sương Giá ra chiến trường. Quả cầu ở cạnh người chơi, liên tục phát huy sức mạnh. HP Cầu Sương Giá = Phép lực người chơi x15 + Lv x100. Mỗi 2 giây, gây sát thương theo thời gian bằng Phép lực người thi triển x1 lên toàn bộ kẻ địch. Kẻ địch trúng đòn có 25% xác suất bị 'Đóng băng'. [Pháp khí] Khi người chơi bị đánh, Cầu Sương Giá đỡ đòn trước. Kẻ tấn công nhận 1 tầng 'Đóng băng' trước khi tính sát thương. Mỗi khi trên chiến trường cộng thêm một tầng Đóng băng, bạn nhận khiên bằng Ma lực x0,1. Chỉ triệu hồi được 1 quả cầu mỗi trận. Nếu bị phá hủy, có thể dùng lại sau 15 giây.","SK_C_A_0802":"[A] Gây 2,800 sát thương lên toàn bộ kẻ địch. Áp 1 Đóng băng. Tỉ lệ chí mạng 25%.","SK_C_E_0503":"Khi tung Đòn phủ đầu, Chính xác +20%.","SK_C_P_0001":"Bị động kích hoạt. Khi bị tấn công, tiêu hao 10% MP hiện tại để giảm lượng sát thương phải nhận đúng bằng lượng đó.","SK_C_P_0212":"Khi đánh thường, một 'Bóng Tối' tung đòn bồi gây 15% lượng sát thương của đòn đánh.","SK_C_P_0301":"[Kiếm, Dao găm, Găng đấm] Kẻ địch trúng đòn liên tục nhận sát thương bằng Nhanh nhẹn x0.1 mỗi 3 giây (30 lượt).","SK_C_P_0302":"Khi trang bị [Kiếm], sát thương đòn đánh thường và kỹ năng +20%. Nhận Chính xác +25%.","SK_C_P_0303":"Khi trang bị [Găng đấm], sát thương kỹ năng +80%. Thời gian niệm -1 lượt.","SK_C_P_0304":"Khi trang bị [Đại kiếm], tăng Sức mạnh bằng Lv người chơi x1.","SK_C_P_0305":"Khi trang bị [Khiên], tăng Phòng thủ bằng Sức mạnh x5. Sát thương phải chịu -35%. Nhận *Khiêu khích*. Bỏ qua sát thương thấp hơn hoặc bằng Phòng thủ của bạn. (Sát thương bị bỏ qua = 1 sát thương)","SK_C_P_0306":"Khi trang bị [Dao găm], tăng Nhanh nhẹn bằng Lv người chơi x1.","SK_C_P_0307":"Khi trang bị [Thương], nhận sát thương cuối +15% và giảm sát thương +15%.","SK_C_P_0308":"Khi trang bị vũ khí [Tầm xa], Tấn công cuối +15%.","SK_C_P_0309":"Khi trang bị [Pháp khí], hồi ngay 10% lượng MP đã tiêu hao. Sát thương kỹ năng +30%.","SK_C_P_0701":"[P] May mắn +30","SK_C_P_0702":"[A] Cấp cho toàn bộ đồng minh khiên bằng Phép lực x3 + HP người thi triển x0.3. Niệm 3 giây. MP 60.","SK_C_P_0703":"[A] Tiêu hết toàn bộ khiên để gây sát thương đúng bằng lượng khiên. Niệm 1 giây. MP 25.","SK_C_P_0706":"[P] Chỉ số cao nhất của bạn +35.","SK_C_P_0707":"[A] Nếu HP tối đa của kẻ địch cao hơn của bạn, gây sát thương vật lý bằng phần chênh lệch HP tối đa x0.5. (Giới hạn sát thương tối đa = Toàn chỉ số x8). MP 50.","SK_C_P_0709":"[P] Nhận Né tránh bằng Lv người chơi x0.5%. (50% ở cấp 99)","SK_C_P_0712":"[P] Hồi 3% lượng sát thương bạn gây ra bằng phép.","SK_C_P_0801":"Tăng 7% sát thương cuối của phép thuộc tính Đóng băng và 20% thời gian duy trì Đóng băng.","SK_C_P_0802":"Khi trận bắt đầu, áp Đóng băng (E) lên toàn bộ kẻ địch với 15% xác suất mỗi tên. Kỹ năng Đóng băng tốn ít hơn 2% MP.","SK_C_P_0803":"[P] Tỉ lệ chí mạng +25% với đòn tấn công thuộc tính Băng.","SK_C_P_0804":"[P] [Thương] Đòn đánh thường và đòn kỹ năng thuộc tính Băng gây thêm 35% sát thương phép. Sát thương phải chịu -10%.","SK_C_P_0805":"[P] Giảm 25% sát thương phép phải nhận. Mỗi lần hiệu ứng giảm kích hoạt, mức giảm hạ 1%p, tối thiểu còn 1%. 25% xác suất kháng Đóng băng.","SK_C_P_0806":"[P] Tăng {25}% lượng EXP nhận được.","SK_C_P_0905":"[P] Giác quan +{12}.","SK_D_A_0001":"[A] Bắn một mũi tên băng vào 1 kẻ địch, gây sát thương bằng 280% Công phép. Niệm 5 giây. Tốn 15% MP.","SK_D_A_0301":"[Kiếm, Đại kiếm] 125% Tấn công cuối. Đánh cùng lúc tối đa 3 kẻ địch.","SK_D_A_0302":"[Găng đấm] 115% Tấn công cuối. Sát thương cộng thêm bằng 3% HP hiện tại của kẻ địch. (Tối đa 1200)","SK_D_A_0303":"[Tầm xa] 110% Tấn công cuối. Giảm 10% thời gian niệm sau đòn (quyền ưu tiên lượt). Gây *Vết thương* lên kẻ địch trúng đòn. Mọi đòn tấn công vật lý gây thêm 5% sát thương lên kẻ địch đang mang vết thương.","SK_D_A_0304":"[Dao găm] 55% Tấn công cuối x2 hit. Tung hai đòn đánh thường. Hit thứ hai bỏ qua 35% Phòng thủ.","SK_D_A_0305":"[Khiên] 110% Tấn công cuối. Gây sát thương cộng thêm bằng Phòng thủ x3. Đánh cùng lúc tối đa 3 kẻ địch. Giảm 25% Phòng thủ của kẻ địch trúng đòn.","SK_D_A_0306":"[Thương] 120% Tấn công cuối. Kẻ địch trúng đòn bị Chính xác -25% và Tốc độ đánh/Tốc độ niệm -25%. (Không cộng dồn)","SK_D_A_0307":"[Pháp khí] 115% Công phép. Kẻ địch trúng đòn bị Kháng phép -50%.","SK_D_A_0501":"[Tầm xa] Kỹ năng Đòn phủ đầu. Tấn công cuối 1.4. Áp dụng thưởng Tỉ lệ chí mạng +15%.","SK_D_A_0503":"Khi Đòn phủ đầu thành công: Trí tuệ +10 trong trận.","SK_D_A_0504":"Khi Đòn phủ đầu thành công: May mắn và Giác quan +15 trong trận.","SK_D_A_0505":"Đòn phủ đầu bỏ qua 20% Phòng thủ :"Bertahan Teguh","SK_E_P_0905":"Penjelajah","SK_F_A_0301":"Ayunan","SK_F_A_0501":"Terjang","SK_F_A_0504":"Tangkis","SK_F_A_0505":"Penangkis","SK_F_A_0506":"Tepisan","SK_F_A_0507":"Manuver Menghindar","SK_F_A_0509":"Serangan Balik","SK_F_A_0701":"Penghancur Perisai","SK_F_A_0702":"Sabetan Tarik","SK_F_A_0703":"Bola Api","SK_F_A_0704":"Kilat Petir","SK_F_A_0801":"Bilah Beku","SK_F_A_0802":"Tombak Es","SK_F_A_0803":"Pecahan Beku","SK_F_A_0804":"Roh Angin","SK_F_A_0805":"Panggil Flame","SK_F_A_0806":"Roh Air","SK_F_A_0807":"Roh Bumi","SK_F_E_0503":"Kenekatan","SK_F_P_0001":"Fokus","SK_F_P_0002":"Kewaspadaan","SK_F_P_0003":"Seni Bela Diri","SK_F_P_0004":"Seni Pedang Besar","SK_F_P_0005":"Pemulihan Tempur","SK_F_P_0006":"Serangan Kombo","SK_F_P_0007":"Pemulihan Mana","SK_F_P_0701":"Penempatan Sempurna","SK_F_P_0702":"Bola Resonansi","SK_F_P_0703":"Kecepatan Bawaan","SK_F_P_0704":"Buah Latihan","SK_F_P_0705":"Daya Tahan","SK_F_P_0706":"Tekad Teguh","SK_F_P_0707":"Semanggi Daun Tiga","SK_F_P_0708":"Visualisasi","SK_F_P_0709":"Perwujudan","SK_F_P_0711":"Pembongkaran","SK_F_P_0712":"Penetapan Target","SK_F_P_0714":"Zona Terlarang","SK_F_P_0716":"Pukulan Kuat","SK_F_P_0719":"Tebasan Beruntun","SK_F_P_0720":"Bakat Pedang","SK_F_P_0722":"Bakat Pembunuh","SK_F_P_0723":"Serangan Balik","SK_F_P_0801":"Afinitas Dingin","SK_F_P_0802":"Penguasaan Beku","SK_F_P_0803":"Pertumbuhan Luar Biasa","SK_F_P_0904":"Kolektor Pecahan","SK_F_P_0905":"Penjelajah","SK_SS_P_0302":"Ilmu Pedang Ganda","SK_SS_P_0303":"Pelanggar Aturan","SK_SS_P_0304":"Pemecah Mantra","SK_SS_P_0301":"Kuras Mana","SK_SS_A_0501":"Oportunis","SK_S_P_0971":"Seni Bertarung Rubah"},"desc":{"SK_EX_A_0001":"Pasif. Memberi dirimu 'Bulan Hitam'. Musuh yang menyerangmu mengalami Akurasi -25%, sementara seranganmu memberikan kerusakan bonus sebesar Serangan Sihir x3.","SK_EX_A_0002":"Aktif elemen cahaya.\nMulai casting begitu pertempuran dimulai, pada casting terpisah miliknya sendiri. Setelah 20 giliran, menyerang semua musuh dengan serangan sihir sebesar seluruh kerusakan yang kamu berikan selama pertempuran. Sesudahnya MP-mu menjadi 0, lalu pulih 10(15)% per giliran selama 10 giliran.","SK_EX_A_0006":"[Pedang] Kelopak bunga jatuh bagai hujan. Serangan dasar mengenai 3 musuh acak sekaligus, masing-masing menerima kerusakan Serangan Akhir x3(4.5) + Semua Stat x3(4.5). Setiap serangan yang mengenai menambah 10 tumpukan Mekar Penuh pada target; pada 60 tumpukan target mekar dan menerima kerusakan sebesar 30% HP maksimalnya (dikurangi DEF). Jika saat itu HP target 30% dari HP maksimal atau kurang, target dieksekusi dengan mengabaikan DEF. Kerusakan mekar tidak dapat melebihi 30 kali HP maksimalmu dan tidak dapat kritis.","SK_EX_A_0007":"[P] Saat [Pedang], [Belati], atau [Pedang Besar] terpasang: serangan dasar menjadi elemen petir. Akurasi +25(37.5)%, Kecepatan serang +80(120)%, Kerusakan kritis +80(120)%.","SK_EX_A_0012":"Aktif elemen kegelapan (instan).\nSetelah dipakai, memulai channeling 15 giliran (tidak bisa beraksi lain). Setiap giliran memberikan kerusakan MAG x N (N = giliran yang berlalu) ke semua musuh dan mengonsumsi 6% mana per giliran. Channeling berakhir lebih awal jika mana habis.\nSaat channeling selesai, hingga pertempuran berakhir serangan dasarmu mendapat kerusakan bonus MAG x8 dan memukul dua kali.","SK_EX_A_0015":"[P] Saat [Pedang], [Belati], atau [Pedang Besar] terpasang: serangan dasar selalu mengenai, dan skill dengan senjata utama [Pedang], [Belati], atau [Pedang Besar] memberikan kerusakan 600(900)% lebih besar.","SK_EX_A_0501":"[Semua Senjata] Skill Serangan Pendahuluan. Lv x100(150) + Semua Stat x2(3). Konsumsi MP 3%.","SK_EX_A_0502":"[Jarak Jauh] Kerusakan tetap Serangan Akhir x120(180)%. Musuh yang terkena Serangan Pendahuluanmu di awal pertempuran ditandai 'Penglihatan Masa Depan' dan menerima kerusakan yang sama berulang setiap detik.","SK_EX_A_0503":"[Semua Senjata] Skill Serangan Pendahuluan. Semua Stat x3. Menyerang monster liar memasuki pertempuran melawan 1-6 monster liar tersebut. Saat pertempuran dimulai, memberikan kerusakan Semua Stat x3 ke semua musuh.","SK_EX_A_0504":"Serangan Pendahuluan pada monster liar langsung memenangkan pertempuran. Saat pertempuran dimulai, memberi semua sekutu Evasi +25%.","SK_EX_A_0505":"Saat kamu menjadi target, 100% peluang memberikan kerusakan ke penyerang sebesar kerusakan yang diterima. Kamu lalu memulihkan 90(135)% dari kerusakan yang diterima.","SK_EX_P_0303":"[P] Setelah serangan dasar, jika target selamat, semua jeda sebelum/sesudah hilang dan kamu otomatis melakukan serangan dasar lagi 1 giliran kemudian tanpa memilih aksi. Berulang sekali per giliran hingga target tumbang, lalu pilihan aksi dan interval aksi semula kembali.","SK_EX_P_0304":"[P] Setiap kali kamu bertindak, MP maks naik 1(1.5)% (berlipat majemuk). Bersamaan itu memberikan kerusakan sihir berkelanjutan ke semua musuh dengan kekuatan setara MP maks yang telah naik. Kerusakan ini dipengaruhi Pertahanan Sihir dan reduksi kerusakan target.","SK_EX_P_0701":"Monster juga memiliki stat. Menambahkan 10% dari masing-masing 6 stat musuh ke stat milikmu. Pada level 100, menambahkan 110% stat yang dimiliki monster ke stat milikmu.","SK_EX_P_0801":"[P] Saat pertempuran dimulai, menandai semua musuh dengan 'Kesudahan'. Setelah 20 detik, memberikan kerusakan Lv x100 + MAG x70 ke semua musuh dan memberi stun 3 dtk. Terhadap musuh yang terkena 'Beku', kerusakannya menjadi kerusakan tetap.","SK_EX_P_0802":"Memanggil 3 Bola Beku saat pertempuran dimulai, mengabaikan batas 1 bola. Kamu memulai pertempuran dengan MP 0%.","SK_SSS_P_0905":"[P] Indra meningkat {27}.","SK_SS_P_0905":"[P] Indra meningkat {24}.","SK_SS_P_0951":"[P] Saat HP musuh tersisa 1, beri dirimu 3 kesempatan serangan dasar. Batas ini naik 5% setiap Lv Penghinaan naik; pada Penghinaan Lv5, kamu mendapat 3 kesempatan serangan dasar saat HP musuh tersisa 25% atau kurang.","SK_A_A_0801":"Memanggil Ratu Beku ke pemain. Ia bertarung di sisimu, casting sihir elemen Beku acak rank F-A setiap 2 giliran aksimu. Statnya 75(112.5)% dari statmu. Ratu Beku tidak bisa dihilangkan. Casting 3(2) dtk, konsumsi MP 25(17)%. Tidak bisa dipanggil dua kali.","SK_EX_A_0003":"[Pedang] Aktif berkelanjutan (instan).\nSetelah dipakai, selama 20 giliran satu serangan meteor sebesar STR x20(30) mengenai satu musuh acak setiap giliran.\nKonsumsi 3% mana per giliran; channeling langsung berakhir jika mana habis, terkena stun, atau kamu memilih skill lain.","SK_EX_A_0017":"[Pedang]\nSaat musuh melakukan serangan dasar, 50(75)% peluang membatalkannya dan memberikan kerusakan Semua Stat x10(15) ke musuh. Cooldown internal 3 giliran.","SK_S_A_0501":"Serangan Pendahuluan dari posisi DPS jarak dekat memberikan kerusakan bonus (STR+AGI) x3(4.5).","SK_S_A_0502":"[Pedang, Belati, Pedang Besar, Tombak] Sekali per pertempuran, saat kamu menjadi target, 5(7.5)% peluang mengurangi kerusakan menjadi 1 dan memberikan kerusakan Serangan Akhir x10(15) ke musuh.","SK_S_A_0801":"[A] [Fase] Casting terus-menerus selama 15 detik. HP-mu menjadi 1 selama casting. Selama casting berlanjut, menyerang musuh acak dengan 6(9) Pecahan Beku setiap 3 giliran. (Casting terputus jika Fase dihapus, buff dihilangkan, atau kamu terkena stun.) Casting 2 dtk.","SK_S_A_0902":"[A] Memberikan kerusakan sebesar {10}% HP maks ke semua musuh. (Kerusakan maks per hit = Semua Stat x 50)","SK_S_P_0502":"[Pedang, Belati, Pedang Besar] Meningkatkan efek Penguasaan Pedang sebesar 50(75)%. Akurasi, Peluang kritis, dan Kerusakan kritis +25(37.5)%. Mendapat tambahan 2(3)x serangan senjata saat Serangan Akhir dihitung.","SK_S_P_0801":"[P] Serangan Sihir +50(75)%, MP Maks +30(45)%","SK_S_P_0905":"[P] Indra meningkat {21}.","SK_S_P_0951":"[P] Membunuh musuh dengan serangan Counter memberi kesempatan serangan tambahan.","SK_S_P_0962":"[P] Membunuh musuh memberi 1 kesempatan serangan tambahan.","SK_A_A_0301":"[Pedang] Menyerang semua musuh dua kali. Kerusakan 150(225)% Serangan Akhir ditambah Semua Stat x1(1.5).","SK_A_A_0302":"[Pedang, Belati] Memberikan kerusakan 100(150)% Serangan Akhir ditambah AGI x12~18(18~27). Kamu kaku selama 3 giliran setelah menyerang.","SK_A_A_0303":"[Belati] 100(150)% Serangan Akhir. Kerusakan kritis 500(750)%.","SK_A_A_0304":"[Pedang Besar] Menyerang hingga 6 musuh sekaligus. Kerusakan 220(330)% Serangan Akhir ditambah STR x5(7.5). Mengurangi Pertahanan musuh yang terkena sebesar 15(22.5)%. (Diperbarui, tidak bertumpuk)","SK_A_A_0305":"[Kepalan Besi] Menyerang semua musuh satu kali. Menghancurkan seluruh pelindung target, lalu memberikan kerusakan 220(330)% Serangan Akhir. Bisa ditahan dengan Counter.","SK_A_A_0306":"[Jarak Jauh] Melepaskan nyala api terakhirmu. 320(480)% Serangan Akhir. Jeda pemulihan 5 giliran. Kerusakan akhir meningkat sebesar MP yang hilang dari maksimum. (+1(1.5)% per 1% yang hilang)","SK_A_A_0307":"[Alat Sihir] 120(180)% Serangan Sihir. Memberikan Racun Mana. Memberikan kerusakan yang sama ke setiap musuh yang teracuni mana. Jika serangan ini membunuh musuh, pulihkan MP-mu sebesar sisa MP musuh tersebut.","SK_A_A_0501":"[Pedang] Skill Serangan Pendahuluan. Serangan Akhir 1.8(2.7) + Semua Stat x1(1.5). Konsumsi MP 3%. (Aura pedang)","SK_A_A_0504":"[Tombak] Skill Serangan Pendahuluan. Kerusakan tetap (STR+MAG) x3.5(5.25); selalu mengenai sebagai kritis. Konsumsi MP 15%. (Lemparan tombak)","SK_A_A_0506":"[Perisai] Skill Serangan Pendahuluan. Kerusakan Pertahanan x5(7.5). Konsumsi MP 4%. (Lemparan batu)","SK_A_A_0508":"[Perisai] Saat menjadi target, langsung pulihkan 2(3)% HP maks. Jika kamu sekutu terakhir yang bertahan, setiap serangan yang kamu terima juga memberikan kerusakan ke semua musuh sebesar HP yang kamu pulihkan.","SK_A_A_0509":"[Tombak, Alat Sihir] Saat sekutu menjadi target dan HP sekutu itu 15(22.5)% atau kurang, langsung pulihkan HP-nya sebesar LUK-mu x8(12). Konsumsi 8% MP per sekutu; tidak terpicu tanpa MP yang bisa dikeluarkan. Kerusakan yang diterima sekutu yang dipulihkan berkurang 25(37.5)% selama pertempuran.","SK_A_A_0510":"Evasi +30(45)%. Saat berhasil menghindar, kejar penyerang dan berikan kerusakan sebesar 80(120)% Serangan Akhirmu.","SK_A_A_0511":"Saat menjadi target skill atau serangan sihir, mengurangi kerusakan itu sebesar 80(120)%. Lalu mengurangi stat dasar penyerang sebesar 30(45)% hingga pertempuran berakhir, dan kamu mendapat jumlah tersebut untuk dirimu.","SK_A_A_0802":"[A] [Fase] Bertahan 10 dtk. Langsung, dan setiap 2 dtk, memberikan 'Beku' ke semua musuh. 'Beku' juga memberikan Akurasi -35(52.5)%.","SK_A_E_0507":"Saat Serangan Pendahuluan, menerapkan efek Ruptur lebih dulu pada musuh. (Kerusakan yang diterima +25(37.5)%)","SK_A_P_0001":"Meningkatkan efisiensi skill elemen Es sebesar 30(45)%.","SK_A_P_0301":"[Perisai] Meningkatkan Pertahanan semua sekutu (kecuali milikmu) sebesar Pertahananmu x0.1(0.15). Selain itu memberi semua sekutu Pelindung Aegis yang bertumpuk sebesar 7(10.5)% dari HP-mu. Lalu memberikan kerusakan ke satu musuh sebesar total pelindung sekutu yang dibuat x0.5(0.75). (Batas kerusakan maks = Lv Pemain x300(450))","SK_A_P_0302":"[Tombak] Memberikan kerusakan (STR + MAG) x10(15) ke 2 musuh.","SK_A_P_0303":"Semua efek Roh +70(105)%. Memanggil pixie yang ikut bertarung. Pixie sesekali menahan skill menggantikanmu.","SK_A_P_0304":"Saat mendapat kesempatan serangan tambahan, serangan dasar atau skill berikutnya mengabaikan Pertahanan musuh.","SK_A_P_0305":"Mengamankan +1 giliran lebih dulu saat memasuki pertempuran.","SK_A_P_0306":"Saat Serangan Pendahuluan: Peluang kritis +25(37.5)%, Akurasi +25(37.5)%.","SK_A_P_0307":"Akurasi +45(67.5)%. Kerusakan sihir yang diterima -15(22.5)%.","SK_A_P_0308":"Saat memasuki Gerbang, MP maks meningkat sementara sebesar 50(75)% hingga Gerbang berakhir. (Karena MP maks, dimulai dalam keadaan penuh.)","SK_A_P_0701":"Kecerdasan +50(75)","SK_A_P_0702":"[P] Setiap kali MP turun ke 20(30) atau kurang, pulihkan 10(15)% MP. (Bisa dinonaktifkan)","SK_A_P_0801":"[P] MP maks naik sebesar Lv Pemain x60(90). Setiap 1% MP yang dikeluarkan meningkatkan kerusakan skill elemen Beku sebesar 1(1.5)%.","SK_A_P_0802":"[P] Giliran musuh +1. Kecepatan casting sekutu +30(45)%.","SK_A_P_0803":"[P] Selama pertempuran, meningkatkan stat STR dan MAG sekutu sebesar Lv x1(1.5) dan mengurangi milik musuh sebesar jumlah yang sama. (Tidak bertumpuk)","SK_A_P_0901":"[Pasif] Memutar roulette setelah setiap serangan dasar. Roulette berjalan 1-7; mendapat angka 7 memberi kesempatan serangan tambahan. LUK-mu menaikkan peluang munculnya 7. (Dari 15% hingga batas 50%)","SK_A_P_0902":"[P] Bertindak lebih dulu dengan satu serangan dasar saat pertempuran dimulai. Jika beberapa petarung punya skill ini, prioritas ke AGI lebih tinggi, lalu EXP lebih tinggi (pemain menang jika seri).","SK_A_P_0905":"[P] Indra meningkat {18}.","SK_B_A_0301":"[Pedang] Memberikan kerusakan 150% Serangan Akhir ditambah Semua Stat x1.","SK_B_A_0302":"[Belati] 100(150)% Serangan Akhir + stack Pengejaran x10(15)%. Dapatkan 1 stack Pengejaran setelah menyerang. (Maks 25) Kerusakan hingga 350(525)%.","SK_B_A_0303":"[Pedang Besar] Memberikan kerusakan 180(270)% Serangan Akhir ditambah STR x2(3) ke semua musuh dalam pertempuran. Giliran musuh yang terkena ditunda +2.","SK_B_A_0304":"[Kepalan Besi] 100(150)% Serangan Akhir + kerusakan ke semua musuh. Pertahanan musuh yang terkena -35(52.5)%. Tidak bisa di-Counter.","SK_B_A_0305":"[Jarak Jauh] 85(127.5)% Serangan Akhir + menembak 6 kali. Mengenai musuh acak. Setiap hit mengurangi Pertahanan musuh yang terkena sebesar 1(1.5). (Bertumpuk tanpa batas.)","SK_B_A_0306":"[Alat Sihir] 120(180)% Serangan Sihir. Memberikan Racun Mana pada musuh yang terkena. Musuh dengan Racun Mana menerima kerusakan sihir bonus sebesar stack Racun Mana x1(1.5)%.","SK_B_A_0501":"[Pedang, Pedang Besar] Skill Serangan Pendahuluan. Serangan Akhir 1.6(2.4) + Semua Stat x1(1.5).","SK_B_A_0502":"[Perisai, Tombak, Kepalan Besi] Skill Serangan Pendahuluan. Serangan Akhir 1.2(1.8) + Semua Stat x1(1.5).","SK_B_A_0503":"[Jarak Jauh] Setelah menumbangkan target sekali pukul dengan Serangan Pendahuluan, Serangan Pendahuluan berikutnya mendapat bonus serangan 15(22.5)%.","SK_B_A_0505":"[Pedang, Kepalan Besi, Belati] Setelah menghindari serangan musuh, 30(45)% peluang memberikan kerusakan Serangan Akhir x1.8(2.7). Selalu mengenai sebagai kritis dengan Kerusakan kritis +250(375)%. Dapatkan aksi segera.","SK_B_A_0506":"Setelah menghindari serangan musuh, 30% peluang memberi 'Percepatan' ke semua sekutu. Mulai penggunaan ke-2, memberi semua sekutu Evasi +5% yang bertumpuk.","SK_B_A_0507":"[Jarak Jauh, Alat Sihir] Saat musuh melakukan casting serangan sihir, 15(22.5)% peluang membatalkannya. Hingga 5 kali per pertempuran; konsumsi 5% MP per penggunaan. Saat batal, memberikan kerusakan sebesar MP yang dikeluarkan musuh x10(15) dan menunda giliran aksi dasar musuh sebanyak 1.","SK_B_A_0801":"[A] Menerapkan Beku ke semua musuh; minimal 1 dijamin, peluang 35(52.5)% masing-masing. Lalu memberikan kerusakan Serangan Sihir x6(9) per stack Beku yang diterapkan. Segera setelahnya, mengeksekusi musuh dengan HP di bawah 20(30)%. Casting 8 dtk. Bisa dipakai 3 kali per pertempuran. Konsumsi MP 25%.","SK_B_P_0001":"Saat serangan dasar, seorang Ksatria Bayangan dengan stat yang sama denganmu melancarkan 1 serangan dasar tambahan.","SK_B_P_0301":"Saat [Perisai] terpasang: memberikan kerusakan Pertahanan x6(9) ke semua musuh. Memberi semua sekutu Pelindung Aegis yang bertumpuk sebesar 5(7.5)% dari HP-mu.","SK_B_P_0302":"[Tombak] Kerusakan tetap sebesar (STR+MAG) x5(7.5).","SK_B_P_0303":"Semua efek Roh +30(45)%.","SK_B_P_0304":"Mengamankan 2 giliran lebih dulu saat memasuki pertempuran.","SK_B_P_0305":"Akurasi, Peluang kritis, dan Kerusakan kritis +25(37.5)%.","SK_B_P_0306":"Evasi +45(67.5)%.","SK_B_P_0307":"MP Maks +15(22.5)%.","SK_B_P_0308":"[Perisai] HP Maks +35(52.5)%.","SK_B_P_0701":"[P] Jenius sejak lahir. Semua Stat +7(10.5)","SK_B_P_0702":"[P] Menambahkan 10(15)% dari stat tertinggimu ke stat lainnya.","SK_B_P_0705":"[P] Akurasi +25(37.5)%. Setiap serangan yang meleset memberi tambahan Akurasi +5(7.5)%. (Bertumpuk tanpa batas)","SK_B_P_0706":"Dapatkan AGI sebesar Lv Pemain x1(1.5).","SK_B_P_0707":"Dapatkan Serangan dan Serangan Sihir sebesar Lv Pemain x1(1.5).","SK_B_P_0708":"Dapatkan LUK dan SEN sebesar Lv Pemain x0.5(0.75).","SK_B_P_0709":"Dapatkan INT sebesar Lv Pemain x1(1.5).","SK_B_P_0711":"[P] Saat ada sekutu dengan HP 10(15)% atau kurang, pulihkan HP sekutu dengan HP terendah sebesar 10(15)% (tanpa casting). 5 kali per pertempuran.","SK_B_P_0712":"[P] Terlahir dengan kekuatan penghancur. STR meningkat 3(4.5) setiap 4 level pemain. Pasif.","SK_B_P_0801":"Meningkatkan kerusakan akhir sihir elemen Es sebesar 35(52.5)%.","SK_B_P_0802":"[P] Menerapkan Beku menambah 1 stack ekstra.","SK_B_P_0905":"[P] Indra meningkat {15}.","SK_C_A_0301":"[Pedang, Pedang Besar] 145% Serangan Akhir. Menyerang hingga 3 musuh sekaligus.","SK_C_A_0302":"[Belati] 120% Serangan Akhir. 15% peluang mendapat kesempatan serangan tambahan setelah menyerang.","SK_C_A_0303":"[Tombak] 125% Serangan Akhir. 15% dari kerusakan diterapkan sebagai kerusakan tetap. Mengurangi Pertahanan musuh yang terkena sebesar 25%.","SK_C_A_0304":"[Kepalan Besi] 90% Serangan Akhir x2 hit. Memukul dengan kepalan kiri dan kanan bergantian. Tidak bisa di-Counter.","SK_C_A_0305":"[Jarak Jauh] 135% Serangan Akhir. Memberikan kerusakan bonus sebesar STR +1,5. (Aditif)","SK_C_A_0306":"[Perisai] 150% Serangan Akhir ditambah kerusakan tetap bonus sebesar Pertahanan x5.","SK_C_A_0307":"[Jarak Jauh] 120% Serangan Akhir x2 hit. Jika hit pertama membunuh musuh, sisa kerusakan dialihkan ke musuh lain.","SK_C_A_0308":"[Alat Sihir] 85% Serangan Sihir. Memberikan 'Racun Mana' pada musuh yang terkena. Musuh yang teracuni mana menerima kerusakan setiap detik (10 giliran) sebanding dengan stat MAG pengguna x1. (Lima penyihir yang memukul dengan 100 memberikan 500 kerusakan per detik. Hanya terakumulasi sekali per pemain.)","SK_C_A_0501":"[Belati] Skill Serangan Pendahuluan. Serangan Akhir 1.5. Bonus mengabaikan 25% reduksi kerusakan (aditif).","SK_C_A_0502":"Jika kamu diserang sebelum bertindak, dapatkan Turn Boost +3 (3 giliran yang dipakai lebih dulu).","SK_C_A_0504":"[Pedang, Pedang Besar, Kepalan Besi, Tombak, Belati] Sekali per pertempuran, 10% peluang terpicu saat kamu menghindari serangan musuh. Memberikan kerusakan 150% Serangan Akhir sebagai kritis pasti, memberimu 'Percepatan' (Evasi +25%, Akurasi +25%, 30 giliran), dan mendapat aksi segera.","SK_C_A_0505":"[Khusus] Membutuhkan pengguna [Perisai] plus [Jarak Jauh] atau [Alat Sihir] dalam party; terpicu hingga 3 kali per pertempuran. Saat kamu menjadi target, 60% peluang mengabaikan kerusakan, dan setiap sekutu yang memakai [Jarak Jauh] atau [Alat Sihir] menyerang semua musuh dengan kerusakan (Serangan Akhir + Serangan Sihir) x2.","SK_C_A_0506":"Peluang Counter +2%. Saat Counter memberikan kerusakan: kerusakan akhir +10%, Akurasi +5%, Peluang kritis +5%.","SK_C_A_0801":"[A] Memanggil Bola Beku ke medan tempur. Bola ini tetap di samping pemain, memancarkan kekuatan berkelanjutan. HP Bola Beku = MAG Pemain x15 + Lv x100. Setiap 2 detik, memberikan kerusakan berkelanjutan MAG pengguna x1 ke semua musuh. Musuh yang terkena punya 25% peluang terkena 'Beku'. [Alat Sihir] Saat pemain diserang, Bola Beku menerima serangan lebih dulu. Penyerang menerima 1 tumpukan 'Beku' sebelum kerusakan dihitung. Setiap kali tumpukan Beku bertambah di medan, kamu mendapat perisai sebesar Sihir x0,1. Hanya 1 bola yang bisa dipanggil per pertempuran. Jika hancur, bisa dipakai lagi setelah 15 detik.","SK_C_A_0802":"[A] Memberikan 2.800 kerusakan ke semua musuh. Menerapkan 1 Beku. Peluang kritis 25%.","SK_C_E_0503":"Saat Serangan Pendahuluan, Akurasi +20%.","SK_C_P_0001":"Pasif terpicu. Saat diserang, mengonsumsi 10% MP saat ini untuk mengurangi kerusakan yang diterima sebesar jumlah tersebut.","SK_C_P_0212":"Saat serangan dasar, sesosok 'Bayangan' melancarkan serangan susulan yang memberikan 15% dari kerusakan tersebut.","SK_C_P_0301":"[Pedang, Belati, Kepalan Besi] Musuh yang terkena terus menerima kerusakan sebesar AGI x0,1 setiap 3 detik (30 giliran).","SK_C_P_0302":"Saat [Pedang] terpasang, kerusakan serangan dasar dan skill +20%. Dapatkan Akurasi +25%.","SK_C_P_0303":"Saat [Kepalan Besi] terpasang, kerusakan skill +80%. Waktu casting -1 giliran.","SK_C_P_0304":"Saat [Pedang Besar] terpasang, meningkatkan STR sebesar Lv Pemain x1.","SK_C_P_0305":"Saat [Perisai] terpasang, meningkatkan Pertahanan sebesar STR x5. Kerusakan yang diterima -35%. Mendapat *Provokasi*. Mengabaikan kerusakan yang setara atau di bawah Pertahananmu. (Kerusakan yang diabaikan = 1 kerusakan)","SK_C_P_0306":"Saat [Belati] terpasang, meningkatkan AGI sebesar Lv Pemain x1.","SK_C_P_0307":"Saat [Tombak] terpasang, dapatkan kerusakan akhir +15% dan reduksi kerusakan +15%.","SK_C_P_0308":"Saat senjata [Jarak Jauh] terpasang, Serangan Akhir +15%.","SK_C_P_0309":"Saat [Alat Sihir] terpasang, langsung memulihkan 10% MP yang dikeluarkan. Kerusakan skill +30%.","SK_C_P_0701":"[P] Keberuntungan + 30","SK_C_P_0702":"[A] Memberi semua sekutu pelindung sebesar MAG x3 + HP pengguna x0,3. Casting 3 dtk. MP 60.","SK_C_P_0703":"[A] Menghabiskan seluruh pelindungmu untuk memberikan kerusakan sebesar jumlah pelindung tersebut. Casting 1 dtk. MP 25.","SK_C_P_0706":"[P] Stat tertinggimu +35.","SK_C_P_0707":"[A] Jika HP maks musuh melebihi milikmu, memberikan kerusakan fisik sebesar selisih HP x0,5. (Batas kerusakan maks = Semua Stat x8). MP 50.","SK_C_P_0709":"[P] Dapatkan Evasi sebesar Lv Pemain x0,5%. (50% pada level 99)","SK_C_P_0712":"[P] Pulihkan 3% dari kerusakan yang kamu berikan dengan sihir.","SK_C_P_0801":"Meningkatkan kerusakan akhir sihir elemen Beku sebesar 7% dan durasi Beku sebesar 20%.","SK_C_P_0802":"Saat pertempuran dimulai, menerapkan Beku (E) ke semua musuh dengan peluang 15% masing-masing. Skill Beku menghabiskan MP 2% lebih sedikit.","SK_C_P_0803":"[P] Peluang kritis +25% pada serangan elemen Es.","SK_C_P_0804":"[P] [Tombak] Serangan dasar dan serangan skill elemen Es memberikan 35% kerusakan sihir bonus. Kerusakan yang diterima -10%.","SK_C_P_0805":"[P] Mengurangi kerusakan sihir yang diterima sebesar 25%. Setiap kali reduksi terpicu, nilainya turun 1%p, minimal 1%. 25% peluang menahan Beku.","SK_C_P_0806":"[P] Meningkatkan perolehan EXP sebesar {25}%.","SK_C_P_0905":"[P] Indra meningkat {12}.","SK_D_A_0001":"[A] Menembakkan panah es ke 1 musuh, memberikan kerusakan 280% Serangan Sihir. Casting 5 dtk. Konsumsi MP 15%.","SK_D_A_0301":"[Pedang, Pedang Besar] 125% Serangan Akhir. Menyerang hingga 3 musuh sekaligus.","SK_D_A_0302":"[Kepalan Besi] 115% Serangan Akhir. Kerusakan bonus sebesar 3% dari HP musuh saat ini. (Maks 1200)","SK_D_A_0303":"[Jarak Jauh] 110% Serangan Akhir. Casting pasca-serangan -10% (konsep prioritas giliran). Memberikan *Luka* pada musuh yang terkena. Semua serangan fisik memberikan 5% kerusakan bonus ke musuh yang terluka.","SK_D_A_0304":"[Belati] 55% Serangan Akhir x2 hit. Melancarkan dua serangan dasar. Hit kedua mengabaikan 35% Pertahanan.","SK_D_A_0305":"[Perisai] 110% Serangan Akhir. Memberikan kerusakan bonus sebesar Pertahanan x3. Menyerang hingga 3 musuh sekaligus. Mengurangi Pertahanan musuh yang terkena sebesar 25%.","SK_D_A_0306":"[Tombak] 120% Serangan Akhir. Musuh yang terkena mengalami Akurasi -25% dan Kecepatan Serang/Casting -25%. (Tidak bertumpuk)","SK_D_A_0307":"[Alat Sihir] 115% Serangan Sihir. Musuh yang terkena mengalami Resistansi Sihir -50%.","SK_D_A_0501":"[Jarak Jauh] Skill Serangan Pendahuluan. Serangan Akhir 1.4. Bonus Peluang kritis +15% diterapkan.","SK_D_A_0503":"Saat Serangan Pendahuluan berhasil: INT +10 selama pertempuran.","SK_D_A_0504":"Saat Serangan Pendahuluan berhasil: LUK dan SEN +15 selama pertempuran.","SK_D_A_0505":"Serangan Pendahuluan mengabaikan 20% Pertahanan musuh.","SK_D_A_0506":"[Alat Sihir] Saat sekutu menjadi target, 30% peluang memberikan 'Beku' pada musuh. Musuh yang membeku mengalami Akurasi -25%. Stack Beku bertahan 10 detik; setiap 3 stack memberikan kerusakan MAG x1.","SK_D_A_0507":"[Pedang, Belati, Pedang Besar, Kepalan Besi, Tombak] Sekali per pertempuran, saat sebuah serangan akan menurunkan HP ke 0, HP dikunci pada 1. Lalu batalkan serangan berikutnya, berikan kerusakan 150% Serangan Akhir ke musuh, dan pulihkan HP-mu ke 15%.","SK_D_A_0801":"[A] Memberi dirimu pelindung sebesar Serangan Sihir x2. Casting 2 dtk. Konsumsi MP 15%.","SK_D_A_0802":"[A] Memberikan kerusakan Serangan Sihir x3 ke semua musuh dan menerapkan 'Beku' 3 kali. Casting 5 dtk. Konsumsi MP 15%.","SK_D_P_0001":"Akurasi +15. (Bertumpuk dengan Fokus)","SK_D_P_0002":"Kecepatan serang naik bertahap setiap giliran selama pertempuran. +0,1% per giliran (10 giliran = 1%).","SK_D_P_0301":"Saat [Pedang] terpasang, kerusakan skill +25%. Mengurangi jeda giliran pasca-serangan sebanyak 3 giliran.","SK_D_P_0302":"Saat [Kepalan Besi] terpasang, kerusakan skill +30%. Waktu casting -1 giliran.","SK_D_P_0303":"Saat [Pedang Besar] terpasang, kerusakan serangan dasar +15%. Reduksi kerusakan +15%.","SK_D_P_0304":"Saat [Perisai] terpasang, meningkatkan Pertahanan sebesar STR x3. Kerusakan yang diterima -25%. Mendapat *Provokasi*.","SK_D_P_0305":"Saat [Belati] terpasang, Kecepatan serang +25%.","SK_D_P_0306":"Saat [Tombak] terpasang, dapatkan kerusakan akhir +10% dan reduksi kerusakan +10%.","SK_D_P_0307":"Saat senjata [Jarak Jauh] terpasang, dapatkan Akurasi +25% dan Kerusakan kritis +25%.","SK_D_P_0308":"Saat [Alat Sihir] terpasang, waktu casting -25%.","SK_D_P_0309":"Meningkatkan Pertahanan sebesar Semua Stat x0,2.","SK_D_P_0701":"[P] Saat kamu casting skill yang mengonsumsi MP dan ada slot casting kosong, otomatis ikut casting 'Bola Resonansi'.","SK_D_P_0702":"[P] Jika HP musuh tersisa 1% atau kurang setelah serangan dasarmu, lancarkan satu serangan dasar tambahan.","SK_D_P_0703":"[P] Dapatkan 1.000 emas dan 30 EXP untuk setiap 3 km perjalanan.","SK_D_P_0704":"[A] Bisa dipakai pada musuh yang teracuni. Mengunci stack Racun pada 5; Racun yang berlebih langsung memberikan kerusakan. Kerusakan tetap Racun lalu menjadi 2% dari HP maks musuh setiap 3 detik. (Kerusakan maks = MAG Pemain x12). Casting 3 dtk. MP 90.","SK_D_P_0705":"[A] Menyuntikkan energi penguat ke 3 sekutu acak selain dirimu. Memberi HP maks +15% dan kerusakan yang diterima -7%. Casting instan. Jeda pemulihan 1 dtk. MP 45.","SK_D_P_0708":"[P] Pulihkan 1% dari kerusakan fisik yang kamu berikan.","SK_D_P_0801":"Skill elemen Beku di-casting 15% lebih cepat (dibulatkan ke atas). Peluang kritis +15%. Durasi Beku +2 dtk.","SK_D_P_0802":"Slow 'Beku' +1 (debuff giliran). Saat 'Beku' berakhir, memberikan kerusakan sihir sebesar stack Beku yang terpakai x HP maks x3%. (Pertahanan Sihir berlaku)","SK_D_P_0803":"25% peluang menahan efek status 'Beku'.","SK_D_P_0804":"[P] Dapatkan 1 INT untuk setiap 1% HP yang hilang selama pertempuran.","SK_D_P_0806":"Serangan Sihir +12%, MP Maks +12%.","SK_D_P_0807":"Kerusakan skill aktif Roh +10%. (Pengali kelompok skill)","SK_D_P_0808":"[P] Mengurangi waktu casting pemanggilan roh sebesar 2 dtk. Pemanggilan roh tidak mengonsumsi MP.","SK_D_P_0809":"[P] Meningkatkan perolehan EXP sebesar {15}%.","SK_D_P_0905":"[P] Indra meningkat {9}.","SK_E_A_0301":"[Pedang] 110% Serangan Akhir. Memberikan kerusakan bonus sebesar AGI +1.","SK_E_A_0302":"[Kepalan Besi] 105% Serangan Akhir. Mengurangi Pertahanan musuh yang terkena sebesar 3. (Bertumpuk tanpa batas)","SK_E_A_0303":"[Pedang Besar] 120% Serangan Akhir. Menyerang 3 musuh terdekat sekaligus. Menerapkan jeda pemulihan 3 giliran.","SK_E_A_0304":"[Perisai] 110% Serangan Akhir. Memberikan kerusakan bonus sebesar Pertahanan x1.","SK_E_A_0305":"[Tombak] 120% Serangan Akhir. Memberikan kerusakan bonus sebesar AGI +1.","SK_E_A_0306":"[Jarak Jauh] 110% Serangan Akhir. Memberikan kerusakan bonus sebesar STR +1. Serangan jarak jauh.","SK_E_A_0307":"[Belati] 95% Serangan Akhir. P ngan kekuatan roh petir. Hingga pertempuran berakhir, serangan dasarmu memberikan kerusakan sihir bonus (MAG+AGI) x1. Casting 2 dtk. MP 50.","SK_E_A_0805":"[A] Roh cahaya membantu pertempuran. Akurasi semua musuh -5%, Akurasi semua sekutu +5%. Resistansi elemen cahaya +15%. Casting 1 dtk. Bertahan 20 dtk. MP 35.","SK_E_E_0505":"*Enchant* Saat Serangan Pendahuluan, mengonsumsi 3% MP untuk kerusakan +10%. Jika target langsung tumbang sekali pukul, 1% MP dikembalikan. (Bisa diaktifkan/dinonaktifkan)","SK_E_E_0506":"Serangan Pendahuluan mengabaikan 25% reduksi kerusakan musuh.","SK_E_P_0001":"Akurasi +10. (Tidak bertumpuk dengan Fokus)","SK_E_P_0002":"Kelincahan +5, Akurasi +5.","SK_E_P_0003":"Makin rendah HP-mu, makin besar reduksi kerusakannya (HP 100% = 1%, +1% per 10% HP yang hilang, maksimal 8% saat HP 30% ke bawah). Saat HP menjadi 1, hindari 2 serangan berikutnya.","SK_E_P_0124":"[Serangan Dasar] Membidik dengan presisi sebelum menembak. Akurasi +15%, kerusakan akhir serangan dasar +5%.","SK_E_P_0301":"Merebut prioritas serangan. Kerusakan +15% terhadap musuh yang sedang casting. Mendapat 10% peluang serangan tambahan. (Rollback waktu hanya untukmu - setelah bertindak, aksi berikutnya dipesan lebih dulu dengan prioritas sebesar 10% dari biaya giliran serangan dasar.)","SK_E_P_0302":"Saat [Pedang] terpasang, kerusakan serangan dasar +15%.","SK_E_P_0303":"Saat [Kepalan Besi] terpasang, Akurasi +25%.","SK_E_P_0304":"Saat [Pedang Besar] terpasang, serangan dasar mengenai +1 target tambahan.","SK_E_P_0305":"Saat [Perisai] terpasang, meningkatkan Pertahanan sebesar STR x1.","SK_E_P_0306":"Saat [Belati] terpasang, semua serangan memberikan *Luka*. *Luka* = semua serangan fisik memberikan 5% kerusakan bonus ke musuh yang terluka.","SK_E_P_0307":"Saat [Tombak] terpasang, dapatkan kerusakan akhir +5% dan reduksi kerusakan +5%.","SK_E_P_0308":"Saat senjata [Jarak Jauh] terpasang, Peluang kritis +25%.","SK_E_P_0309":"Saat [Alat Sihir] terpasang, memulihkan 1% MP maks per detik (10 giliran) selama pertempuran.","SK_E_P_0504":"*Enchant* Saat Serangan Pendahuluan, mengonsumsi 1% MP untuk memberikan kerusakan bonus sebesar MP yang dikeluarkan x MAG x0,3. (Bisa diaktifkan/dinonaktifkan)","SK_E_P_0704":"[Aturan Khusus] Pertempuran monster liar memunculkan +1 monster tambahan. (Bisa dinonaktifkan)","SK_E_P_0705":"[P] *Buff diri tempur*. Giliran aksimu tetap berjalan selama casting, memungkinkanmu menumpuk satu skill casting lagi (maks 2 sekaligus). Serangan dasar tidak bisa dipakai pada giliran aksi yang ditumpuk. (Bisa dinonaktifkan)","SK_E_P_0706":"[P] Kecerdasan+8","SK_E_P_0707":"[P] Kerusakan skill +15%.","SK_E_P_0708":"[P] Kerusakan skill meningkat sesuai waktu casting. +0,5% kerusakan bonus per giliran (4 dtk = +20% kerusakan).","SK_E_P_0709":"[P] Mempercepat gerakanmu. Kecepatan serang +8%.","SK_E_P_0710":"[P] Kerusakan kritis +60% terhadap musuh dengan HP 30% ke bawah.","SK_E_P_0713":"[P] Setiap kali serangan meleset selama pertempuran, dapatkan LUK +1.","SK_E_P_0714":"[A] Memberikan kerusakan fisik Lv x30 + (STR+MAG) x2 ke 3 musuh. Akurasi +25% diterapkan. MP 80.","SK_E_P_0716":"[P] Serangan dasar pertamamu dalam pertempuran memberikan kerusakan 1,3x.","SK_E_P_0717":"[A] Melapisi senjatamu dengan racun. Serangan dasar lalu punya 15% peluang memberikan 'Racun'. MP 15. Casting 0,1 dtk.","SK_E_P_0718":"[A] Memberikan 'Racun' pada satu musuh. Memberikan kerusakan tetap sebesar 1% HP maks musuh setiap 3 detik. (Bisa bertumpuk) (Kerusakan maks = MAG Pemain x8). Casting 2 dtk. MP 45.","SK_E_P_0719":"[A] Memulihkan HP sekutu dengan HP terendah sebesar LUK x4. Casting instan. Jeda giliran 2 dtk sesudahnya. MP 80.","SK_E_P_0720":"[A] Memasang zona pemulihan. Semua sekutu memulihkan HP sebesar LUK x2 setiap giliran selama 15 giliran. Casting 2 dtk. Konsumsi MP 15%. Sekali per pertempuran.","SK_E_P_0721":"[A] Memberikan ketajaman pada senjata. 2 sekutu dengan serangan tertinggi mendapat Peluang kritis +15% dan Kerusakan kritis +30%. Casting 3 dtk. Konsumsi MP 8%.","SK_E_P_0722":"[A] Memberi dirimu Kecepatan casting -10% (lebih cepat). Tambahan -5% per 10 level pemain. Casting 1 dtk. Konsumsi MP 12%.","SK_E_P_0723":"[A] Memasang zona yang kaya mana. Semua sekutu memulihkan MP sebesar LUK x1 setiap giliran selama 15 giliran. Casting 2 dtk. Konsumsi MP 15%. Sekali per pertempuran.","SK_E_P_0724":"[P] 15% peluang menahan skill efek status. Durasi efek status -15%.","SK_E_P_0801":"[P] Skill elemen Es mengonsumsi tambahan 25 mana. Stat MAG +Lv x1 selama pertempuran. (Bisa diaktifkan/dinonaktifkan)","SK_E_P_0802":"[P] Setiap kali stack Beku berakhir, pulihkan 3% MP. MAG +1.","SK_E_P_0810":"[P] Mengurangi kerusakan yang diterima selama casting sebesar {15}%.","SK_E_P_0905":"[P] Indra meningkat {6}.","SK_F_A_0301":"[Semua Senjata] 100% Serangan Akhir. Mengayunkan senjatamu.","SK_F_A_0501":"[Semua Senjata] Skill Serangan Pendahuluan. Serangan Akhir 1.0","SK_F_A_0504":"[Pedang, Pedang Besar] Saat menjadi target serangan, terima 1 kerusakan lalu terjang penyerang, memberikan kerusakan 200%. Peluang terpicu 8%.","SK_F_A_0505":"[Perisai] Sekali per pertempuran, saat menjadi target serangan fisik, 10% peluang untuk melakukan counter. Mengabaikan kerusakan tersebut dan memberikan kerusakan sebesar 20% Serangan Akhir musuh. (Maks: Lv Pemain x50)","SK_F_A_0506":"[Tombak, Kepalan Besi] Saat menjadi target serangan, 3% peluang terpicu: membatalkan serangan (giliran musuh terpakai) dan memberikan 80% Serangan Akhirmu ke musuh. Menunda giliran musuh sebanyak 3 giliran.","SK_F_A_0507":"[Belati, Jarak Jauh] Saat menjadi target kerusakan fisik, 4% peluang hanya menerima 10% kerusakan dan memberikan kerusakan AGI x2 ke musuh. (Selalu aktif)","SK_F_A_0509":"Saat serangan Counter berhasil: musuh tertunda 2 giliran dan kamu mengamankan prioritas 2 giliran.","SK_F_A_0701":"[A] Memukul satu titik untuk menembus perisai. Kerusakan 110% Serangan Akhir + Pertahanan musuh yang terkena -100. (Tidak bertumpuk) Bisa dipakai 3 kali. MP 25. Cast الكامل» إلى الهدف، وعند 60 تكديسًا يتفتّح ويتلقى ضررًا يساوي 30% من أقصى نقاط صحته (يقلّله الدفاع). وإذا كانت صحة الهدف حينها 30% من أقصى صحته أو أقل، يُعدَم متجاهلًا الدفاع. لا يتجاوز ضرر التفتّح 30 ضعف أقصى صحتك ولا يمكن أن يكون ضربة حرجة.","SK_EX_A_0007":"[P] أثناء تجهيز [سيف] أو [خنجر] أو [سيف عظيم]: تتحوّل الهجمات الأساسية إلى عنصر البرق. الدقّة +25(37.5)%، سرعة الهجوم +80(120)%، ضرر الضربة الحرجة +80(120)%.","SK_EX_A_0012":"نشطة من عنصر الظلام (فورية).\nعند التفعيل، يبدأ توجيه لمدة 15 جولة (لا تصرّفات أخرى). يُلحق كل جولة بجميع الأعداء ضررًا يساوي القوّة السحرية × N (حيث N = الجولات المنقضية) ويستهلك 6% مانا لكل جولة. ينتهي التوجيه مبكرًا إذا نفدت المانا.\nعند اكتمال التوجيه، تكتسب هجماتك الأساسية حتى نهاية المعركة ضررًا إضافيًا يساوي القوّة السحرية ×8 وتضرب مرتين.","SK_EX_A_0015":"[P] أثناء تجهيز [سيف] أو [خنجر] أو [سيف عظيم]: تصيب الهجمات الأساسية دائمًا، وتُلحق المهارات التي سلاحها الرئيسي [سيف] أو [خنجر] أو [سيف عظيم] ضررًا أكبر بنسبة 600(900)%.","SK_EX_A_0501":"[جميع الأسلحة] مهارة الضربة الاستباقية. المستوى ×100(150) + جميع الخصائص ×2(3). يستهلك 3% من MP.","SK_EX_A_0502":"[بعيد المدى] ضرر ثابت بنسبة الهجوم النهائي ×120(180)%. الأعداء المصابون بضربتك الاستباقية عند بدء المعركة يُوسَمون بـ'رؤية المستقبل' ويتلقّون الضرر نفسه بشكل متكرر كل ثانية.","SK_EX_A_0503":"[جميع الأسلحة] مهارة الضربة الاستباقية. جميع الخصائص ×3. عند مهاجمة وحش برّي تدخل معركة من 1-6 من ذلك الوحش البرّي. عند بدء المعركة يُلحق ضررًا يساوي جميع الخصائص ×3 بجميع الأعداء.","SK_EX_A_0504":"الضربات الاستباقية على الوحوش البرّية تحسم المعركة فورًا بالنصر. عند بدء المعركة يمنح جميع الحلفاء المراوغة +25%.","SK_EX_A_0505":"عندما تصبح هدفًا، فرصة 100% لإلحاق ضرر بالمهاجم يساوي الضرر المتلقّى. ثم تستعيد 90(135)% من الضرر الذي تلقّيته.","SK_EX_P_0303":"[P] بعد الهجوم الأساسي، إذا بقي الهدف حيًا يختفي كل تأخير سابق/لاحق وتنفّذ هجومًا أساسيًا تلقائيًا بعد جولة واحدة دون اختيار تصرّف. يتكرّر مرة كل جولة حتى يسقط الهدف، ثم يعود إليك حقّ اختيار التصرّف وفاصلك الزمني الأصلي.","SK_EX_P_0304":"[P] في كل مرة تتصرّف فيها، يرتفع أقصى MP بنسبة 1(1.5)% (تراكميًا مركّبًا). ويُلحق في الوقت نفسه بجميع الأعداء ضررًا سحريًا مستمرًا بقوة تساوي أقصى MP بعد الارتفاع. يتأثر هذا الضرر بالدفاع السحري للهدف وتأثيرات تقليل الضرر.","SK_EX_P_0701":"الوحوش أيضًا تمتلك خصائص. يضيف 10% من كل خاصية من خصائص العدو الست إلى خصائصك. عند المستوى 100، يضيف 110% من خصائص الوحش إلى خصائصك.","SK_EX_P_0801":"[P] عند بدء المعركة يَسِم جميع الأعداء بـ'الخاتمة'. بعد 20 ثانية يُلحق بجميع الأعداء ضررًا يساوي المستوى ×100 + القوّة السحرية ×70 ويصيبهم بالذهول 3 ثوانٍ. ضد الأعداء المصابين بـ'التجمّد' يصبح الضرر ضررًا ثابتًا.","SK_EX_P_0802":"يستدعي 3 كرات صقيع عند بدء المعركة متجاوزًا حدّ الكرة الواحدة. تبدأ المعركة بـ0% من MP.","SK_SSS_P_0905":"[P] الحس +{27}.","SK_SS_P_0905":"[P] الحس +{24}.","SK_SS_P_0951":"[P] عندما يتبقّى لدى عدو 1 HP، تمنح نفسك 3 فرص هجوم أساسي. يرتفع هذا الحد بنسبة 5% مع كل مستوى من مستويات الازدراء، وعند المستوى Lv5 تحصل على 3 فرص هجوم أساسي عندما تكون HP العدو 25% أو أقل.","SK_A_A_0801":"يستدعي ملكة الصقيع إلى جانب اللاعب. تقاتل معك وتلقي تعويذة عشوائية من عنصر التجمّد بين الرتبتين F وA كل جولتي تصرّف لك. خصائصها تساوي 75(112.5)% من خصائصك. لا يمكن تبديد ملكة الصقيع. التحضير 3(2) ثوانٍ، يستهلك 25(17)% من MP. لا يمكن استدعاؤها مرتين.","SK_EX_A_0003":"[سيف] نشطة مستمرة (فورية).\nعند التفعيل، تضرب شهب بقوة القوّة ×20(30) عدوًا عشوائيًا واحدًا كل جولة لمدة 20 جولة.\nتستهلك 3% مانا لكل جولة؛ وينتهي التوجيه فورًا إذا نفدت المانا أو تعرضت للصعق أو اخترت مهارة أخرى.","SK_EX_A_0017":"[سيف]\nعندما ينفّذ عدو هجومًا أساسيًا، فرصة 50(75)% لإبطاله وإلحاق ضرر بالعدو يساوي جميع الخصائص ×10(15). فترة انتظار داخلية 3 جولات.","SK_S_A_0501":"الضربات الاستباقية من موقع مقاتل التلاحم تُلحق ضررًا إضافيًا يساوي (القوّة+الرشاقة) ×3(4.5).","SK_S_A_0502":"[سيف، خنجر، سيف عظيم، رمح] مرة واحدة في المعركة، عندما تصبح هدفًا، فرصة 5(7.5)% لتقليل الضرر إلى 1 وإلحاق ضرر بالعدو يساوي الهجوم النهائي ×10(15).","SK_S_A_0801":"[A] [طور] يحضّر باستمرار لمدة 15 ثانية. تُضبَط HP لديك على 1 أثناء التحضير. وبينما يستمر التحضير، يهاجم عدوًا عشوائيًا بـ6(9) من شظايا الصقيع كل 3 جولات. (ينقطع التحضير إذا أُزيل الطور أو بُدّد التعزيز أو أُصبت بالذهول.) التحضير ثانيتان.","SK_S_A_0902":"[A] يُلحق ضررًا يساوي {10}% من أقصى HP بجميع الأعداء. (الضرر الأقصى للضربة = جميع الخصائص × 50)","SK_S_P_0502":"[سيف، خنجر، سيف عظيم] يزيد تأثيرات إتقان السيف بنسبة 50(75)%. الدقّة واحتمال الضربة الحرجة وضرر الضربة الحرجة +25(37.5)%. تكتسب عند حساب الهجوم النهائي 2(3) أضعاف هجوم السلاح إضافيًا.","SK_S_P_0801":"[P] الهجوم السحري +50(75)%، أقصى MP +30(45)%","SK_S_P_0905":"[P] الحس +{21}.","SK_S_P_0951":"[P] قتل عدو بهجوم مضاد يمنح فرصة هجوم إضافية.","SK_S_P_0962":"[P] قتل عدو يمنحك 1 فرصة هجوم إضافية.","SK_A_A_0301":"[سيف] يضرب جميع الأعداء مرتين. ضرر بنسبة 150(225)% من الهجوم النهائي زائد جميع الخصائص ×1(1.5).","SK_A_A_0302":"[سيف، خنجر] يُلحق ضررًا بنسبة 100(150)% من الهجوم النهائي زائد الرشاقة ×12~18(18~27). تُشَلّ حركتك لمدة 3 جولات بعد الهجوم.","SK_A_A_0303":"[خنجر] 100(150)% من الهجوم النهائي. ضرر الضربة الحرجة 500(750)%.","SK_A_A_0304":"[سيف عظيم] يضرب حتى 6 أعداء في آنٍ واحد. ضرر بنسبة 220(330)% من الهجوم النهائي زائد القوّة ×5(7.5). يخفّض دفاع الأعداء المصابين بنسبة 15(22.5)%. (يتجدّد ولا يتراكم)","SK_A_A_0305":"[قبضات] يضرب جميع الأعداء مرة واحدة. يدمّر جميع دروع الأهداف، ثم يُلحق ضررًا بنسبة 220(330)% من الهجوم النهائي. يمكن صدّه بالهجوم المضاد.","SK_A_A_0306":"[بعيد المدى] تطلق شعلتك الأخيرة المتبقية. 320(480)% من الهجوم النهائي. تأخير لاحق 5 جولات. يزداد الضرر النهائي بمقدار MP الناقص من الحدّ الأقصى. (+1(1.5)% لكل 1% ناقص)","SK_A_A_0307":"[أداة سحرية] 120(180)% من الهجوم السحري. يُلحق تسمّم المانا. يُلحق الضرر نفسه بكل عدو مصاب بتسمّم المانا. إذا قتل هذا الهجوم عدوًا، تستعيد من MP بمقدار MP المتبقي لدى العدو.","SK_A_A_0501":"[سيف] مهارة الضربة الاستباقية. الهجوم النهائي 1.8(2.7) + جميع الخصائص ×1(1.5). يستهلك 3% من MP. (هالة سيف)","SK_A_A_0504":"[رمح] مهارة الضربة الاستباقية. ضرر ثابت يساوي (القوّة+القوّة السحرية) ×3.5(5.25)؛ يصيب دائمًا كضربة حرجة. يستهلك 15% من MP. (رمي الرمح)","SK_A_A_0506":"[درع] مهارة الضربة الاستباقية. ضرر يساوي الدفاع ×5(7.5). يستهلك 4% من MP. (رمي حجر)","SK_A_A_0508":"[درع] عندما تصبح هدفًا، تستعيد فورًا 2(3)% من أقصى HP. إذا كنت آخر الحلفاء صمودًا، فكل ضربة تتلقّاها تُلحق أيضًا بجميع الأعداء ضررًا يساوي HP الذي استعدته.","SK_A_A_0509":"[رمح، أداة سحرية] عندما يصبح حليف هدفًا وكانت HP لديه 15(22.5)% أو أقل، تستعيد HP له فورًا بمقدار حظّك ×8(12). يستهلك 8% من MP لكل حليف؛ ولا يتفعّل دون MP كافٍ. يقلّ الضرر المتلقّى للحليف المُعالَج بنسبة 25(37.5)% طوال المعركة.","SK_A_A_0510":"المراوغة +30(45)%. عندما تراوغ بنجاح، تطارد المهاجم وتُلحق به ضررًا بنسبة 80(120)% من هجومك النهائي.","SK_A_A_0511":"عندما تصبح هدفًا لهجوم بمهارة أو سحر، يقلّ ذلك الضرر بنسبة 80(120)%. ثم تنخفض الخصائص الأساسية للمهاجم بنسبة 30(45)% حتى نهاية المعركة، وتكتسب أنت ذلك المقدار.","SK_A_A_0802":"[A] [طور] يدوم 10 ثوانٍ. يُلحق 'التجمّد' بجميع الأعداء فورًا ثم كل ثانيتين. يُلحق 'التجمّد' إضافيًا الدقّة -35(52.5)%.","SK_A_E_0507":"عند الضربة الاستباقية، يُطبِّق 'التمزّق' مسبقًا على العدو. (الضرر المتلقّى +25(37.5)%)","SK_A_P_0001":"يزيد كفاءة مهارات عنصر الجليد بنسبة 30(45)%.","SK_A_P_0301":"[درع] يزيد دفاع جميع الحلفاء (باستثناء دفاعك) بمقدار دفاعك ×0.1(0.15). يمنح إضافةً إلى ذلك جميع الحلفاء درع إيجيس متراكمًا يساوي 7(10.5)% من HP الخاصة بك. ثم يُلحق بعدو واحد ضررًا يساوي مجموع دروع الحلفاء المُنشأة ×0.5(0.75). (سقف الضرر الأقصى = مستوى اللاعب ×300(450))","SK_A_P_0302":"[رمح] يُلحق ضررًا يساوي (القوّة + القوّة السحرية) ×10(15) بعدوين.","SK_A_P_0303":"جميع تأثيرات الأرواح +70(105)%. يستدعي جنيّة تشارك في القتال. تصدّ الجنيّة أحيانًا مهارة بدلًا منك.","SK_A_P_0304":"عند حصولك على فرصة هجوم إضافية، يتجاهل هجومك الأساسي أو مهارتك التالية دفاع العدو.","SK_A_P_0305":"تؤمّن +1 جولة مسبقًا عند دخول المعركة.","SK_A_P_0306":"عند الضربة الاستباقية: احتمال الضربة الحرجة +25(37.5)%، الدقّة +25(37.5)%.","SK_A_P_0307":"الدقّة +45(67.5)%. الضرر السحري المتلقّى -15(22.5)%.","SK_A_P_0308":"عند دخول بوابة، يزداد أقصى MP مؤقتًا بنسبة 50(75)% حتى نهاية البوابة. (لكونه أقصى MP فإنه يبدأ ممتلئًا.)","SK_A_P_0701":"الذكاء +50(75)","SK_A_P_0702":"[P] كلما انخفض MP إلى 20(30) أو أقل، تستعيد 10(15)% من MP. (يمكن تعطيله)","SK_A_P_0801":"[P] يرتفع أقصى MP بمقدار مستوى اللاعب ×60(90). كل 1% مستهلَك من MP يزيد ضرر مهارات عنصر التجمّد بنسبة 1(1.5)%.","SK_A_P_0802":"[P] جولات الأعداء +1. سرعة تحضير الحلفاء +30(45)%.","SK_A_P_0803":"[P] أثناء المعركة، يزيد خاصّيتَي القوّة والقوّة السحرية للحلفاء بمقدار المستوى ×1(1.5) ويخفّضهما لدى الأعداء بالمقدار نفسه. (لا يتراكم)","SK_A_P_0901":"[خاملة] تُدار عجلة حظّ بعد كل هجوم أساسي. تدور العجلة من 1 إلى 7؛ وظهور الرقم 7 يمنح فرصة هجوم إضافية. يرفع حظّك احتمال ظهور الرقم 7. (من 15% حتى سقف 50%)","SK_A_P_0902":"[P] تتصرّف أولًا بهجوم أساسي واحد عند بدء المعركة. إذا امتلك أكثر من مقاتل هذه المهارة، تكون الأولوية للأعلى رشاقة، ثم للأعلى خبرة (وعند التعادل يفوز اللاعب).","SK_A_P_0905":"[P] الحس +{18}.","SK_B_A_0301":"[سيف] يُلحق ضررًا بنسبة 150% من الهجوم النهائي زائد جميع الخصائص ×1.","SK_B_A_0302":"[خنجر] 100(150)% من الهجوم النهائي + تراكمات المطاردة ×10(15)%. تحصل على 1 تراكم مطاردة بعد الهجوم. (بحدّ أقصى 25) ضرر يصل إلى 350(525)%.","SK_B_A_0303":"[سيف عظيم] يُلحق ضررًا بنسبة 180(270)% من الهجوم النهائي زائد القوّة ×2(3) بجميع الأعداء في المعركة. تتأخر جولات الأعداء المصابين بمقدار +2.","SK_B_A_0304":"[قبضات] 100(150)% من الهجوم النهائي + ضرر لجميع الأعداء. دفاع الأعداء المصابين -35(52.5)%. لا يمكن صدّه بالهجوم المضاد.","SK_B_A_0305":"[بعيد المدى] 85(127.5)% من الهجوم النهائي + يطلق 6 طلقات. يصيب أعداء عشوائيين. تخفّض كل إصابة دفاع العدو المصاب بمقدار 1(1.5). (يتراكم بلا حدود.)","SK_B_A_0306":"[أداة سحرية] 120(180)% من الهجوم السحري. يُلحق تسمّم المانا بالأعداء المصابين. يتلقّى الأعداء المصابون بتسمّم المانا ضررًا سحريًا إضافيًا يساوي تراكمات تسمّم المانا ×1(1.5)%.","SK_B_A_0501":"[سيف، سيف عظيم] مهارة الضربة الاستباقية. الهجوم النهائي 1.6(2.4) + جميع الخصائص ×1(1.5).","SK_B_A_0502":"[درع، رمح، قبضات] مهارة الضربة الاستباقية. الهجوم النهائي 1.2(1.8) + جميع الخصائص ×1(1.5).","SK_B_A_0503":"[بعيد المدى] بعد القضاء على هدف من ضربة استباقية واحدة، تحصل ضربتك الاستباقية التالية على مكافأة هجوم بنسبة 15(22.5)%.","SK_B_A_0505":"[سيف، قبضات، خنجر] بعد مراوغة هجوم عدو، فرصة 30(45)% لإلحاق ضرر يساوي الهجوم النهائي ×1.8(2.7). يصيب دائمًا كضربة حرجة مع ضرر ضربة حرجة +250(375)%. تحصل على تصرّف فوري.","SK_B_A_0506":"بعد مراوغة هجوم عدو، فرصة 30% لمنح 'التسارع' لجميع الحلفاء. بدءًا من الاستخدام الثاني، يمنح جميع الحلفاء مراوغة متراكمة +5%.","SK_B_A_0507":"[بعيد المدى، أداة سحرية] عندما يحضّر عدو هجومًا سحريًا، فرصة 15(22.5)% لإلغائه. حتى 5 مرات في المعركة؛ يستهلك 5% من MP لكل استخدام. عند الإلغاء، يُلحق ضررًا يساوي MP الذي استهلكه العدو ×10(15) ويؤخّر جولة تصرّف العدو الأساسية بمقدار 1.","SK_B_A_0801":"[A] يطبّق التجمّد على جميع الأعداء؛ واحد مضمون على الأقل، بفرصة 35(52.5)% لكل منهم. ثم يُلحق ضررًا يساوي الهجوم السحري ×6(9) لكل تراكم تجمّد مطبَّق. وبعدها مباشرة يُعدِم الأعداء الذين تقلّ HP لديهم عن 20(30)%. التحضير 8 ثوانٍ. قابل للاستخدام 3 مرات في المعركة. يستهلك 25% من MP.","SK_B_P_0001":"عند الهجوم الأساسي، ينفّذ فارس ظلٍّ يحمل خصائص مطابقة لخصائصك هجومًا أساسيًا إضافيًا واحدًا.","SK_B_P_0301":"أثناء تجهيز [درع]: يُلحق ضررًا يساوي الدفاع ×6(9) بجميع الأعداء. يمنح جميع الحلفاء درع إيجيس متراكمًا يساوي 5(7.5)% من HP الخاصة بك.","SK_B_P_0302":"[رمح] ضرر ثابت يساوي (القوّة+القوّة السحرية) ×5(7.5).","SK_B_P_0303":"جميع تأثيرات الأرواح +30(45)%.","SK_B_P_0304":"تؤمّن جولتين مسبقًا عند دخول المعركة.","SK_B_P_0305":"الدقّة واحتمال الضربة الحرجة وضرر الضربة الحرجة +25(37.5)%.","SK_B_P_0306":"المراوغة +45(67.5)%.","SK_B_P_0307":"أقصى MP +15(22.5)%.","SK_B_P_0308":"[درع] أقصى HP +35(52.5)%.","SK_B_P_0701":"[P] عبقري بالفطرة. جميع الخصائص +7(10.5)","SK_B_P_0702":"[P] يضيف 10(15)% من أعلى خاصّية لديك إلى خصائصك الأخرى.","SK_B_P_0705":"[P] الدقّة +25(37.5)%. كل هجوم يخطئ يمنح دقّة إضافية +5(7.5)%. (يتراكم بلا حدود)","SK_B_P_0706":"تحصل على رشاقة تساوي مستوى اللاعب ×1(1.5).","SK_B_P_0707":"تحصل على هجوم وهجوم سحري يساوي مستوى اللاعب ×1(1.5).","SK_B_P_0708":"تحصل على حظّ وإحساس يساوي مستوى اللاعب ×0.5(0.75).","SK_B_P_0709":"تحصل على ذكاء يساوي مستوى اللاعب ×1(1.5).","SK_B_P_0711":"[P] عندما يكون لدى حليف 10(15)% من HP أو أقل، تستعيد HP لأقل الحلفاء HP بنسبة 10(15)% (دون تحضير). 5 مرات في المعركة.","SK_B_P_0712":"[P] وُلد بقوة مدمّرة. تزداد القوّة بمقدار 3(4.5) كل 4 مستويات للاعب. خاملة.","SK_B_P_0801":"يزيد الضرر النهائي لسحر عنصر الجليد بنسبة 35(52.5)%.","SK_B_P_0802":"[P] يضيف تطبيق التجمّد تراكمًا إضافيًا واحدًا.","SK_B_P_0905":"[P] الحس +{15}.","SK_C_A_0301":"[سيف، سيف عظيم] 145% من الهجوم النهائي. يضرب حتى 3 أعداء في آنٍ واحد.","SK_C_A_0302":"[خنجر] 120% من الهجوم النهائي. فرصة 15% للحصول على فرصة هجوم إضافية بعد الهجوم.","SK_C_A_0303":"[رمح] 125% من الهجوم النهائي. يُطبَّق 15% من الضرر كضرر ثابت. يخفّض دفاع العدو المصاب بنسبة 25%.","SK_C_A_0304":"[قبضات] 90% من الهجوم النهائي ×2 ضربة. يضرب باليدين اليسرى واليمنى بالتناوب. لا يمكن صدّه بالهجوم المضاد.","SK_C_A_0305":"[بعيد المدى] 135% من الهجوم النهائي. يُلحق ضررًا إضافيًا يساوي القوّة +1.5. (جمعي)","SK_C_A_0306":"[درع] 150% من الهجوم النهائي مع ضرر ثابت إضافي يساوي الدفاع ×5.","SK_C_A_0307":"[بعيد المدى] 120% من الهجوم النهائي ×2 ضربة. إذا قتلت الضربة الأولى العدو، ينتقل الضرر المتبقي إلى عدو آخر.","SK_C_A_0308":"[أداة سحرية] 85% من الهجوم السحري. يُلحق 'تسمّم المانا' بالأعداء المصابين. يتلقّى الأعداء المتسمّمون بالمانا ضررًا كل ثانية (10 جولات) يتناسب مع خاصّية القوّة السحرية للمستخدِم ×1. (خمسة سحرة يضربون بـ100 يُلحقون 500 ضرر في الثانية. يُحتسَب مرة واحدة فقط لكل لاعب.)","SK_C_A_0501":"[خنجر] مهارة الضربة الاستباقية. الهجوم النهائي 1.5. يتجاهل 25% من تقليل الضرر (جمعي) كمكافأة.","SK_C_A_0502":"إذا تعرّضت للهجوم قبل أن تتصرّف، تحصل على تعزيز الجولات +3 (3 جولات تُستخدَم أولًا).","SK_C_A_0504":"[سيف، سيف عظيم، قبضات، رمح، خنجر] مرة واحدة في المعركة، فرصة 10% للتفعيل عند مراوغتك هجوم عدو. يُلحق ضررًا بنسبة 150% من الهجوم النهائي كضربة حرجة مضمونة، ويمنحك 'التسارع' (المراوغة +25%، الدقّة +25%، 30 جولة) وتحصل على تصرّف فوري.","SK_C_A_0505":"[خاصة] تتطلّب وجود [درع] مع مستخدم [بعيد المدى] أو [أداة سحرية] في الفريق؛ ت  opts(document.getElementById('kind'),[['',T.kind+': '+T.all]].concat(['active','passive','auto','preempt','basic','counter'].map(function(k){return [k,L.kind[k]]})),KIND);
