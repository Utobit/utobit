0707":"Trébol de Tres Hojas","SK_F_P_0708":"Visualización","SK_F_P_0709":"Materialización","SK_F_P_0711":"Desmantelar","SK_F_P_0712":"Fijar Blanco","SK_F_P_0714":"Zona Prohibida","SK_F_P_0716":"Puñetazo Potente","SK_F_P_0719":"Corte Encadenado","SK_F_P_0720":"Talento de Espada","SK_F_P_0722":"Talento de Asesino","SK_F_P_0723":"Contragolpe","SK_F_P_0801":"Afinidad con el Frío","SK_F_P_0802":"Maestría de Congelación","SK_F_P_0803":"Crecimiento Excepcional","SK_F_P_0904":"Coleccionista de Fragmentos","SK_F_P_0905":"Explorador","SK_SS_P_0302":"Esgrima Dual","SK_SS_P_0303":"Rompereglas","SK_SS_P_0304":"Rompehechizos","SK_SS_P_0301":"Drenaje de maná","SK_SS_A_0501":"Oportunista","SK_S_P_0971":"Arte de combate del zorro"},"desc":{"SK_EX_A_0001":"Pasiva. Te otorga 'Luna Negra'. Los enemigos que te atacan sufren -25% de Precisión, y tus ataques infligen daño extra igual a ATQ Mágico x3.","SK_EX_A_0002":"Activa de elemento Luz.\nEmpieza a lanzarse en cuanto inicia la batalla, con su propio lanzamiento aparte. Tras 20 turnos, golpea a todos los enemigos con un ataque mágico igual a todo el daño que infligiste durante la batalla. Después tu MP pasa a 0 y se recupera un 10(15)% por turno durante 10 turnos.","SK_EX_A_0006":"[Espada] Los pétalos caen como lluvia. Los ataques básicos golpean a 3 enemigos aleatorios a la vez, infligiendo a cada uno ATQ Final x3(4.5) + estad. totales x3(4.5) de daño. Cada golpe añade 10 acumulaciones de Plena floración al objetivo; al llegar a 60, florece y recibe daño igual al 30 % de su PV máx. (reducido por DEF). Si en ese momento sus PV son del 30 % o menos de su PV máx., es ejecutado ignorando la DEF. El daño de floración no puede superar 30 veces tus PV máx. y no puede ser crítico.","SK_EX_A_0007":"[P] Con [Espada], [Daga] o [Espadón] equipado: los ataques básicos pasan a ser de elemento rayo. Precisión +25(37.5)%, Velocidad de ataque +80(120)%, Daño crítico +80(120)%.","SK_EX_A_0012":"Activa de elemento Oscuridad (instantánea).\nAl lanzarla, inicia una canalización de 15 turnos (sin otras acciones). Cada turno inflige MAG x N de daño (N = turnos transcurridos) a todos los enemigos y consume 6% de maná por turno. La canalización termina antes si el maná se agota.\nAl completarse, hasta el fin de la batalla tus ataques básicos ganan MAG x8 de daño extra y golpean dos veces.","SK_EX_A_0015":"[P] Con [Espada], [Daga] o [Espadón] equipado: los ataques básicos siempre aciertan, y las habilidades cuya arma principal sea [Espada], [Daga] o [Espadón] infligen 600(900)% más daño.","SK_EX_A_0501":"[Todas las armas] Habilidad de Ataque preventivo. Lv x100(150) + estad. totales x2(3). Cuesta 3% de MP.","SK_EX_A_0502":"[A distancia] ATQ Final x120(180)% de daño fijo. Los enemigos alcanzados por tu Ataque preventivo al iniciar la batalla quedan marcados con 'Visión Futura' y reciben el mismo daño cada segundo.","SK_EX_A_0503":"[Todas las armas] Habilidad de Ataque preventivo. Estad. totales x3. Atacar a un monstruo salvaje inicia una batalla contra 1-6 de ese monstruo. Al empezar la batalla, inflige estad. totales x3 de daño a todos los enemigos.","SK_EX_A_0504":"Los Ataques preventivos a monstruos salvajes ganan la batalla al instante. Al empezar la batalla, otorga a todos los aliados Evasión +25%.","SK_EX_A_0505":"Al ser objetivo, 100% de probabilidad de infligir al atacante un daño igual al recibido. Luego recuperas el 90(135)% del daño sufrido.","SK_EX_P_0303":"[P] Tras un ataque básico, si el objetivo sobrevive, todo el retardo previo/posterior desaparece y vuelves a atacar automáticamente 1 turno después sin elegir acción. Se repite una vez por turno hasta que el objetivo cae; entonces recuperas la elección de acción y tu intervalo de acción original.","SK_EX_P_0304":"[P] Cada vez que actúas, el MP máximo sube un 1(1.5)% (compuesto). A la vez inflige a todos los enemigos daño mágico continuo con potencia igual a tu MP máximo aumentado. Este daño se ve afectado por la DEF mágica y la reducción de daño del objetivo.","SK_EX_P_0701":"Los monstruos también tienen estadísticas. Suma a tus estadísticas el 10% de cada una de las 6 estadísticas del enemigo. En el nivel 100, suma a tus estadísticas el 110% de las estadísticas del monstruo.","SK_EX_P_0801":"[P] Al empezar la batalla, marca a todos los enemigos con 'El Fin'. Tras 20 segundos, inflige Lv x100 + MAG x70 de daño a todos los enemigos y los aturde 3s. Contra enemigos con 'Congelación', el daño pasa a ser daño fijo.","SK_EX_P_0802":"Invoca 3 Orbes de Escarcha al empezar la batalla, ignorando el límite de 1 orbe. Empiezas la batalla con 0% de MP.","SK_SSS_P_0905":"[P] Sentido +{27}.","SK_SS_P_0905":"[P] Sentido +{24}.","SK_SS_P_0951":"[P] Cuando un enemigo queda con 1 de HP, te otorgas 3 oportunidades de ataque básico. Este umbral sube un 5% con cada Lv de Desprecio; con Desprecio Lv5, obtienes 3 oportunidades de ataque básico cuando un enemigo tiene un 25% de HP o menos.","SK_A_A_0801":"Invoca a la Reina Escarcha junto al jugador. Lucha a tu lado y lanza un hechizo aleatorio de elemento Congelación de rango F-A cada 2 turnos de acción tuyos. Sus estadísticas son el 75(112.5)% de las tuyas. La Reina Escarcha no puede disiparse. Lanzamiento de 3(2)s, cuesta 25(17)% de MP. No puede invocarse dos veces.","SK_EX_A_0003":"[Espada] Activa sostenida (instantánea).\nAl lanzarla, durante 20 turnos un meteoro de FUE x20(30) golpea a un enemigo aleatorio cada turno.\nCuesta 3% de maná por turno; la canalización termina al instante si el maná se agota, te aturden o eliges otra habilidad.","SK_EX_A_0017":"[Espada]\nCuando un enemigo hace un ataque básico, 50(75)% de probabilidad de anularlo e infligirle estad. totales x10(15) de daño. 3 turnos de recarga interna.","SK_S_A_0501":"Los Ataques preventivos desde posición de daño cuerpo a cuerpo infligen (FUE+AGI) x3(4.5) de daño extra.","SK_S_A_0502":"[Espada, Daga, Espadón, Lanza] Una vez por batalla, al ser objetivo, 5(7.5)% de probabilidad de reducir el daño a 1 e infligir ATQ Final x10(15) de daño al enemigo.","SK_S_A_0801":"[A] [Fase] Se lanza de forma continua durante 15 segundos. Tu HP se fija en 1 mientras se lanza. Mientras dure el lanzamiento, ataca a un enemigo aleatorio con 6(9) Esquirlas de Escarcha cada 3 turnos. (El lanzamiento se interrumpe si la Fase se elimina, el potenciador se disipa o quedas aturdido.) Lanzamiento de 2s.","SK_S_A_0902":"[A] Inflige el {10}% del HP máximo como daño a todos los enemigos. (Daño máx. por golpe = estad. totales x 50)","SK_S_P_0502":"[Espada, Daga, Espadón] Aumenta los efectos de Maestría de Espada un 50(75)%. Precisión, Prob. de crítico y Daño crítico +25(37.5)%. Ganas además 2(3) veces el ATQ del arma al calcular el ATQ Final.","SK_S_P_0801":"[P] ATQ Mágico +50(75)%, MP máximo +30(45)%","SK_S_P_0905":"[P] Sentido +{21}.","SK_S_P_0951":"[P] Matar a un enemigo con un Contraataque otorga una oportunidad de ataque extra.","SK_S_P_0962":"[P] Matar a un enemigo otorga 1 oportunidad de ataque extra.","SK_A_A_0301":"[Espada] Golpea a todos los enemigos 2 veces. Daño de 150(225)% del ATQ Final más estad. totales x1(1.5).","SK_A_A_0302":"[Espada, Daga] Inflige 100(150)% del ATQ Final más AGI x12~18(18~27) de daño. Quedas paralizado 3 turnos tras atacar.","SK_A_A_0303":"[Daga] 100(150)% del ATQ Final. Daño crítico 500(750)%.","SK_A_A_0304":"[Espadón] Golpea hasta 6 enemigos a la vez. 220(330)% del ATQ Final más FUE x5(7.5) de daño. Reduce la DEF de los enemigos golpeados un 15(22.5)%. (Se renueva, no se acumula)","SK_A_A_0305":"[Nudilleras] Golpea a todos los enemigos 1 vez. Destruye todos los escudos de los objetivos y luego inflige 220(330)% del ATQ Final de daño. Puede bloquearse con Contraataque.","SK_A_A_0306":"[A distancia] Desata tu última llama. 320(480)% del ATQ Final. 5 turnos de retardo de recuperación. El daño final aumenta según el MP que te falte del máximo. (+1(1.5)% por cada 1% faltante)","SK_A_A_0307":"[Herramienta Mágica] 120(180)% del ATQ Mágico. Inflige Envenenamiento de Maná. Inflige el mismo daño a todos los enemigos con Envenenamiento de Maná. Si este ataque mata a un enemigo, recuperas MP igual al MP restante del enemigo.","SK_A_A_0501":"[Espada] Habilidad de Ataque preventivo. ATQ Final 1.8(2.7) + estad. totales x1(1.5). Cuesta 3% de MP. (Aura de espada)","SK_A_A_0504":"[Lanza] Habilidad de Ataque preventivo. Daño fijo de (FUE+MAG) x3.5(5.25); siempre acierta como golpe crítico. Cuesta 15% de MP. (Lanzamiento de lanza)","SK_A_A_0506":"[Escudo] Habilidad de Ataque preventivo. Daño de DEF x5(7.5). Cuesta 4% de MP. (Roca arrojada)","SK_A_A_0508":"[Escudo] Al ser objetivo, recuperas al instante 2(3)% del HP máximo. Si eres el último aliado en pie, cada golpe que recibas también inflige a todos los enemigos un daño igual al HP recuperado.","SK_A_A_0509":"[Lanza, Herramienta Mágica] Cuando un aliado es objetivo y su HP está al 15(22.5)% o menos, restaura al instante su HP en tu SUE x8(12). Cuesta 8% de MP por aliado; no se activa sin MP disponible. El aliado curado recibe 25(37.5)% menos daño durante la batalla.","SK_A_A_0510":"Evasión +30(45)%. Al esquivar con éxito, persigues al atacante y le infliges 80(120)% de tu ATQ Final como daño.","SK_A_A_0511":"Al ser objetivo de una habilidad o ataque mágico, reduce ese daño un 80(120)%. Luego reduce las estadísticas base del atacante un 30(45)% hasta el fin de la batalla, y tú ganas esa cantidad.","SK_A_A_0802":"[A] [Fase] Dura 10s. Al instante, y cada 2s, inflige 'Congelación' a todos los enemigos. La 'Congelación' inflige además Precisión -35(52.5)%.","SK_A_E_0507":"En Ataque preventivo, aplica Ruptura al enemigo por adelantado. (Daño recibido +25(37.5)%)","SK_A_P_0001":"Aumenta la eficacia de las habilidades de elemento Hielo un 30(45)%.","SK_A_P_0301":"[Escudo] Aumenta la DEF de todos los aliados (excepto la tuya) en tu DEF x0.1(0.15). Además otorga a todos los aliados un Escudo Égida acumulable igual al 7(10.5)% de tu HP. Luego inflige a un enemigo un daño igual al total de escudos aliados creados x0.5(0.75). (Límite de daño = Lv del jugador x300(450))","SK_A_P_0302":"[Lanza] Inflige (FUE + MAG) x10(15) de daño a 2 enemigos.","SK_A_P_0303":"Todos los efectos de Espíritu +70(105)%. Invoca a una pixie que participa en el combate. La pixie a veces bloquea una habilidad en tu lugar.","SK_A_P_0304":"Al ganar una oportunidad de ataque extra, tu siguiente ataque básico o habilidad ignora la DEF del enemigo.","SK_A_P_0305":"Asegura +1 turno por adelantado al entrar en batalla.","SK_A_P_0306":"En Ataque preventivo: Prob. de crítico +25(37.5)%, Precisión +25(37.5)%.","SK_A_P_0307":"Precisión +45(67.5)%. Daño mágico recibido -15(22.5)%.","SK_A_P_0308":"Al entrar en una Puerta, el MP máximo aumenta temporalmente un 50(75)% hasta que termine la Puerta. (Al ser MP máximo, empieza lleno.)","SK_A_P_0701":"Inteligencia +50(75)","SK_A_P_0702":"[P] Cada vez que el MP cae a 20(30) o menos, recuperas 10(15)% de MP. (Se puede desactivar)","SK_A_P_0801":"[P] El MP máximo sube en Lv del jugador x60(90). Cada 1% de MP gastado aumenta el daño de habilidades de Congelación un 1(1.5)%.","SK_A_P_0802":"[P] Turnos enemigos +1. Velocidad de lanzamiento aliada +30(45)%.","SK_A_P_0803":"[P] Durante la batalla, aumenta la FUE y MAG de los aliados en Lv x1(1.5) y reduce las de los enemigos en la misma cantidad. (No se acumula)","SK_A_P_0901":"[Pasiva] Gira una ruleta tras cada ataque básico. La ruleta va de 1 a 7; sacar un 7 otorga una oportunidad de ataque extra. Tu SUE aumenta la probabilidad de sacar 7. (Del 15% hasta un tope del 50%)","SK_A_P_0902":"[P] Actúa primero con un ataque básico al iniciar la batalla. Si varios combatientes poseen esta habilidad, la prioridad va a la mayor AGI y luego a la mayor EXP (el jugador gana los empates).","SK_A_P_0905":"[P] Sentido +{18}.","SK_B_A_0301":"[Espada] Inflige 150% del ATQ Final más estad. totales x1 de daño.","SK_B_A_0302":"[Daga] 100(150)% del ATQ Final + acumulaciones de Persecución x10(15)%. Ganas 1 acumulación de Persecución tras atacar. (Máx. 25) Hasta 350(525)% de daño.","SK_B_A_0303":"[Espadón] Inflige 180(270)% del ATQ Final más FUE x2(3) de daño a todos los enemigos en batalla. Los turnos de los enemigos golpeados se retrasan +2.","SK_B_A_0304":"[Nudilleras] 100(150)% del ATQ Final + daño a todos los enemigos. DEF de los golpeados -35(52.5)%. No puede ser contraatacado.","SK_B_A_0305":"[A distancia] 85(127.5)% del ATQ Final + dispara 6 tiros. Golpea a enemigos aleatorios. Cada impacto reduce la DEF del enemigo golpeado en 1(1.5). (Acumulación infinita.)","SK_B_A_0306":"[Herramienta Mágica] 120(180)% del ATQ Mágico. Inflige Envenenamiento de Maná a los golpeados. Los enemigos con Envenenamiento de Maná reciben daño mágico extra igual a sus acumulaciones x1(1.5)%.","SK_B_A_0501":"[Espada, Espadón] Habilidad de Ataque preventivo. ATQ Final 1.6(2.4) + estad. totales x1(1.5).","SK_B_A_0502":"[Escudo, Lanza, Nudilleras] Habilidad de Ataque preventivo. ATQ Final 1.2(1.8) + estad. totales x1(1.5).","SK_B_A_0503":"[A distancia] Tras eliminar a un objetivo de un solo golpe con un Ataque preventivo, tu siguiente Ataque preventivo gana un bono de ATQ del 15(22.5)%.","SK_B_A_0505":"[Espada, Nudilleras, Daga] Tras esquivar un ataque enemigo, 30(45)% de probabilidad de infligir ATQ Final x1.8(2.7) de daño. Siempre acierta como crítico con Daño crítico +250(375)%. Ganas una acción inmediata.","SK_B_A_0506":"Tras esquivar un ataque enemigo, 30% de probabilidad de otorgar 'Aceleración' a todos los aliados. A partir del 2.º uso, otorga a todos los aliados Evasión +5% acumulable.","SK_B_A_0507":"[A distancia, Herramienta Mágica] Cuando un enemigo lanza un ataque mágico, 15(22.5)% de probabilidad de cancelarlo. Hasta 5 veces por batalla; cuesta 5% de MP por uso. Al cancelar, inflige daño igual al MP gastado por el enemigo x10(15) y retrasa 1 su turno de acción base.","SK_B_A_0801":"[A] Aplica Congelación a todos los enemigos; mínimo 1 garantizado, 35(52.5)% de probabilidad por enemigo. Luego inflige ATQ Mágico x6(9) de daño por cada acumulación de Congelación aplicada. Justo después, ejecuta a los enemigos por debajo del 20(30)% de HP. Lanzamiento de 8s. Utilizable 3 veces por batalla. Cuesta 25% de MP.","SK_B_P_0001":"Con cada ataque básico, un Caballero Sombrío con tus mismas estadísticas realiza un ataque básico extra.","SK_B_P_0301":"Con un [Escudo] equipado: inflige DEF x6(9) de daño a todos los enemigos. Otorga a todos los aliados un Escudo Égida acumulable igual al 5(7.5)% de tu HP.","SK_B_P_0302":"[Lanza] Daño fijo de (FUE+MAG) x5(7.5).","SK_B_P_0303":"Todos los efectos de Espíritu +30(45)%.","SK_B_P_0304":"Asegura 2 turnos por adelantado al entrar en batalla.","SK_B_P_0305":"Precisión, Prob. de crítico y Daño crítico +25(37.5)%.","SK_B_P_0306":"Evasión +45(67.5)%.","SK_B_P_0307":"MP máximo +15(22.5)%.","SK_B_P_0308":"[Escudo] HP máximo +35(52.5)%.","SK_B_P_0701":"[P] Un genio nato. Estad. totales +7(10.5)","SK_B_P_0702":"[P] Añade el 10(15)% de tu estadística más alta a las demás.","SK_B_P_0705":"[P] Precisión +25(37.5)%. Cada ataque fallado otorga Precisión +5(7.5)% adicional. (Acumulación infinita)","SK_B_P_0706":"Ganas AGI igual a Lv del jugador x1(1.5).","SK_B_P_0707":"Ganas ATQ y ATQ Mágico iguales a Lv del jugador x1(1.5).","SK_B_P_0708":"Ganas SUE y SEN iguales a Lv del jugador x0.5(0.75).","SK_B_P_0709":"Ganas INT igual a Lv del jugador x1(1.5).","SK_B_P_0711":"[P] Cuando un aliado está al 10(15)% de HP o menos, restaura el HP del aliado con menos HP un 10(15)% (sin lanzamiento). 5 veces por batalla.","SK_B_P_0712":"[P] Nacido con fuerza destructiva. La FUE aumenta 3(4.5) cada 4 niveles de jugador. Pasiva.","SK_B_P_0801":"Aumenta el daño final de la magia de elemento Hielo un 35(52.5)%.","SK_B_P_0802":"[P] Aplicar Congelación añade 1 acumulación extra.","SK_B_P_0905":"[P] Sentido +{15}.","SK_C_A_0301":"[Espada, Espadón] 145% del ATQ Final. Golpea hasta 3 enemigos a la vez.","SK_C_A_0302":"[Daga] 120% del ATQ Final. 15% de probabilidad de ganar una oportunidad de ataque extra tras atacar.","SK_C_A_0303":"[Lanza] 125% del ATQ Final. El 15% del daño se aplica como daño fijo. Reduce la DEF del enemigo golpeado un 25%.","SK_C_A_0304":"[Nudilleras] 90% del ATQ Final x2 golpes. Golpea alternando puño izquierdo y derecho. No puede ser contraatacado.","SK_C_A_0305":"[A distancia] 135% del ATQ Final. Inflige daño extra igual a FUE +1.5. (Aditivo)","SK_C_A_0306":"[Escudo] 150% del ATQ Final más daño fijo extra igual a DEF x5.","SK_C_A_0307":"[A distancia] 120% del ATQ Final x2 golpes. Si el primer golpe mata al enemigo, el daño sobrante pasa a otro enemigo.","SK_C_A_0308":"[Herramienta Mágica] 85% del ATQ Mágico. Inflige 'Envenenamiento de Maná' a los golpeados. Los enemigos envenenados reciben daño cada segundo (10 turnos) según el MAG del lanzador x1. (Cinco magos golpeando con 100 infligen 500 de daño por segundo. Solo se acumula una vez por jugador.)","SK_C_A_0501":"[Daga] Habilidad de Ataque preventivo. ATQ Final 1.5. Ignora un 25% de reducción de daño (aditiva) como bono.","SK_C_A_0502":"Si te atacan antes de actuar, ganas Impulso de Turno +3 (3 turnos que se usan primero).","SK_C_A_0504":"[Espada, Espadón, Nudilleras, Lanza, Daga] Una vez por batalla, 10% de probabilidad al esquivar un ataque enemigo. Inflige 150% del ATQ Final como crítico garantizado, te otorga 'Aceleración' (Evasión +25%, Precisión +25%, 30 turnos) y ganas una acción inmediata.","SK_C_A_0505":"[Especial] Requiere un [Escudo] y un usuario de [A distancia] o [Herramienta Mágica] en el grupo; se activa hasta 3 veces por batalla. Al ser objetivo, 60% de probabilidad de ignorar el daño, y cada aliado con [A distancia] o [Herramienta Mágica] golpea a todos los enemigos con (ATQ Final + ATQ Mágico) x2 de daño.","SK_C_A_0506":"Probabilidad de Contraataque +2%. Cuando un Contraataque inflige daño: daño final +10%, Precisión +5%, Prob. de crítico +5%.","SK_C_A_0801":"[A] Invoca un Orbe de Escarcha en el campo. El orbe permanece junto al jugador irradiando poder continuo. tivos con el HP lleno. Lo mismo aplica contra enemigos al 25% de HP o menos.","SK_F_P_0723":"[P] Cuando tu HP es menor que el de tu objetivo, Daño crítico +25%.","SK_F_P_0801":"ATQ Mágico +15, MP máximo +50","SK_F_P_0802":"Daño de elemento Hielo +15%","SK_F_P_0803":"[P] Aumenta la EXP obtenida un {5}%.","SK_F_P_0904":"[P] Ganas {1} Cristal por cada monstruo salvaje abatido.","SK_F_P_0905":"[P] Sentido +{3}.","SK_SS_P_0302":"[Espada/Espadón/Daga] Al equiparlo, empuñas dos hojas. Suma el 100 % del ATQ final de tu arma de tipo espada más fuerte sin equipar a tu ATQ final (+5 % por nivel de mejora), y además puedes obtener el efecto único de esa espada.","SK_SS_P_0303":"Cancela a la fuerza el ataque básico del enemigo. (20% de probabilidad de activación)","SK_SS_P_0304":"Cuando el enemigo está lanzando, lo cancela a la fuerza y le inflige aturdimiento. (20% de probabilidad de activación)","SK_SS_P_0301":"[Herramienta Mágica] Al atacar, inflige daño igual al 20% del MP restante del enemigo y recuperas esa cantidad de MP.","SK_SS_A_0501":"[Espada/Daga/Lanza] 5 veces por batalla: al ser objetivo, 40% de probabilidad de reducir el daño a 1 y ganar 3 turnos.","SK_S_P_0971":"[P] [Daga/Arco] Al equiparlo, AGI +50. En combate, obtienes un 5 % de evasión aparte que se comprueba primero, sin importar la precisión del atacante."},"kind":{"preempt":"Ataque preventivo","basic":"Ataque básico","counter":"Contraataque","auto":"Activación automática","active":"Activa","passive":"Pasiva"},"weapon":{"sword":"Espada","greatsword":"Espadón","shield":"Escudo","orb":"Foco mágico","gun":"Arma de fuego","bow":"Arco","spear":"Lanza","dagger":"Daga","blunt":"Maza","knuckle":"Manoplas","crossbow":"Ballesta"},"src":{"dexui.src.create":"Creación de habilidad","dexui.src.grant":"Otorgado","dexui.src.base":"Desde el inicio","dexui.src.explore":"Exploración","dexui.src.book":"Libro de habilidad"}},"it":{"name":{"SK_EX_A_0001":"Lama della Luna Nera","SK_EX_A_0002":"Lampo della Notte Bianca","SK_EX_A_00 ploratore","SK_F_A_0301":"Fendente Ampio","SK_F_A_0501":"Carica","SK_F_A_0504":"Parata","SK_F_A_0505":"Deviazione","SK_F_A_0506":"Respinta","SK_F_A_0507":"Manovra Evasiva","SK_F_A_0509":"Colpo di Risposta","SK_F_A_0701":"Spezza Scudo","SK_F_A_0702":"Colpo Strappato","SK_F_A_0703":"Palla di Fuoco","SK_F_A_0704":"Fulmine","SK_F_A_0801":"Lama di Brina","SK_F_A_0802":"Lancia di Ghiaccio","SK_F_A_0803":"Scheggia di Brina","SK_F_A_0804":"Spirito del Vento","SK_F_A_0805":"Evocazione della Fiamma","SK_F_A_0806":"Spirito dell'Acqua","SK_F_A_0807":"Spirito della Terra","SK_F_E_0503":"Audacia","SK_F_P_0001":"Concentrazione","SK_F_P_0002":"Allerta","SK_F_P_0003":"Arti Marziali","SK_F_P_0004":"Arte dello Spadone","SK_F_P_0005":"Recupero in Battaglia","SK_F_P_0006":"Attacco Combo","SK_F_P_0007":"Recupero di Mana","SK_F_P_0701":"Posizione Perfetta","SK_F_P_0702":"Sfera di Risonanza","SK_F_P_0703":"Velocità Innata","SK_F_P_0704":"Frutto dell'Allenamento","SK_F_P_0705":"Tempra","SK_F_P_0706":"Ferma Volontà","SK_F_P_0707":"Trifoglio","SK_F_P_0708":"Visualizzazione","SK_F_P_0709":"Materializzazione","SK_F_P_0711":"Smantellamento","SK_F_P_0712":"Bersaglio Designato","SK_F_P_0714":"Zona Interdetta","SK_F_P_0716":"Pugno Potente","SK_F_P_0719":"Taglio Concatenato","SK_F_P_0720":"Talento di Spada","SK_F_P_0722":"Talento dell'Assassino","SK_F_P_0723":"Ribaltamento","SK_F_P_0801":"Affinità col Freddo","SK_F_P_0802":"Maestria di Congelamento","SK_F_P_0803":"Crescita Fuori dal Comune","SK_F_P_0904":"Collezionista di Frammenti","SK_F_P_0905":"Esploratore","SK_SS_P_0302":"Doppia Spada","SK_SS_P_0303":"Spezzaregole","SK_SS_P_0304":"Spezzaincantesimi","SK_SS_P_0301":"Drenaggio di Mana","SK_SS_A_0501":"Opportunista","SK_S_P_0971":"Arte di combattimento della volpe"},"desc":{"SK_EX_A_0001":"Passiva. Ti conferisce 'Luna Nera'. I nemici che ti attaccano subiscono precisione -25%, mentre i tuoi attacchi infliggono danno extra pari ad ATT magico x3.","SK_EX_A_0002":"Attiva di elemento Luce.\nInizia il lancio nel momento in cui la battaglia comincia, su un lancio separato. Dopo 20 turni, colpisce tutti i nemici con un attacco magico pari a tutti i danni che hai inflitto nella battaglia. In seguito i tuoi PM vengono azzerati, poi recuperano del 10(15)% per turno per 10 turni.","SK_EX_A_0006":"[Spada] I petali cadono come pioggia. Gli attacchi base colpiscono 3 nemici casuali contemporaneamente, infliggendo a ciascuno danno pari ad ATT finale x3(4.5) + tutte le statistiche x3(4.5). Ogni colpo aggiunge al bersaglio 10 cariche di Piena fioritura; a 60 cariche sboccia e subisce danni pari al 30% dei suoi PS massimi (ridotti dalla DIF). Se in quel momento i suoi PS sono pari o inferiori al 30% dei PS massimi, viene giustiziato ignorando la DIF. I danni della fioritura non possono superare 30 volte i tuoi PS massimi e non possono essere critici.","SK_EX_A_0007":"[P] Con una [Spada], un [Pugnale] o uno [Spadone] equipaggiato: gli attacchi base diventano di elemento Fulmine. Precisione +25(37.5)%, velocità d'attacco +80(120)%, danno critico +80(120)%.","SK_EX_A_0012":"Attiva di elemento Oscurità (istantanea).\nAl lancio, inizia un incanalamento di 15 turni (nessun'altra azione). Ogni turno infligge danno pari a MAG x N (N = turni trascorsi) a tutti i nemici e consuma il 6% di mana per turno. L'incanalamento termina in anticipo se il mana si esaurisce.\nAl completamento dell'incanalamento, fino a fine battaglia i tuoi attacchi base ottengono danno extra pari a MAG x8 e colpiscono due volte.","SK_EX_A_0015":"[P] Con una [Spada], un [Pugnale] o uno [Spadone] equipaggiato: gli attacchi base vanno sempre a segno e le abilità la cui arma principale è [Spada], [Pugnale] o [Spadone] infliggono il 600(900)% di danni in più.","SK_EX_A_0501":"[Tutte le armi] Abilità di Attacco preventivo. Lv x100(150) + tutte le statistiche x2(3). Costa il 3% dei PM.","SK_EX_A_0502":"[A distanza] ATT finale x120(180)% come danno fisso. I nemici colpiti dal tuo Attacco preventivo a inizio battaglia vengono marchiati con 'Visione del Futuro' e subiscono lo stesso danno ripetutamente ogni secondo.","SK_EX_A_0503":"[Tutte le armi] Abilità di Attacco preventivo. Tutte le statistiche x3. Attaccando un mostro selvatico, entri in una battaglia contro 1-6 esemplari di quel mostro. A inizio battaglia, infligge danno pari a tutte le statistiche x3 a tutti i nemici.","SK_EX_A_0504":"Gli Attacchi preventivi sui mostri selvatici vincono all'istante la battaglia. A inizio battaglia, conferisce a tutti gli alleati evasione +25%.","SK_EX_A_0505":"Quando sei bersaglio, 100% di probabilità di infliggere all'attaccante danno pari al danno ricevuto. Poi recuperi il 90(135)% del danno subito.","SK_EX_P_0303":"[P] Dopo un attacco base, se il bersaglio sopravvive, ogni ritardo pre/post scompare e attacchi di nuovo automaticamente 1 turno dopo senza scegliere un'azione. Si ripete una volta per turno finché il bersaglio non cade, poi la scelta d'azione e l'intervallo d'azione originale tornano normali.","SK_EX_P_0304":"[P] Ogni volta che agisci, i PM massimi aumentano del 1(1.5)% (composto). Contemporaneamente infligge a tutti i nemici danno magico nel tempo con potenza pari ai tuoi PM massimi aumentati. Questo danno è influenzato dalla DIF magica e dalla riduzione del danno del bersaglio.","SK_EX_P_0701":"Anche i mostri hanno statistiche. Aggiunge alle tue statistiche il 10% di ciascuna delle 6 statistiche del nemico. Al livello 100, aggiunge alle tue statistiche il 110% delle statistiche del mostro.","SK_EX_P_0801":"[P] A inizio battaglia, marchia tutti i nemici con 'Epilogo'. Dopo 20 secondi, infligge danno pari a Lv x100 + MAG x70 a tutti i nemici e li stordisce per 3 s. Contro i nemici afflitti da 'Congelamento', il danno diventa danno fisso.","SK_EX_P_0802":"Evoca 3 Sfere di Brina a inizio battaglia, ignorando il limite di 1 sfera. Inizi la battaglia con PM allo 0%.","SK_SSS_P_0905":"[P] SEN +{27}.","SK_SS_P_0905":"[P] SEN +{24}.","SK_SS_P_0951":"[P] Quando un nemico resta con 1 PS, ti conferisci 3 opportunità di attacco base. Questa soglia sale del 5% a ogni Lv di Disprezzo; con Disprezzo Lv5 ottieni 3 opportunità di attacco base quando un nemico ha il 25% dei PS o meno.","SK_A_A_0801":"Evoca la Regina della Brina accanto al giocatore. Combatte al tuo fianco, lanciando un incantesimo casuale di elemento Congelamento di rango F-A ogni 2 tuoi turni d'azione. Le sue statistiche sono il 75(112.5)% delle tue. La Regina della Brina non può essere dissolta. Lancio 3(2) s, costa il 25(17)% dei PM. Non può essere evocata due volte.","SK_EX_A_0003":"[Spada] Attiva prolungata (istantanea).\nAl lancio, per 20 turni un colpo meteorico di FOR x20(30) colpisce un nemico casuale ogni turno.\nCosta il 3% di mana per turno; l'incanalamento termina immediatamente se il mana si esaurisce, vieni stordito o scegli un'altra abilità.","SK_EX_A_0017":"[Spada]\nQuando un nemico sferra un attacco base, 50(75)% di probabilità di annullarlo e infliggergli danno pari a tutte le statistiche x10(15). Tempo di ricarica interno di 3 turni.","SK_S_A_0501":"Gli Attacchi preventivi in posizione DPS corpo a corpo infliggono danno extra pari a (FOR+AGI) x3(4.5).","SK_S_A_0502":"[Spada, Pugnale, Spadone, Lancia] Una volta per battaglia, quando sei bersaglio, 5(7.5)% di probabilità di ridurre il danno a 1 e infliggere al nemico danno pari ad ATT finale x10(15).","SK_S_A_0801":"[A] [Fase] Lancia continuamente per 15 secondi. I tuoi PS restano fissati a 1 durante il lancio. Finché il lancio prosegue, attacca un nemico casuale con 6(9) Schegge di Brina ogni 3 turni. (Il lancio si interrompe se la Fase viene rimossa, il buff dissolto o vieni stordito.) Lancio 2 s.","SK_S_A_0902":"[A] Infligge il {10}% dei PS massimi come danno a tutti i nemici. (Danno max per colpo = tutte le statistiche x 50)","SK_S_P_0502":"[Spada, Pugnale, Spadone] Aumenta gli effetti della Maestria di Spada del 50(75)%. Precisione, prob. critico e danno critico +25(37.5)%. Ottiene un ulteriore 2(3)x dell'ATT dell'arma nel calcolo dell'ATT finale.","SK_S_P_0801":"[P] ATT magico +50(75)%, PM max +30(45)%","SK_S_P_0905":"[P] SEN +{21}.","SK_S_P_0951":"[P] Uccidere un nemico con un Contrattacco conferisce un'opportunità d'attacco extra.","SK_S_P_0962":"[P] Uccidere un nemico conferisce 1 opportunità d'attacco extra.","SK_A_A_0301":"[Spada] Colpisce tutti i nemici due volte. 150(225)% dell'ATT finale più danno pari a tutte le statistiche x1(1.5).","SK_A_A_0302":"[Spada, Pugnale] Infligge il 100(150)% dell'ATT finale più danno pari ad AGI x12~18(18~27). Resti immobilizzato per 3 turni dopo l'attacco.","SK_A_A_0303":"[Pugnale] 100(150)% dell'ATT finale. Danno critico 500(750)%.","SK_A_A_0304":"[Spadone] Colpisce fino a 6 nemici contemporaneamente. 220(330)% dell'ATT finale più danno pari a FOR x5(7.5). Riduce la DIF dei nemici colpiti del 15(22.5)%. (Si rinnova, non si accumula)","SK_A_A_0305":"[Tirapugni] Colpisce tutti i nemici una volta. Distrugge tutte le barriere dei bersagli, poi infligge il 220(330)% dell'ATT finale come danno. Può essere bloccato dal Contrattacco.","SK_A_A_0306":"[A distanza] Scatena la tua ultima fiamma rimasta. 320(480)% dell'ATT finale. Ritardo di recupero di 5 turni. Il danno finale aumenta in base ai PM mancanti dal massimo. (+1(1.5)% ogni 1% mancante)","SK_A_A_0307":"[Strumento magico] 120(180)% dell'ATT magico. Infligge Avvelenamento da Mana. Infligge lo stesso danno a ogni nemico avvelenato dal mana. Se questo attacco uccide un nemico, recuperi PM pari ai PM residui del nemico.","SK_A_A_0501":"[Spada] Abilità di Attacco preventivo. ATT finale 1.8(2.7) + tutte le statistiche x1(1.5). Costa il 3% dei PM. (Aura di spada)","SK_A_A_0504":"[Lancia] Abilità di Attacco preventivo. Danno fisso pari a (FOR+MAG) x3.5(5.25); va sempre a segno come colpo critico. Costa il 15% dei PM. (Lancio della lancia)","SK_A_A_0506":"[Scudo] Abilità di Attacco preventivo. Danno pari a DIF x5(7.5). Costa il 4% dei PM. (Pietra scagliata)","SK_A_A_0508":"[Scudo] Quando sei bersaglio, recuperi istantaneamente il 2(3)% dei PS massimi. Se sei l'ultimo alleato in piedi, ogni colpo subito infligge anche a tutti i nemici danno pari ai PS recuperati.","SK_A_A_0509":"[Lancia, Strumento magico] Quando un alleato è bersaglio e i suoi PS sono al 15(22.5)% o meno, ripristina istantaneamente i suoi PS della tua FRT x8(12). Costa l'8% dei PM per alleato; non si attiva senza PM da spendere. Il danno subito dall'alleato curato è ridotto del 25(37.5)% per la battaglia.","SK_A_A_0510":"Evasione +30(45)%. Quando schivi con successo, insegui l'attaccante e infliggi il 80(120)% del tuo ATT finale come danno.","SK_A_A_0511":"Quando sei bersaglio di un attacco con abilità o magico, riduce quel danno del 80(120)%. Poi riduce le statistiche base dell'attaccante del 30(45)% fino a fine battaglia, e tu ottieni quella quantità.","SK_A_A_0802":"[A] [Fase] Dura 10 s. Subito, e ogni 2 s, infligge 'Congelamento' a tutti i nemici. 'Congelamento' infligge inoltre precisione -35(52.5)%.","SK_A_E_0507":"Con un Attacco preventivo, pre-applica Squarcio al nemico. (Danno subito +25(37.5)%)","SK_A_P_0001":"Aumenta l'efficacia delle abilità di elemento Ghiaccio del 30(45)%.","SK_A_P_0301":"[Scudo] Aumenta la DIF di tutti gli alleati (tranne la tua) della tua DIF x0.1(0.15). Inoltre conferisce a tutti gli alleati una Barriera Egida cumulabile pari al 7(10.5)% dei tuoi PS. Infligge poi a un nemico danno pari al totale delle barriere alleate create x0.5(0.75). (Tetto danni max = Lv giocatore x300(450))","SK_A_P_0302":"[Lancia] Infligge danno pari a (FOR + MAG) x10(15) a 2 nemici.","SK_A_P_0303":"Tutti gli effetti degli Spiriti +70(105)%. Evoca una pixie che partecipa al combattimento. La pixie a volte blocca un'abilità al posto tuo.","SK_A_P_0304":"Quando ottieni un'opportunità d'attacco extra, il tuo prossimo attacco base o abilità ignora la DIF del nemico.","SK_A_P_0305":"Ti assicuri +1 turno in anticipo entrando in battaglia.","SK_A_P_0306":"Con Attacco preventivo: prob. critico +25(37.5)%, precisione +25(37.5)%.","SK_A_P_0307":"Precisione +45(67.5)%. Danno magico subito -15(22.5)%.","SK_A_P_0308":"Entrando in un portale, i PM massimi aumentano temporaneamente del 50(75)% fino alla fine del portale. (Essendo PM massimi, partono già pieni.)","SK_A_P_0701":"INT +50(75)","SK_A_P_0702":"[P] Ogni volta che i PM scendono a 20(30) o meno, recuperi il 10(15)% dei PM. (Disattivabile)","SK_A_P_0801":"[P] I PM massimi aumentano di Lv giocatore x60(90). Ogni 1% di PM speso aumenta il danno delle abilità di elemento Congelamento del 1(1.5)%.","SK_A_P_0802":"[P] Turni nemici +1. Velocità di lancio degli alleati +30(45)%.","SK_A_P_0803":"[P] In battaglia, aumenta le statistiche FOR e MAG degli alleati di Lv x1(1.5) e riduce quelle dei nemici della stessa quantità. (Non cumulabile)","SK_A_P_0901":"[Passiva] Fa girare una roulette dopo ogni attacco base. La roulette va da 1 a 7; ottenere un 7 conferisce un'opportunità d'attacco extra. La tua FRT aumenta le probabilità del 7. (Dal 15% fino a un tetto del 50%)","SK_A_P_0902":"[P] Agisci per primo con un attacco base a inizio battaglia. Se più combattenti possiedono questa abilità, la priorità va a chi ha AGI più alta, poi EXP più alta (a parità vince il giocatore).","SK_A_P_0905":"[P] SEN +{18}.","SK_B_A_0301":"[Spada] Infligge il 150% dell'ATT finale più danno pari a tutte le statistiche x1.","SK_B_A_0302":"[Pugnale] 100(150)% dell'ATT finale + cariche di Inseguimento x10(15)%. Ottieni 1 carica di Inseguimento dopo l'attacco. (Max 25) Fino a 350(525)% di danno.","SK_B_A_0303":"[Spadone] Infligge il 180(270)% dell'ATT finale più danno pari a FOR x2(3) a tutti i nemici in battaglia. I turni dei nemici colpiti vengono ritardati di +2.","SK_B_A_0304":"[Tirapugni] 100(150)% dell'ATT finale + danno a tutti i nemici. DIF dei nemici colpiti -35(52.5)%. Non può essere contrattaccato.","SK_B_A_0305":"[A distanza] 85(127.5)% dell'ATT finale + spara 6 colpi. Colpisce nemici casuali. Ogni colpo riduce la DIF del nemico colpito di 1(1.5). (Si accumula all'infinito.)","SK_B_A_0306":"[Strumento magico] 120(180)% dell'ATT magico. Infligge Avvelenamento da Mana ai nemici colpiti. I nemici con Avvelenamento da Mana subiscono danno magico extra pari alle cariche di Avvelenamento da Mana x1(1.5)%.","SK_B_A_0501":"[Spada, Spadone] Abilità di Attacco preventivo. ATT finale 1.6(2.4) + tutte le statistiche x1(1.5).","SK_B_A_0502":"[Scudo, Lancia, Tirapugni] Abilità di Attacco preventivo. ATT finale 1.2(1.8) + tutte le statistiche x1(1.5).","SK_B_A_0503":"[A distanza] Dopo aver eliminato un bersaglio in un colpo con un Attacco preventivo, il tuo prossimo Attacco preventivo ottiene un bonus di ATT del 15(22.5)%.","SK_B_A_0505":"[Spada, Tirapugni, Pugnale] Dopo aver schivato un attacco nemico, 30(45)% di probabilità di infliggere danno pari ad ATT finale x1.8(2.7). Va sempre a segno come critico con danno critico +250(375)%. Ottieni un'azione immediata.","SK_B_A_0506":"Dopo aver schivato un attacco nemico, 30% di probabilità di conferire 'Accelerazione' a tutti gli alleati. Dal 2° utilizzo in poi, conferisce a tutti gli alleati evasione +5% cumulabile.","SK_B_A_0507":"[A distanza, Strumento magico] Quando un nemico lancia un attacco magico, 15(22.5)% di probabilità di annullarlo. Fino a 5 volte per battaglia; costa il 5% dei PM per utilizzo. All'annullamento, infligge danno pari ai PM spesi dal nemico x10(15) e ritarda di 1 il turno d'azione base del nemico.","SK_B_A_0801":"[A] Applica Congelamento a tutti i nemici; almeno 1 garantito, 35(52.5)% di probabilità ciascuno. Poi infligge danno pari ad ATT magico x6(9) per carica di Congelamento applicata. Subito dopo, giustizia i nemici sotto il 20(30)% dei PS. Lancio 8 s. Utilizzabile 3 volte per battaglia. Costa il 25% dei PM.","SK_B_P_0001":"A ogni attacco base, un Cavaliere Ombra con le tue stesse statistiche sferra un attacco base aggiuntivo.","SK_B_P_0301":"Con uno [Scudo] equipaggiato: infligge danno pari a DIF x6(9) a tutti i nemici. Conferisce a tutti gli alleati una Barriera Egida cumulabile pari al 5(7.5)% dei tuoi PS.","SK_B_P_0302":"[Lancia] Danno fisso pari a (FOR+MAG) x5(7.5).","SK_B_P_0303":"Tutti gli effetti degli Spiriti +30(45)%.","SK_B_P_0304":"Ti assicuri 2 turni in anticipo entrando in battaglia.","SK_B_P_0305":"Precisione, prob. critico e danno critico +25(37.5)%.","SK_B_P_0306":"Evasione +45(67.5)%.","SK_B_P_0307":"PM massimi +15(22.5)%.","SK_B_P_0308":"[Scudo] PS massimi +35(52.5)%.","SK_B_P_0701":"[P] Un genio nato. Tutte le statistiche +7(10.5)","SK_B_P_0702":"[P] Aggiunge il 10(15)% della tua statistica più alta alle altre statistiche.","SK_B_P_0705":"[P] Precisione +25(37.5)%. Ogni attacco mancato conferisce un'ulteriore precisione +5(7.5)%. (Si accumula all'infinito)","SK_B_P_0706":"Ottieni AGI pari a Lv giocatore x1(1.5).","SK_B_P_0707":"Ottieni ATT e ATT magico pari a Lv giocatore x1(1.5).","SK_B_P_0708":"Ottieni FRT e PER pari a Lv giocatore x0.5(0.75).","SK_B_P_0709":"Ottieni INT pari a Lv giocatore x1(1.5).","SK_B_P_0711":"[P] Quando un alleato è al 10(15)% dei PS o meno, ripristina i PS dell'alleato con meno PS del 10(15)% (senza lancio). 5 volte per battaglia.","SK_B_P_0712":"[P] Nato con una forza distruttiva. La FOR aumenta di 3(4.5) ogni 4 livelli del giocatore. Passiva.","SK_B_P_0801":"Aumenta il danno finale della magia di elemento Ghiaccio del 35(52.5)%.","SK_B_P_0802":"[P] Applicare Congelamento aggiunge 1 carica extra.","SK_B_P_0905":"[P] SEN +{15}.","SK_C_A_0301":"[Spada, Spadone] 145% dell'ATT finale. Colpisce fino a 3 nemici contemporaneamente.","SK_C_A_0302":"[Pugnale] 120% dell'ATT finale. 15% di probabilità di ottenere un'opportunità d'attacco extra dopo l'attacco.","SK_C_A_0303":"[Lancia] 125% dell'ATT finale. Il 15% del danno viene inflitto come danno fisso. Riduce la DIF del nemico colpito del 25%.","SK_C_A_0304":"[Tirapugni] 90% dell'ATT finale x2 colpi. Colpisce alternando sinistro e destro. Non può essere contrattaccato.","SK_C_A_0305":"[A distanza] 135% dell'ATT finale. Danno extra pari a FOR +1,5. (Additivo)","SK_C_A_0306":"[Scudo] 150% dell'ATT finale più danno fisso extra pari a DIF x5.","SK_C_A_0307":"[A distanza] 120% dell'ATT finale x2 colpi. Se il primo colpo uccide il nemico, il danno residuo si trasferisce a un altro nemico.","SK_C_A_0308":"[Strumento magico] 85% dell'ATT magico. Infligge 'Avvelenamento da Mana' ai nemici colpiti. I nemici avvelenati dal mana subiscono danni ogni secondo (10 turni) in base al MAG del lanciatore x1. (Cinque maghi che colpiscono con 100 infliggono 500 danni al secondo. Si accumula una sola volta per giocatore.)","SK_C_A_0501":"[Pugnale] Abilità di Attacco preventivo. ATT finale 1,5. Ignora come bonus il 25% della riduzione del danno (additivo).","SK_C_A_0502":"Se vieni attaccato prima di agire, ottieni Impulso di Turno +3 (3 turni usati per primi).","SK_C_A_0504":"[Spada, Spadone, Tirapugni, Lancia, Pugnale] Una volta per battaglia, 10% di probabilità di attivazione quando schivi un attacco nemico. Infligge il 150% dell'ATT finale come critico garantito, ti conferisce 'Accelerazione' (evasione +25%, precisione +25%, 30 turni) e ottieni un'azione immediata.","SK_C_A_0505":"[Speciale] Richiede nel gruppo uno [Scudo] più un utilizzatore [A distanza] o di [Strumento magico]; si attiva fino a 3 volte per battaglia. Quando sei bersaglio, 60% di probabilità di ignorare il danno e ogni alleato equipaggiato con [A distanza] o [Strumento magico] colpisce tutti i nemici con danno pari a (ATT finale + ATT magico) x2.","SK_C_A_0506":"Probabilità di Contrattacco +2%. Quando un Contrattacco infligge danni: danno finale +10%, precisione +5%, prob. critico +5%.","SK_C_A_0801":"[A] Evoca una Sfera di Brina sul campo. La sfera resta accanto al giocatore, irradiando potere continuo. PS Sfera di Brina = MAG giocatore x15 + Lv x100. Ogni 2 secondi, infligge a tutti i nemici danno nel tempo pari al MAG del lanciatore x1. I nemici colpiti hanno il 25% di probabilità di subire 'Congelamento'. [Strumento magico] Quando il giocatore viene colpito, la Sfera di Brina subisce il colpo per prima. L'attaccante riceve 1 accumulo di 'Congelamento' prima del calcolo dei danni. Ogni volta che sul campo si aggiunge un accumulo di Congelamento, ottieni uno scudo pari a Magia x0,1. Se ne può evocare solo 1 per battaglia. Se viene distrutta, è riutilizzabile dopo 15 secondi.","SK_C_A_0802":"[A] Infligge 2.800 danni a tutti i nemici. Applica 1 Congelamento. Prob. critico 25%.","SK_C_E_0503":"Con un Attacco preventivo, precisione +20%.","SK_C_P_0001":"Passiva attivata. Quando vieni attaccato, consuma il 10% dei PM attuali per ridurre di altrettanto il danno subito.","SK_C_P_0212":"A ogni attacco base, un'Ombra sferra un colpo aggiuntivo che infligge il 15% del danno.","SK_C_P_0301":"[Spada, Pugnale, Tirapugni] I nemici colpiti subiscono danni continui pari ad AGI x0,1 ogni 3 secondi (30 turni).","SK_C_P_0302":"Con una [Spada] equipaggiata, danno dell'attacco base e delle abilità +20%. Ottieni precisione +25%.","SK_C_P_0303":"Con i [Tirapugni] equipaggiati, danno delle abilità +80%. Tempo di lancio -1 turno.","SK_C_P_0304":"Con uno [Spadone] equipaggiato, aumenta la FOR di Lv giocatore x1.","SK_C_P_0305":"Con uno [Scudo] equipaggiato, aumenta la DIF di FOR x5. Danno subito -35%. Ottieni *Provocazione*. Ignora i danni pari o inferiori alla tua DIF. (Danno ignorato = 1 danno)","SK_C_P_0306":"Con un [Pugnale] equipaggiato, aumenta l'AGI di Lv giocatore x1.","SK_C_P_0307":"Con una [Lancia] equipaggiata, ottieni danno finale +15% e riduzione del danno +15%.","SK_C_P_0308":"Con un'arma [A distanza] equipaggiata, ATT finale +15%.","SK_C_P_0309":"Con uno [Strumento magico] equipaggiato, recuperi subito il 10% dei PM spesi. Danno delle abilità +30%.","SK_C_P_0701":"[P] FRT +30","SK_C_P_0702":"[A] Conferisce a tutti gli alleati una barriera pari a MAG x3 + PS del lanciatore x0,3. Lancio 3 s. PM 60.","SK_C_P_0703":"[A] Consuma l'intera barriera per infliggere danno pari al valore della barriera. Lancio 1 s. PM 25.","SK_C_P_0706":"[P] La tua statistica più alta +35.","SK_C_P_0707":"[A] Se i PS massimi del nemico superano i tuoi, infligge la differenza di PS x0,5 come danno fisico. (Tetto danni max = tutte le statistiche x8). PM 50.","SK_C_P_0709":"[P] Ottieni evasione pari a Lv giocatore x0,5%. (50% al livello 99)","SK_C_P_0712":"[P] Recuperi il 3% del danno che infliggi con la magia.","SK_C_P_0801":"Aumenta il danno finale della magia di elemento Congelamento del 7% e la durata del Congelamento del 20%.","SK_C_P_0802":"A inizio battaglia, applica Congelamento (E) a tutti i nemici con il 15% di probabilità ciascuno. Le abilità di Congelamento costano il 2% di PM in meno.","SK_C_P_0803":"[P] Prob. critico +25% sugli attacchi di elemento Ghiaccio.","SK_C_P_0804":"[P] [Lancia] Gli attacchi base e con abilità di elemento Ghiaccio infliggono un 35% di danno magico extra. Danno subito -10%.","SK_C_P_0805":"[P] Riduce il danno magico subito del 25%. Ogni volta che la riduzione si attiva, cala di 1 punto percentuale, fino a un minimo dell'1%. 25% di probabilità di resistere al Congelamento.","SK_C_P_0806":"[P] Aumenta l'EXP ottenuta del {25}%.","SK_C_P_0905":"[P] SEN +{12}.","SK_D_A_0001":"[A] Scaglia una freccia di ghiaccio su un nemico infliggendo il 280% dell'ATT magico. Lancio 5 s. Costa il 15% dei PM.","SK_D_A_0301":"[Spada, Spadone] 125% dell'ATT finale. Colpisce fino a 3 nemici contemporaneamente.","SK_D_A_0302":"[Tirapugni] 115% dell'ATT finale. Danno extra pari al 3% dei PS attuali del nemico. (Max 1200)","SK_D_A_0303":"[A distanza] 110% dell'ATT finale. Lancio post-attacco -10% (priorità di turno). Infligge *Ferita* al nemico colpito. Tutti gli attacchi fisici infliggono un 5% di danno extra ai nemici feriti.","SK_D_A_0304":"[Pugnale] 55% dell'ATT finale x2 colpi. Sferra due attacchi base. Il secondo colpo ignora il 35% della DIF.","SK_D_A_0305":"[Scudo] 110% dell'ATT finale. Danno extra pari a DIF x3. Colpisce fino a 3 nemici contemporaneamente. Riduce la DIF dei nemici colpiti del 25%.","SK_D_A_0306":"[Lancia] 120% dell'ATT finale. I nemici colpiti subiscono precisione -25% e velocità d'attacco/di lancio -25%. (Non cumulabile)","SK_D_A_0307":"[Strumento magico] 115% dell'ATT magico. I nemici colpiti subiscono resistenza magica -50%.","SK_D_A_0501":"[A distanza] Abilità di Attacco preventivo. ATT finale 1,4. Bonus prob. critico +15% applicato.","SK_D_A_0503":"Con un Attacco preventivo riuscito: INT +10 per la battaglia.","SK_D_A_0504":"Con un Attacco preventivo riuscito: FRT e PER +15 per la battaglia.","SK_D_A_0505":"Gli Attacchi preventivi ignorano il 20% della DIF del nemico.","SK_D_A_0506":"[Strumento magico] Quando un alleato è bersaglio, 30% di probabilità di infliggere 'Congelamento' al nemico. I nemici congelati subiscono precisione -25%. Le cariche di Congelamento durano 10 secondi; ogni 3 cariche infliggono danno pari a MAG x1.","SK_D_A_0507":"[Spada, Pugnale, Spadone, Tirapugni, Lancia] Una volta per battaglia, quando un colpo ridurrebbe i PS a 0, i PS restano fissi a 1. Poi annulli il colpo successivo, infliggi al nemico il 150% dell'ATT finale come danno e recuperi i PS fino al 15%.","SK_D_A_0801":"[A] Ti conferisce una barriera pari ad ATT magico x2. Lancio 2 s. Costa il 15% dei PM.","SK_D_A_0802":"[A] Infligge danno pari ad ATT magico x3 a tutti i nemici e applica 'Congelamento' 3 volte. Lancio 5 s. Costa il 15% dei PM.","SK_D_P_0001":"Precisione +15. (Si somma a Concentrazione)","SK_D_P_0002":"La velocità d'attacco aumenta gradualmente a ogni turno di battaglia. +0,1% per turno (10 turni = 1%).","SK_D_P_0301":"Con una [Spada] equipaggiata, danno delle abilità +25%. Riduce di 3 turni il ritardo post-attacco.","SK_D_P_0302":"Con i [Tirapugni] equipaggiati, danno delle abilità +30%. Tempo di lancio -1 turno.","SK_D_P_0303":"Con uno [Spadone] equipaggiato, danno dell'attacco base +15%. Riduzione del danno +15%.","SK_D_P_0304":"Con uno [Scudo] equipaggiato, aumenta la DIF di FOR x3. Danno subito -25%. Ottieni *Provocazione*.","SK_D_P_0305":"Con un [Pugnale] equipaggiato, velocità d'attacco +25%.","SK_D_P_0306":"Con una [Lancia] equipaggiata, ottieni danno finale +10% e riduzione del danno +10%.","SK_D_P_0307":"Con un'arma [A distanza] equipaggiata, ottieni precisione +25% e danno critico +25%.","SK_D_P_0308":"Con uno [Strumento magico] equipaggiato, tempo di lancio -25%.","SK_D_P_0309":"Aumenta la DIF di tutte le statistiche x0,2.","SK_D_P_0701":"[P] Quando lanci un'abilità che consuma PM e uno slot di lancio è libero, lancia automaticamente in parallelo 'Sfera di Risonanza'.","SK_D_P_0702":"[P] Se dopo il tuo attacco base un nemico resta con PS all'1% o meno, sferri un attacco base extra.","SK_D_P_0703":"[P] Ottieni 1.000 oro e 30 EXP ogni 3 km percorsi.","SK_D_P_0704":"[A] Utilizzabile su un nemico avvelenato. Fissa le cariche di Veleno a 5; il Veleno in eccesso infligge danno immediato. Il danno fisso del Veleno diventa poi il 2% dei PS massimi del nemico ogni 3 secondi. (Danno max = MAG giocatore x12). Lancio 3 s. PM 90.","SK_D_P_0705":"[A] Inietta energia potenziante in 3 alleati casuali diversi da te. Conferisce PS massimi +15% e danno subito -7%. Lancio istantaneo. Ritardo di recupero di 1 s. PM 45.","SK_D_P_0708":"[P] Recuperi l'1% del danno fisico che infliggi.","SK_D_P_0801":"Le abilità di elemento Congelamento si lanciano il 15% più in fretta (arrotondato per eccesso). Prob. critico +15%. Durata del Congelamento +2 s.","SK_D_P_0802":"Rallentamento di 'Congelamento' +1 (debuff di turno). Quando 'Congelamento' termina, infligge danno magico pari alle cariche di Congelamento consumate x PS massimi x3%. (Si applica la DIF magica)","SK_D_P_0803":"25% di probabilità di resistere allo stato alterato 'Congelamento'.","SK_D_P_0804":"[P] Ottieni 1 INT per ogni 1% di PS perso in battaglia.","SK_D_P_0806":"ATT magico +12%, PM max +12%.","SK_D_P_0807":"Danno delle abilità attive degli Spiriti +10%. (Moltiplicatore del gruppo di abilità)","SK_D_P_0808":"[P] Riduce di 2 s il tempo di lancio delle abilità di evocazione degli spiriti. Le evocazioni di spiriti non costano PM.","SK_D_P_0809":"[P] Aumenta l'EXP ottenuta del {15}%.","SK_D_P_0905":"[P] SEN +{9}.","SK_E_A_0301":"[Spada] 110% dell'ATT finale. Danno extra pari ad AGI +1.","SK_E_A_0302":"[Tirapugni] 105% dell'ATT finale. Riduce la DIF del nemico colpito di 3. (Si accumula all'infinito)","SK_E_A_0303":"[Spadone] 120% dell'ATT finale. Colpisce 3 nemici vicini contemporaneamente. Applica un ritardo di recupero di 3 turni.","SK_E_A_0304":"[Scudo] 110% dell'ATT finale. Danno extra pari a DIF x1.","SK_E_A_0305":"[Lancia] 120% dell'ATT finale. Danno extra pari ad AGI +1.","SK_E_A_0306":"[A distanza] 110% dell'ATT finale. Danno extra pari a FOR +1. Attacco a distanza.","SK_E_A_0307":"[Pugnale] 95% dell'ATT finale. Prob. critico +30% su questo attacco. Danno critico +25%.","SK_E_A_0308":"[Strumento magico] 105% dell'ATT magico. Gli attacchi base diventano proiettili magici.","SK_E_A_0501":"[Pugnale] Abilità di Attacco preventivo. Coefficiente ATT finale 1,1. Proiettile: pugnale.","SK_E_A_0502":"[A distanza] Abilità di Attacco preventivo. Coefficiente ATT finale 1,2. Proiettile: pallottola.","SK_E_A_0503":"[Strumento magico] Abilità di Attacco preventivo. ATT magico 1,1. Proiettile: sfera magica. Elemento: fuoco.","SK_E_A_0507":"Le uccisioni con Attacco preventivo conferiscono +15% di oro.","SK_E_A_0508":"[Scudo] Quando sei bersaglio di un attacco, si attiva con probabilità del 100%. Infligge danno pari a DIF x5.","SK_E_A_0509":"[Lancia, Tirapugni] Quando sei bersaglio di un attacco, 5% di probabilità di attivazione: annulla l'attacco (il turno del nemico viene consumato) e ti conferisce un'opportunità d'attacco extra. (Furto di turno)","SK_E_A_0701":"[A] ATT x220%. PM 25.","SK_E_A_0702":"[A] ATT x180%, precisione +20% applicata. Prob. critico +10%. PM 20.","SK_E_A_0703":"[A] Scaglia 2 nemici in cielo. 160% dell'ATT magico. I nemici colpiti non possono agire per 15 turni. Lancio 1,5 s. PM 70.","SK_E_A_0711":"[A] Infligge 'Corrosione' a un nemico. Riduce la sua DIF e DIF magica del 30% e infligge ogni turno danno pari all'1% dei suoi PS massimi. Lancio 2,5 s. PM 95.","SK_E_A_0801":"[A] Debuff a bersaglio singolo. Ritarda di 1 turno l'azione di un nemico dopo che agisce. Quando il Congelamento raggiunge 3 cariche, ogni carica ulteriore infligge danno pari al MAG del lanciatore x1. Dura 6 s. Lancio 1 s. Costa il 2% dei PM. (Max 3 cariche.)","SK_E_A_0802":"[A] Evoca un Imp. Quando il tuo attacco base va a segno, 15% di probabilità di infliggere danno magico extra di elemento Oscurità pari all'85% del tuo ATT magico.","SK_E_A_0803":"[A] Infligge a tutti i nemici danno pari al numero di spiriti evocati x 150% del tuo ATT magico. Questo attacco ignora il 50% della DIF magica. Utilizzabile 3 volte per battaglia.","SK_E_A_0804":"[A] Ti avvolge nel potere di uno spirito del fulmine. Fino a fine battaglia, i tuoi attacchi base infliggono danno magico extra pari a (MAG+AGI) x1. Lancio 2 s. PM 50.","SK_E_A_0805":"[A] Uno spirito della luce assiste la battaglia. Precisione di tutti i nemici -5%, precisione di tutti gli alleati +5%. Resistenza all'elemento Luce +15%. Lancio 1 s. Dura 20 s. PM 35.","SK_E_E_0505":"*Incantamento* Con un Attacco preventivo, consuma il 3% dei PM per +10% di danno. Se elimina il bersaglio in un colpo, l'1% dei PM viene restituito. (Attivabile e disattivabile)","SK_E_E_0506":"Gli Attacchi preventivi ignorano il 25% della riduzione del danno del nemico.","SK_E_P_0001":"Precisione +10. (Non si somma a Concentrazione)","SK_E_P_0002":"AGI +5, Precisione +5.","SK_E_P_0003":"Più bassi sono i tuoi PS, maggiore è la riduzione del danno (PS 100% = 1%, +1% ogni 10% di PS persi, fino all'8% con PS al 30% o meno). Quando i PS scendono a 1, schivi i 2 attacchi successivi.","SK_E_P_0124":"[Attacco base] Mira con precisione prima di sparare. Precisione +15%, danno finale dell'attacco base +5%.","SK_E_P_0301":"Ottiene la priorità d'attacco. Danno +15% contro i nemici in pieno lancio. Ottieni un 10% di opportunità d'attacco extra. (Riavvolgimento temporale solo per te: dopo aver agito, la tua prossima azione viene prenotata con priorità pari al 10% del costo in turni di un attacco base.)","SK_E_P_0302":"Con una [Spada] equipaggiata, danno dell'attacco base +15%.","SK_E_P_0303":"Con i [Tirapugni] equipaggiati, precisione +25%.","SK_E_P_0304":"Con uno [Spadone] equipaggiato, gli attacchi base colpiscono +1 bersaglio aggiuntivo.","SK_E_P_0305":"Con uno [Scudo] equipaggiato, aumenta la DIF di FOR x1.","SK_E_P_0306":"Con un [Pugnale] equipaggiato, tutti gli attacchi infliggono *Ferita*. *Ferita* = tutti gli attacchi fisici infliggono un 5% di danno extra ai nemici feriti.","SK_E_P_0307":"Con una [Lancia] equipaggiata, ottieni danno finale +5% e riduzione del danno +5%.","SK_E_P_0308":"Con un'arma [A distanza] equipaggiata, prob. critico +25%.","SK_E_P_0309":"Con uno [Strumento magico] equipaggiato, recuperi l'1% dei PM massimi al secondo (10 turni) in battaglia.","SK_E_P_0504":"*Incantamento* Con un Attacco preventivo, consuma l'1% dei PM per infliggere danno extra pari ai PM spesi x MAG x0,3. (Attivabile e disattivabile)","SK_E_P_0704":"[Regola speciale] Le battaglie con mostri selvatici generano +1 mostro extra. (Disattivabile)","SK_E_P_0705":"[P] *Buff personale in battaglia*. Il tuo turno d'azione prosegue durante il lancio, permettendoti di sovrapporre un'ulteriore abilità con lancio (max 2 contemporanee). Nel turno d'azione sovrapposto non puoi usare attacchi base. (Disattivabile)","SK_E_P_0706":"[P] INT +8","SK_E_P_0707":"[P] Danno delle abilità +15%.","SK_E_P_0708":"[P] Il danno delle abilità cresce col tempo di lancio. +0,5% di danno extra per turno (4 s = +20% di danno).","SK_E_P_0709":"[P] Rende i tuoi movimenti più rapidi. Velocità d'attacco +8%.","SK_E_P_0710":"[P] Danno critico +60% contro nemici con PS al 30% o meno.","SK_E_P_0713":"[P] Ogni volta che un attacco manca durante la battaglia, ottieni FRT +1.","SK_E_P_0714":"[A] Infligge danno fisico pari a Lv x30 + (FOR+MAG) x2 a 3 nemici. Precisione +25% applicata. PM 80.","SK_E_P_0716":"[P] Il tuo primo attacco base in battaglia infligge danno x1,3.","SK_E_P_0717":"[A] Cosparge la tua arma di veleno. Gli attacchi base hanno poi il 15% di probabilità di infliggere 'Veleno'. PM 15. Lancio 0,1 s.","SK_E_P_0718":"[A] Infligge 'Veleno' a un nemico. Infligge danno fisso pari all'1% dei PS massimi del nemico ogni 3 secondi. (Cumulabile) (Danno max = MAG giocatore x8). Lancio 2 s. PM 45.","SK_E_P_0719":"[A] Ripristina i PS dell'alleato con meno PS di FRT x4. Lancio istantaneo. Ritardo di turno di 2 s dopo l'uso. PM 80.","SK_E_P_0720":"[A] Dispiega un campo di cura. Tutti gli alleati recuperano FRT x2 PS ogni turno per 15 turni. Lancio 2 s. Costa il 15% dei PM. Una volta per battaglia.","SK_E_P_0721":"[A] Dona affilatura alle armi. I 2 alleati con l'ATT più alto ottengono prob. critico +15% e danno critico +30%. Lancio 3 s. Costa l'8% dei PM.","SK_E_P_0722":"[A] Ti conferisce velocità di lancio -10% (più rapida). Un ulteriore -5% ogni 10 livelli del giocatore. Lancio 1 s. Costa il 12% dei PM.","SK_E_P_0723":"[A] Dispiega un campo ricco di mana. Tutti gli alleati recuperano FRT x1 PM ogni turno per 15 turni. Lancio 2 s. Costa il 15% dei PM. Una volta per battaglia.","SK_E_P_0724":"[P] 15% di probabilità di resistere alle abilità con stati alterati. Durata degli stati alterati -15%.","SK_E_P_0801":"[P] Le abilità di elemento Ghiaccio costano 25 mana in più. Statistica MAG +Lv x1 in battaglia. (Attivabile e disattivabile)","SK_E_P_0802":"[P] Ogni volta che una carica di Congelamento svanisce, recuperi il 3% dei PM. MAG +1.","SK_E_P_0810":"[P] Riduce il danno subito durante il lancio del {15}%.","SK_E_P_0905":"[P] SEN +{6}.","SK_F_A_0301":"[Tutte le armi] 100% dell'ATT finale. Brandisci la tua arma.","SK_F_A_0501":"[Tutte le armi] Abilità di Attacco preventivo. ATT finale 1,0","SK_F_A_0504":"[Spada, Spadone] Quando sei bersaglio di un attacco, subisci 1 danno e ti scagli sull'attaccante infliggendo il 200% di danno. Probabilità di attivazione 8%.","SK_F_A_0505":"[Scudo] Una volta per battaglia, quando sei bersaglio di un attacco fisico, 10% di probabilità di contrattaccare. Ignora il danno e infligge il 20% dell'ATT finale del nemico come danno. (Max: Lv giocatore x50)","SK_F_A_0506":"[Lancia, Tirapugni] Quando sei bersaglio di un attacco, 3% di probabilità di attivazione: annulla l'attacco (il turno del nemico viene consumato) e infligge al nemico l'80% del tuo ATT finale. Ritarda il turno del nemico di 3 turni.","SK_F_A_0507":"[Pugnale, A distanza] Quando sei bersaglio di danno fisico, 4% di probabilità di subire solo il 10% del danno e infliggere al nemico danno pari ad AGI x2. (Sempre attiva)","SK_F_A_0509":"Con un Contrattacco riuscito: il nemico viene ritardato di 2 turni e tu ti assicuri 2 turni di priorità.","SK_F_A_0701":"[A] Colpisce un punto preciso per perforare gli scudi. 110% dell'ATT finale come danno + DIF del nemico colpito -100. (Non cumulabile) Utilizzabile 3 volte. PM 25. Lancio istantaneo.","SK_F_A_0702":"[A] Un attacco a segno garantito su un massimo di 2 nemici casuali. 120% dell'ATT finale. Utilizzabile 4 volte per battaglia. Costa 35 PM.","SK_F_A_0703":"[A] 175% dell'ATT magico come danno. Infligge metà danno a 2 nemici adiacenti. Lancio 4 s. PM 30.","SK_F_A_0704":"[A] Colpisce tutti i nemici al 120% dell'ATT magico. PM 45. Lancio 3 s.","SK_F_A_0801":"[A] ATT magico 2,0 + MAG x3 come danno. Prob. critico +25% applicata. Lancio 5 s. Costa il 3% dei PM.","SK_F_A_0802":"[A] Aggiunge ai tuoi attacchi base danno extra pari ad ATT magico x0,5 durante la battaglia. Mentre Lancia di Ghiaccio è attiva, prob. critico dell'attacco base +25%. Lancio 1 s.","SK_F_A_0803":"[A] ATT magico x1,2. Lancio 2 s. Costa il 5% dei PM.","SK_F_A_0804":"[A] Conferisce uno spirito del vento a un alleato casuale. Quell'alleato ottiene velocità d'attacco, velocità di lancio ed evasione 'Lua Negra'. Inimigos que atacam você sofrem -25% de Precisão, enquanto seus próprios ataques causam dano bônus igual a Ataque Mágico x3.","SK_EX_A_0002":"Ativa de elemento luz.\nComeça a conjurar no momento em que a batalha inicia, em uma conjuração separada. Após 20 turnos, atinge todos os inimigos com um ataque mágico igual a todo o dano que você causou durante a batalha. Depois, seu MP é reduzido a 0 e então se recupera em 10(15)% por turno durante 10 turnos.","SK_EX_A_0006":"[Espada] Pétalas caem como chuva. Ataques básicos atingem 3 inimigos aleatórios de uma vez, causando a cada um Ataque Final x3(4.5) + todos os atributos x3(4.5) de dano. Cada acerto adiciona 10 acúmulos de Florescer Pleno ao alvo; com 60 acúmulos, ele floresce e sofre dano igual a 30% do seu PV máx. (reduzido pela DEF). Se o PV do alvo estiver em 30% ou menos do PV máx., ele é executado ignorando a DEF. O dano do florescer não pode passar de 30 vezes o seu PV máx. e não pode ser crítico.","SK_EX_A_0007":"[P] Com [Espada], [Adaga] ou [Espadão] equipado: os ataques básicos tornam-se de elemento relâmpago. Precisão +25(37.5)%, Velocidade de Ataque +80(120)%, Dano Crítico +80(120)%.","SK_EX_A_0012":"Ativa de elemento sombrio (instantânea).\nAo conjurar, inicia uma canalização de 15 turnos (nenhuma outra ação). A cada turno causa MAG x N de dano (N = turnos decorridos) a todos os inimigos e consome 6% de mana por turno. A canalização termina antecipadamente se a mana acabar.\nQuando a canalização se completa, até o fim da batalha seus ataques básicos ganham dano bônus de MAG x8 e atingem duas vezes.","SK_EX_A_0015":"[P] Com [Espada], [Adaga] ou [Espadão] equipado: os ataques básicos sempre acertam, e habilidades cuja arma principal seja [Espada], [Adaga] ou [Espadão] causam 600(900)% mais dano.","SK_EX_A_0501":"[Todas as Armas] Habilidade de ataque preemptivo. Nível x100(150) + todos os atributos x2(3). Custa 3% de MP.","SK_EX_A_0502":"[À Distância] ATQ Final x120(180)% de dano fixo. Inimigos atingidos pelo seu ataque preemptivo no início da batalha são marcados com 'Visão do Futuro' e recebem o mesmo dano repetidamente a cada segundo.","SK_EX_A_0503":"[Todas as Armas] Habilidade de ataque preemptivo. Todos os atributos x3. Ao atacar um monstro selvagem, entra em uma batalha com 1-6 daquele monstro selvagem. No início da batalha, causa todos os atributos x3 de dano a todos os inimigos.","SK_EX_A_0504":"Ataques preemptivos contra monstros selvagens vencem a batalha instantaneamente. No início da batalha, concede Evasão +25% a todos os aliados.","SK_EX_A_0505":"Ao ser alvo de ataque, 100% de chance de causar ao atacante dano igual ao dano recebido. Em seguida, você recupera 90(135)% do dano sofrido.","SK_EX_P_0303":"[P] Após um ataque básico, se o alvo sobreviver, todo o atraso pré/pós desaparece e você desfere outro ataque básico automaticamente 1 turno depois, sem escolher uma ação. Repete uma vez por turno até o alvo cair; então sua escolha de ação e seu intervalo de ação original retornam.","SK_EX_P_0304":"[P] Cada vez que você age, o MP máximo aumenta em 1(1.5)% (composto). Ao mesmo tempo, causa dano mágico contínuo a todos os inimigos com poder igual ao seu MP máximo aumentado. Este dano é afetado pela DEF Mágica e pela redução de dano do alvo.","SK_EX_P_0701":"Os monstros também têm atributos. Adiciona aos seus atributos 10% de cada um dos 6 atributos do inimigo. No nível 100, adiciona aos seus atributos 110% dos atributos do monstro.","SK_EX_P_0801":"[P] No início da batalha, marca todos os inimigos com 'Fim Derradeiro'. Após 20 segundos, causa Lv x100 + MAG x70 de dano a todos os inimigos e os atordoa por 3s. Contra inimigos afetados por 'Congelamento', o dano se torna dano fixo.","SK_EX_P_0802":"Invoca 3 Orbes de Gelo no início da batalha, ignorando o limite de 1 orbe. Você começa a batalha com 0% de MP.","SK_SSS_P_0905":"[P] Sentido +{27}.","SK_SS_P_0905":"[P] Sentido +{24}.","SK_SS_P_0951":"[P] Quando um inimigo fica com 1 de HP, concede a si mesmo 3 oportunidades de ataque básico. Esse limite sobe 5% a cada Lv de Desprezo; com Desprezo Lv5, você ganha 3 oportunidades de ataque básico quando um inimigo está com 25% de HP ou menos.","SK_A_A_0801":"Invoca a Rainha do Gelo para o jogador. Ela luta ao seu lado, conjurando uma magia aleatória de elemento congelamento de grau F a A a cada 2 turnos de ação seus. Os atributos dela são 75(112.5)% dos seus. A Rainha do Gelo não pode ser dissipada. Conjuração de 3(2)s, custa 25(17)% de MP. Não pode ser invocada duas vezes.","SK_EX_A_0003":"[Espada] Ativa contínua (instantânea).\nAo conjurar, por 20 turnos um golpe de meteoro de FOR x20(30) atinge um inimigo aleatório a cada turno.\nCusta 3% de mana por turno; a canalização termina imediatamente se a mana acabar, se você for atordoado ou se escolher outra habilidade.","SK_EX_A_0017":"[Espada]\nQuando um inimigo realiza um ataque básico, 50(75)% de chance de anulá-lo e causar todos os atributos x10(15) de dano ao inimigo. Tempo de recarga interno de 3 turnos.","SK_S_A_0501":"Ataques preemptivos a partir de uma posição de dano corpo a corpo causam (FOR+AGI) x3(4.5) de dano adicional.","SK_S_A_0502":"[Espada, Adaga, Espadão, Lança] Uma vez por batalha, ao ser alvo de ataque, 5(7.5)% de chance de reduzir o dano a 1 e causar ATQ Final x10(15) de dano ao inimigo.","SK_S_A_0801":"[A] [Fase] Conjura continuamente por 15 segundos. Seu HP é reduzido a 1 durante a conjuração. Enquanto a conjuração continua, ataca um inimigo aleatório com 6(9) Fragmentos de Gelo a cada 3 turnos. (A conjuração é interrompida se a Fase for removida, o buff for dissipado ou você for atordoado.) Conjuração de 2s.","SK_S_A_0902":"[A] Causa {10}% do HP máximo como dano a todos os inimigos. (Dano máximo por golpe = todos os atributos x 50)","SK_S_P_0502":"[Espada, Adaga, Espadão] Aumenta os efeitos de Maestria em Espada em 50(75)%. Precisão, Chance Crítica e Dano Crítico +25(37.5)%. Ganha adicionalmente 2(3)x o ATQ da arma no cálculo do ATQ Final.","SK_S_P_0801":"[P] Ataque Mágico +50(75)%, MP máximo +30(45)%","SK_S_P_0905":"[P] Sentido +{21}.","SK_S_P_0951":"[P] Matar um inimigo com um Contra-ataque concede uma oportunidade de ataque extra.","SK_S_P_0962":"[P] Matar um inimigo concede 1 oportunidade de ataque extra.","SK_A_A_0301":"[Espada] Atinge todos os inimigos duas vezes. 150(225)% do ATQ Final mais todos os atributos x1(1.5) de dano.","SK_A_A_0302":"[Espada, Adaga] Causa 100(150)% do ATQ Final mais AGI x12~18(18~27) de dano. Você fica imobilizado por 3 turnos após atacar.","SK_A_A_0303":"[Adaga] 100(150)% do ATQ Final. Dano crítico 500(750)%.","SK_A_A_0304":"[Espadão] Atinge até 6 inimigos ao mesmo tempo. 220(330)% do ATQ Final mais FOR x5(7.5) de dano. Reduz a DEF dos inimigos atingidos em 15(22.5)%. (Renova, não acumula)","SK_A_A_0305":"[Manoplas] Atinge todos os inimigos uma vez. Destrói todos os escudos dos alvos e, em seguida, causa 220(330)% do ATQ Final como dano. Pode ser bloqueado por Contra-ataque.","SK_A_A_0306":"[À Distância] Libera sua última chama restante. 320(480)% do ATQ Final. Atraso de recuperação de 5 turnos. O dano final aumenta conforme o MP que falta para o máximo. (+1(1.5)% por 1% faltante)","SK_A_A_0307":"[Ferramenta Mágica] 120(180)% do ATQ Mágico. Inflige Envenenamento de Mana. Causa o mesmo dano a todos os inimigos envenenados por mana. Se este ataque matar um inimigo, restaura seu MP na quantidade de MP restante do inimigo.","SK_A_A_0501":"[Espada] Habilidade de ataque preemptivo. ATQ Final 1.8(2.7) + todos os atributos x1(1.5). Custa 3% de MP. (Aura de espada)","SK_A_A_0504":"[Lança] Habilidade de ataque preemptivo. (FOR+MAG) x3.5(5.25) de dano fixo; sempre acerta como golpe crítico. Custa 15% de MP. (Arremesso de lança)","SK_A_A_0506":"[Escudo] Habilidade de ataque preemptivo. DEF x5(7.5) de dano. Custa 4% de MP. (Arremesso de pedra)","SK_A_A_0508":"[Escudo] Ao ser alvo de um ataque, recupera instantaneamente 2(3)% do HP máximo. Se você for o último aliado de pé, cada golpe recebido também causa a todos os inimigos dano igual ao HP recuperado.","SK_A_A_0509":"[Lança, Ferramenta Mágica] Quando um aliado é alvo de ataque e o HP dele está em 15(22.5)% ou menos, restaura instantaneamente o HP dele em sua SOR x8(12). Custa 8% de MP por aliado; não é acionada sem MP disponível. O dano recebido pelo aliado curado é reduzido em 25(37.5)% durante a batalha.","SK_A_A_0510":"Evasão +30(45)%. Ao esquivar com sucesso, persegue o atacante e causa dano igual a 80(120)% do seu ATQ Final.","SK_A_A_0511":"Ao ser alvo de uma habilidade ou ataque mágico, reduz esse dano em 80(120)%. Em seguida, reduz os atributos base do atacante em 30(45)% até o fim da batalha, e você ganha essa mesma quantidade.","SK_A_A_0802":"[A] [Fase] Dura 10s. Instantaneamente, e a cada 2s, inflige 'Congelamento' a todos os inimigos. O 'Congelamento' também inflige Precisão -35(52.5)%.","SK_A_E_0507":"Em ataque preemptivo, pré-aplica Ruptura ao inimigo. (Dano recebido +25(37.5)%)","SK_A_P_0001":"Aumenta a eficiência das habilidades de elemento Gelo em 30(45)%.","SK_A_P_0301":"[Escudo] Aumenta a DEF de todos os aliados (exceto a sua) em sua DEF x0.1(0.15). Além disso, concede a todos os aliados um Escudo de Égide acumulável igual a 7(10.5)% do seu HP. Em seguida, causa a um inimigo dano igual ao total de escudos aliados criados x0.5(0.75). (Limite máximo de dano = Nível do Jogador x300(450))","SK_A_P_0302":"[Lança] Causa (FOR + MAG) x10(15) de dano a 2 inimigos.","SK_A_P_0303":"Todos os efeitos de Espírito +70(105)%. Invoca uma pixie que participa do combate. A pixie às vezes bloqueia uma habilidade no seu lugar.","SK_A_P_0304":"Ao ganhar uma oportunidade de ataque extra, seu próximo ataque básico ou habilidade ignora a DEF do inimigo.","SK_A_P_0305":"Garante +1 turno antecipado ao entrar em batalha.","SK_A_P_0306":"Em ataque preemptivo: chance crítica +25(37.5)%, Precisão +25(37.5)%.","SK_A_P_0307":"Precisão +45(67.5)%. Dano mágico recebido -15(22.5)%.","SK_A_P_0308":"Ao entrar em um
