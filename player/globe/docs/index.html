<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>PLAYER 기획·규칙</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1c1c1a;--mut:#6b6b66;--line:#e3e2dd;--acc:#2f5bd3;--accbg:#eaf0ff;--warn:#b3261e;--ok:#1f7a3a;--code:#f0efea}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--mut:#9b9a94;--line:#2f2e2b;--acc:#8fb0ff;--accbg:#22283a;--warn:#ff8a80;--ok:#7bd88f;--code:#262522}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--accbg)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
#app{display:flex;height:100%}
#side{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side .top{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
#side .top h1{font-size:16px;margin:0;display:flex;justify-content:space-between;align-items:center}
#list{overflow:auto;flex:1;padding:6px 0}
.sec{font-size:12px;color:var(--mut);padding:10px 14px 4px;font-weight:600}
.dir{padding:4px 14px;cursor:pointer;color:var(--mut);user-select:none}
.dir:before{content:"▸ "}.dir.open:before{content:"▾ "}
.f{padding:4px 14px 4px 28px;cursor:pointer;word-break:break-all;font-size:14px}
.f:hover,.f.cur{background:var(--accbg)}.f.pin{padding-left:14px;font-weight:600}
.hit{font-size:12px;color:var(--mut);padding:0 14px 6px 28px;word-break:break-all}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#bar .path{flex:1;min-width:0;font-weight:600;word-break:break-all}
#menu{display:none}
#body{flex:1;overflow:auto;padding:20px 28px 80px}
#doc{max-width:900px;margin:0 auto}
#doc table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%}
#doc th,#doc td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
#doc code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:.9em}
#doc pre{background:var(--code);padding:12px;border-radius:8px;overflow-x:auto}#doc pre code{padding:0}
#doc blockquote{border-left:3px solid var(--line);margin:0;padding-left:14px;color:var(--mut)}
#doc a{color:var(--acc)}
#ed{width:100%;height:100%;min-height:60vh;font:14px/1.55 ui-monospace,Consolas,monospace;resize:none;border:0;border-radius:0;padding:16px}
.msg{padding:8px 16px;font-size:14px}.msg.err{color:var(--warn)}.msg.ok{color:var(--ok)}
.card{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0;flex-wrap:wrap}
@media (max-width:760px){
 #side{position:fixed;inset:0 auto 0 0;width:86vw;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px #0005}
 #side.show{transform:none}#menu{display:inline-block}#body{padding:16px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BASE = location.pathname.replace(/\/?$/, "/");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let TREE = [], CUR = null, OPEN = new Set(JSON.parse(safeGet("open") || "[]"));
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const API = "https://xmrhcmbz52csvisciqp6bwzzvu0jcyjg.lambda-url.ap-northeast-2.on.aws/RC4HG8OmcGLofsweHukANuc88aaYId7I/";   // 배포 때 docs_site_admin.py 가 람다 주소로 채운다 (이 파일엔 문서 내용 없음)
let TOKEN = safeGet("pds_token") || "";
async function register(code, name){
  const r = await fetch(API+"api/register",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({code,name})});
  if(r.ok){ const j = await r.json(); TOKEN = j.token; safeSet("pds_token", TOKEN) }
  return r;
}
async function api(p, opt={}){
  const r = await fetch(API + "api/" + p, {...opt, headers:{"content-type":"application/json", "x-pds-token":TOKEN}});
  let j = null; try{ j = await r.json() }catch(e){}
  if(r.status === 401){ showRegister(); throw new Error("unregistered") }
  return {status:r.status, ok:r.ok, data:j};
}
function showRegister(msg){
  $("#app").innerHTML = `<div class="card"><h2 style="margin:0">기기 등록</h2>
   <div class="mut">이 기기는 아직 등록되지 않았습니다. 등록된 기기의 '기기 관리 → 새 기기 코드' QR을 카메라로 찍으면 바로 등록됩니다.</div>
   <input id="rc" inputmode="numeric" placeholder="등록 코드 8자리" maxlength="9">
   <input id="rn" placeholder="이 기기 이름 (예: 갤럭시, 집 PC)">
   <button class="pri" id="rb">등록</button><div id="rm" class="msg err">${msg||""}</div></div>`;
  $("#rb").onclick = async () => {
    const r = await register($("#rc").value, $("#rn").value);
    if(r.ok){ boot() } else { $("#rm").textContent = r.status===429 ? "시도 횟수 초과 — 1시간 뒤 다시" : "코드가 틀렸거나 만료되었습니다" }
  };
}
function hashParams(){ const h = location.hash; return h.startsWith("#?") ? new URLSearchParams(h.slice(2)) : null }
async function boot(){
  const hp = hashParams();
  if(hp && hp.get("c")){   // 자동 등록 링크(QR) — 코드 입력 없이
    await register(hp.get("c"), hp.get("n")||"");
    hp.delete("c"); hp.delete("n");
  }
  const go = hp && hp.get("p"), qr = hp && hp.get("qr");
  if(hp) history.replaceState(null, "", location.pathname + (go ? "#" + encodeURIComponent(go) : ""));
  const me = await api("me");
  $("#app").innerHTML = `<aside id="side"><div class="top"><h1>PLAYER 기획·규칙 <span class="mut">${esc(me.data.name)}</span></h1>
    <input id="q" placeholder="검색 (제목·본문)"><div style="display:flex;gap:6px;flex-wrap:wrap">
    <button id="bNew">새 문서</button><button id="bEd">최근 편집</button><button id="bDev">기기 관리</button></div></div>
    <div id="list"></div></aside>
    <main id="main"><div id="bar"><button id="menu">☰</button><div class="path" id="path">문서를 고르세요</div><span id="acts"></span></div>
    <div id="msg"></div><div id="body"><div id="doc"></div></div></main>`;
  $("#menu").onclick = () => $("#side").classList.toggle("show");
  let t; $("#q").oninput = e => { clearTimeout(t); t = setTimeout(() => doSearch(e.target.value), 300) };
  $("#bNew").onclick = newDoc; $("#bEd").onclick = showEdits; $("#bDev").onclick = showDevices;
  await loadTree();
  window.onhashchange = () => { const p = decodeURIComponent(location.hash.slice(1)); if(p) openDoc(p) };
  if(qr){ await showDevices(); await makeCode(qr); return }
  const h = decodeURIComponent(location.hash.slice(1)); openDoc(h || "Wiki/00_INDEX.md");
}
async function makeCode(n){
  const c = (await api("code",{method:"POST",body:JSON.stringify({name:n})})).data;
  const link = location.origin + location.pathname + "#?c=" + c.code + "&n=" + encodeURIComponent(n);
  $("#codeOut").innerHTML = `<div class="card" style="margin:0 0 16px;align-items:center;text-align:center"><b>${esc(n)} 등록 — 카메라로 QR 찍기만 하면 끝</b><div id="qrbox" style="background:#fff;padding:12px;border-radius:8px"></div><div class="mut">${c.min}분·1회용 · 코드 ${esc(c.code)}</div></div>`;
  new QRCode($("#qrbox"), {text:link, width:240, height:240});
}
async function loadTree(){ TREE = (await api("tree")).data; renderTree() }
function renderTree(){
  const pins = TREE.filter(f => f.p.startsWith("Wiki/"));
  $("#list").innerHTML = `<div class="sec">기획·규칙 문서 (${pins.length})</div>` + pins.map(f => `<div class="f pin" data-p="${esc(f.p)}">${esc(f.p.slice(5).replace(/\.md$/,"").replace(/_/g," "))}</div>`).join("");
  bindList();
}
function bindList(){
  document.querySelectorAll("#list .f").forEach(e => e.onclick = () => { location.hash = encodeURIComponent(e.dataset.p); $("#side").classList.remove("show") });
  document.querySelectorAll("#list .dir").forEach(e => e.onclick = () => { const d = e.dataset.d; OPEN.has(d)?OPEN.delete(d):OPEN.add(d); safeSet("open", JSON.stringify([...OPEN])); renderTree() });
  if(CUR) document.querySelectorAll(`#list .f`).forEach(e => e.classList.toggle("cur", e.dataset.p === CUR.path));
}
async function doSearch(q){
  if(q.trim().length < 2){ renderTree(); return }
  const r = (await api("search?q=" + encodeURIComponent(q))).data;
  $("#list").innerHTML = `<div class="sec">검색 결과 ${r.length}</div>` + r.map(x => `<div class="f" data-p="${esc(x.p)}">${esc(x.p)} <span class="mut">${x.c}</span></div>` + x.hits.map(h => `<div class="hit">…${esc(h)}…</div>`).join("")).join("");
  bindList();
}
function setMsg(t, cls){ $("#msg").innerHTML = t ? `<div class="msg ${cls||""}">${esc(t)}</div>` : "" }
async function openDoc(p){
  if(CUR && CUR.dirty && !confirmLeave()) return;
  const r = await api("doc?path=" + encodeURIComponent(p));
  if(!r.ok){ setMsg("문서 없음: " + p, "err"); return }
  CUR = {path:p, text:r.data.text, sha:r.data.sha, dirty:false}; view();
}
function confirmLeave(){ return window.confirm("저장 안 한 수정이 있습니다. 버릴까요?") }
function view(){
  setMsg(""); $("#path").textContent = CUR.path;
  $("#acts").innerHTML = `<button id="bE">편집</button>`; $("#bE").onclick = edit;
  $("#body").style.padding = "";
  const html = DOMPurify.sanitize(marked.parse(CUR.text, {gfm:true}));
  $("#body").innerHTML = `<div id="doc">${html}</div>`;
  document.querySelectorAll("#doc a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if(/^https?:/.test(href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; return }
    if(href.endsWith(".md") || href.includes(".md#")){
      const dir = CUR.path.includes("/") ? CUR.path.slice(0, CUR.path.lastIndexOf("/")+1) : "";
      const parts = (dir + href.split("#")[0]).split("/"); const out = [];
      parts.forEach(x => { if(x === "..") out.pop(); else if(x && x !== ".") out.push(x) });
      a.onclick = e => { e.preventDefault(); location.hash = encodeURIComponent(out.join("/")) };
    }
  });
  $("#body").scrollTop = 0; bindList();
}
function edit(){
  $("#acts").innerHTML = `<button id="bC">취소</button> <button class="pri" id="bS">저장</button>`;
  $("#body").style.padding = "0";
  $("#body").innerHTML = `<textarea id="ed" spellcheck="false"></textarea>`;
  const ed = $("#ed"); ed.value = CUR.text.replace(/\r\n/g, "\n");
  ed.oninput = () => CUR.dirty = true;
  $("#bC").onclick = () => { if(!CUR.dirty || confirmLeave()){ CUR.dirty = false; view() } };
  $("#bS").onclick = () => save(ed.value);
}
async function save(text){
  const r = await api("doc", {method:"PUT", body:JSON.stringify({path:CUR.path, text, baseSha:CUR.sha})});
  if(r.status === 409){ setMsg("다른 곳에서 먼저 바뀌었습니다. 내 수정은 아래 칸에 남아 있으니 복사해 두고 다시 여세요.", "err"); return }
  if(!r.ok){ setMsg("저장 실패 " + r.status, "err"); return }
  CUR.text = text; CUR.sha = r.data.sha; CUR.dirty = false; view(); setMsg("저장됨 — PC 반영은 docs_site_admin.py pull", "ok"); loadTree();
}
async function newDoc(){
  let n = window.prompt("새 문서 이름 (예: 10_보스레이드_규칙)", "");
  if(!n) return; n = n.trim().replace(/\.md$/,"").replace(/[\\/:*?"<>|]/g,"").replace(/\s+/g,"_");
  const p = "Wiki/" + n + ".md";
  const r = await api("doc", {method:"PUT", body:JSON.stringify({path:p, text:"# " + p.split("/").pop().replace(/\.md$/,"") + "\n", baseSha:null})});
  if(!r.ok){ setMsg(r.status===409 ? "이미 있는 경로" : "만들기 실패", "err"); return }
  await loadTree(); location.hash = encodeURIComponent(p);
}
async function showEdits(){
  if(CUR && CUR.dirty && !confirmLeave()) return; CUR = null;
  const r = (await api("edits")).data;
  $("#path").textContent = "최근 편집 50건"; $("#acts").innerHTML = ""; $("#body").style.padding = "";
  $("#body").innerHTML = `<div id="doc">` + (r.length ? r.map(e => `<div class="row"><a href="#${encodeURIComponent(e.path)}">${esc(e.path)}</a><span class="mut">${esc(e.sk.slice(0,19).replace("T"," "))} UTC · ${esc(e.devName)} · ${e.beforeLen}→${e.afterLen}자</span></div>`).join("") : `<p class="mut">아직 없음</p>`) + `</div>`;
}
async function showDevices(){
  if(CUR && CUR.dirty && !confirmLeave()) return; CUR = null;
  const r = (await api("devices")).data;
  $("#path").textContent = "기기 관리"; $("#acts").innerHTML = `<button class="pri" id="bCode">새 기기 코드</button>`; $("#body").style.padding = "";
  $("#body").innerHTML = `<div id="doc"><div id="codeOut"></div>` + r.map(d => `<div class="row"><div><b>${esc(d.name)}</b> <span class="mut">${esc(d.id)}${d.revoked?" · 해제됨":""}</span><div class="mut">등록 ${new Date(d.created*1000).toLocaleString()} · 최근 ${new Date(d.seen*1000).toLocaleString()}</div></div>${d.revoked?"":`<button data-id="${esc(d.id)}">해제</button>`}</div>`).join("") + `</div>`;
  document.querySelectorAll("#doc button[data-id]").forEach(b => b.onclick = async () => { if(window.confirm("이 기기 접속을 끊을까요?")){ await api("revoke",{method:"POST",body:JSON.stringify({id:b.dataset.id})}); showDevices() } });
  $("#bCode").onclick = () => makeCode("새 기기");
}
window.addEventListener("beforeunload", e => { if(CUR && CUR.dirty){ e.preventDefault(); e.returnValue = "" } });
boot().catch(e => { if(e.message !== "unregistered") $("#app").innerHTML = `<div class="card">오류: ${esc(e.message)}</div>` });
</script>
</body>
</html>
