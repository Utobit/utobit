  m+='<section id="s'+i+'"><h2>'+esc(secTitle(s))+' <small>'+s.ids.length+'</small></h2><div class=grid>'+s.ids.map(function(id){return card(byId[id])}).join('')+'</div></section>'});
 document.getElementById('main').innerHTML=m;
 document.getElementById('rulesTitle').textContent=T.rules;
 var tr=function(cells,th){return '<tr>'+cells.map(function(c){return (th?'<th>':'<td>')+esc(c)+(th?'</th>':'</td>')}).join('')+'</tr>'};
 var enh='<h3>'+esc(T.enhTitle)+'</h3><div class=tw><table>'+tr([T.enhStep,T.enhMult,T.enhGold,T.enhRate,T.enhMat],1);
 for(var i=0;i<5;i++)enh+=tr(['+'+(i+1),'+'+R.enh_cum_pct[i+1]+'%',nf(R.enh_gold[i])+' / '+nf(R.enh_gold[i]*3)+' / '+nf(R.enh_gold[i]*8),R.enh_pct[i]+'%','×'+(i+1)]);
 enh+='</table></div><p>'+esc(T.enhNote)+'</p>';
 var opt='<h3>'+esc(T.optTitle)+'</h3><div class=tw><table>'+tr([T.optKind,T.optRange],1)+R.opt_kinds.map(function(k){return tr([L.stat[k[0]],k[1]+'~'+k[2]+(PCT.indexOf(k[0])>=0?'%':'')])}).join('')+'</table></div><p>'+esc(T.optNote)+'</p>';
 var pc=function(v){return v+'%'};
 var ec='<h3>'+esc(T.ecTitle)+'</h3><div class=tw><table>'+tr(['','T1','T2','T3','T4','T5','T6','E1'],1)+
  tr([L.item.EQ_WEAPON_302+' · '+L.stat.finalAtk].concat(R.ec_weapon.map(nf)))+tr([L.item.EQ_HEAD_302+' · '+L.stat.finalDef].concat(R.ec_head.map(nf)))+
  tr([L.item.EQ_TOP_302+' · '+L.stat.maxHp].concat(R.ec_top_hp.map(nf)))+tr([L.item.EQ_TOP_302+' · '+L.stat.maxMp].concat(R.ec_top_mp.map(nf)))+
  tr([L.item.EQ_BOTTOM_302+' · '+L.stat.dmgReduce].concat(R.ec_pct.map(pc)))+tr([L.item.EQ_GLOVES_302+' · '+L.stat.critRate].concat(R.ec_pct.map(pc)))+
  tr([L.item.EQ_SHOES_302+' · '+L.stat.evasion].concat(R.ec_pct.map(pc)))+'</table></div><p>'+esc(fmt(T.ecNote,{s:R.ec_up_shards.join('/'),g:nf(R.ec_up_gold)}))+'</p>';
 var op='<h3>'+esc(T.opTitle)+'</h3><div class=tw><table>'+tr(['','T1','T2','T3','T4','T5','T6'],1)+tr([L.stat.finalAtk+' · '+L.stat.magicAtk].concat(R.op_atk.map(nf)))+tr([L.stat.maxHp].concat(R.op_hp.map(nf)))+tr([L.stat.critDmg].concat(R.op_cd.map(pc)))+'</table></div><p>'+esc(T.opNote)+'</p>';
 var mn='<h3>'+esc(T.mnTitle)+'</h3><p>'+esc(T.mnRows)+'</p><p>'+esc(T.setBonus)+' · '+esc(T.midnightPower)+'</p>';
 document.getElementById('rulesBody').innerHTML='<div>'+enh+'</div><div>'+opt+'</div><div>'+ec+op+'</div><div>'+mn+'</div>';
 document.getElementById('foot').innerHTML='<p>'+esc(T.footer)+'</p>'+(DEV?'<p>dev: 자료 = ItemSO·item_tiers·reward_pool·monster_fixed_levels·출시 인덱스·언어팩·tools/gear_pending_changes.json. 다시 만들기 python tools/gen_globe_item_page.py</p>':'');
}
document.getElementById('lang').addEventListener('change',function(){LANG=this.value;try{localStorage.setItem('globeLang',LANG)}catch(e){}render()});
document.getElementById('q').addEventListener('input',function(){var q=this.value.trim().toLowerCase();document.querySelectorAll('.card').forEach(function(c){c.style.display=!q||c.getAttribute('data-name').indexOf(q)>=0?'':'none'})});
render();
</script>
