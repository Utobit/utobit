<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PLAYER GLOBE — Player : Final Raid</title>
  <meta name="description" content="Player : Final Raid 헌터 기록을 지구본 위에서 확인하세요. 닉네임 또는 헌터 번호로 검색합니다.">
  <link rel="canonical" href="https://utobit.net/player/globe/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://utobit.net/player/globe/">
  <meta property="og:title" content="PLAYER GLOBE — Player : Final Raid">
  <meta property="og:description" content="헌터의 기록이 새겨지는 지구. 닉네임 또는 헌터 번호로 검색하세요.">
  <meta name="theme-color" content="#05030f">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <style>
    :root {
      --space: #05030f;
      --panel: rgba(14, 10, 34, .72);
      --line: rgba(150, 130, 255, .22);
      --line-strong: rgba(150, 130, 255, .5);
      --text: #f2efff;
      --muted: #a39cc9;
      --dim: #6f6896;
      --violet: #9d7bff;
      --cyan: #5ee6ff;
      --gold: #ffd27a;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--space); color: var(--text); overflow: hidden;
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #map { position: fixed; inset: 0; }
    /* 우주 연출(지도 뒤 층 — 지구본이 가리는 곳은 안 보이고 둘레의 우주에만 보인다). 움직임은 전부 CSS(스크립트 없음) */
    #sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    #sky i { position: absolute; display: block; will-change: transform, opacity; }
    #sky .meteor { width: 130px; height: 1.5px; border-radius: 2px; opacity: 0;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(190, 205, 255, .55) 60%, #fff);
      animation: meteor var(--t, 13s) linear var(--d, 0s) infinite; }
    @keyframes meteor {
      0% { transform: translate3d(0, 0, 0) rotate(30deg); opacity: 0; }
      1% { opacity: 1; }
      6% { transform: translate3d(520px, 300px, 0) rotate(30deg); opacity: 0; }
      100% { transform: translate3d(520px, 300px, 0) rotate(30deg); opacity: 0; }
    }
    #sky .sat { width: 3px; height: 3px; border-radius: 50%; background: #dfe6ff; left: 0; top: 0;
      box-shadow: 0 0 6px rgba(170, 190, 255, .9);
      animation: sat var(--t, 90s) linear var(--d, 0s) infinite, satblink 2.4s ease-in-out infinite; }
    @keyframes sat { from { transform: translate3d(-6vw, var(--y0), 0); } to { transform: translate3d(106vw, var(--y1), 0); } }
    @keyframes satblink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #sky { display: none; } }
    /* 지구 뒤 성운 — 지도가 뜨기 전·토큰이 없을 때도 화면이 비지 않는다 */
    #nebula { position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(60% 50% at 18% 22%, rgba(120, 70, 255, .20), transparent 70%),
        radial-gradient(50% 45% at 85% 78%, rgba(40, 190, 255, .14), transparent 70%),
        radial-gradient(40% 40% at 70% 15%, rgba(255, 110, 200, .08), transparent 70%); }
    .mapboxgl-ctrl-logo, .mapboxgl-ctrl-attrib { opacity: .55; }
    .mapboxgl-ctrl-attrib { background: transparent !important; }
    .mapboxgl-ctrl-attrib a { color: var(--muted) !important; }

    .hud { position: fixed; z-index: 5; }
    .brand { top: max(18px, env(safe-area-inset-top)); left: 20px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
    .brand b { font-size: 15px; font-weight: 800; letter-spacing: .32em; color: var(--text); }
    .brand span { font-size: 11px; letter-spacing: .14em; color: var(--muted); }

    .panel { top: max(70px, calc(env(safe-area-inset-top) + 58px)); left: 20px; width: 340px; max-width: calc(100vw - 32px);
      display: flex; flex-direction: column; gap: 10px; }
    .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

    .search { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; }
    .search:focus-within { border-color: var(--line-strong); }
    .search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text);
      font: inherit; font-size: 15px; height: 38px; }
    .search input::placeholder { color: var(--dim); }
    .search button { height: 38px; padding: 0 16px; border: 0; border-radius: 10px; cursor: pointer;
      font: inherit; font-size: 13px; font-weight: 700; color: #0b0720;
      background: linear-gradient(135deg, var(--cyan), var(--violet)); transition: filter .15s; }
    .search button:hover { filter: brightness(1.12); }
    .search button:disabled { filter: grayscale(.7) brightness(.7); cursor: default; }

    .msg { padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
    .list { max-height: 44vh; overflow-y: auto; padding: 6px; }
    .list button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 10px; background: transparent; border: 0; border-radius: 9px; cursor: pointer;
      color: var(--text); font: inherit; font-size: 14px; text-align: left; transition: background .15s; }
    .list button:hover { background: rgba(150, 130, 255, .14); }
    .list small { color: var(--muted); font-size: 12px; white-space: nowrap; }

    .card { padding: 18px 18px 16px; }
    .card .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .card .fold { margin-left: auto; align-self: center; flex: none; width: 32px; height: 32px; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; cursor: pointer; }
    .card .fold svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
    .card.folded .fold svg { transform: rotate(180deg); }
    .card.folded { padding-bottom: 14px; }
    .card.folded > :not(.who) { display: none !important; }
    .card .nick { font-size: 22px; font-weight: 800; word-break: break-all; }
    .card .no { font-size: 14px; font-weight: 600; color: var(--cyan); }
    .card .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 4px 9px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--muted); }
    .tag.grade { color: var(--gold); border-color: rgba(255, 210, 122, .4); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .stat { padding: 12px 8px 10px; border-radius: 11px; background: rgba(150, 130, 255, .08);
      border: 1px solid var(--line); text-align: center; }
    .stat b { display: block; font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
    .rows { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 2px;
      border-top: 1px solid var(--line); font-size: 13px; }
    .row span { color: var(--muted); }
    .row b { font-weight: 600; text-align: right; }
    .row button { background: transparent; border: 1px solid var(--line-strong); color: var(--cyan); cursor: pointer;
      font: inherit; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; transition: background .15s; }
    .row button:hover { background: rgba(94, 230, 255, .12); }
    .equip { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .equip h3 { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
    .equip ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .equip li { display: flex; align-items: center; gap: 8px; padding: 6px 9px 6px 6px; border-radius: 8px;
      background: rgba(150, 130, 255, .07); border: 1px solid var(--line); font-size: 12px; min-width: 0; }
    /* 아이콘 칸 = 인게임 아이템 등급 배경(Resources/UI/EquipmentBackgrounds/TierAtlas 의 Tier1~6 영역 — tier1~6.jpg, 등급은 서버 items[].grade) */
    .equip li img, .equip li i { flex: none; width: 36px; height: 36px; border-radius: 5px; background: #0b0d13 url('tier1.jpg') center / cover no-repeat; border: 1px solid rgba(255, 255, 255, .16); object-fit: contain; padding: 2px; box-sizing: border-box; }
    .equip li span { flex: 1; min-width: 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .equip li b { flex: none; font-weight: 700; color: var(--gold); font-variant-numeric: tabular-nums; }
    .equip p { font-size: 12px; color: var(--dim); }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; color: var(--muted); }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
    .legend .w { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .legend .g { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .note { margin-top: 12px; font-size: 11px; color: var(--dim); line-height: 1.5; }

    /* 랭킹 서랍 — 오른쪽 위 햄버거 */
    .burger { top: max(16px, env(safe-area-inset-top)); right: 20px; width: 44px; height: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px; cursor: pointer; padding: 0; transition: border-color .15s; }
    .burger:hover { border-color: var(--line-strong); }
    .burger i { display: block; width: 18px; height: 2px; border-radius: 2px; background: var(--text); }
    .drawer { top: max(70px, calc(env(safe-area-inset-top) + 58px)); right: 20px; bottom: 84px; width: 340px; max-width: calc(100vw - 32px);
      display: flex; flex-direction: column; overflow: hidden; }
    .drawer h2 { padding: 16px 18px 10px; font-size: 13px; font-weight: 800; letter-spacing: .22em; }
    .tabs { display: flex; gap: 6px; padding: 0 14px 10px; }
    .tabs button { flex: 1; height: 34px; border-radius: 9px; border: 1px solid var(--line); background: transparent; cursor: pointer;
      color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; transition: background .15s, color .15s; }
    .tabs button.on { background: rgba(150, 130, 255, .2); border-color: var(--line-strong); color: var(--text); }
    .ranks { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
    .ranks button { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 8px; width: 100%; padding: 9px 10px;
      background: transparent; border: 0; border-radius: 9px; cursor: pointer; color: var(--text); font: inherit; text-align: left; transition: background .15s; }
    .ranks button:hover { background: rgba(150, 130, 255, .14); }
    .ranks .no { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
    .ranks .top .no { color: var(--gold); }
    .ranks .who { min-width: 0; }
    .ranks .who b { display: block; font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranks .who small { display: block; margin-top: 1px; font-size: 11px; color: var(--dim); }
    .ranks .sc { font-size: 13px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }

    /* 랭킹 막대(햄버거 왼쪽) — 누르면 랭킹 서랍. 햄버거 = 서버 범람 게이트 목록 */
    .rankbar { top: max(16px, env(safe-area-inset-top)); right: 72px; width: 44px; height: 44px; padding: 0; cursor: pointer; color: var(--text);
      display: flex; align-items: center; justify-content: center; transition: border-color .15s; }
    .rankbar svg { width: 20px; height: 20px; fill: currentColor; }
    /* 햄버거 메뉴(범람 게이트 · 시스템 안내서) */
    .bmenu { top: max(70px, calc(env(safe-area-inset-top) + 58px)); right: 20px; width: 220px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
    .bmenu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 12px; border: 0; border-radius: 9px; background: transparent;
      cursor: pointer; color: var(--text); font: inherit; font-size: 13px; font-weight: 700; text-align: left; transition: background .15s; }
    .bmenu button:hover { background: rgba(150, 130, 255, .16); }
    .bmenu button i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #ff4664; box-shadow: 0 0 8px #ff4664; }
    .bmenu button i.sys { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    /* 언어: 메뉴의 한 줄(현재 언어 표시) → 누르면 게임 제공 언어 목록 */
    .bmenu button i.lang { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .bmenu button em { margin-left: auto; font-style: normal; font-size: 12px; font-weight: 600; color: var(--dim); white-space: nowrap; }
    .lmenu { max-height: calc(100vh - 160px); overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(150, 130, 255, .45) transparent; }
    .lmenu button { white-space: nowrap; }
    .lmenu button.on { background: rgba(150, 130, 255, .2); }
    /* 시스템 안내서 */
    .doc { flex: 1; overflow-y: auto; padding: 0 18px 18px; scrollbar-width: thin; scrollbar-color: rgba(150, 130, 255, .45) transparent; }
    .doc .sys { margin: 2px 0 14px; padding: 12px 14px; border: 1px solid rgba(120, 220, 255, .45); border-radius: 10px;
      background: rgba(60, 170, 220, .08); font-size: 12px; line-height: 1.65; color: #cfefff; }
    .doc .sys b { display: block; margin-bottom: 4px; font-size: 11px; letter-spacing: .2em; color: var(--cyan); }
    .doc h3 { margin: 18px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .06em; color: var(--gold); }
    .doc h3 span { margin-right: 8px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .doc p { margin: 0 0 7px; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
    .doc p b { color: var(--text); font-weight: 700; }
    .doc .end { margin-top: 18px; font-size: 11px; color: var(--dim); text-align: right; }
    .ranks .who small em { font-style: normal; color: inherit; font-weight: inherit; }   /* 범람 단계 = 옆 글자와 같은 톤(강조 없음) */
    .rankbar:hover, .rankbar[aria-expanded="true"], .burger[aria-expanded="true"] { border-color: var(--line-strong); }
    .gnote { padding: 0 18px 10px; font-size: 11px; line-height: 1.5; color: var(--dim); }
    .ranks .gr { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px;
      font-size: 13px; font-weight: 800; color: #ffd9de; background: rgba(255, 70, 100, .22); border: 1px solid rgba(255, 90, 120, .55); }
    .ranks .st { font-size: 11px; font-weight: 700; color: var(--dim); }
    .ranks .st.ok { color: var(--gold); }
    /* 범람 게이트 표식 */
    /* 범람 게이트 표식 = 발판형 붉은 점(바닥 원 + 퍼지는 파문) + 곧게 선 1자 빛기둥 + 등급 표 — 발판 중심이 좌표.
       1005 마스터 "빛기둥은 없애고, 발판형 빨간점은 괜찮네" → "빛기둥 1자로 그리는건 괜찮을듯"(렌즈 모양 균열 폐기) */
    .fg { width: 44px; height: 64px; cursor: pointer; }
    body.hunter .fg, body.hunter .site { display: none; }
    /* 발견된 유적지(금빛) 표식 */
    .site { width: 26px; height: 26px; border-radius: 9px; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 6, 30, .82); border: 1px solid var(--cyan); box-shadow: 0 0 10px rgba(94, 230, 255, .55); }
    .site.hr svg { width: 16px; height: 16px; fill: none; stroke: var(--gold); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .site.hr { border-color: var(--gold); box-shadow: 0 0 10px rgba(255, 210, 122, .6); }
    .ranks button.sel { background: rgba(94, 230, 255, .16); box-shadow: inset 0 0 0 1px var(--cyan); }
    .fg svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(0 0 5px rgba(255, 60, 95, .95)) drop-shadow(0 0 14px rgba(255, 40, 80, .55)); }
    .fg .beam { animation: beam 2.6s ease-in-out infinite; }
    .fg .wave { transform-origin: 22px 53px; animation: wave 2.2s ease-out infinite; }
    .fg .wave.b { animation-delay: 1.1s; }
    .fg .fgb { position: absolute; left: 29px; top: 12px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 6px; box-sizing: border-box;
      font: 800 11px/16px inherit; font-style: normal; text-align: center; color: #fff; background: rgba(120, 12, 40, .92);
      border: 1px solid rgba(255, 150, 170, .9); box-shadow: 0 0 10px rgba(255, 60, 95, .6); }
    .fg:hover svg { filter: drop-shadow(0 0 7px rgba(255, 120, 150, 1)) drop-shadow(0 0 20px rgba(255, 60, 95, .8)); }
    @keyframes beam { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    @keyframes wave { from { transform: scale(.4); opacity: .95; } to { transform: scale(1.9); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .fg .beam, .fg .wave { animation: none; } }
    .mapboxgl-popup-content { background: rgba(18, 12, 42, .96); color: var(--text); border: 1px solid var(--line-strong); border-radius: 12px;
      padding: 12px 34px 12px 14px; box-shadow: 0 10px 34px rgba(0, 0, 0, .5); font: inherit; }
    .mapboxgl-popup-tip { border-top-color: rgba(18, 12, 42, .96) !important; border-bottom-color: rgba(18, 12, 42, .96) !important; }
    .mapboxgl-popup-close-button { color: var(--muted); font-size: 18px; padding: 4px 8px; }
    .gpop b { display: block; font-size: 14px; font-weight: 800; }
    .gpop span { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
    .gpop em { display: block; margin-top: 8px; font-size: 11px; font-style: normal; line-height: 1.45; color: var(--dim); }
    .gpop em.ok { color: var(--gold); }

    /* 다음 범람 게이트 등장까지 남은 시간 */
    .gnext { bottom: max(58px, calc(env(safe-area-inset-bottom) + 24px)); left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; pointer-events: none;
      background: rgba(10, 6, 30, .72); border: 1px solid rgba(255, 90, 120, .45); }
    .gnext b { margin-left: 8px; font-weight: 800; color: #ff9db0; font-variant-numeric: tabular-nums; }
    body.hunter .gnext { display: none; }
    .hint { bottom: max(34px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      font-size: 11px; letter-spacing: .1em; color: var(--dim); pointer-events: none; white-space: nowrap; }

    /* 길드 본부 표식 */
    .hq { width: 18px; height: 18px; border-radius: 50%; background: var(--gold);
      box-shadow: 0 0 0 4px rgba(255, 210, 122, .25), 0 0 22px 6px rgba(255, 210, 122, .55); }
    .hq::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 1px solid rgba(255, 210, 122, .7);
      animation: ping 2.2s ease-out infinite; }
    @keyframes ping { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.4); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .hq::after { animation: none; } }

    .ranks, .list { scrollbar-width: thin; scrollbar-color: rgba(150, 130, 255, .45) transparent; }
    .ranks::-webkit-scrollbar, .list::-webkit-scrollbar { width: 6px; }
    .ranks::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb { background: rgba(150, 130, 255, .45); border-radius: 3px; }
    .ranks::-webkit-scrollbar-track, .list::-webkit-scrollbar-track { background: transparent; }

    [hidden] { display: none !important; }
    @media (max-width: 560px) {
      .burger { right: 16px; }
      .rankbar { right: 68px; }
      .bmenu { right: 16px; }
      .drawer { left: 16px; right: 16px; width: auto; bottom: 16px; z-index: 6; }
      .brand { left: 16px; }
      .panel { left: 16px; right: 16px; width: auto; }
      .hint { display: none; }
      .gnext { bottom: max(16px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="nebula"></div>
  <div id="sky" aria-hidden="true">
    <i class="meteor" style="left:6%;top:8%;--t:13s;--d:2s"></i>
    <i class="meteor" style="left:58%;top:4%;--t:19s;--d:7s"></i>
    <i class="meteor" style="left:72%;top:52%;--t:23s;--d:12s"></i>
    <i class="meteor" style="left:14%;top:62%;--t:29s;--d:17s"></i>
    <i class="sat" style="--y0:14vh;--y1:30vh;--t:95s;--d:-20s"></i>
    <i class="sat" style="--y0:86vh;--y1:66vh;--t:120s;--d:-70s"></i>
    <i class="sat" style="--y0:44vh;--y1:6vh;--t:150s;--d:-110s"></i>
  </div>
  <div id="map"></div>

  <div class="hud brand"><b>PLAYER GLOBE</b><span>MANAMUHAN STUDIO</span></div>

  <div class="hud panel">
    <form class="glass search" id="form" autocomplete="off">
      <input id="q" type="search" maxlength="40" spellcheck="false" enterkeyhint="search">
      <button id="go" type="submit"></button>
    </form>
    <div class="glass msg" id="msg" hidden></div>
    <div class="glass list" id="list" hidden></div>
    <div class="glass card" id="card" hidden>
      <div class="who"><span class="nick" id="c-nick"></span><span class="no" id="c-no"></span><button class="fold" id="c-fold" type="button" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button></div>
      <div class="tags" id="c-tags"></div>
      <div class="stats">
        <div class="stat"><b id="c-level"></b><span data-t="level"></span></div>
        <div class="stat"><b id="c-stat"></b><span data-t="stat"></span></div>
        <div class="stat"><b id="c-power"></b><span data-t="power"></span></div>
      </div>
      <div class="rows" id="c-rows"></div>
      <div class="equip" id="c-equip" hidden><h3 data-t="equip"></h3><ul id="c-equip-list"></ul><p id="c-equip-none" data-t="noEquip" hidden></p></div>
      <div class="legend" id="c-legend" hidden><span><i class="w"></i><span data-t="walk"></span></span><span><i class="g"></i><span data-t="gate"></span></span></div>
      <p class="note" data-t="note"></p>
    </div>
  </div>

  <button class="hud glass rankbar" id="rankbar" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="12" width="5.4" height="9.5" rx="1.2"/><rect x="9.3" y="4" width="5.4" height="17.5" rx="1.2"/><rect x="16.1" y="8.5" width="5.4" height="13" rx="1.2"/></svg></button>
  <button class="hud glass burger" id="burger" type="button" aria-expanded="false"><i></i><i></i><i></i></button>
  <div class="hud glass bmenu" id="bmenu" hidden>
    <button type="button" id="m-gates"><i></i><span data-t="gTitle"></span></button>
    <button type="button" id="m-guide"><i class="sys"></i><span data-t="guideTitle"></span></button>
    <button type="button" id="m-lang"><i class="lang"></i><span data-t="langTitle"></span><em id="m-lang-cur"></em></button>
  </div>
  <div class="hud glass bmenu lmenu" id="lmenu" hidden></div>
  <div class="hud glass drawer" id="guide" hidden>
    <h2 data-t="guideTitle"></h2>
    <div class="doc" id="doc"></div>
  </div>
  <div class="hud glass drawer" id="gdrawer" hidden>
    <h2 data-t="gTitle"></h2>
    <p class="gnote" id="gnote"></p>
    <div class="ranks" id="gates"></div>
  </div>
  <div class="hud glass drawer" id="drawer" hidden>
    <h2 data-t="rankTitle"></h2>
    <div class="tabs" id="tabs">
      <button type="button" data-board="points" data-t="rankPoints"></button>
      <button type="button" data-board="level" data-t="level"></button>
      <button type="button" data-board="power" data-t="power"></button>
    </div>
    <div class="ranks" id="ranks"></div>
  </div>

  <div class="hud gnext" id="gnext" hidden><span data-t="gNext"></span><b id="gnext-t"></b></div>
  <div class="hud hint" data-t="hint"></div>

<script src="i18n.js"></script>
<script src="guide.js"></script>
<script>
(function () {
  'use strict';

  // ── 설정 ────────────────────────────────────────────────────────────
  // Mapbox 공개 토큰(pk.…) — URL 제한(utobit.net)을 건 웹 전용 토큰을 넣는다. 게임 클라의 sk 토큰은 절대 넣지 않는다.
  var MAPBOX_TOKEN = 'pk.eyJ1Ijoic2Flcm9rIiwiYSI6ImNtdXJ3MmpycTAwM3cyeXM1cGNxZDZ2bWoifQ.vSHSOBC3wO8Kax7hjxEl3g';
  var API = {
    live: 'https://d1lt9hjs49q6xa.cloudfront.net',                              // 실서비스
    test: 'https://uwpaalwrka.execute-api.ap-northeast-2.amazonaws.com/prod'    // 테스트 서버(?s=test)
  };

  var params = new URLSearchParams(location.search);
  var apiBase = params.get('s') === 'test' ? API.test : API.live;
  var still = params.has('still');   // 시점 이동 연출 없이 바로(화면 점검용)
  var I18N = window.GLOBE_I18N || { K: [], NAMES: [['ko', '한국어'], ['en', 'English']], L: {} };
  var LANG = (function () {
    var codes = I18N.NAMES.map(function (p) { return p[0]; }), saved = '';
    try { saved = params.get('hl') || localStorage.getItem('globeLang') || ''; } catch (e) {}   // ?hl=ja = 주소로 언어 지정(점검·공유용)
    if (codes.indexOf(saved) >= 0) return saved;
    var nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('zh') === 0) return /tw|hk|mo|hant/.test(nav) ? 'zh-Hant' : 'zh-Hans';
    var two = nav.slice(0, 2);
    return codes.indexOf(two) >= 0 ? two : 'en';
  })();
  var KO = LANG === 'ko';
  var T = KO ? {
    ph: '닉네임 또는 #헌터 번호', go: '검색', level: '레벨', stat: '총 스탯', power: '전투력',
    hint: '드래그 회전 · 휠 확대', searching: '찾는 중…', none: '해당 헌터를 찾지 못했습니다.',
    many: function (n) { return n + '명이 검색되었습니다. 헌터를 선택하세요.'; },
    fail: '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.',
    grade: '등급', country: '국가', guild: '길드', guildHq: '길드 본부', view: '위치 보기', noHq: '미설립',
    equip: '착용 장비', noEquip: '착용 중인 장비가 없습니다.',
    rankTitle: '랭킹', rankPoints: '공략 포인트', rankOpen: '랭킹 열기', rankEmpty: '아직 랭킹이 없습니다.',
    trail: '자취가 닿은 지역', trailUnit: '곳', walk: '지나간 길', gate: '게이트 공략 지역', noTrail: '아직 기록이 없습니다',
    note: '상세 스탯은 공개되지 않습니다. 기록은 몇 분 간격으로 갱신됩니다.',
    noMap: '지도를 불러오지 못했습니다. 검색은 그대로 사용할 수 있습니다.',
    gTitle: '범람 게이트', gOpen: '범람 게이트 목록', gEmpty: '지금 열려 있는 범람 게이트가 없습니다.',
    gNoteKey: function (n) { return (n ? n + ' 님 — ' : '') + '게이트를 누르면 내 게이트 목록(레이드 › 위험)에 등록됩니다.'; },
    gNoteNoKey: '게임 안에서 지구본을 열면, 누른 게이트가 내 게이트 목록에 등록됩니다.',
    gClaiming: '내 게이트 목록에 등록하는 중…', gNoKey: '게임 안에서 지구본을 열면 내 게이트 목록에 등록됩니다.',
    gClaimed: function (n) { return (n ? n + ' 님의 ' : '내 ') + '게이트 목록에 등록되었습니다. 게임의 레이드 › 위험 목록에서 이동할 수 있습니다.'; },
    gDone: '등록됨', gGone: '이미 닫힌 게이트입니다.', gBadKey: '계정을 확인하지 못했습니다. 게임에서 지구본을 다시 열어 주세요.',
    gLine: function (g) { return g.grade + '급 · Lv.' + g.level; }, gStage: function (n) { return '범람 ' + n + '단계'; },
    menuOpen: '메뉴', guideTitle: '시스템 안내서', langTitle: '언어',
    stadium: '스타디움', heritage: '유적지', firstBy: '최초 발견자', gNext: '다음 게이트 등장까지'
  } : {
    ph: 'Nickname or #hunter number', go: 'Search', level: 'LEVEL', stat: 'TOTAL STATS', power: 'COMBAT POWER',
    hint: 'DRAG TO ROTATE · SCROLL TO ZOOM', searching: 'Searching…', none: 'No hunter found.',
    many: function (n) { return n + ' hunters found. Select one.'; },
    fail: 'Could not reach the server. Please try again shortly.',
    grade: 'Grade', country: 'Country', guild: 'Guild', guildHq: 'Guild HQ', view: 'Show', noHq: 'Not built',
    equip: 'EQUIPPED', noEquip: 'Nothing equipped.',
    rankTitle: 'RANKING', rankPoints: 'RAID POINTS', rankOpen: 'Open ranking', rankEmpty: 'No ranking yet.',
    trail: 'Areas reached', trailUnit: '', walk: 'Path walked', gate: 'Gate cleared area', noTrail: 'No records yet',
    note: 'Detailed stats are private. Records refresh every few minutes.',
    noMap: 'The map could not be loaded. Search still works.',
    gTitle: 'FLOOD GATES', gOpen: 'Flood gate list', gEmpty: 'No flood gates are open right now.',
    gNoteKey: function (n) { return (n ? n + ' — ' : '') + 'Tap a gate to add it to your gate list (Raid › Danger).'; },
    gNoteNoKey: 'Open the globe from inside the game to add tapped gates to your gate list.',
    gClaiming: 'Adding to your gate list…', gNoKey: 'Open the globe from inside the game to add this gate to your list.',
    gClaimed: function (n) { return 'Added to ' + (n ? n + "'s" : 'your') + ' gate list. Travel to it from Raid › Danger in the game.'; },
    gDone: 'Added', gGone: 'This gate has already closed.', gBadKey: 'Could not verify your account. Reopen the globe from the game.',
    gLine: function (g) { return 'Grade ' + g.grade + ' · Lv.' + g.level; }, gStage: function (n) { return 'Flood stage ' + n; },
    menuOpen: 'Menu', guideTitle: 'SYSTEM GUIDE', langTitle: 'LANGUAGE',
    stadium: 'Stadium', heritage: 'Heritage site', firstBy: 'First discovered by', gNext: 'Next gate in'
  };

  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;       // 닉네임 등 서버 값은 항상 textContent 로만 넣는다
    return e;
  };
  var num = function (n) { return Number(n || 0).toLocaleString(); };

  // 한국어·영어 밖의 언어 = i18n.js 문구로 덮는다(빠진 값은 영어). {n}·{g}·{l} 자리가 있는 문구는 함수로 바꾼다.
  (function () {
    var pack = I18N.L[LANG];
    if (!pack) return;
    var fill = function (s, o) { return s.replace(/\{(\w)\}/g, function (_, k) { return o[k] != null ? o[k] : ''; }); };
    I18N.K.forEach(function (k, i) {
      var v = pack.T[i];
      if (v == null) return;
      if (k === 'many') T.many = function (n) { return fill(v, { n: n }); };
      else if (k === 'gNote') T.gNoteKey = function (n) { return (n ? n + ' — ' : '') + v; };
      else if (k === 'gClaimed') T.gClaimed = function (n) { return (n ? n + ' — ' : '') + v; };
      else if (k === 'gLine') T.gLine = function (g) { return fill(v, { g: g.grade, l: g.level }); };
      else if (k === 'gStage') T.gStage = function (n) { return fill(v, { n: n }); };
      else T[k] = v;
    });
  })();
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(function (e) { e.textContent = T[e.getAttribute('data-t')]; });
  $('q').placeholder = T.ph;
  $('go').textContent = T.go;

  // ── 지구 ────────────────────────────────────────────────────────────
  var map = null, mapReady = false, hqMarker = null, userTouched = false, spinning = true, pendingRow = null;

  function initMap() {
    if (!MAPBOX_TOKEN || !window.mapboxgl || !mapboxgl.supported || !mapboxgl.supported()) { return false; }
    mapboxgl.accessToken = MAPBOX_TOKEN;
    map = new mapboxgl.Map({
      container: 'map', style: 'mapbox://styles/mapbox/dark-v11', projection: 'globe',
      center: [127, 30], zoom: 1.6, minZoom: 0.8, maxZoom: 16, attributionControl: true
    });
    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');
    map.on('style.load', function () {
      map.setFog({
        color: 'rgb(60, 40, 140)', 'high-color': 'rgb(120, 80, 255)', 'horizon-blend': 0.06,
        'space-color': 'rgba(5, 3, 15, 0)', 'star-intensity': 0.85
      });
      paintGalaxy();
      // 검색된 헌터의 국가 윤곽
      map.addSource('countries', { type: 'vector', url: 'mapbox://mapbox.country-boundaries-v1' });
      var none = ['==', ['get', 'iso_3166_1'], ''];
      map.addLayer({ id: 'country-fill', type: 'fill', source: 'countries', 'source-layer': 'country_boundaries',
        filter: none, paint: { 'fill-color': '#7c5cff', 'fill-opacity': 0.28 } });
      map.addLayer({ id: 'country-glow', type: 'line', source: 'countries', 'source-layer': 'country_boundaries',
        filter: none, paint: { 'line-color': '#5ee6ff', 'line-width': 5, 'line-blur': 6, 'line-opacity': 0.7 } });
      map.addLayer({ id: 'country-line', type: 'line', source: 'countries', 'source-layer': 'country_boundaries',
        filter: none, paint: { 'line-color': '#c9f6ff', 'line-width': 1 } });
      // 자취 — 멀리서는 빛점, 가까이서는 칸
      var empty = { type: 'FeatureCollection', features: [] };
      var tone = ['case', ['==', ['get', 'k'], 1], '#5ee6ff', '#ffd27a'];
      map.addSource('trail-pt', { type: 'geojson', data: empty });
      map.addSource('trail-cell', { type: 'geojson', data: empty });
      map.addLayer({ id: 'trail-halo', type: 'circle', source: 'trail-pt', maxzoom: 8, paint: {
        'circle-color': tone, 'circle-blur': 1,
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 0, 5, 4, 9, 8, 26],
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0.55, 6, 0.4, 8, 0] } });
      map.addLayer({ id: 'trail-dot', type: 'circle', source: 'trail-pt', maxzoom: 7, paint: {
        'circle-color': '#ffffff',
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 0, 1, 4, 1.8, 7, 3],
        'circle-opacity': ['interpolate', ['linear'], ['zoom'], 0, 0.9, 6, 0.6, 7, 0] } });
      map.addLayer({ id: 'trail-fill', type: 'fill', source: 'trail-cell', minzoom: 4.5, paint: {
        'fill-color': tone, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 4.5, 0, 6.5, 0.32] } });
      map.addLayer({ id: 'trail-edge', type: 'line', source: 'trail-cell', minzoom: 6, paint: {
        'line-color': tone, 'line-width': 1.2, 'line-blur': 1.5, 'line-opacity': 0.8 } });
      mapReady = true;
      if (pendingRow) { focusRow(pendingRow); pendingRow = null; }
    });
    ['mousedown', 'touchstart', 'wheel'].forEach(function (ev) {
      map.on(ev, function () { userTouched = true; });
    });
    map.on('moveend', spin);
    spin();
    return true;
  }

  // 기본 다크 스타일을 은하 색으로 다시 칠한다 — 바다는 심우주 남색, 땅은 짙은 보라, 경계선은 은은한 빛.
  function paintGalaxy() {
    map.getStyle().layers.forEach(function (l) {
      try {
        if (l.type === 'background') map.setPaintProperty(l.id, 'background-color', '#120b33');
        else if (l.id === 'water') map.setPaintProperty(l.id, 'fill-color', '#060418');
        else if (l.type === 'fill' && /land|national-park|landuse/.test(l.id)) map.setPaintProperty(l.id, 'fill-color', '#1a1046');
        else if (l.type === 'line' && /admin-0/.test(l.id)) map.setPaintProperty(l.id, 'line-color', 'rgba(150, 130, 255, .55)');
        else if (l.type === 'line' && /admin-1/.test(l.id)) map.setPaintProperty(l.id, 'line-color', 'rgba(150, 130, 255, .2)');
        else if (l.type === 'line' && /road|bridge|tunnel/.test(l.id)) map.setPaintProperty(l.id, 'line-color', 'rgba(94, 230, 255, .22)');
        else if (l.type === 'symbol') {
          map.setPaintProperty(l.id, 'text-color', '#b9aef0');
          map.setPaintProperty(l.id, 'text-halo-color', 'rgba(5, 3, 15, .85)');
        }
      } catch (e) { /* 스타일 판에 따라 없는 속성은 넘어간다 */ }
    });
  }

  // 아무도 만지지 않았을 때만 천천히 돈다
  function spin() {
    if (!map || !spinning || userTouched || map.getZoom() > 3) return;
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var c = map.getCenter(); c.lng -= 6;
    map.easeTo({ center: c, duration: 4000, easing: function (n) { return n; } });
  }

  function countryName(code) {
    try { return new Intl.DisplayNames([LANG], { type: 'region' }).of(code) || code; }
    catch (e) { return code; }
  }

  function focusCountry(code) {
    var f = ['all', ['==', ['get', 'iso_3166_1'], code], ['==', ['get', 'disputed'], 'false'],
             ['any', ['==', 'all', ['get', 'worldview']], ['in', 'US', ['get', 'worldview']]]];
    ['country-fill', 'country-glow', 'country-line'].forEach(function (id) { map.setFilter(id, code ? f : ['==', ['get', 'iso_3166_1'], '']); });
    if (!code) return;
    var en = code;
    try { en = new Intl.DisplayNames(['en'], { type: 'region' }).of(code) || code; } catch (e) {}
    fetch('https://api.mapbox.com/search/geocode/v6/forward?types=country&limit=1&country=' + encodeURIComponent(code) +
          '&q=' + encodeURIComponent(en) + '&access_token=' + MAPBOX_TOKEN)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var ft = j && j.features && j.features[0];
        if (!ft) return;
        var c = ft.geometry.coordinates;
        map.flyTo({ center: c, zoom: 2.6, duration: still ? 0 : 2600, essential: true });
      }).catch(function () {});
  }

  function focusHq(g) {
    if (hqMarker) { hqMarker.remove(); hqMarker = null; }
    if (!g || (!g.hqLat && !g.hqLng)) return false;
    hqMarker = new mapboxgl.Marker({ element: el('div', 'hq') }).setLngLat([g.hqLng, g.hqLat]).addTo(map);
    return true;
  }

  function focusRow(row) {
    if (!map) return;
    if (!mapReady) { pendingRow = row; return; }
    spinning = false; map.stop();
    var hasHq = focusHq(row.guild);
    focusCountry(row.country || '');
    if (!row.country && hasHq) flyHq(row.guild);
  }

  // 자취 칸([위도칸, 경도칸, 종류]) → 지도. 종류 1=지나간 길, 2·3=게이트 공략 지역(금빛 우선)
  // 게이트 공략 지역(gcells)은 서버가 큰 칸(gdeg)으로 뭉쳐서 준다 — 잘게 그리면 생활권이 특정된다
  function drawTrail(cells, deg, gcells, gdeg) {
    var pts = [], polys = [], w = 180, e = -180, s = 90, n = -90;
    var put = function (iy, ix, d, k) {
      var la = iy * d - 90, lo = ix * d - 180;
      pts.push({ type: 'Feature', properties: { k: k }, geometry: { type: 'Point', coordinates: [lo + d / 2, la + d / 2] } });
      polys.push({ type: 'Feature', properties: { k: k }, geometry: { type: 'Polygon',
        coordinates: [[[lo, la], [lo + d, la], [lo + d, la + d], [lo, la + d], [lo, la]]] } });
      w = Math.min(w, lo); e = Math.max(e, lo + d); s = Math.min(s, la); n = Math.max(n, la + d);
    };
    (gcells || []).forEach(function (c) { put(c[0], c[1], gdeg, 2); });
    (cells || []).forEach(function (c) { if (c[2] === 1) put(c[0], c[1], deg, 1); });
    map.getSource('trail-pt').setData({ type: 'FeatureCollection', features: pts });
    map.getSource('trail-cell').setData({ type: 'FeatureCollection', features: polys });
    return pts.length ? [[w, s], [e, n]] : null;
  }

  function loadTrail(row, onCount) {
    var mine = cardSeq;
    fetch(apiBase + '/globe?trail=' + encodeURIComponent(row.name))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        if (mine !== cardSeq) return;
        var cells = (j && j.cells) || [], gcells = (j && j.gcells) || [];
        onCount(cells.length + gcells.length);
        if (!map || !mapReady) return;
        var box = drawTrail(cells, j.deg || 0.05, gcells, j.gdeg || 0.25);
        // 자취가 있으면 국가 대신 자취 전체가 보이게 — 한 지역뿐이면 너무 파고들지 않는다
        // 검색 패널에 가리지 않게 여백을 둔다(넓은 화면 = 왼쪽, 좁은 화면 = 위)
        var pad = window.innerWidth > 720 ? { top: 90, bottom: 90, left: 420, right: 90 } : { top: 400, bottom: 50, left: 30, right: 30 };
        if (box) map.fitBounds(box, { padding: pad, maxZoom: 7, duration: still ? 0 : 2800, essential: true });
      })
      .catch(function () { if (mine === cardSeq) onCount(-1); });
  }

  // 아이템 이름을 받을 언어 — 게임 언어팩 17종 중 브라우저 언어에 맞는 것
  function packLang() { return LANG; }   // 장비·게이트 이름 = 화면 언어와 같은 언어팩

  var cardSeq = 0;   // 카드가 바뀌면 이전 헌터의 늦은 응답은 버린다

  // 아이콘이 있는 아이템 목록(items/index.json — tools/export_globe_item_icons.py 가 만든다). 못 받으면 아이콘 없이 이름만.
  var iconIds = {};
  var iconsReady = fetch('items/index.json').then(function (r) { return r.ok ? r.json() : []; })
    .then(function (a) { (a || []).forEach(function (id) { iconIds[id] = true; }); })
    .catch(function () {});

  function loadEquip(row) {
    var mine = cardSeq;
    $('c-equip').hidden = true;
    iconsReady.then(function () { return fetch(apiBase + '/globe?equip=' + encodeURIComponent(row.name) + '&lang=' + packLang()); })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        if (mine !== cardSeq) return;
        var items = (j && j.items) || [], ul = $('c-equip-list');
        ul.textContent = '';
        items.forEach(function (it) {
          var li = el('li');
          if (iconIds[it.id]) {
            var img = document.createElement('img');
            img.src = 'items/' + encodeURIComponent(it.id) + '.png';
            img.alt = ''; img.width = 36; img.height = 36;
            li.appendChild(img);
          } else {
            li.appendChild(el('i'));               // 아이콘이 없는 아이템 = 빈 칸(줄 맞춤)
          }
          var tier = Math.min(6, Math.max(1, parseInt(it.grade, 10) || 1));   // 인게임 등급 배경
          li.firstChild.style.backgroundImage = "url('tier" + tier + ".jpg')";
          li.appendChild(el('span', null, it.name));
          if (it.enhance > 0) li.appendChild(el('b', null, '+' + it.enhance));
          li.title = it.name;
          ul.appendChild(li);
        });
        $('c-equip-none').hidden = items.length > 0;
        $('c-equip').hidden = false;
      })
      .catch(function () {});
  }

  function flyHq(g) { map.flyTo({ center: [g.hqLng, g.hqLat], zoom: 13.5, duration: still ? 0 : 3200, essential: true }); }

  // ── 검색 ────────────────────────────────────────────────────────────
  var seq = 0;

  var selName = '';   // 지금 강조 중인 헌터(닉네임#순번) — 랭킹에서 같은 줄을 다시 누르면 강조를 끈다

  function show(which) {
    ['msg', 'list', 'card'].forEach(function (id) { $(id).hidden = id !== which; });
    // 헌터 한 명을 보는 동안에는 범람 게이트·스타디움·유적지 표식을 끈다 — 그 헌터의 자취만 보이게
    document.body.classList.toggle('hunter', which === 'card');
    if (which === 'card' && floodPopup) { floodPopup.remove(); floodPopup = null; }
    if (which !== 'card') { selName = ''; markRanks(); }
  }
  function markRanks() {
    document.querySelectorAll('#ranks button').forEach(function (b) { b.classList.toggle('sel', !!selName && b.getAttribute('data-name') === selName); });
  }
  // 헌터 강조 끄기 — 카드·자취·국가 윤곽·길드 본부 표식을 지우고 범람 게이트 등 표식을 다시 보인다
  function clearHunter() {
    seq++; cardSeq++;
    $('go').disabled = false;
    $('q').value = '';
    show(null);
    if (hqMarker) { hqMarker.remove(); hqMarker = null; }
    pendingRow = null;
    if (map && mapReady) { drawTrail([], 0.05); focusCountry(''); }
  }
  function message(text) { $('msg').textContent = text; show('msg'); }

  function search(q, push) {
    q = (q || '').trim();
    if (!q) return clearHunter();                 // 빈 검색 = 강조 끄기
    var mine = ++seq;
    $('go').disabled = true;
    message(T.searching);
    fetch(apiBase + '/globe?q=' + encodeURIComponent(q))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        if (mine !== seq) return;
        var rows = (j && j.rows) || [];
        if (!rows.length) return message(T.none);
        if (rows.length === 1) return render(rows[0]);
        listRows(rows, j.total || rows.length);
      })
      .catch(function () { if (mine === seq) message(T.fail); })
      .then(function () { if (mine === seq) $('go').disabled = false; });
  }

  function listRows(rows, total) {
    var box = $('list');
    box.textContent = '';
    box.appendChild(el('div', 'msg', T.many(total)));
    rows.forEach(function (r) {
      var b = el('button');
      b.type = 'button';
      b.appendChild(el('span', null, r.name));
      b.appendChild(el('small', null, 'Lv.' + r.level + ' · ' + num(r.power)));
      b.addEventListener('click', function () { $('q').value = r.name; render(r); });
      box.appendChild(b);
    });
    show('list');
  }

  function addRow(label, value, btnText, onClick) {
    var row = el('div', 'row');
    row.appendChild(el('span', null, label));
    if (btnText) {
      var b = el('button', null, btnText);
      b.type = 'button';
      b.addEventListener('click', onClick);
      var wrap = el('b');
      if (value) wrap.appendChild(document.createTextNode(value + '  '));
      wrap.appendChild(b);
      row.appendChild(wrap);
    } else {
      var val = el('b', null, value);
      row.appendChild(val);
    }
    $('c-rows').appendChild(row);
    return val || null;
  }

  function render(r) {
    $('c-nick').textContent = r.nick;
    $('c-no').textContent = '#' + r.order;
    var tags = $('c-tags');
    tags.textContent = '';
    tags.appendChild(el('span', 'tag grade', T.grade + ' ' + (r.grade || 'F')));
    if (r.country) tags.appendChild(el('span', 'tag', countryName(r.country)));
    $('c-level').textContent = num(r.level);
    $('c-stat').textContent = num(r.statTotal);
    $('c-power').textContent = num(r.power);
    $('c-rows').textContent = '';
    if (r.guild) {
      addRow(T.guild, r.guild.name || '-');
      var has = !!(r.guild.hqLat || r.guild.hqLng);
      if (has && map) addRow(T.guildHq, '', T.view, function () { spinning = false; flyHq(r.guild); });
      else addRow(T.guildHq, has ? countryName(r.guild.hqCountry || '') || '-' : T.noHq);
    }
    cardSeq++;
    loadEquip(r);
    var trailRow = addRow(T.trail, '…');
    $('c-legend').hidden = true;
    show('card');
    selName = r.name; markRanks();
    setFold(window.matchMedia('(max-width: 560px)').matches);   // 좁은 화면(휴대폰) = 접힌 채 시작 — 카드가 지구본을 가리지 않게
    focusRow(r);
    if (map && mapReady) drawTrail([], 0.05);
    loadTrail(r, function (n) {
      trailRow.textContent = n > 0 ? num(n) + (T.trailUnit ? ' ' + T.trailUnit : '') : n === 0 ? T.noTrail : '-';
      $('c-legend').hidden = !(n > 0);
    });
  }

  // ── 랭킹 서랍 ───────────────────────────────────────────────────────
  var rankCache = {}, rankBoard = 'points', rankSeq = 0;

  function rankNote(text) {
    var box = $('ranks');
    box.textContent = '';
    box.appendChild(el('div', 'msg', text));
  }

  function drawRanks(rows) {
    var box = $('ranks');
    box.textContent = '';
    if (!rows.length) return rankNote(T.rankEmpty);
    rows.forEach(function (r) {
      var b = el('button', r.rank <= 3 ? 'top' : null);
      b.type = 'button';
      b.appendChild(el('span', 'no', r.rank));
      var who = el('span', 'who');
      who.appendChild(el('b', null, r.name));
      who.appendChild(el('small', null, 'Lv.' + r.level + (r.country ? ' · ' + countryName(r.country) : '')));
      b.appendChild(who);
      b.appendChild(el('span', 'sc', num(r.score)));
      b.setAttribute('data-name', r.name);
      if (r.name === selName) b.classList.add('sel');
      b.addEventListener('click', function () {
        if (selName === r.name) return clearHunter();   // 강조 중인 줄을 다시 누르면 강조를 끈다
        seq++;                                   // 진행 중이던 검색 응답은 버린다
        $('go').disabled = false;
        $('q').value = r.name;
        if (window.innerWidth <= 560) toggleDrawer(false);   // 좁은 화면은 서랍이 카드를 덮는다
        render(r);
      });
      box.appendChild(b);
    });
  }

  function loadRank(board) {
    rankBoard = board;
    document.querySelectorAll('#tabs button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-board') === board); });
    if (rankCache[board]) return drawRanks(rankCache[board]);
    var mine = ++rankSeq;
    rankNote(T.searching);
    fetch(apiBase + '/globe?rank=' + board)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        rankCache[board] = (j && j.rows) || [];
        if (mine === rankSeq) drawRanks(rankCache[board]);
      })
      .catch(function () { if (mine === rankSeq) rankNote(T.fail); });
  }

  function toggleDrawer(open) {
    var d = $('drawer');
    if (open == null) open = d.hidden;
    if (open) closeBurger();                      // 서랍은 같은 자리 — 하나만 연다
    d.hidden = !open;
    $('rankbar').setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) loadRank(rankBoard);
  }

  // ── 서버 범람 게이트: 지구 위 표식 + 햄버거 목록. 누르면 그 자리로 날아가고, 게임에서 연 지구본(계정 키 보유)이면 내 게이트 목록에 등록한다 ──
  var CITY_EN = { '뉴욕': 'New York', '도쿄': 'Tokyo', '파리': 'Paris', '서울': 'Seoul', '두바이': 'Dubai' };
  var gateKey = params.get('k') || '', floods = null, floodMe = '', floodMarkers = [], floodPopup = null, claimed = {};
  try { if (gateKey) localStorage.setItem('globeKey', gateKey); else gateKey = localStorage.getItem('globeKey') || ''; } catch (e) {}
  if (params.has('k')) {                          // 키는 주소에 남기지 않는다(주소를 공유해도 계정이 따라가지 않게)
    params.delete('k');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
  }
  function cityName(g) { return KO ? g.city : (g.cityEn || CITY_EN[g.city] || g.city); }

  function claimGate(g, st) {
    if (!gateKey) return;
    if (claimed[g.id] != null) { st.textContent = T.gClaimed(claimed[g.id]); st.className = 'ok'; return; }
    fetch(apiBase + '/globe?claim=' + encodeURIComponent(g.id) + '&k=' + encodeURIComponent(gateKey))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { claimed[g.id] = j.nick || ''; st.textContent = T.gClaimed(j.nick || ''); st.className = 'ok'; drawGates(); }
        else st.textContent = j && j.message === 'gone' ? T.gGone : T.gBadKey;
      })
      .catch(function () { st.textContent = T.fail; });
  }

  function openGate(g) {
    userTouched = true;
    if (floodPopup) { floodPopup.remove(); floodPopup = null; }
    var box = el('div', 'gpop');
    box.appendChild(el('b', null, cityName(g) + ' · ' + g.name));
    box.appendChild(el('span', null, T.gLine(g) + ' · ' + T.gStage(g.flood || 1)));
    var st = el('em', null, gateKey ? T.gClaiming : T.gNoKey);
    box.appendChild(st);
    if (map) {
      map.flyTo({ center: [g.lng, g.lat], zoom: 12.5, duration: still ? 0 : 3000, essential: true });
      floodPopup = new mapboxgl.Popup({ offset: 62, maxWidth: '270px' }).setLngLat([g.lng, g.lat]).setDOMContent(box).addTo(map);
    }
    claimGate(g, st);
    if (window.innerWidth <= 560) toggleGates(false);   // 좁은 화면은 서랍이 지도를 덮는다
  }

  function drawGates() {
    var box = $('gates');
    box.textContent = '';
    $('gnote').textContent = gateKey ? T.gNoteKey(floodMe) : T.gNoteNoKey;
    if (floods == null) { box.appendChild(el('div', 'msg', T.searching)); return; }
    if (!floods.length) { box.appendChild(el('div', 'msg', T.gEmpty)); return; }
    floods.forEach(function (g) {
      var b = el('button');
      b.type = 'button';
      b.appendChild(el('span', 'gr', g.grade));
      var who = el('span', 'who');
      who.appendChild(el('b', null, cityName(g) + ' · ' + g.name));
      var sm = el('small', null, T.gLine(g) + ' · ');
      sm.appendChild(el('em', null, T.gStage(g.flood || 1)));
      who.appendChild(sm);
      b.appendChild(who);
      b.appendChild(el('span', claimed[g.id] != null ? 'st ok' : 'st', claimed[g.id] != null ? T.gDone : ''));
      b.addEventListener('click', function () { openGate(g); });
      box.appendChild(b);
    });
  }

  var GATE_SVG = '<svg viewBox="0 0 44 64" aria-hidden="true">' +
    '<defs>' +
    '<linearGradient id="fgBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a78" stop-opacity="0"/><stop offset=".45" stop-color="#ff4d70" stop-opacity=".85"/><stop offset="1" stop-color="#ffe3e8"/></linearGradient>' +
    '<radialGradient id="fgPad" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ffb3c0"/><stop offset=".7" stop-color="#ff2d55"/><stop offset="1" stop-color="#8a0c30"/></radialGradient>' +
    '</defs>' +
    '<ellipse class="wave" cx="22" cy="53" rx="13" ry="4.6" fill="none" stroke="#ff7a93" stroke-width="1.2"/>' +
    '<ellipse class="wave b" cx="22" cy="53" rx="13" ry="4.6" fill="none" stroke="#ff7a93" stroke-width="1.2"/>' +
    '<ellipse cx="22" cy="53" rx="12" ry="4.2" fill="rgba(255,45,85,.28)" stroke="#ff9db0" stroke-width="1"/>' +
    '<ellipse cx="22" cy="53" rx="6.5" ry="2.6" fill="url(#fgPad)"/>' +
    '<g class="beam">BEAMS</g></svg>';
  // 빛기둥은 모든 게이트가 같은 1줄(범람 단계는 목록·팝업에 글자로 표시)
  function gateSvg(stage) {
    var n = 1, xs = [22], s = '';   // 1005 마스터("빛기둥은 다 똑같이 한단계면 되잖아"): 단계와 무관하게 기둥 1줄 — 단계는 목록·팝업 글자로만
    xs.forEach(function (x, i) {
      var top = n === 3 && i !== 1 ? 14 : 4;       // 3단계는 가운데 기둥이 가장 높다
      s += '<rect x="' + (x - 2.5) + '" y="' + top + '" width="5" height="' + (53 - top) + '" rx="2.5" fill="url(#fgBeam)" opacity=".55"/>' +
           '<rect x="' + (x - 0.9) + '" y="' + (top + 6) + '" width="1.8" height="' + (47 - top) + '" rx=".9" fill="url(#fgBeam)"/>';
    });
    return GATE_SVG.replace('BEAMS', s);
  }

  function placeGateMarkers() {
    if (!map || !floods) return;
    floodMarkers.forEach(function (m) { m.remove(); });
    floodMarkers = floods.map(function (g) {
      var dot = el('div', 'fg');
      dot.innerHTML = gateSvg(g.flood);                  // 고정 문자열 조합(서버 값은 단계 숫자만 — 1~3 으로 자른다)
      dot.appendChild(el('i', 'fgb', g.grade));
      dot.title = cityName(g) + ' · ' + g.name + ' · ' + T.gStage(g.flood || 1);
      dot.addEventListener('click', function (e) { e.stopPropagation(); openGate(g); });
      return new mapboxgl.Marker({ element: dot, anchor: 'bottom', offset: [0, 11] }).setLngLat([g.lng, g.lat]).addTo(map);
    });
  }

  function loadFloods() {
    fetch(apiBase + '/globe?floods=1&lang=' + encodeURIComponent(LANG) + (gateKey ? '&k=' + encodeURIComponent(gateKey) : ''))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { floods = (j && j.rows) || []; floodMe = (j && j.me) || ''; nextAt = (j && j.nextAt) || 0; drawGates(); placeGateMarkers(); })
      .catch(function () { floods = []; drawGates(); });
  }

  // 다음 게이트 등장까지 남은 시간 — 서버가 준 다음 일정 시각(매시 정각)까지 센다. 시각이 지나면 목록을 다시 받는다(스폰이 끝날 여유 20초).
  var nextAt = 0, nextReload = 0;
  function tickNext() {
    var now = Date.now() / 1000;
    if (!nextAt) nextAt = (Math.floor(now / 3600) + 1) * 3600;
    var left = Math.ceil(nextAt - now);
    if (left <= 0) {
      if (!nextReload) nextReload = now + 20;
      if (now >= nextReload) { nextReload = 0; nextAt = 0; loadFloods(); }
      left = 0;
    }
    var m = Math.floor(left / 60), sec = left % 60;
    $('gnext-t').textContent = (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    $('gnext').hidden = !map;
  }

  // ── 발견된 유적지(최초 발견자 닉네임) — 스타디움 표식은 1005 마스터 지시로 뺐다(서버 응답 stadiums 는 쓰지 않음) ──
  var SITE_SVG = {
    hr: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5M5 9v9M10 9v9M14 9v9M19 9v9M3 20h18"/></svg>'
  };
  var siteMarkers = [];
  function openSite(kind, x) {
    userTouched = true;
    if (floodPopup) { floodPopup.remove(); floodPopup = null; }
    var box = el('div', 'gpop');
    box.appendChild(el('b', null, x.name));
    box.appendChild(el('span', null, kind === 'st' ? T.stadium + (x.city ? ' · ' + x.city : '') : T.heritage));
    if (kind === 'hr' && x.by) box.appendChild(el('em', 'ok', T.firstBy + ' · ' + x.by));
    map.flyTo({ center: [x.lng, x.lat], zoom: Math.max(map.getZoom(), 5), duration: still ? 0 : 2200, essential: true });
    floodPopup = new mapboxgl.Popup({ offset: 18, maxWidth: '270px' }).setLngLat([x.lng, x.lat]).setDOMContent(box).addTo(map);
  }
  function placeSites(kind, rows) {
    (rows || []).forEach(function (x) {
      var dot = el('div', 'site ' + kind);
      dot.innerHTML = SITE_SVG[kind];                    // 고정 문자열(서버 값은 넣지 않는다)
      dot.title = x.name + (kind === 'hr' && x.by ? ' · ' + T.firstBy + ' ' + x.by : '');
      dot.addEventListener('click', function (e) { e.stopPropagation(); openSite(kind, x); });
      siteMarkers.push(new mapboxgl.Marker({ element: dot }).setLngLat([x.lng, x.lat]).addTo(map));
    });
  }
  function loadSites() {
    if (!map) return;
    fetch(apiBase + '/globe?sites=1&lang=' + encodeURIComponent(LANG))
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) {
        siteMarkers.forEach(function (m) { m.remove(); });
        siteMarkers = [];
        placeSites('hr', j && j.heritage);
      })
      .catch(function () {});
  }

  function closeBurger() {
    $('bmenu').hidden = true; $('lmenu').hidden = true; $('gdrawer').hidden = true; $('guide').hidden = true;
    $('burger').setAttribute('aria-expanded', 'false');
  }
  function openBurgerPanel(id) {                  // id = 'bmenu'(메뉴) | 'gdrawer'(범람 게이트) | 'guide'(시스템 안내서)
    toggleDrawer(false);
    closeBurger();
    $(id).hidden = false;
    $('burger').setAttribute('aria-expanded', 'true');
    if (id === 'gdrawer') drawGates();
    if (id === 'guide') drawGuide();
  }
  function toggleGates(open) { if (open === false) closeBurger(); else openBurgerPanel('gdrawer'); }

  // ── 시스템 안내서: 이 세계의 규칙 문서. 지금은 범람 게이트 편(수치 = 서버 정산 규칙 그대로) ──
  var GUIDE = (window.GLOBE_GUIDE || {})[LANG] || (window.GLOBE_GUIDE || {}).en || ['', [], ''];   // [머리말, [[제목, 문단…]…], 맺음말]
  var guideDrawn = false;
  function richP(text) {                          // 고정 문구 안의 <b>…</b> 만 굵게 — 문자열을 HTML 로 넣지 않는다
    var p = el('p');
    text.split(/<b>|<\/b>/).forEach(function (part, i) { if (part) p.appendChild(i % 2 ? el('b', null, part) : document.createTextNode(part)); });
    return p;
  }
  function drawGuide() {
    if (guideDrawn) return;
    guideDrawn = true;
    var doc = $('doc'), sys = el('div', 'sys');
    sys.appendChild(el('b', null, '[ SYSTEM ]'));
    sys.appendChild(document.createTextNode(GUIDE[0]));
    doc.appendChild(sys);
    GUIDE[1].forEach(function (s, i) {
      var h = el('h3');
      h.appendChild(el('span', null, (i < 9 ? '0' : '') + (i + 1)));
      h.appendChild(document.createTextNode(s[0]));
      doc.appendChild(h);
      s.slice(1).forEach(function (line) { doc.appendChild(richP(line)); });
    });
    doc.appendChild(el('div', 'end', GUIDE[2]));
  }

  $('rankbar').setAttribute('aria-label', T.rankOpen);
  $('rankbar').addEventListener('click', function () { toggleDrawer(); });
  $('burger').setAttribute('aria-label', T.menuOpen);
  $('burger').addEventListener('click', function () {
    if (!$('bmenu').hidden || !$('lmenu').hidden || !$('gdrawer').hidden || !$('guide').hidden) closeBurger(); else openBurgerPanel('bmenu');
  });
  // 헌터 정보 접기·펴기(접으면 이름 줄만 남는다)
  function setFold(on) { $('card').classList.toggle('folded', on); $('c-fold').setAttribute('aria-expanded', on ? 'false' : 'true'); }
  $('c-fold').addEventListener('click', function () { setFold(!$('card').classList.contains('folded')); });
  $('m-gates').addEventListener('click', function () { openBurgerPanel('gdrawer'); });
  $('m-guide').addEventListener('click', function () { openBurgerPanel('guide'); });
  // 언어 설정: 메뉴의 '언어' → 게임 제공 언어 목록. 고르면 기기에 저장하고 다시 불러온다(문구가 처음 한 번에 채워지는 구조)
  I18N.NAMES.forEach(function (p) {
    if (p[0] === LANG) $('m-lang-cur').textContent = p[1];
    var b = el('button', p[0] === LANG ? 'on' : null, p[1]);
    b.type = 'button';
    b.addEventListener('click', function () {
      if (p[0] === LANG) { openBurgerPanel('bmenu'); return; }
      try { localStorage.setItem('globeLang', p[0]); } catch (e) {}
      location.reload();
    });
    $('lmenu').appendChild(b);
  });
  $('m-lang').addEventListener('click', function () { openBurgerPanel('lmenu'); });
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.addEventListener('click', function () { loadRank(b.getAttribute('data-board')); });
  });

  $('form').addEventListener('submit', function (e) { e.preventDefault(); search($('q').value, true); });

  if (!initMap()) { $('map').hidden = true; message(T.noMap); }
  if (params.has('rank')) toggleDrawer(true);   // ?rank = 랭킹을 연 채로 시작
  loadFloods();
  tickNext(); setInterval(tickNext, 1000);
  loadSites();
  if (params.has('gates')) toggleGates(true);   // ?gates = 범람 게이트 목록을 연 채로 시작
  if (params.has('langs')) openBurgerPanel('lmenu');    // ?langs = 언어 목록을 연 채로 시작(화면 점검용)
  if (params.has('menu')) openBurgerPanel('bmenu');     // ?menu = 메뉴를 연 채로 시작(화면 점검용)
  if (params.has('guide')) openBurgerPanel('guide');   // ?guide = 시스템 안내서를 연 채로 시작
  var q0 = params.get('q');
  if (q0) {                                       // ?q = 공유받은 주소로 한 번만 검색 — 주소에서는 지운다(새로고침하면 처음 화면)
    $('q').value = q0; search(q0, false);
    params.delete('q');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
  }
})();
</script>
</body>
</html>
